            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc ARCH=x86_64 WORK=/tmp/olb-native OLB_EXPECT=1
              sh /src/src/imgact/test/run_olb_native.sh
            '

  # -----------------------------------------------------------------------
  # build-com-native — self-host S3.2 (bead vms-615): a DCL command procedure
  # (BUILD.COM) drives compile -> link -> run of a C program from inside an
  # OVMX DCL session using the OVMX-native TCC.EXE + LINK.EXE as foreign
  # commands, with ZERO bash in the build path. Replaces the run_*.sh shell
  # build driver -- "Build-native" self-hosting (vms-678). aarch64-only for the
  # same reason as tcc-native (tinycc configure keys off uname -m); runs under
  # arm64 binfmt/QEMU emulation. BUILD_EXPECT=1 (BLOCKING): any native build or
  # the @BUILD run failing is a real regression.
  # -----------------------------------------------------------------------
  build-com-native:
    name: BUILD.COM DCL driver — compile+link+run, no bash (self-hosting S3.2)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build the native toolchain + DCL.EXE, then @SYS$SYSTEM:BUILD HELLO drives TCC.EXE + LINK.EXE and runs HELLO.EXE (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/build-com-native BUILD_EXPECT=1
              sh /src/src/imgact/test/run_build_com_native.sh
            '

  # link-selfhost-native — self-host S4 FIXPOINT (bead vms-62b, the vms-678
  # Build-native 1.0 gate): OVMX builds a nontrivial OVMX component (the OVMX
  # linker LINK.EXE) from WITHIN OVMX and proves it byte-stable. A multi-TU
  # BUILD.COM, driven from a DCL session with ZERO bash in the build path, has
  # the OVMX-native TCC.EXE compile link.c + ovmx_link_rms_io.c and the native
  # gen1 LINK.EXE link them into gen2; gen2 is installed as SYS$SYSTEM:LINK.EXE
  # and links LINK.EXE again into gen3; the job FAILs unless gen2 == gen3
  # byte-for-byte (the tcc gen2==gen3 fixpoint, now for LINK.EXE). aarch64-only
  # for the same reason as tcc-native/build-com-native (tinycc configure keys
  # off uname -m); runs under arm64 binfmt/QEMU emulation. LINK_SELFHOST_EXPECT=1
  # (BLOCKING): any native build, either @BUILD run, or a gen2!=gen3 mismatch is
  # a real regression.
  # -----------------------------------------------------------------------
  link-selfhost-native:
    name: LINK.EXE self-host fixpoint — OVMX builds LINK.EXE, gen2==gen3, no bash (self-hosting S4)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build the native toolchain + DCL.EXE, then @BUILD LINK.EXE inside OVMX twice and assert gen2==gen3 (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/link-selfhost-native LINK_SELFHOST_EXPECT=1
              sh /src/src/imgact/test/run_link_selfhost_native.sh
            '

  # -----------------------------------------------------------------------
  # netbsd-vax-simh (vms-0041, epic vms-8e8 "OVMX/NetBSD SYSKRNL")
  #
  # The NetBSD/vax analogue of the QEMU executive jobs. There is no
  # qemu-system-vax (docs/design-ovmx-netbsd-syskrnl.md sec 6), so NetBSD/vax
  # boots under SIMH -- the same emulator the OpenVMS VAX labs use. This job
  # boots a REAL NetBSD/vax under SIMH and asserts `uname -srm` == the pinned
  # "NetBSD <ver> vax"; the negctl step proves the assertion can go red. It is
  # the proving ground P3/P4 of the epic build on. BUILD/TEST tooling, not a
  # runtime (Rule 9 / docs/runtime-target.md) -- SIMH is emulation, nothing runs
  # on the host.
  #
  # GATED like the heavy QEMU tiers: on push/merge_group/schedule the path
  # filter forces netbsd_vax=true so the full job runs; on a PR it runs only when
  # tests/lab-vax/** (or the workflow) changed, so ordinary PRs don't pay for it.
  #
  # INSTALL/BOOT SPLIT + CACHE. Installing NetBSD/vax on an emulated VAX is slow
  # (tens of minutes -- a ~1980s CPU under emulation). The install runs ONCE and
  # its output (the SIMH disk wd0.img + the verified ISO) is cached under
  # .boot-cache/lab-vax, keyed on the pinned NetBSD version + SIMH ref + anita
  # ref + the harness files. A cache hit makes the "install" step an instant
  # no-op and only the fast boot+assert steps run; a cache miss (first nightly,
  # or after a pin bump) pays the install once and actions/cache stores the disk
  # for subsequent runs.
  #
  # SIMH is a pure software VAX interpreter (no KVM needed), so it runs on a
  # stock ubuntu-latest runner -- only slowly. The cold-cache install is the one
  # heavy cost; if a GitHub-hosted runner cannot complete the install within the
  # job timeout, populate the cache on a capable/self-hosted runner (or prime it
  # from a local `tests/lab-vax/run-local.sh install`) and let this job restore
  # it. The steps below never stub the proof: smoke actually boots + asserts, and
  # a failure fails the job.
  # -----------------------------------------------------------------------
  netbsd-vax-simh:
    name: NetBSD/vax boots under SIMH (vms-0041)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the installed NetBSD/vax disk + verified ISO
        uses: actions/cache@v4
        with:
          path: .boot-cache/lab-vax
          # Bump implicitly via the pinned strings + harness hash. A NetBSD/SIMH/
          # anita pin change or an entrypoint/Dockerfile change invalidates the
          # cache and forces a fresh, reproducible install.
          key: lab-vax-netbsd9.4-simh2e0d51e-anitav2_18-${{ hashFiles('tests/lab-vax/Dockerfile', 'tests/lab-vax/entrypoint.sh') }}

      - name: Build the lab-vax image
        run: docker build -f tests/lab-vax/Dockerfile -t ovmx-vax-lab tests/lab-vax

      - name: Populate the cache (install NetBSD/vax once; no-op on a cache hit)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab install

      - name: Smoke — boot the cached disk and assert uname -srm is NetBSD/vax
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab smoke

      - name: Negative control — the uname assertion must be able to FAIL
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab negctl

  # -----------------------------------------------------------------------
  # libvmssys-netbsd-vax (rd vms-9dc, epic vms-8e8; design sec 4).
  #
  # BUILD-ONLY cross-compile gate for the OVMX/NetBSD VAX userspace port. It
  # stands up the pinned `vax--netbsdelf` GCC cross toolchain (binutils 2.42,
  # gcc 13.3.0) over a SHA512-pinned NetBSD 10.1/vax sysroot, then (1) builds
  # libvmssys.a for netbsd-vax through the CMake VMSSYS_SUBSTRATE=netbsd path and
  # (2) links a real vax--netbsdelf ELF32 executable against NetBSD libc --
  # proving the link-libc backend (design sec 4.1) and the ILP32 width audit
  # (docs/audit-ilp32-vax-libvmssys.md) compile clean for VAX.
  #
  # This is DELIBERATELY NOT emulation: QEMU has no VAX system target, and
  # booting NetBSD/vax under SIMH is the separate netbsd-vax-simh job (P4). This
  # gate is fast once the toolchain image layer-caches (gha). BUILD/TEST tooling,
  # never a runtime (Rule 9 / docs/runtime-target.md). Gated like the SIMH job:
  # push/merge_group/schedule always; on a PR only when the cross inputs change.
  # -----------------------------------------------------------------------
  libvmssys-netbsd-vax:
    name: libvmssys cross-compiles for netbsd-vax (vms-9dc)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the vax--netbsdelf cross toolchain image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Cross-compile libvmssys for netbsd-vax + link an ELF32 VAX exe
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
                  ovmx-cross-vax build-libvmssys-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: netbsd-vax cross build/link exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: libvmssys builds and links for vax--netbsdelf' \
            || { echo "FAIL: did not see the build+link PASS banner"; exit 1; }
          echo "$RAW" | grep -qF 'file format elf32-vax' \
            || { echo "FAIL: objects were not elf32-vax -- wrong target"; exit 1; }
          echo "$RAW" | grep -qiF 'Machine:                           Digital VAX' \
            || { echo "FAIL: linked executable was not a VAX ELF"; exit 1; }
          echo "PASS: libvmssys built for netbsd-vax and a real ELF32 VAX exe linked against NetBSD libc"

