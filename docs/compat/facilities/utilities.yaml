# Source of truth for the utilities row of the Compatibility Surface Register.
facility: utilities
name: "Utility Images (AUTHORIZE, BACKUP, SORT, ANALYZE, …)"
domain: command-language
vms_ref: "OpenVMS System Management Utilities Reference Manual; OpenVMS Utility Routines Manual"
scope_1_0: in
tier: 1
plan_ref: vms-8ad
summary: >
  Standalone utility images invoked as DCL verbs. Most core system-management
  utilities are real; SORT does real /KEY field-based sorting (vms-e76), and the
  remaining record/data utilities (BACKUP, CONVERT) are honestly partial on
  their advanced qualifiers rather than full VMS-parity implementations.
  Re-censused 2026-09-14 against origin/main: unchanged in substance; CONVERT is
  still the one facade-risk row (line-by-line copy printing CONVERTED); evidence
  lines re-anchored. PRODUCT stays verified (install-boot-e2e gate).
last_reviewed: 2026-09-14
