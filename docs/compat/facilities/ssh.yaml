# Source of truth for the SSH row of the Compatibility Surface Register.
# Scope note: SSH is a VMS-era surface — VSI OpenVMS ships an OpenSSH server as
# part of TCP/IP Services. The compat surface is "SSH into the system and get an
# authenticated DCL session," NOT OVMX's internal init plumbing.
facility: ssh
name: "SSH remote login"
domain: networking
vms_ref: "VSI OpenVMS TCP/IP Services — SSH server (OpenSSH port)"
scope_1_0: in
plan_ref: vms-67f
summary: >
  SSH login to an authenticated interactive (DCL) session, as VSI OpenVMS
  provides through TCP/IP Services. OVMX has the daemon but not the end-to-end
  surface: it is blocked on the networking lane, and the authenticated session
  does not yet assume the user's identity.
last_reviewed: 2026-08-13
items:
  - id: ssh$remote-login
    kind: feature
    status: partial
    authenticity: real
    scope_1_0: in
    vms: "SSH in and get an authenticated interactive DCL/LOGINOUT session"
    evidence: src/vmsssh/vmssshd.c
    notes: >
      Daemon is real (vmsshd, ~903 lines, libssh, LOGINOUT-equivalent PCB init,
      execs `vmsdcl --login`), but the end-to-end surface does not function in the
      shipped system: there is no NIC to listen on (see tcpip-services) and the
      daemon is not started at boot. Blocked on the networking lane (vms-67f) — a
      reachability gap, honestly stated, not a fake success.
  - id: ssh$identity
    kind: feature
    status: absent
    authenticity: facade-risk
    scope_1_0: in
    vms: "Authenticated session assumes the user's UIC/privileges (LOGINOUT identity), not root"
    evidence: src/vmsssh/vmssshd.c
    notes: >
      Every SSH session runs euid=0 — no credential drop to the authenticated
      user's UIC. A security facade distinct from the reachability gap;
      cross-listed to docs/draper-faithfulness-register.md. (Console LOGINOUT drops
      identity correctly via vms_kif_setident; SSH does not.)
