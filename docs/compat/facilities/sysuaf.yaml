# Source of truth for the SYSUAF row of the Compatibility Surface Register.
facility: sysuaf
name: "SYSUAF — Accounts + Login Authentication"
domain: system-management
vms_ref: "OpenVMS Guide to System Security; Authorize Utility Manual"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  Full UAF account record storage and Purdy/hashed password authentication are
  real. Account-state login enforcement is now genuine: DISUSER/DISACNT deny
  login (console + SSH) and CAPTIVE confines the session — both read at login
  time (vms-c8fa). SSH now performs the executive setident + a permanent,
  fail-closed UIC credential drop (vms-49e/vms-6ae), closing the old
  authenticate-then-run-as-root facade. Password expiration is now ENFORCED at
  login on both front-ends (vms-c6df): an expired password (admin-forced
  UAI$M_PWD_EXPIRED, or UAF$Q_PWD_DATE+UAF$Q_PWD_LIFETIME elapsed) is refused
  rather than logged straight in. The interactive force-change flow VMS runs in
  its place is not yet built (honest-refuse floor, INV-6); it is the tracked
  follow-up.
last_reviewed: 2026-09-09
items:
  - {id: sysuaf$record,        kind: struct,   status: implemented, authenticity: real,        vms: "Full UAF account record (username, UIC, dirs, quotas, flags, hashed password)", evidence: src/libvms/rtl/sysuaf.c}
  - {id: sysuaf$authenticate,  kind: routine,  status: implemented, authenticity: real,        vms: "sysuaf_authenticate() — Purdy/hashed password check against stored quadword", evidence: "src/libvms/rtl/sysuaf.c:319"}
  - {id: sysuaf$disuser,       kind: feature,  status: implemented, authenticity: real,        vms: "UAI$M_DISUSER/DISACNT — interactive login disabled for account", evidence: "src/libvms/rtl/sysuaf.c:389", notes: "vms-c8fa (re-census 2026-08-31): now READ at login. sysuaf_interactive_login_permitted() checks DISUSER|DISACNT and is enforced BEFORE start_session() in both console LOGINOUT (tools/vms_login.c:~740) and SSH (src/vmsssh/sshd_auth.c:41) — a disabled account is refused with the same generic failure text even with the correct password. Was absent/facade-risk on 2026-08-13."}
  - {id: sysuaf$captive,       kind: feature,  status: implemented, authenticity: real,        vms: "UAI$M_CAPTIVE — restrict account to captive command procedure", evidence: "src/libvms/rtl/sysuaf.c:399", notes: "vms-c8fa (re-census 2026-08-31): sysuaf_account_captive() now read. SSH auth passes --captive to vmsdcl (src/vmsssh/sshd_auth.c:151); DCL enforces it (src/vmsdcl/dcl_main.c:614+ — Ctrl-Y disabled, REPL suppressed, logs out after the login procedure). Was absent/facade-risk on 2026-08-13."}
  - {id: sysuaf$pwd_expired,   kind: feature,  status: partial,     authenticity: advisory,    vms: "UAI$M_PWD_EXPIRED + UAF$Q_PWD_DATE/PWD_LIFETIME — password expiration enforced at login", evidence: "src/libvms/rtl/sysuaf.c:418", notes: "vms-c6df: NOW ENFORCED. sysuaf_password_expired() (src/libvms/rtl/sysuaf.c) reads UAI$M_PWD_EXPIRED and UAF$Q_PWD_DATE+UAF$Q_PWD_LIFETIME straight from the binary $UAFDEF record (NOT the flag-name string, which omits the transient bit) against sys$gettim; an expired password is REFUSED at login on both front-ends — console LOGINOUT (tools/vms_login.c, %OVMX-F-PWDEXPIRED before start_session) and SSH (src/vmsssh/sshd_auth.c ovmx_sshd_check_login). On-disk UAF$Q_PWD_LIFETIME field added at [OVMX] offset 0x188 (sysuaf.h). authenticity=advisory (not real): VMS FORCES a password change at login; OVMX honestly REFUSES instead (INV-6) — the interactive force-change flow is the tracked follow-up vms-91f. Proof: tests/libvms/test_sysuaf_login_flags.c (predicate + LOGINOUT source guard), tests/vmsssh/test_sshd_auth.c (real SSH decision fn vs expired binary records), tests/qemu/test_syssvc_loginout_acp.c (expired account authored + read back over the ODS-2 ACP). Was absent/facade-risk (zero readers, expired pwd logged in normally) on 2026-08-31."}
  - {id: sysuaf$ssh_credential_drop, kind: feature, status: implemented, authenticity: real, vms: "Process credentials match the authenticated SYSUAF identity after SSH login", evidence: "src/vmsssh/vmssshd.c:612", notes: "vms-49e/vms-6ae (re-census 2026-08-31): FIXED. vmssshd now (a) establishes the authenticated identity in the executive via vms_kif_setident, fail-closed _exit(1) on refusal (vmssshd.c:~446, INV-6), and (b) performs a permanent setgid-before-setuid UIC drop via ovmx_cred_drop_to_uic() (vmssshd.c:612) BEFORE execl of vmsdcl, fatal on failure. Unit-tested (tests/vmsssh/test_cred_drop.c, test_ssh_ident.c). Was absent/facade-risk (session ran as euid=0/root) on 2026-08-13."}
