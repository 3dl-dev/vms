  - {id: sys$delprc, kind: routine, status: implemented, authenticity: real, vms: "Delete a process", evidence: src/libvms/syssvc/sys_process.c}
  - {id: sys$hiber, kind: routine, status: implemented, authenticity: real, vms: "Hibernate the calling process", evidence: src/libvms/syssvc/sys_process.c}
  - {id: sys$exit, kind: routine, status: implemented, authenticity: real, vms: "Exit the calling process/image", evidence: src/libvms/syssvc/sys_process.c}
  - {id: sys$wake, kind: routine, status: implemented, authenticity: facade-risk, vms: "Wake a hibernating/suspended process, by process name or ID", evidence: src/libvms/syssvc/sys_misc.c, notes: "prcnam argument silently discarded; acts on the calling Linux PID only"}
  - {id: sys$suspnd, kind: routine, status: implemented, authenticity: facade-risk, vms: "Suspend a process", evidence: src/libvms/syssvc/sys_misc.c, notes: "prcnam argument silently discarded; acts on the calling Linux PID only"}
  - {id: sys$resume, kind: routine, status: implemented, authenticity: facade-risk, vms: "Resume a suspended process", evidence: src/libvms/syssvc/sys_misc.c, notes: "prcnam argument silently discarded; acts on the calling Linux PID only"}
  - {id: sys$setpri, kind: routine, status: implemented, authenticity: facade-risk, vms: "Set process scheduling priority", evidence: src/libvms/syssvc/sys_misc.c, notes: "prcnam argument silently discarded; acts on the calling Linux PID only"}
  - {id: sys$forcex, kind: routine, status: implemented, authenticity: facade-risk, vms: "Force a process to exit", evidence: src/libvms/syssvc/sys_misc.c, notes: "prcnam argument silently discarded; acts on the calling Linux PID only"}
  - {id: sys$cancel, kind: routine, status: stub, authenticity: facade-risk, vms: "Cancel all I/O on all channels of the calling process", evidence: src/libvms/syssvc/sys_process.c, notes: "literal no-op, returns SS$_NORMAL unconditionally"}
