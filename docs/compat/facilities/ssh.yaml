  - {id: ssh$identity-terminal-map, kind: feature, status: partial, authenticity: real, vms: "executive-resident VMS identity + terminal mapping for a network-login session", evidence: "src/vmsssh/ssh_ident.c", notes: "The SEAMS are real and unit-tested: ssh_ident.c establishes identity through the executive (vms_kif_setident) and is FAIL-HONEST — if the executive refuses (even status, or /dev/vms absent) the session is DENIED with no local privileged fallback (tests/vmsssh/test_ssh_ident.c, closing the audit §3.7 soft-fail bypass); term_map.c maps TERM -> VMS device type, labelled an OVMX design choice (not VMS-authentic) per Rule 8 (tests/vmsssh/test_term_mapping.c). ssh_ident.c is reused by the TCP/IP inetd run-as path (alongside cred_drop.c); term_map.c is unit-tested substrate with NO production caller yet — it will be wired by the real OpenSSH port (vms-9ef). status=partial (not implemented) because there is no SSH session wiring them end-to-end yet — that arrives with the real OpenSSH port (vms-9ef). The former 'RUNTIME-PROVEN over the wrapped sshd' claim (and its sshd_auth.c evidence) is WITHDRAWN: that scaffold was retired as LARP (vms-d916), so the runtime proof it rested on no longer exists."}
