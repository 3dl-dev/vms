# Source of truth for the DECnet Phase IV row of the Compatibility Surface Register.
facility: decnet
name: "DECnet Phase IV (Routing, NSP, Task-to-Task, SET HOST)"
domain: networking
vms_ref: "DECnet for OpenVMS Networking Manual; DNA Phase IV Routing + NSP specs"
scope_1_0: in
plan_ref: vms-30e
summary: >
  No longer greenfield: src/vmsdecnet now carries real, clean-room Phase IV
  wire codecs and a routing adjacency engine, several oracle-verified
  byte-identical against captures committed in docs/decnet-provenance-register.md
  (lab specimens, rd vms-3be/PR #665). Present: the Ethernet Endnode Hello
  codec (oracle-verified), the Router Hello codec (spec-derived), the routing
  adjacency state machine + hello/listen timers, and the NSP transport codec
  (Connect Initiate oracle-verified; other PDUs self-round-trip). A live
  engine/socket now drives real logical links over the datalink: inbound SET HOST
  reaches an AUTHENTICATED LOGINOUT (decnet$cterm-session-auth), the outbound
  DCL SET HOST CLIENT is wired (decnet$set-host), and inbound file COPY / FAL
  (object 17) authenticates the connect-carried credentials and moves a file
  through DAP + RMS (decnet$fal / decnet$dap). Still open: general task-to-task
  ($QIO), and the outbound COPY-over-datalink client wired into a DCL process.
  NODE"acc"::file filespec syntax parses and DCL COPY now routes it to the FAL
  path (reporting honestly until the outbound bridge lands). Real-VAX oracle
  status (rd vms-a70): OUTBOUND SET HOST is now PROVEN live against a real VMS
  VAX V7.3 -- OVMX's DCL SET HOST client drives a complete DECnet Phase IV CTERM
  session (CI -> CC -> NSP link-service -> CTERM foundation negotiation ->
  LOGINOUT -> authenticated DCL -> remote commands with live output -> clean
  LOGOUT), wire-verified in tests/lab/captures/decnet-sethost-dcl-20260911/ (the
  session's own _RTA1: process appears in its own SHOW SYSTEM output). The CTERM
  foundation/Bind protocol was re-grounded byte-for-byte on the real oracle
  (decnet$sc-connect + the foundation codec), retiring the earlier OVMX-labelled
  facade. Still open on the DECnet SET HOST bracket: the INBOUND direction
  (real VAX -> OVMX-as-CTERM-server -> OVMX LOGINOUT) is not yet live-proven
  (needs the booted OVMX executive; decnet$cterm-session-auth stays partial),
  plus general task-to-task ($QIO) and the outbound COPY-over-datalink client.
  1.0 track (vms-30e).
last_reviewed: 2026-10-04
