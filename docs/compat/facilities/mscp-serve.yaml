# Source of truth for the mscp-serve row of the Compatibility Surface Register.
facility: mscp-serve
name: "MSCP/TMSCP disk & tape serving"
domain: clustering
vms_ref: "MSCP/TMSCP protocol (Systems Application A); OpenVMS Cluster Systems manual"
scope_1_0: in
plan_ref: vms-6e1
summary: >
  MSCP disk SERVING IS NOT BUILT. It lived in the userspace SCS daemon, which
  FC-P3.9 deleted (the operator's 2026-09-02 clustering reset); the
  executive-resident replacement is FC-P6.x and unbuilt. What DOES exist is the
  CLIENT half the executive's own cluster join drives: the MSCP codec and the
  served-unit discovery FSM. TMSCP tape serving is not evidenced.
last_reviewed: 2026-09-03
items:
  - id: mscp-serve$disk-read-write
    kind: feature
    status: implemented
    authenticity: real
    vms: "MSCP disk-serving controller: READ/WRITE command responder"
    evidence: src/kernel-core/vms_mscp_srv.c
    notes: >
      EXECUTIVE-RESIDENT SERVER LANDED (FC-P6.3), earning back the capability the
      2026-09-02 reset voided when it deleted the userspace daemon
      (src/vmsscs/scs_mscp_srv.c). `vms_mscp_srv_fsm.c` (UQB/HQB/HRB, the
      Controller-Available/Online state machine) + `vms_mscp_srv.c` glue serve the
      executive's own mounted volumes via `exec_blockdev_*`/the ACP as
      `$<ALLOCLASS>$DUAn`; SCC/GUS/ONLINE/READ/WRITE built+parsed through the
      FC-P6.2 codec at measured lengths; MSCP$DISK LISTENs only when a serveable
      unit exists; write-protect honest (ST.WPR with the real Table B-2 reason
      sub-code, zero blocks written). status=implemented, authenticity=real, NOT
      verified: R1 = test_mscp_srv (167 checks) + R4-lite = FC-P3.4's real
      class-driver discovery FSM walks this real server end-to-end (SCC x2 + MD.NXU
      walk, 2 units). NOT YET: R5 real-VAX MOUNT (FC-P6.4, lab-deferred); the WRITE
      block-transfer INITIATION direction is lab-ungrounded (READ, what a MOUNT
      needs, is fully grounded); MSCP_SERVE_ALL bit semantics undecoded (any
      non-zero = serve). `mscp-serve$online-end` is implemented (real serve-side
      handler) but below verified — no byte-exact real-VAX-accepted oracle yet.

  - id: mscp-serve$online-end
    kind: feature
    status: implemented
    authenticity: real
    vms: "ONLINE END (0x89) response"
    evidence: src/kernel-core/vms_mscp_srv_fsm.c
    notes: >
      Executive-resident serve-side handler (vms-600), no longer book-only:
      h_cmd_online (vms_mscp_srv_fsm.c) parses an inbound ONLINE command and
      srv_send_online_end builds+sends the 44-byte ONLINE-END via the codec's
      vms_mscp_online_end_build ("44 bytes MEASURED"). The P.UNFL echo runs
      serve-side (host_unfl | unit_flags, host_unfl recorded on the HQB from the
      host's own ONLINE cmd) and P.UNTI = (SCSSYSTEMID<<16)|unit. GROUNDED on
      vaxlab-9: the 44-byte measured length, the P.UNFL echo rule, and P.UNTI.
      NOT verified: there is no byte-exact capture of OVMX's OWN ONLINE-END being
      ACCEPTED by a real VAX end-to-end (SCC + GUS have goldens; ONLINE-END does
      not) -- that is the R5 mount-acceptance lab run (vms-36a8/vms-600), so this
      stays implemented, below verified, until the oracle capture exists.

  - id: mscp-serve$client-discovery
    kind: feature
    status: implemented
    authenticity: real
    vms: "MSCP$DISK client: connect, and walk the member's served units"
    evidence: src/kernel-core/vms_mscp_cl_fsm.c
    notes: >
      FC-P3.4/FC-P3.3, executive-resident. The joining node opens its own
      MSCP$DISK client connection to the member it is joining through and walks
      the served units, which is a real obligation of the documented join
      sequence (wire spec §4(L)(c)), not a diagnostic. Every field it emits is
      built by the MSCP codec (vms_cluster_codec_mscp.c) from state the FSM
      holds; no offset is written outside the codec TU.
      PROVEN AT R1/R2: tests/cluster/host/test_mscp_cl_fsm.c and
      test_codec_mscp.c (byte-exact against the in-tree fixtures), plus the
      simulator's join scenarios. NOT claimed: mounting a real VAX-served disk,
      which needs both a real member and the server half -- R5, lab-deferred.

  - id: mscp-serve$tmscp-tape
    kind: feature
    status: absent
    authenticity: n/a
    vms: "TMSCP tape serving"
    notes: "Not evidenced in the current tree."
