  # Job: Multi-Object main() Executable Link + Activate — x86_64 (vms-206)
  #
  # x86_64 counterpart of multiobj-exec. Proves LINK.EXE's emit_shareable()
  # synthesizes REAL x86_64 machine code, not the aarch64 words it silently
  # reused before vms-206, for (1) the crt0 entry stub of a main()-based
  # --executable and (2) the PLT stub + import-CALL routing for a cross-image
  # R_X86_64_PLT32 call to a --use producer's universal.
  #
  # Runs in a NATIVE x86_64 alpine container (vms-0b8): the runner is x86_64, so
  # this container executes on the HOST kernel with NO qemu/emulation in the path
  # under test — the real Linux ELF loader invokes IMGACT.EXE via PT_INTERP
  # exactly as it would for any process, identical to the arm64 sibling's model
  # and to the now-green imgact-x86_64 activation proof. The container gives the
  # root-owned mount namespace the harness needs to stage IMGACT.EXE at its baked
  # PT_INTERP path /vms/SYS0/SYSCOMMON/SYSEXE/IMGACT.EXE (the REAL OVMX SYSDISK
  # deployment path — not a Unix leak to design around). Previously this job ran
  # bare on the runner as the non-root user and could not `mkdir /vms`.
  # -----------------------------------------------------------------------
  multiobj-exec-x86_64:
    name: Multi-Object main() Executable Link + Activate — x86_64 (vms-206)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link + activate a multi-object main() program through IMGACT.EXE (native x86_64)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make >/dev/null
              export CC=gcc WORK=/tmp/multiobj-exec-x86_64
              sh /src/src/imgact/test/run_multiobj_exec_x86_64.sh
            '

  # -----------------------------------------------------------------------
  # Job: Read-only-section relocations — x86_64 (vms-a66)
  #
  # LINK.EXE used to collect relocations ONLY against sections it bucketed
  # B_TEXT or B_DATA, silently discarding every relocation whose target was a
  # read-only allocatable section. gcc emits each switch jump table into
  # `.rodata` as `.long arm - table_base` (one R_X86_64_PC32 per arm, because
  # the arms are in .text and the table is not), so those tables came out ALL
  # ZERO and the dispatch `jmp *rdx` executed the table's own bytes. That is
  # what made DCL.EXE segfault on x86_64: musl's pop_arg jumped into the
  # "(null)" string in DECC$SHR's .rodata on the first %-conversion.
  #
  # The three jobs that "covered" this path before (multiobj-exec-x86_64,
  # vmslink-x86_64, exec-tls) all passed through the bug because their
  # specimens contained no switch big enough for a jump table and never
  # executed one. This job reproduces the SHAPE directly — it is not a
  # scale/import-count gate — and diffs the activated image's output against
  # the same source built by the system toolchain.
  # -----------------------------------------------------------------------
  rodata-reloc-x86_64:
    name: Read-only-section relocations (switch jump tables) — x86_64 (vms-a66)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link + activate a jump-table-bearing image against real musl DECC$SHR (x86_64)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/rodata-reloc-x86_64
              sh /src/src/vmslink/test/run_rodata_reloc_x86_64.sh
            '

  exec-tls:
    name: Executable-Own TLS Link + Activate
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Link + activate an executable with its OWN __thread/TLSDESC var through IMGACT.EXE (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make >/dev/null
              export CC=gcc WORK=/tmp/exec-tls
              sh /src/src/imgact/test/run_exec_tls.sh
            '

  # -----------------------------------------------------------------------
  # DCL-native ENDPOINT (pillar vms-ade / bead vms-b65.6) — S1 of self-hosting
  # (vms-116). The REAL src/vmsdcl shell (21 TUs) + src/vmsqueue links as a
  # VMS-native ET_DYN executable via LINK.EXE --executable --use {DECC$SHR + the
  # five OVMX shareables}: a 22-object main() program with the full intra-image
  # reloc set, 140 cross-image imports all bound, and its own single-object TLS.
  # IMGACT.EXE activates it (crt0 recovers argc/argv off the kernel stack) and
  # DCL runs a scripted session (SHOW TIME + A = 2+3 / SHOW SYMBOL A) to VMS-
  # correct output, clean exit. NO ld / NO ld.so — the operator's "all VMS" path.
  # -----------------------------------------------------------------------
  dcl-native:
    name: DCL.EXE VMS-native Link + Activate (self-hosting S1)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
