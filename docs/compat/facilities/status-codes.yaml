# Status / condition codes. See docs/design-compat-surface-register.md.
facility: status-codes
name: "Status / Condition Codes (SS$_, RMS$_, Facility Registry)"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — Condition Values; OpenVMS Programming Concepts Manual Ch. 8"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  STS$V/M/S_* bitfield layout complete and matches the documented VSI layout
  (implemented, not oracle-verified — no lab/conformance capture pins it). SS$_
  codes: 111 of VMS's ~500+ defined (common/executive subset, long tail absent).
  RMS$_ codes: 83 of ~200+ defined. SYS$GETMSG message text: the compiled-in
  known_codes[] table in src/libvms/status.c carries real text for 51 SS$+RMS$
  codes (44 SS$ + 8 RMS$); a code absent from the table decodes honestly to
  "unknown status code" and an unknown facility to "NONAME" — no invented
  VMS-shaped text. Facility number registry: 6 facilities decoded in
  facility_name() (SYSTEM,RMS,CLI,LIB,MTH,OTS); unknown facilities decode to
  generic NONAME. starlet.h declares only 109 sys$ symbols vs several
  hundred in real VMS.
last_reviewed: 2026-09-14
items:
