# Source of truth for the TCP/IP Services row of the Compatibility Surface Register.
facility: tcpip-services
name: "TCP/IP Services (UCX QIO + Sockets + EWA0:/BGn:)"
domain: networking
vms_ref: "OpenVMS TCP/IP Services for OpenVMS (UCX) manuals"
scope_1_0: in
plan_ref: vms-67f
summary: >
  Data half built (BGn: sockets veneer + QIO path + client tools, vms-843/
  vms-22a/vms-dbb) and now the CONFIG/MANAGEMENT half (vms-67f): OVMX IP can
  be configured the VMS way — TCPIP$CONFIG core-environment procedure +
  `TCPIP SET INTERFACE`/`SHOW CONFIGURATION` record the local host name,
  domain and interface address in the VMS-faithful TCPIP$INET_HOST/DOMAIN/
  HOSTADDR SYSTEM logicals (executive-resident LNM$SYSTEM, shared cross-process
  over /dev/vms) and apply the address to the interface over the substrate
  stack. INV-6 honest: with no executive the config fails SS$_NOSUCHDEV, never
  a per-process fake. Deferred rungs (honestly): DHCP, multiple interfaces /
  TCPIP$INET_HOSTADDRn, the persistent service/proxy databases, a NIC as a
  VMS device (EWA0:). 1.0 blocker (vms-67f).
last_reviewed: 2026-08-28
items:
  - {id: tcpip-services$ucx-qio-socket-api, kind: feature, status: absent, authenticity: n/a, vms: "UCX QIO-based / C-socket network API for VMS programs", evidence: "docs/design-tcpip-services-ovmx.md", scope_1_0: in, notes: "No src/vmstcpip/. No BG: device, no QIO network path, no usable socket API."}
  - {id: tcpip-services$nic-device, kind: feature, status: absent, authenticity: n/a, vms: "NIC exposed as VMS device EWA0:/BGn:", evidence: "distro/boot/run-qemu.sh:70", scope_1_0: in, notes: "QEMU boots with -nic none (also distro/Dockerfile.bootable:773); no network device path into the VM at all."}
  - {id: tcpip-services$dcl-tcpip-verb, kind: command, status: implemented, authenticity: real, vms: "DCL TCPIP verb (show interface/route/host/version/configuration, set host/interface/route/name_service)", evidence: "src/vmsdcl/dcl_cmd_misc.c", scope_1_0: in, notes: "SHOW INTERFACE/ROUTE is Linux-substrate introspection (SIOCGIF*/proc). SET INTERFACE now applies the address to the interface AND records TCPIP$INET_HOSTADDR in the executive-resident LNM$SYSTEM table; SHOW CONFIGURATION reads the TCPIP$ SYSTEM logicals back (honest %TCPIP-W-NOEXEC with no executive). The durable config path is authentic (vms-67f); the introspection commands remain substrate-sourced."}
  - {id: tcpip-services$config-plane, kind: feature, status: implemented, authenticity: real, vms: "TCPIP$CONFIG core config + TCPIP$INET_HOST/DOMAIN/HOSTADDR SYSTEM logicals", evidence: "src/vmstcpip/mgmt/tcpip_config.h", scope_1_0: in, notes: "Config/management half of vms-67f. Host name/domain/address configured the VMS way land in the executive-resident LNM$SYSTEM table (shared cross-process over /dev/vms), read back through the independent sys$trnlnm, and the address is applied to the interface over the substrate stack. INV-6: SS$_NOSUCHDEV with no executive, never a per-process fake. Proven against a real /dev/vms (test_syssvc_tcpip_config) + a host honest-degradation DCL test."}
