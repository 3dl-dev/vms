                  ovmx-cross-vax tools/cross-vax/build-vmslnm-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: netbsd-vax vmslnm cross build/link exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: vmslnm builds and links for vax--netbsdelf' \
            || { echo "FAIL: did not see the vmslnm build+link PASS banner"; exit 1; }
          echo "$RAW" | grep -qiF 'file format elf32-vax' \
            || { echo "FAIL: vmslnm objects were not elf32-vax -- wrong target"; exit 1; }
          echo "$RAW" | grep -qiF 'Machine:                           Digital VAX' \
            || { echo "FAIL: vmslnm exe was not a VAX ELF"; exit 1; }
          echo "PASS: vmslnm built for netbsd-vax and a real ELF32 VAX exe linked"

      - name: Cross-compile vmsfs (userspace) for netbsd-vax + link an ELF32 VAX exe
        run: |
