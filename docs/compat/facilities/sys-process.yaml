# SYS$ Process Control. See docs/design-compat-surface-register.md.
facility: sys-process
name: "SYS$ Process Control"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — Process Control Services"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  VMS ships ~25 process-control services; OVMX declares 14. CREPRC/DELPRC/
  HIBER/EXIT are real. WAKE/SUSPND/RESUME/SETPRI/FORCEX all silently discard
  their prcnam argument and act on the calling Linux PID only (facade-risk).
  SYS$CANCEL is a literal no-op returning SS$_NORMAL (facade-risk). SYS$SETPRN
  and SYS$PROCESS_SCAN are absent.
last_reviewed: 2026-08-13
items:
