# OVMX module source manifest for vms.ko (read by overlay-ovmx-drivers.sh).
#
# One glob per line, relative to the OVMX repo root. The overlay FLATTENS every
# matching file into drivers/ovmx/vms/ at kernel-build time (the canonical
# source stays single-record in src/kernel* -- this is an overlay, not a fork).
# Blank lines and '#' comments are ignored. Globs are non-recursive, so the
# vmsfs/ subdirs below are NOT pulled in here.
#
# vms.ko = the Linux glue (src/kernel: the /dev/vms char device + P0/P1 region
# mappers + exec_*_linux.h backend shims) + the substrate-agnostic executive
# core (src/kernel-core: the exec facilities + exec_*.h shim contracts). This
# set MUST mirror src/kernel/Makefile's `vms-y` -- see vms/Kbuild.
src/kernel/*.c
src/kernel/*.h
src/kernel-core/*.c
src/kernel-core/*.h
# The genuine ODS-2 codec compiled KERNEL-RESIDENT (vms-5f0, epic vms-208): the
# atomic flip makes PID 1 $MOUNT SYS$DISK via the ACP, so the shipped vms.ko must
# validate the volume for real (acp_validate_ods2 in vmsfs_acp.c). vms/Kbuild's
# vms-y builds ONLY ods2_reader.o + ods2_edit.o (the pure parse/validate + edit
# surface); the writer / bdev / block objects are staged but NOT built --
# vmsfs_acp.c does its own block I/O through exec_blockdev_*_block. Same pattern
# as vmsfs/sources.conf.
src/vmsfs/ods2/*.c
src/vmsfs/ods2/*.h
# The codec's PUBLIC header is #include'd by a SUBDIR path (#include
# "vmsfs/ods2.h"); stage it preserving that component (the '->' convention in
# overlay-ovmx-drivers.sh) so the flat module dir resolves it via -I$(src).
src/vmsfs/include/vmsfs/ods2.h -> vmsfs/
