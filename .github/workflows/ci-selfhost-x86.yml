    # was ubuntu-latest emulating arm64 via setup-qemu+--platform (~10x slower).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Activate a VMS-native image through the real IMGACT.EXE (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make >/dev/null
              export CC=gcc WORK=/tmp/symvec-act
              sh /src/src/imgact/test/run_symvec_activation.sh
            '

      - name: Activate a producer whose section table exceeds the old 64 cap (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
