# Source of truth for the SYSUAF row of the Compatibility Surface Register.
facility: sysuaf
name: "SYSUAF — Accounts + Login Authentication"
domain: system-management
vms_ref: "OpenVMS Guide to System Security; Authorize Utility Manual"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  Full UAF account record storage and Purdy/hashed password authentication are
  real. Account-state login enforcement is genuine: DISUSER/DISACNT deny login
  (console + SSH) and CAPTIVE confines the session — both read at login time
  (vms-c8fa). SSH performs the executive setident + a permanent, fail-closed UIC
  credential drop (vms-49e/vms-6ae), closing the old authenticate-then-run-as-root
  facade. Password expiration is ENFORCED at login on both front-ends (vms-c6df):
  an expired password (admin-forced UAI$M_PWD_EXPIRED, or
  UAF$Q_PWD_DATE+UAF$Q_PWD_LIFETIME elapsed) is refused rather than logged straight
  in; the interactive force-change flow VMS runs in its place is the tracked
  follow-up (honest-refuse floor, INV-6). A NETWORK-class login authorization
  decision (DISNETWORK + the account/expiry gates) now exists and is
  selftest-proven fail-closed, but is deliberately unwired into any live login
  path pending the SSH->LOGINOUT session-establish (vms-843a/vms-16b).
last_reviewed: 2026-09-14
items:
  - {id: sysuaf$record,        kind: struct,   status: implemented, authenticity: real,        vms: "Full UAF account record (username, UIC, dirs, quotas, flags, hashed password)", evidence: src/libvms/rtl/sysuaf.c}
  - {id: sysuaf$authenticate,  kind: routine,  status: implemented, authenticity: real,        vms: "sysuaf_authenticate() — Purdy/hashed password check against stored quadword", evidence: "src/libvms/rtl/sysuaf.c:320"}
  - {id: sysuaf$disuser,       kind: feature,  status: implemented, authenticity: real,        vms: "UAI$M_DISUSER/DISACNT — interactive login disabled for account", evidence: "src/libvms/rtl/sysuaf.c:390", notes: "vms-c8fa: READ at login. sysuaf_interactive_login_permitted() checks DISUSER|DISACNT and is enforced BEFORE start_session() in console LOGINOUT (tools/vms_login.c) — a disabled account is refused with the same generic failure text even with the correct password. (The SSH front-end that also enforced this was the hand-rolled scaffold sshd_auth.c, retired as LARP vms-d916; the enforcement returns with the real OpenSSH port, vms-9ef.) Was absent/facade-risk on 2026-08-13. Re-census 2026-09-15: SSH front-end clause corrected, line ref :390."}
  - {id: sysuaf$captive,       kind: feature,  status: implemented, authenticity: real,        vms: "UAI$M_CAPTIVE — restrict account to captive command procedure", evidence: "src/libvms/rtl/sysuaf.c:400", notes: "vms-c8fa: sysuaf_account_captive() read. DCL enforces captive (src/vmsdcl/dcl_main.c — Ctrl-Y disabled, REPL suppressed, logs out after the login procedure) regardless of front-end. (The SSH front-end that passed --captive to vmsdcl was the retired scaffold sshd_auth.c, vms-d916; it returns with the real OpenSSH port, vms-9ef.) Was absent/facade-risk on 2026-08-13. Re-census 2026-09-15: SSH front-end clause corrected, line ref :400."}
  - {id: sysuaf$pwd_expired,   kind: feature,  status: partial,     authenticity: advisory,    vms: "UAI$M_PWD_EXPIRED + UAF$Q_PWD_DATE/PWD_LIFETIME — password expiration enforced at login", evidence: "src/libvms/rtl/sysuaf.c:418", notes: "vms-c6df: ENFORCED. sysuaf_password_expired() reads UAI$M_PWD_EXPIRED and UAF$Q_PWD_DATE+UAF$Q_PWD_LIFETIME straight from the binary $UAFDEF record (NOT the flag-name string, which omits the transient bit) against sys$gettim; an expired password is REFUSED at login in console LOGINOUT (tools/vms_login.c, %OVMX-F-PWDEXPIRED before start_session). (The SSH front-end that also refused it was the retired scaffold sshd_auth.c, vms-d916; it returns with the real OpenSSH port, vms-9ef.) On-disk UAF$Q_PWD_LIFETIME field at [OVMX] offset 0x188 (sysuaf.h). authenticity=advisory (not real): VMS FORCES a password change at login; OVMX honestly REFUSES instead (INV-6) — interactive force-change is the tracked follow-up vms-91f. Proof: tests/libvms/test_sysuaf_login_flags.c, tests/qemu/test_syssvc_loginout_acp.c (expired account authored + read back over the ODS-2 ACP). Re-census 2026-09-15: SSH front-end + test_sshd_auth.c (both retired) removed from proof."}
  - {id: sysuaf$network_login_permit, kind: feature, status: partial, authenticity: advisory, vms: "NETWORK-class login authorization — DISNETWORK/DISUSER/DISACNT/expired gates for a pre-authenticated (SSH) session", evidence: "tools/vms_login.c:933", plan_ref: vms-843a, notes: "vms-843a/vms-16b (2026-09-12, #1199): loginout_network_permit() is a pure, fail-closed AUTHORIZATION DECISION for the faithful SSH->$CREPRC(LOGINOUT) handoff (Option A — SSH authenticates in-protocol against the same SYSUAF/Purdy authority, so LOGINOUT does not re-read the password). Permits a network login only if the account is enabled (DISUSER/DISACNT), UAI$M_DISNETWORK is clear, and the password is not expired; grants nothing beyond the SYSUAF record. Real, honest logic but DELIBERATELY UNWIRED into any live login path (dead until the session-establish + executive-identity conveyance land, lab-gated vms-101) — hence partial/advisory, not a facade. Proof is a plain host-side ctest (loginout_network_permit_selftest, tools/CMakeLists.txt:48, 6 cases clean->permit / DISNETWORK|DISUSER|DISACNT|expired|NULL->refuse) — a self-test, not an oracle, so NOT verified. This is a real, landed substrate rung the real OpenSSH port (rd vms-9ef) will bind. Design/plan: rd vms-9ef tree (the earlier docs/design-ssh-loginout-handoff.md was a scaffold-era design doc, not on the current tree)."}
  - {id: sysuaf$ssh_credential_drop, kind: feature, status: partial, authenticity: real, vms: "Process credentials match the authenticated SYSUAF identity after a network login", evidence: "src/vmsssh/cred_drop.c", notes: "vms-49e/vms-6ae: the SEAMS are real and unit-tested — (a) ssh_ident.c establishes the authenticated identity in the executive via vms_kif_setident, fail-closed on refusal (INV-6, test_ssh_ident.c), and (b) cred_drop.c performs a permanent setgroups/setgid-before-setuid UIC drop, fail-closed on any error (test_cred_drop.c). status=partial (not implemented) because the hand-rolled daemon that used to wire these before an execl of vmsdcl (vmssshd.c) was RETIRED as LARP (vms-d916): there is no SSH login process wiring them end-to-end today. The drop seam is meanwhile consumed for real by the TCP/IP inetd per-service run-as identity (tcpip_inetd_ident.c, vms-8bd), and both seams will be bound by the real OpenSSH port (vms-9ef). Was absent/facade-risk (session ran as euid=0/root) on 2026-08-13. Re-census 2026-09-15: evidence repointed off the retired vmssshd.c to the surviving seam; status implemented->partial (no live SSH session)."}
