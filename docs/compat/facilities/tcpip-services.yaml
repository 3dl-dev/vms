# Source of truth for the TCP/IP Services row of the Compatibility Surface Register.
facility: tcpip-services
name: "TCP/IP Services (UCX QIO + Sockets + BGn:/ETH0:)"
domain: networking
vms_ref: "OpenVMS TCP/IP Services for OpenVMS (UCX) manuals"
scope_1_0: in
plan_ref: vms-67f
summary: >
  Both halves are now substantially real. DATA PLANE: a VMS program reaches
  TCP the ordinary VMS way — $ASSIGN TCPIP$DEVICE: then $QIO on the
  executive-resident INET pseudo-device BGn: (src/kernel/vms_bg*, socket lives
  in vms.ko over the host in-kernel socket API, no userspace stack), proven
  end-to-end against a real /dev/vms and guarded by a negctl defect gate. A
  BSD-sockets RTL veneer (DECC$SOCKET-equivalent) rides that path, and the
  client TOOLS (DCL TELNET/FTP + PING), the TCPIP$INETD auxiliary server and a
  DAYTIME service are real. The NIC now surfaces as the VMS device ETH0: and
  QEMU provides a virtio-net-pci device (default user-mode NAT). CONFIG PLANE
  (vms-67f): host name/domain/address land in the executive-resident
  TCPIP$INET_HOST/DOMAIN/HOSTADDR SYSTEM logicals AND PERSIST ACROSS REBOOT —
  host/interface/route/name-service settings are written to TCPIP$*.DAT over the
  Files-11 ACP (apply/persist split) and reapplied at startup (TCPIP REAPPLY),
  proven by a double-boot e2e. INBOUND is R4-hardened: TCPIP$INETD drops each
  spawned service to its own SYSUAF run-as account before execv (fail-closed,
  never SYSTEM — vms-8bd) and caps concurrent service children (MAXCHILD
  fork-flood back-pressure — vms-bb4). INV-6 honest throughout: no /dev/vms =>
  SS$_NOSUCHDEV, never a per-process fake. Deferred honestly: DHCP, multiple
  interfaces / TCPIP$INET_HOSTADDRn, a PERSISTENT INETD service database (#878 —
  service enablement is in-memory from a text SERVICE.DAT today), and a raw
  NIC-as-VMS-device data path (EWA0:).
last_reviewed: 2026-09-12
items:
  - {id: tcpip-services$bg-inet-device, kind: feature, status: verified, authenticity: real, vms: "INET pseudo-device BGn: — $ASSIGN TCPIP$DEVICE: + $QIO (IO$_SETMODE/IO$_ACCESS/IO$_READVBLK/IO$_WRITEVBLK/IO$_DEACCESS) TCP socket path, executive-resident", evidence: "src/kernel/vms_bg_datafd.c", verified_against: "tests/qemu/test_syssvc_bg_echo.c — a VMS program TCP round-trips a loopback echo via the public system services against a REAL /dev/vms (honest SS$_NOSUCHDEV/EXIT_SKIP with no executive); + the facility_defects negctl gate 'bg-recv-length-zeroed' (vms-527)", notes: "The socket is executive-resident (vms.ko), the analogue of the executive mailbox; no userspace socket, exactly as VMS BGn: is a driver not a library."}
  - {id: tcpip-services$sockets-veneer, kind: feature, status: implemented, authenticity: real, vms: "BSD-sockets RTL veneer (DECC$SOCKET) — socket/connect/send/recv translated to $QIO on BGn:", evidence: "src/vmstcpip/sockets/vms_bgsock.c", notes: "707-line veneer; app speaks only BSD sockets, never BGn:/$QIO. Exercised by the qemu harness (tests/qemu/CMakeLists.txt) alongside the BGn: driver; used by the wrapped OpenSSH clients/daemon."}
  - {id: tcpip-services$client-tools, kind: utility, status: implemented, authenticity: real, vms: "TCP/IP client TOOLS — DCL TELNET + FTP over BGn:", evidence: "src/vmstcpip/services/tcpip_client.h", notes: "TELNET/FTP protocol engines driving BGn: the ordinary $ASSIGN/$QIO way; header-only static-inline so the test exercises the real product logic. Guarded by the negctl gate 'tcpip-ftp-get-length-dropped' (vms-dbb). Honest SS$_NOSUCHDEV with no executive."}
  - {id: tcpip-services$ping, kind: utility, status: implemented, authenticity: real, vms: "PING (ICMP echo) over BGn: raw socket", evidence: "src/vmstcpip/services/tcpip_ping.h", notes: "IO$_SETMODE P2=IO$K_SOCK_ICMP mints a raw AF_INET/SOCK_RAW/IPPROTO_ICMP executive socket; same public services as the TCP tools (vms-80b). Was the one tool tcpip_client.h honestly deferred as a NOOP."}
  - {id: tcpip-services$inetd, kind: subsystem, status: implemented, authenticity: real, vms: "TCPIP$INETD auxiliary server — bind/listen each enabled service's port and hand the connection to its service image", evidence: "src/vmstcpip/services/tcpip_inetd.h", notes: "Proven against a real /dev/vms by tests/qemu/test_syssvc_tcpip_inetd.c (vms-cdb9). Until vms-21b the aux server could not run on a BOOTED distro: TCPIP$INETD.EXE was never staged into the image, and it launched service images by a raw execv of a Linux path (service images are ODS-2-resident at SYS$SYSTEM:, not on the boot initramfs VFS). vms-21b stages it at SYS$SYSTEM: and launches service images the VMS way — materialize off the Files-11 ACP (the shared rms_stage_over_acp DCL RUN + PID1 use) then execve. NOT auto-started in the shipped default (operator security-posture call; enforced by tests/integration/test_tcpip_posture_guard.sh). R4-HARDENED (the gate before any reading/privileged service): each spawned service drops to its own SYSUAF run-as account (the SERVICE.DAT username field -> vms_kif_setident + Linux cred drop) BEFORE execv, FAIL-CLOSED — an empty/unknown/refused account _exit(125)s and the service never launches, never as SYSTEM (vms-8bd, tcpip_inetd_ident.c); and concurrent service children are capped (TCPIP_INETD_MAXCHILD, accept back-pressure) so a network fork-flood cannot exhaust the system (vms-bb4). Both proven by the fail-closed CHECKs in test_syssvc_tcpip_inetd.c and the daytime cold-boot e2e (DAYTIME launches under the low-priv TCPIP$DAYTIME account). Precondition that unblocks the OpenSSH sshd ladder (vms-9ef)."}
  - {id: tcpip-services$daytime-service, kind: feature, status: implemented, authenticity: real, vms: "DAYTIME service (RFC 867) launched by the auxiliary server", evidence: "src/vmstcpip/services/tcpip_daytime.h", notes: "First genuine standalone service image INETD launches end to end; proven by tests/qemu/test_syssvc_tcpip_daytime.c against a real /dev/vms (vms-477). That KE-harness proof injects a literal Linux image path; on the SHIPPED distro the image is ODS-2-resident at SYS$SYSTEM: and the aux server activates it over the ACP (materialize->execve, vms-21b) — proven answerable on a cold boot by tests/qemu/run_tcpip_daytime_boot_e2e.sh. DISABLED in the shipped default SERVICE.DAT (operator-enabled; the shipped image auto-starts no service — posture-guarded by tests/integration/test_tcpip_posture_guard.sh); the cold-boot proof enables it via a test overlay only. Under R4 (vms-8bd) the aux server launches it under the low-privilege TCPIP$DAYTIME SYSUAF service account (UIC [128,134], TMPMBX/NETMBX), NOT SYSTEM — the cold-boot e2e proves the persona drop end to end."}
  - {id: tcpip-services$nic-device, kind: feature, status: implemented, authenticity: real, vms: "NIC exposed as a VMS device (ETH0:, DVI$_DEVCLASS = DC$_SCOM)", evidence: "src/kernel-core/vms_devtab.c", notes: "The Linux net device roots at 'eth' so the native-rooted VMS name is ETH0: (device-native naming, vms-9d2). QEMU now provides ONE virtio-net-pci device; OVMX_NET_MODE defaults to user-mode NAT (SLIRP), with tap/bridge/none options (vms-7bd). A raw NIC-as-VMS-device I/O path (EWA0:) is still deferred; the TCP data path rides BGn:."}
  - {id: tcpip-services$config-plane, kind: feature, status: implemented, authenticity: real, vms: "TCPIP$CONFIG core config + TCPIP$INET_HOST/DOMAIN/HOSTADDR SYSTEM logicals + TCPIP SET INTERFACE/SHOW CONFIGURATION", evidence: "src/vmstcpip/mgmt/tcpip_config.h", notes: "Host name/domain/address configured the VMS way land in the executive-resident LNM$SYSTEM table (shared cross-process over /dev/vms), read back through the independent sys$trnlnm, and the address is applied to the interface over the substrate stack. Proven against a real /dev/vms (tests/qemu/test_syssvc_tcpip_config) + a host honest-degradation DCL test; SS$_NOSUCHDEV with no executive (vms-67f). CONFIG NOW PERSISTS ACROSS REBOOT: host/interface/route/name-service settings are written to TCPIP$HOST/INTERFACE/ROUTE/NAMESERVICE.DAT via RMS over the Files-11 ACP (apply/persist split) and reapplied at startup by the C 'TCPIP REAPPLY' verb from @SYS$STARTUP:TCPIP$STARTUP — proven by tests/qemu/run_tcpip_reboot_e2e.sh (double-boot: settings survive, store proven no-growth). Config persistence shipped; a persistent INETD SERVICE database (#878) remains deferred."}
  - {id: tcpip-services$dcl-tcpip-verb, kind: command, status: implemented, authenticity: real, vms: "DCL TCPIP verb (show interface/route/host/version/configuration, set host/interface/route/name_service)", evidence: "src/vmsdcl/dcl_cmd_misc.c", notes: "SHOW INTERFACE/ROUTE is Linux-substrate introspection (SIOCGIF*/proc). SET INTERFACE applies the address AND records TCPIP$INET_HOSTADDR in the executive; SHOW CONFIGURATION reads the TCPIP$ SYSTEM logicals back (honest %TCPIP-W-NOEXEC with no executive). SET HOST/INTERFACE/ROUTE/NAME_SERVICE additionally PERSIST their settings to TCPIP$*.DAT over the Files-11 ACP, and TCPIP REAPPLY (invoked at boot from @SYS$STARTUP:TCPIP$STARTUP) reapplies them on the next cold boot (apply/persist split; proven by run_tcpip_reboot_e2e.sh). SHOW INTERFACE/ROUTE and the live SET ROUTE apply remain Linux-substrate introspection ('ip route')-- honestly disclosed, not fabricated."}
  - {id: tcpip-services$deferred-rungs, kind: feature, status: absent, authenticity: n/a, vms: "DHCP client, multiple interfaces / TCPIP$INET_HOSTADDRn, a PERSISTENT INETD service database (#878), a raw NIC-as-VMS-device data path (EWA0:)", evidence: "docs/design-tcpip-services-ovmx.md", scope_1_0: stretch, notes: "Honestly deferred; single static interface + in-memory INETD service enablement (from a text SERVICE.DAT) today. NOTE: CONFIG persistence (host/interface/route/name-service) is NO LONGER deferred — it shipped over the Files-11 ACP with a boot-time TCPIP REAPPLY (see the config-plane and dcl-tcpip-verb rows); only the INETD SERVICE database (#878) remains in-memory."}
