# SYS$ FAO Formatting + Message Services. See docs/design-compat-surface-register.md.
facility: sys-fao-msg
name: "SYS$ FAO Formatting + Message Services"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — FAO and Message Services"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  FAO (SYS$FAO/SYS$FAOL + LIB$ wrapper forms): 3/3 implemented, real. Message
  services: SYS$GETMSG and SYS$PUTMSG implemented+real -- SYS$PUTMSG now honors
  the facnam facility-name override by rewriting the %FACILITY token of the
  formatted message (vms-7a2), no longer silently discarding it. SYS$SNDJBC is
  absent.
last_reviewed: 2026-08-31
items:
  - {id: sys$fao, kind: routine, status: implemented, authenticity: real, vms: "Formatted ASCII output (buffer form)", evidence: src/libvms/syssvc/sys_fao.c}
  - {id: sys$faol, kind: routine, status: implemented, authenticity: real, vms: "Formatted ASCII output (arg-list form)", evidence: src/libvms/syssvc/sys_fao.c}
  - {id: lib$_fao_forms, kind: routine, status: implemented, authenticity: real, vms: "LIB$ wrapper forms of FAO (LIB$FAO, LIB$FAOL)", evidence: src/libvms/syssvc/sys_fao.c}
  - {id: sys$getmsg, kind: routine, status: implemented, authenticity: real, vms: "Get formatted message text for a condition code", evidence: src/libvms/syssvc/sys_msg.c, notes: "reads the compiled-in known_codes[] table in status.c (51 codes); a code absent decodes honestly to 'unknown status code'"}
  - {id: sys$putmsg, kind: routine, status: implemented, authenticity: real, vms: "Output a formatted message via the condition-handling mechanism", evidence: src/libvms/syssvc/sys_msg.c, notes: "honors the facnam facility-name override by rewriting the %FACILITY token of the formatted message (vms-7a2); OVMX messages carry no FAO directives so the FAO argument list has nothing to substitute (honest, not a facade). Was facade-risk: facnam silently discarded."}
  - {id: sys$sndjbc, kind: routine, status: absent, authenticity: n/a, vms: "Send a message to the job controller"}
