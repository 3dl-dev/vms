facility: compilers
name: "Compilers (language front-ends)"
domain: languages
vms_ref: "VSI OpenVMS language reference manuals (Fortran/COBOL/BASIC/Pascal/MACRO/…)"
scope_1_0: undecided
plan_ref: vms-082
summary: >
  VMS ships a large family of DEC/VSI compilers. OVMX has exactly one language —
  C, via tcc (the self-hosting beachhead; 549 files under third-party/tcc on
  origin/main). Every other VMS language is absent — grep on origin/main finds no
  FOR$/COB$/BAS$/PAS$ RTL and no MACRO-32 front-end. Which of them are in 1.0
  scope is an operator call (vms-082); the "run corpus software" goal (R2) leans
  on Fortran/COBOL/BASIC, so this is not automatically out-of-scope. Absent
  languages fail at compile time — the correct failure mode, never a facade.
last_reviewed: 2026-09-14
items:
  - {id: c, kind: subsystem, status: implemented, authenticity: real, scope_1_0: in,
     vms: "DEC C / VSI C compiler", evidence: third-party/tcc,
     notes: "tcc self-hosts inside OVMX (S2, gen2==gen3); independence beachhead, NOT full DEC C nor a perf compiler (rustc/Rust later). Source-compat is the C target. Not 'verified' — no DEC C conformance oracle is gated."}
  - {id: macro32, kind: subsystem, status: absent, authenticity: n/a, scope_1_0: out,
     vms: "MACRO-32 assembler", evidence: docs/compat/facilities/macro.yaml,
     notes: "Explicitly out of scope (compatibility-contract.md); tcc's integrated assembler is GAS-syntax only. Cross-listed as the toolchain-domain MACRO-32 assembler row (facilities/macro.yaml)."}
  - {id: macro64, kind: subsystem, status: absent, authenticity: n/a, scope_1_0: stretch,
     vms: "MACRO-64 (Alpha) assembler", notes: "No native Alpha backend on origin/main either; the Alpha object toolchain reads GAS-produced EVAX objects (object-format), not MACRO-64 source."}
  - {id: fortran, kind: subsystem, status: absent, authenticity: n/a, scope_1_0: undecided,
     vms: "VAX/DEC/VSI Fortran (77/90/95)", notes: "Central to the scientific corpus. Needs FOR$ RTL + array descriptors (DSC$K_CLASS_A now DECLARED in descrip.h but unmarshalled) + VAX-float support — all absent. Operator scope call (vms-082)."}
  - {id: cobol, kind: subsystem, status: absent, authenticity: n/a, scope_1_0: undecided,
