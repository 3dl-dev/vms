// alpha1-install.cfg -- alpha1.cfg plus a CD-ROM, for installing OpenVMS.
//
// Identical to alpha1.cfg except for the disk0.1 entry below. Use this config
// only for the install, then go back to alpha1.cfg: AXPbox refuses to start if
// a configured file is missing, so a permanent CD entry means the machine will
// not boot once the ISO is moved or unmounted.
//
//   >>> EDIT THE `file =` LINE UNDER disk0.1 TO POINT AT YOUR ISO <<<
//
// Boot the installer from the SRM prompt with:  P00>>> boot dqa1
// The system disk is DQA0; give that as the install target.

sys0 = tsunami
{
    memory.bits = 28;                       // 2^28 = 256 MB

    rom.srm          = "/data/training/vax/alpha/rom/cl67srmrom.exe";
    rom.decompressed = "/data/training/vax/alpha/rom/decompressed.rom";
    rom.flash        = "/data/training/vax/alpha/rom/flash.rom";
    rom.dpr          = "/data/training/vax/alpha/rom/dpr.rom";

    cpu0 = ev68cb
    {
        speed  = 800M;
        icache = false;
    }

    serial0 = serial
    {
        port = 21264;
    }

    pci0.15 = ali_ide
    {
        disk0.0 = file                      // DQA0 -- system disk
        {
            file      = "/data/training/vax/alpha/disks/alpha1-sys.img";
            cdrom     = false;
            read_only = false;
        }

        disk0.1 = file                      // DQA1 -- installation media
        {
            file      = "/data/training/vax/alpha/media/ALPHA084.ISO";
            cdrom     = true;
            read_only = true;
        }
    }

    pci0.7 = ali
    {
        mouse.enabled = false;
        vga_console   = false;
    }

    pci0.19 = ali_usb
    {
    }
}
