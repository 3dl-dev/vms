            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/dcl-native DCL_EXPECT_LINK=1
              sh /src/src/imgact/test/run_dcl_native.sh
            '

  # -----------------------------------------------------------------------
  # dcl-native-x86_64 — the x86_64 analog of dcl-native above (bead vms-cb5f,
  # vms-bdf's own done-condition, epic vms-b93 "0.1 pre-release"). Reproduces
  # the SAME proof (real DCL.EXE, the full six-library producer graph, IMGACT
  # activation, the SHOW TIME / A=2+3 SHOW SYMBOL scripted session, zero
