  # in src/vmslink/mk_tcc.sh) — emit `.data.ro` writable, matching gcc's
  # pre-RELRO .data.rel.ro. Entirely in tcc/mk_tcc.sh scope; NOT a link.c change.
  # mk_decc_shr.sh also exports one more libgcc quad helper (__negtf2) that a
  # self-hosted tcc emits where gcc inlined it, keeping gen-2's deferred set to
  # exactly one dead-for-`-c` reference (environ), same as gen-1.
