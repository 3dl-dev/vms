  - {id: ods2$reader, kind: feature, status: verified, authenticity: real, vms: "Files-11 L2 (ODS-2) volume reader", evidence: src/vmsfs/ods2/ods2_reader.c, verified_against: "real OpenVMS VAX V7.3 ODS-2 volume, tests/ods2/real_vax_ods2.dsk (see tests/ods2/PROVENANCE-real_vax_ods2.md)", notes: "byte-exact: home block, INDEXF.SYS, BITMAP.SYS, FH2 headers, FM2 retrieval pointers, directory listing"}
