# Source of truth for the audit row of the Compatibility Surface Register.
facility: audit
name: "Security Auditing / Break-in Evasion / OPCOM Alarms"
domain: system-management
vms_ref: "OpenVMS Guide to System Security ch. 7-8 (Auditing, Break-In Evasion)"
scope_1_0: stretch
plan_ref: vms-8ad
summary: >
  The auditing subsystem is unbuilt — no security-audit journal, no break-in
  evasion (login-failure throttling/lockout), no OPCOM security-class alarms.
  The DCL verb SET AUDIT exists but is an HONEST stub: it changes no state and
  says so (a deliberate de-facade, vms-6f4). Not a 1.0 blocker on current
  evidence; flagged for an operator scope call since it borders the
  password-expiration/login-limit gap in sysuaf.
last_reviewed: 2026-08-31
