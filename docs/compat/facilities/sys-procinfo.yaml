  - {id: sys$getjpiw, kind: routine, status: implemented, authenticity: real, vms: "Get job/process information (waits for completion)", evidence: src/libvms/syssvc/sys_process.c}
  - {id: sys$getsyi, kind: routine, status: implemented, authenticity: real, vms: "Get system information (single item)", evidence: src/libvms/syssvc/sys_misc.c}
