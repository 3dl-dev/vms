          echo "PASS: LINKVAX.EXE emits an elf32-vax ET_DYN consumer (crt0 + PT_INTERP=IMGACT.EXE + .vms\$imp -> producer; R_VAX_* relocs applied); LP64 --executable output unchanged"

  # -----------------------------------------------------------------------
  # vax-shipped-shareable-packaging (rd vms-c7f7, epic vms-404 P3b;
  # docs/design/vax-symbol-vector-imgact.md P3). Per-PR, fast, build-only (no
  # SIMH): proves tools/cross-vax/build-vax-shareable-graph.sh builds the
  # REAL src/libvms RTL as a genuine elf32-vax `.vms$sv` OVMX shareable
  # (LIBVMS$SHR.EXE) via LINKVAX.EXE (vms-19b/P3a) -- NOT an ordinary NetBSD
  # `.so` -- and that tools/cross-vax/build-os-kit-vax.sh stages it into the
  # VAX SYSLIB. readelf-shape only (ET_DYN/EM_VAX/`.vms$sv`, no PT_DYNAMIC,
  # no unapplied R_VAX_* dynamic relocations, real RTL universals present) --
  # the SIMH runtime-activation proof is P4, gated separately.
  #
  # NOT proven here (honest scope, see the scripts' own header comments): a
  # genuine elf32-vax PT_INTERP=IMGACT.EXE CONSUMER of this shareable. That
  # consumer emit — LINKVAX.EXE's elf32-vax `--executable` (crt0 + PT_INTERP=
  # IMGACT.EXE) — is now implemented (vms-099) and proven readelf-shape by the
  # vmslink-vax-exec job above; its SIMH runtime-activation proof is P4 (vms-d4a).
  # -----------------------------------------------------------------------
  vax-shipped-shareable-packaging:
    name: VAX ships the VMS-format shareable graph (vms-c7f7 / vms-404 P3b)
    # vms-e7c5 twin: read-only pull of the PRIVATE prebuilt toolchain image from ghcr.
    permissions:
      packages: read
      contents: read
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' || needs.changes.outputs.exec_netbsd_vax == 'true') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.vax_p4_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull the prebuilt vax--netbsdelf toolchain image (source-hash tag) or fall back to build
        env:
          GHCR_IMG: ghcr.io/3dl-dev/ovmx-cross-vax
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s \
            tools/cross-vax/Dockerfile \
            'tools/cross-vax/*.tar.xz' \
            | sha256sum | cut -c1-16)
          echo "SOURCE_HASH=$SOURCE_HASH"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$GHCR_IMG:$SOURCE_HASH"; then
            docker tag "$GHCR_IMG:$SOURCE_HASH" ovmx-cross-vax:latest
            echo "PULLED prebuilt toolchain image $GHCR_IMG:$SOURCE_HASH (no gnu.org fetch)"
          else
            echo "no prebuilt image for $SOURCE_HASH — falling back to a gha-cached source build"
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        if: env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Build LIBVMS$SHR.EXE (genuine elf32-vax .vms$sv shareable, from the real src/libvms RTL)
        run: |
          set +e
          # -v /tmp:/tmp: build-vax-shareable-graph.sh writes to BUILD_DIR
          # under /tmp (default /tmp/build-vax-shareable-graph) INSIDE the
          # container; bind-mounting the runner's own /tmp makes that output
          # visible to the next (non-containerized) step on the runner.
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -v /tmp:/tmp -w /src \
                  ovmx-cross-vax sh tools/cross-vax/build-vax-shareable-graph.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: build-vax-shareable-graph.sh exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL VAX SHAREABLE-GRAPH CHECKS PASSED' \
            || { echo "FAIL: did not see the shareable-graph PASS banner"; exit 1; }
          echo "PASS: LIBVMS\$SHR.EXE is a genuine elf32-vax ET_DYN .vms\$sv shareable, self-contained, built from the real src/libvms RTL"

      - name: Build the host ovmx_kit_pack tool
        run: |
          cmake -S . -B /tmp/host-build -DBUILD_TOOLS=ON -DBUILD_TESTS=OFF
          cmake --build /tmp/host-build --target ovmx_kit_pack -j"$(nproc)"

      - name: Stage LIBVMS$SHR.EXE into the VAX SYSLIB via build-os-kit-vax.sh (--shareables-dir)
        run: |
          set -euo pipefail
          FAKE_IMAGES=/tmp/fake-vax-images
          mkdir -p "$FAKE_IMAGES"
          for f in STARTUP.EXE PROVISION.EXE DCL.EXE JOB_CONTROL.EXE LOGINOUT.EXE \
                   PRODUCT.EXE AUTHORIZE.EXE INITIALIZE.EXE SYSGEN.EXE; do
            printf 'CI placeholder (this job proves SYSLIB staging, not the boot-image build)\n' > "$FAKE_IMAGES/$f"
          done
          sh tools/cross-vax/build-os-kit-vax.sh "$FAKE_IMAGES" "$PWD" /tmp/ovmx-os-vax-shareable.kit \
              /tmp/host-build/bin/ovmx_kit_pack --shareables-dir /tmp/build-vax-shareable-graph/out
          echo "PASS: build-os-kit-vax.sh stages LIBVMS\$SHR.EXE into SYSLIB and round-trips it byte-exact (SYS\$SHARE hard-fail lifted)"

  # -----------------------------------------------------------------------
  # vax-cmake-images (rd vms-64a, epic vms-509 "unified cross-platform
  # build", Rung B; docs/design-unified-cross-build.md §3-B/§8). This job
  # proves the `ovmx-images` aggregate target -- the single authoritative
  # "what ships" list -- configures and builds the FULL shipped userspace
  # image set for vax under tools/cross-vax/toolchain-vax-netbsd.cmake (this
  # is now the ONLY per-PR gate that builds STARTUP.EXE via cmake -- rd
  # vms-d65 Rung C retired the standalone single-image `vax-cmake-toolchain`
  # (vms-75f) job as redundant with this one), and specifically closes rd
  # vms-e1d's cross-arch parity-drift gap: HELP.EXE, AUTHORIZE.EXE, MAIL.EXE,
  # MONITOR.EXE, INITIALIZE.EXE, INSTALL.EXE, SYSGEN.EXE, PRODUCT.EXE and
  # PARTS.EXE -- now cross-build + link for netbsd-vax and pass the Decision-A
  # activation contract (vms-42d): ELF32, Digital VAX, dynamically linked,
  # PT_INTERP == /usr/libexec/ld.elf_so, NEEDED subset of {libc,libpthread,
  # libm,libatomic}.
  #
  # SCSD.EXE was the tenth drift image and is GONE (FC-P3.9): the userspace
  # SCS daemon is retired and its source deleted, so there is no longer an
  # image to keep in parity. The cluster stack is executive-resident and
  # cross-builds as part of vms.kmod, which the NetBSD kmod legs cover.
  # LINK.EXE stays excluded for the "no VAX role by design" reason
  # IMGACT.EXE already carries in tools/parity/image-parity-allowlist.json
  # (it produces x86_64/aarch64 Mode-2 shareables; vax has no Mode 2). Its
  # per-image loop below (STARTUP/PROVISION/DCL/JOB_CONTROL/LOGINOUT.EXE +
  # LIBRARIAN.EXE) is also now the ONLY per-PR proof of the boot-image set --
  # rd vms-d65 Rung C retired the standalone `ovmx-boot-images-netbsd-vax`
  # (vms-5d1) job that duplicated it via the old per-image
  # build-boot-images-vax.sh path; that script itself remains for
  # tests/lab-vax/run-boot.sh, which still consumes it directly.
  #
  # RUNG E (rd vms-08cb, docs/design-unified-cross-build.md §6/§8): this is
  # now the ONLY per-PR vax build gate for every per-lib/per-image script
  # this job's aggregate transitively covers. Retired as redundant:
  # libvmssys-netbsd-vax, vmsprocess-netbsd-vax, libvms-netbsd-vax,
  # vmslnm-vmsfs-vmsrms-netbsd-vax, vmsdcl-netbsd-vax, ovmx-init-netbsd-vax,
  # librarian-netbsd-vax, activation-netbsd-vax -- each script's positive
  # build+link proof is subsumed by the per-image activation-contract loop
  # below (the aggregate transitively builds+links every library and image
  # those jobs proved standalone). Every negctl/teeth assertion those jobs
  # carried that this job did not already prove was MIGRATED, not dropped
  # (CLAUDE.md Rule 7/9, INV-6) -- see "MIGRATED TEETH" in
  # tools/cross-vax/build-ovmx-images-vax-cmake.sh's header and the extra
  # banner assertions below. The underlying build-libvmssys-vax.sh,
  # build-vmsprocess-vax.sh, build-libvms-vax.sh, build-vmslnm-vax.sh,
  # build-vmsfs-vax.sh, build-vmsrms-vax.sh, build-librarian-vax.sh, and
  # build-activation-vax.sh scripts were deleted along with their jobs (zero
  # remaining references outside this job's own history). build-vmsdcl-vax.sh
  # and build-ovmx-init-vax.sh are KEPT ON DISK (unlike the rest) because
  # tests/lab-vax/run-boot.sh still calls them directly and via
  # build-boot-images-vax.sh -- only their now-redundant standalone CI jobs
  # were removed.
  #
  # netbsd-vax-vms-crosscompile (the vms.kmod.o executive module) and
  # netbsd-vax-facility-tools-crosscompile (the eflag/access/proctab/mbx
  # guest tools, not shipped images) are UNTOUCHED by this rung -- they are
  # not per-lib/per-image script gates this aggregate covers.
  # Gated on the same shared netbsd_vax filter. Fast once the cross
  # toolchain image layer-caches (gha, shared scope=cross-vax).
  # -----------------------------------------------------------------------
  vax-cmake-images:
    name: vax toolchain builds the ovmx-images aggregate; 10/10 parity-drift images close (vms-64a, vms-838)
    # vms-e7c5 twin: read-only pull of the PRIVATE prebuilt toolchain image from ghcr.
    permissions:
      packages: read
      contents: read
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.vax_p4_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # vms-e7c5 twin: PULL the source-hash-keyed prebuilt toolchain image from
      # ghcr (zero ftp.gnu.org fetch). SOURCE_HASH is the exact same
      # `git ls-files -s | sha256sum` over tools/cross-vax/{Dockerfile,*.tar.xz}
      # that the vax-toolchain-image build-push job uses, so the tag matches the
      # current sources. A missing tag (not yet seeded / registry hiccup) cleanly
      # FALLS THROUGH to the gha-cached build below (BUILD_FALLBACK=1). Tags the
      # result ovmx-cross-vax:latest either way, so downstream steps are unchanged.
      - name: Pull the prebuilt vax--netbsdelf toolchain image (source-hash tag) or fall back to build
        env:
          GHCR_IMG: ghcr.io/3dl-dev/ovmx-cross-vax
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s \
            tools/cross-vax/Dockerfile \
            'tools/cross-vax/*.tar.xz' \
            | sha256sum | cut -c1-16)
          echo "SOURCE_HASH=$SOURCE_HASH"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$GHCR_IMG:$SOURCE_HASH"; then
            docker tag "$GHCR_IMG:$SOURCE_HASH" ovmx-cross-vax:latest
            echo "PULLED prebuilt toolchain image $GHCR_IMG:$SOURCE_HASH (no gnu.org fetch)"
          else
            echo "no prebuilt image for $SOURCE_HASH — falling back to a gha-cached source build"
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        if: env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Configure + build the ovmx-images aggregate via the top-level CMake project under the vax toolchain
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
                  ovmx-cross-vax tools/cross-vax/build-ovmx-images-vax-cmake.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: cmake vax-toolchain configure/build of ovmx-images exited nonzero ($RC)"
            exit 1
          fi
          for img in STARTUP.EXE PROVISION.EXE DCL.EXE JOB_CONTROL.EXE LOGINOUT.EXE LIBRARIAN.EXE OVMXDUMP HELP.EXE AUTHORIZE.EXE MAIL.EXE MONITOR.EXE INITIALIZE.EXE INSTALL.EXE SYSGEN.EXE PRODUCT.EXE PARTS.EXE; do
            echo "$RAW" | grep -qF -- "-> $img: ELF32 Digital VAX, dynamically linked, interp=/usr/libexec/ld.elf_so" \
              || { echo "FAIL: $img did not pass the activation contract assertion"; exit 1; }
          done
          for img in HELP.EXE AUTHORIZE.EXE MAIL.EXE MONITOR.EXE INITIALIZE.EXE INSTALL.EXE SYSGEN.EXE PRODUCT.EXE PARTS.EXE; do
            echo "$RAW" | grep -qF "DRIFT-CLOSED: $img" \
              || { echo "FAIL: $img was not reported as a closed parity-drift image"; exit 1; }
          done

          # --- MIGRATED TEETH (rd vms-08cb, Rung E) -- each ported from a retired
          # per-job script's own gate (see the job header comment above). Defense
          # in depth beyond the script's own `set -e`: confirm every migrated
          # check's banner actually appeared, not just that the script exited 0.
          echo "$RAW" | grep -qF "libvmssys_ilp32_negctl_vax .......   Passed" \
            || { echo "FAIL: the libvmssys ilp32 negctl (was build-libvmssys-vax.sh) did not run"; exit 1; }
          echo "$RAW" | grep -qF "librarian_negctl_vax .............   Passed" \
            || { echo "FAIL: the librarian negctl (was build-librarian-vax.sh) did not run"; exit 1; }
          echo "$RAW" | grep -qF "100% tests passed, 0 tests failed out of 2" \
            || { echo "FAIL: the migrated ctest negctls did not both pass"; exit 1; }
          echo "$RAW" | grep -qF "OK: ovmx_init.c has no __NetBSD__/__linux__ boot-logic fork" \
            || { echo "FAIL: the ovmx_init.c INV-DRIFT check (was build-ovmx-init-vax.sh) did not run"; exit 1; }
          echo "$RAW" | grep -qF "OK: every ovmx_boot.h op is defined by the NetBSD backend" \
            || { echo "FAIL: the NetBSD boot-backend ops check (was build-ovmx-init-vax.sh) did not run"; exit 1; }
          echo "$RAW" | grep -qF "OK: ovmx_boot_open_executive() opens the real /dev/vms (fail-honest)" \
            || { echo "FAIL: the real-/dev/vms check (was build-ovmx-init-vax.sh) did not run"; exit 1; }
          echo "$RAW" | grep -qF "OK: no undefined readline symbols -- DCL's own non-readline line editor is used" \
            || { echo "FAIL: the DCL.EXE no-readline check (was build-vmsdcl-vax.sh) did not run"; exit 1; }
          echo "$RAW" | grep -qF "PASS (negctl): the non-ld.elf_so image is correctly rejected by the Decision-A activation contract" \
            || { echo "FAIL: the activation-contract negctl (was build-activation-vax.sh) did not run"; exit 1; }

          echo "$RAW" | grep -qF "ALL PROOFS PASSED: ovmx-images builds the full shipped image set via 'cmake --build --target ovmx-images' for vax--netbsdelf, every image passes the Decision-A activation contract, and every migrated teeth check genuinely fires" \
            || { echo "FAIL: did not see the ovmx-images PASS banner"; exit 1; }
          echo "PASS: ovmx-images built the full shipped image set for netbsd-vax; 10/10 vms-e1d parity-drift images closed; every migrated Rung-E teeth check fired"

  # -----------------------------------------------------------------------
  # vax-acp-read-ilp32 (rd vms-8e8f, piece A of the VAX ACP flip epic
  # vms-c45). THE VAX ILP32 LEG of the conductor's 3-way convergence gate
  # {x86_64 CI + VAX ILP32 + Alpha LP64} for the Files-11 ACP read path.
  #
  # The VMS ACP-read arms (RMS's $ASSIGN/IO$_ACCESS/DID-walk/READVBLK path,
  # the shared imgact_acp.c file-access walk, PID 1's staging bridge, and the
  # OVMXVMSSYS.PAR-over-ACP reader) are OVMX_HAVE_ACP-gated, and until this
  # job NOTHING on the VAX side ever defined that macro -- the netbsd-vax
  # vmsrms cross builds VMSRMS_STANDALONE (which skips the define) and
  # build-ovmx-init-vax.sh defines neither OVMX_HAVE_ACP nor the bridge
  # macro. So those arms had never been compiled for elf32-vax at all, and
  # LP64-only-correct code could accrue in them indefinitely with every gate
  # green.
  #
  # This is a COMPILE AUDIT, not a runtime build -- the same relationship
  # build-vms-module-vax.sh has to the shipped vms.kmod. It compiles a
  # configuration no shipped VAX recipe uses yet; the RUNTIME cutover is rd
  # vms-329 and this job is explicitly NOT a substitute for that item's SIMH
  # end-to-end proof. What it buys is that the cutover is a wiring change
  # rather than also a compile-error hunt, and that the arms can never
  # silently rot back to LP64-only-correct in the meantime.
  #
  # The script carries its own teeth (see its header): the ACP symbols must
  # genuinely be compiled IN (an empty preprocessor arm compiles beautifully
  # -- that is the INV-6 fake-success class in gate form), the strong
  # ovmx_sysgen_acp_read must resolve in the closure link (the static-link
  # weak-seam class), and an LP64 negative control MUST be rejected by this
  # compiler or the whole width check is meaningless. The banner assertions
  # below are defense in depth beyond the script's `set -e`: they confirm each
  # check actually FIRED, not merely that the script exited 0.
  # Gated on the same shared netbsd_vax filter; fast (compile-only, no link
  # of the full library stack) once the cross toolchain image layer-caches.
  # -----------------------------------------------------------------------
  vax-acp-read-ilp32:
    name: VAX ILP32 leg -- the whole ACP-read path cross-compiles width-clean for elf32-vax (vms-8e8f)
    # vms-e7c5 twin: read-only pull of the PRIVATE prebuilt toolchain image from ghcr.
    permissions:
      packages: read
      contents: read
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.vax_p4_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # vms-e7c5 twin: PULL the source-hash-keyed prebuilt toolchain image from
      # ghcr (zero ftp.gnu.org fetch). SOURCE_HASH is the exact same
      # `git ls-files -s | sha256sum` over tools/cross-vax/{Dockerfile,*.tar.xz}
      # that the vax-toolchain-image build-push job uses, so the tag matches the
      # current sources. A missing tag (not yet seeded / registry hiccup) cleanly
      # FALLS THROUGH to the gha-cached build below (BUILD_FALLBACK=1). Tags the
      # result ovmx-cross-vax:latest either way, so downstream steps are unchanged.
      - name: Pull the prebuilt vax--netbsdelf toolchain image (source-hash tag) or fall back to build
        env:
          GHCR_IMG: ghcr.io/3dl-dev/ovmx-cross-vax
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s \
            tools/cross-vax/Dockerfile \
            'tools/cross-vax/*.tar.xz' \
            | sha256sum | cut -c1-16)
          echo "SOURCE_HASH=$SOURCE_HASH"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$GHCR_IMG:$SOURCE_HASH"; then
            docker tag "$GHCR_IMG:$SOURCE_HASH" ovmx-cross-vax:latest
            echo "PULLED prebuilt toolchain image $GHCR_IMG:$SOURCE_HASH (no gnu.org fetch)"
          else
            echo "no prebuilt image for $SOURCE_HASH — falling back to a gha-cached source build"
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        if: env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Cross-compile the ACP-read closure for elf32-vax with the ACP arms ON
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
                  ovmx-cross-vax tools/cross-vax/build-acp-read-audit-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: the elf32-vax ACP-read compile audit exited nonzero ($RC)"
            exit 1
          fi

          echo "$RAW" | grep -qF "OK: all 9 ACP-read closure translation units compile for vax--netbsdelf" \
            || { echo "FAIL: the closure compile proof did not run"; exit 1; }
          echo "$RAW" | grep -qF "OK: 9/9 objects are elf32-vax" \
            || { echo "FAIL: the elf32-vax object-arch proof did not run"; exit 1; }
          echo "$RAW" | grep -qF "OK: every ACP arm in the closure is genuinely compiled in" \
            || { echo "FAIL: the ACP-arms-compiled-in TEETH did not run"; exit 1; }
          echo "$RAW" | grep -qF "PASS (negctl): the LP64 translation unit is correctly rejected for vax--netbsdelf" \
            || { echo "FAIL: the LP64 width negctl did not run -- the width gate has no proven teeth"; exit 1; }
          echo "$RAW" | grep -qF "OK   ovmx_sysgen_acp_read resolves STRONG in the closure" \
            || { echo "FAIL: the static-link weak-seam check did not run"; exit 1; }
          echo "$RAW" | grep -qF "ALL PROOFS PASSED: the VMS ACP-read code path compiles ILP32-clean for vax--netbsdelf" \
            || { echo "FAIL: did not see the ACP-read audit PASS banner"; exit 1; }
          echo "PASS: the VMS ACP-read path (RMS ACP arm + imgact_acp + PID 1 staging bridge + OVMXVMSSYS.PAR-over-ACP + the NetBSD boot backend) cross-compiles ILP32-clean for elf32-vax with OVMX_HAVE_ACP; every tooth fired"
