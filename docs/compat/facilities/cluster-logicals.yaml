# Source of truth for the cluster-logicals row of the Compatibility Surface Register.
facility: cluster-logicals
name: "Cluster-wide logical names / global sections"
domain: clustering
vms_ref: "OpenVMS Cluster Systems manual; $CRELNM (LNM$M_CLUSTERWIDE), $MGBLSC/$CRMPSC"
scope_1_0: in
plan_ref: vms-694
summary: >
  The executive holds LNM$CLUSTER_TABLE, LNM$SYSCLUSTER_TABLE and the tables
  members create under them (rd vms-94a). A member's propagated $CRELNM,
  $CRELNT and $DELLNM is pulled, applied and only then answered, and a late
  joiner pulls the whole clusterwide database. $CRELNM/$TRNLNM/$DELLNM work
  locally against these tables. This node does not yet send its own changes
  to the other members, so a local change while it shares a cluster is
  refused (SS$_UNSUPPORTED). Cluster-wide global sections are absent.
last_reviewed: 2026-10-13
