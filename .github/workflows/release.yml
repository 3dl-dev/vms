# release.yml - cut an OVMX release bundle and publish it to GitHub Releases
# (vms-644, epic vms-a84 RELEASE ENGINEERING).
#
# This is the "ship THROUGH the machinery" trigger (release-engineering
# pillar): pushing a release-shaped tag (e.g. `0.4`, `0.3-1`, `v1.0.0`) is the
# deliberate, human-authorized act that starts a release. On that tag push
# this workflow runs the SAME machinery a developer would run by hand --
# tools/cut-release.sh then tools/publish-release.sh -- so a published release
# is never hand-assembled: it is the reproducible bundle, its generated notes,
# and its checksums, attached to a GitHub Release.
#
# It deliberately does NOT create the tag; the tag push is the input. The
# reproducibility / acceptance / upgrade gates run in ci.yml on the pushed
# commit; publish-release.sh independently re-verifies the bundle's SHA256SUMS
# before uploading, so corrupt bytes are never published.
#
# workflow_dispatch is provided so a maintainer can also cut+publish an
# existing tag by hand, and choose a draft (default) so the final "make it
# public" click stays with a human -- publishing is the one externally-visible
# step, and defaulting to a draft keeps it gated.

name: Cut and Publish Release

on:
  push:
    tags:
      # Release-shaped tags only: 0.4, 0.3-1, V0.4-2, v1.0.0, 1.2.3 ...
      # GitHub tag filters are CASE-SENSITIVE and have no alternation, so every
      # accepted spelling needs its own literal glob. The prefix may be absent,
      # lowercase 'v', or uppercase 'V' -- this repo has SHIPPED all three: bare
      # `0.3-8`, then `V0.3-9` / `V0.4` / `V0.4-1`..`V0.4-4` -- and a `-N` point
      # suffix is allowed on every form. Missing any one variant means a real
      # release tag pushes but silently never publishes: that is exactly the
      # V0.3-9..V0.4-4 gap (6 tags, 0 releases) this list closes (vms-644).
      # Non-release tags (wip/*, migration/*) still match nothing here.
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+-[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to cut and publish (e.g. 0.4)'
        required: true
      draft:
        description: 'Publish as a draft (default true; the final public step stays manual)'
        type: boolean
        default: true

# Creating a GitHub Release needs write access to repository contents.
permissions:
  contents: write

jobs:
  cut-and-publish:
    name: cut-release + publish to GitHub Releases
    runs-on: ubuntu-latest
    # A full containerized cut is ~25-30 min cold (kernel + VMS-native
    # toolchain + QEMU image); mirror cut-release-reproducible's budget.
    timeout-minutes: 150

    steps:
      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            # A tag pushed here is a deliberate release; publish it (not a draft).
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the tagged commit (full history for release notes)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # gen_release_notes.py walks history from the previous release tag,
          # so the whole history and all tags must be present.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cut the reproducible bundle from the tagged commit into a known dir.
      # Sign modules with the persistent OVMX signing key from Actions secrets
      # (vms-19ed): the private key is NEVER in git, but releases all share it,
      # so their module signatures/keyring are deterministic release-to-release
      # (vms-d73) and form one stable trust anchor. Absent (e.g. a fork build)
      # -> cut-release.sh mints an ephemeral key and only the signature bytes
      # vary. The secret is written to a temp file the script reads via
      # OVMX_MODULE_SIGNING_KEY, then removed.
      - name: Cut the release bundle
        env:
          OVMX_MODULE_SIGNING_KEY_PEM: ${{ secrets.OVMX_MODULE_SIGNING_KEY }}
        run: |
          if [ -n "${OVMX_MODULE_SIGNING_KEY_PEM:-}" ]; then
            KEYFILE="$(mktemp)"
            printf '%s\n' "$OVMX_MODULE_SIGNING_KEY_PEM" > "$KEYFILE"
            export OVMX_MODULE_SIGNING_KEY="$KEYFILE"
            echo "release signing: using persistent key from secrets.OVMX_MODULE_SIGNING_KEY"
          else
            echo "release signing: no OVMX_MODULE_SIGNING_KEY secret -- ephemeral key (signatures not reproducible)"
          fi
          tools/cut-release.sh --ref "${{ steps.tag.outputs.tag }}" \
            --out-dir "${{ github.workspace }}/dist/release-cut"
          [ -n "${KEYFILE:-}" ] && rm -f "$KEYFILE" || true

      # Publish artifacts + generated notes. --no-record-notes: committing the
      # in-tree notes record is a source change for a PR, not something a
      # tag-triggered publish should push back to the branch. The publisher
      # re-verifies SHA256SUMS before any upload.
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT_FLAG=""
          if [ "${{ steps.tag.outputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          tools/publish-release.sh \
            --bundle-dir "${{ github.workspace }}/dist/release-cut" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --no-record-notes \
            $DRAFT_FLAG
