  - {id: decnet$nsp-transport, kind: protocol, status: implemented, authenticity: real, vms: "NSP transport codec + live logical link — Connect Initiate/Confirm, Link Service (flow-control credit), Data, Ack, teardown PDUs", evidence: "src/vmsdecnet/nsp/dnet_nsp.c", verified_against: "rd vms-a70: a live NSP logical link ran END-TO-END, BIDIRECTIONALLY, against a real OpenVMS VAX V7.3 (tests/lab/captures/decnet-sethost-dcl-20260911/) — CI -> CC -> Link Service credit-grant/ack -> multi-segment Data both directions -> data-ack -> Disconnect Initiate/Confirm clean teardown. Connect Initiate also byte-identical against docs/decnet-provenance-register.md sec 4.6 specimen #3.", notes: "The live transport engine (src/vmsdecnet/engine) NOW drives a real logical link over the datalink; the CC / Link Service (MSGFLG 0x10) / Data / Ack / DI / DC PDUs are all wire-exercised against a real VAX (were previously self-round-trip only). Link Service added rd vms-a70 (the client's post-CC credit grant, ACKNUM from real link state, INV-6). Tested tests/vmsdecnet/test_dnet_nsp.c + test_dnet_link.c (rd vms-6986)."}
  - {id: decnet$datalink, kind: feature, status: implemented, authenticity: real, vms: "NETACP Ethernet datalink — Phase IV routing (ethertype 0x6003) over the node's circuit, sourced from the algorithmic station address AA-00-04-00-<LE16(area*1024+node)>", evidence: "src/kernel-core/vms_l2.c", notes: "rd vms-1f69. On the booted runtime NETACP (DECNETD.EXE) opens its raw L2 datalink THROUGH THE EXECUTIVE: the kernel owns the AF_PACKET socket (VMS_IOCTL_L2_OPEN/SEND/RECV, src/kernel-core/vms_l2.c) and the open is gated on the VMS PHY_IO privilege — a booted VMS process holds no CAP_NET_RAW and needs none (the V0.7-6 %DECNETD-E-NOSOCKET EPERM is gone). The booted/static build links the executive backend ONLY (src/libdatalink ovmx_datalink_exec, CMake OVMX_DATALINK_VIA_EXECUTIVE, default ON for OVMX_STATIC on Linux): no AF_PACKET code is in that image, so there is no runtime fallback. L2_OPEN takes an optional STATION address the executive validates (the NIC hwaddr or the DNA Phase IV block AA-00-04-00-xx-xx, else SS$_BADPARAM; src/kernel/vms_l2_station.h) and then STAMPS as the source of every frame sent on the handle; NETACP asks for its Phase IV algorithmic address. Unicast to that address reaches the handle because L2_OPEN puts the NIC in promiscuous mode. PROVEN: station accept/refuse + the executive-stamped source observed on the wire by an ETH_P_ALL tap (tests/qemu/test_syssvc_l2_datalink.c section 6, kmod leg, real virtio NIC); booted DECNETD opening the datalink via the executive with station AA-00-04-00-2A-04 and transmitting endnode hellos, and SS$_NOPRIV without PHY_IO (shared acceptance battery, driven on lo since that VM has no NIC); policy unit tests/vmsdecnet/test_l2_station.c. NOT YET: a real VAX listing the booted OVMX node as reachable/adjacent (the dnlab-1 lab bracket), and the NetBSD/VAX substrate (exec_l2_* there are contract-only, so DECNETD on VAX keeps bpf(4)). The host/lab build keeps the AF_PACKET probe backend (CAP_NET_RAW) as an RE instrument."}
  - {id: decnet$task-to-task, kind: feature, status: absent, authenticity: n/a, vms: "Task-to-task DECnet communication (logical-link $QIO / FAL)", evidence: "docs/design-decnet-ovmx.md", scope_1_0: in, notes: "The codecs exist but the engine boundary has not moved — no socket/AF_PACKET engine binds them into a live link."}
  - {id: decnet$ncp, kind: command, status: partial, authenticity: real, vms: "NCP — Network Control Program (node/executor configuration)", evidence: "src/vmsdecnet/ncp/ncp.c", notes: "Real NCP.EXE driving a persisted database: SET/DEFINE NODE, CLEAR/PURGE NODE, SHOW KNOWN NODES, SHOW NODE, SET/SHOW EXECUTOR (ADDRESS/NAME/STATE), and SET/DEFINE/SHOW/CLEAR/PURGE OBJECT (the Session Control object registry — number/name/file, e.g. 42=CTERM, 17=FAL; rd vms-f52, dnet_objectdb), with VMS-faithful SHOW layout and honest errors. Grammar/layout from the public NCP manual (Rule 8). NOT yet: circuits, lines, counters, LOOP, and the SET(volatile)/DEFINE(permanent) split — OVMX keeps one persisted DB per entity today (counters/circuit/reachability state must be read from the live executive, never invented — INV-6). Config-only; it does not itself start the network (@SYS$MANAGER:STARTNET does, gated on the executor database NCP writes). STORAGE (rd vms-1f69, subsumes vms-20e): the executor, node and object databases persist at SYS$SYSTEM:NETNODE_LOCAL.DAT / NETNODE_REMOTE.DAT / NETOBJECT.DAT THROUGH THE VMS FILE LAYER (RMS over the Files-11 ODS-2 ACP, src/vmsdecnet/ncp/dnet_ncpstore.c), the same store NETACP reads; a write that cannot reach the file fails honestly (%NCP-E-CFGWRERR/DBWRERR naming the VMS file) — the old /etc/ovmx/decnet Linux default is gone (OVMX_DECNET_* env vars remain only as the host-test hook). The record LAYOUT inside those files is OVMX's documented text (labelled in each file's header), NOT the VMS binary indexed format (Rule 8). Booted proof: NCP SET EXECUTOR ADDRESS/NAME/STATE then SHOW EXECUTOR + F$SEARCH of NETNODE_LOCAL.DAT in the shared acceptance battery; host: tests/vmsdecnet/test_dnet_ncp_executor.sh + test_dnet_ncpstore.c."}
  - {id: decnet$node-database, kind: feature, status: implemented, authenticity: real, vms: "Persisted remote-node database + node NAME<->address resolution", evidence: "src/vmsdecnet/ncp/dnet_nodedb.c", notes: "The NCP node table: add/update/clear, case-insensitive unique node names, ascending-address SHOW ordering, and persistence (atomic save + tolerant load). Provides the name<->address resolution the SET HOST / NODE:: paths need. Persists at SYS$SYSTEM:NETNODE_REMOTE.DAT through the VMS file layer (RMS over the ACP, dnet_ncpstore; rd vms-1f69, subsumes vms-20e) — read by NCP and by NETACP's SET HOST name resolution from the same store. The record layout inside the file is a documented OVMX plain-text layout (labelled OVMX choice in the file header — NOT the VMS binary indexed format). Unit: tests/vmsdecnet/test_dnet_nodedb.c (rd vms-1e9) + test_dnet_ncpstore.c."}
  - {id: decnet$object-database, kind: feature, status: implemented, authenticity: real, vms: "Persisted DECnet OBJECT database (Session Control object registry: number/name/file)", evidence: "src/vmsdecnet/ncp/dnet_objectdb.c", notes: "The NCP object table managed by SET/DEFINE/SHOW/CLEAR/PURGE OBJECT: add/update keyed by object NUMBER, unique object names, an optional servicing FILE, ascending-number SHOW ordering, persistence (atomic save + tolerant load). The registry of Session Control objects the node offers (42=CTERM, 17=FAL, ...). Persists at SYS$SYSTEM:NETOBJECT.DAT through the VMS file layer (RMS over the ACP, dnet_ncpstore; rd vms-1f69, subsumes vms-20e); the record layout inside is a documented OVMX plain-text layout (labelled OVMX choice — NOT the VMS permanent object database binary). HONEST SCOPE: access-control fields (USER/PROXY/PASSWORD) and the volatile/permanent SET-vs-DEFINE split are filed follow-ons; this is the CONFIG surface, distinct from the executive's live runtime object dispatch (decnet$netacp-device-face). Library unit + first NCP command-dispatch tests: tests/vmsdecnet/test_dnet_objectdb.c + test_dnet_ncp_object.sh (rd vms-f52)."}
  - {id: decnet$sc-connect, kind: protocol, status: verified, authenticity: real, vms: "DNA Session Control CONNECT message — destination/source end-user descriptors + access-control fields", evidence: "src/vmsdecnet/cterm/dnet_cterm.c", verified_against: "docs/oracle/vax-sethost-cterm.pcap frame 5 (rd vms-558, real OpenVMS VAX V7.3 -> V7.3 SET HOST): the twenty connect-data bytes decode field-for-field and OVMX re-emits them BYTE-IDENTICAL, asserted in tests/vmsdecnet/test_dnet_cterm.c against the specimen array", notes: "Oracle-CORRECTED the #1013 cut, which emitted format 1 for the destination object where the real VAX sends format 0. Establishes the security fact vms-f40 rests on: the access-control fields (RQSTRID/PASSWRD/ACCOUNT) are EMPTY on a real SET HOST, so the carried node::user is PROXY/accounting info and the remote must authenticate fresh. Decoder is fully bounded against attacker-controlled bytes (truncation/over-long/unknown-format all refused) and never retains a wire-supplied password."}
  - {id: decnet$cterm-session-auth, kind: feature, status: partial, authenticity: real, vms: "Inbound SET HOST (Session Control object 42) reaches an AUTHENTICATED LOGINOUT prompt on a virtual terminal (RTAn:)", evidence: "src/vmsdecnet/cterm/dnet_cterm_host.c", notes: "An inbound object-42 connect mints an RTAn: THROUGH THE EXECUTIVE (VMS_IOCTL_TERM_CREATE -> vms_devtab_add_terminal; the executive picks the unit) and creates a process running the real SYS$SYSTEM:LOGINOUT.EXE on it via $CREPRC PRC$M_INTER|PRC$M_LOGINOUT -- the SAME primitive the console login uses (vms-3e9/vms-f881). The daemon holds no credential, spawns nothing, and the carried username reaches no decision; there is no fork/execvp/openpty anywhere above the VMS layer (standing gate tests/integration/test_creprc_session_primitive.sh check 5, both directions + negctl). NOT yet: no CTERM read-solicitation flow (byte-transparent pump), no DCL `SET HOST` client wiring (decnet$set-host), no live-VAX bracket. The authentication proof (challenged, bad credentials REFUSED, $GETDVI RTAn: cross-process) is DECNETD.EXE --cterm-accept-test against the real /dev/vms + real LOGINOUT, run by the shared acceptance battery in the booted image -- it FAILS honestly where the executive is absent (INV-6), it does not degrade to a stub. CTERM FOUNDATION PROTOCOL RE-GROUNDED (rd vms-a70): the CTERM foundation/Bind wire protocol is NO LONGER a facade -- it was re-grounded byte-for-byte on the real oracle (the foundation short-TLV + msgtype-9 envelope codec, host-speaks-first negotiation FSM, NSP link-service credit grant, prompt-gated Read Data) and PROVEN interoperable with a real OpenVMS VAX V7.3 in the OUTBOUND direction: OVMX's SET HOST client drove a full authenticated CTERM session to a live DCL on a real VAX (decnet$set-host, tests/lab/captures/decnet-sethost-dcl-20260911/). This row (the INBOUND server: real VAX -> OVMX object 42 -> OVMX LOGINOUT on RTAn:) stays PARTIAL because the executive session/auth machinery here is real + unit/accept-proven (--cterm-accept-test) but the INBOUND live-VAX bracket (a real VAX initiating SET HOST into OVMX-as-server) is not yet run -- it needs the full booted OVMX-on-VAX executive; tracked as vms-a70 direction B. What IS oracle-proven with a real VAX: Session Control CONNECT + datalink + routing + NSP + the CTERM foundation exchange, all the way to an authenticated remote DCL (decnet$sc-connect + decnet$nsp-transport + decnet$set-host)."}
  - {id: decnet$netacp-device-face, kind: feature, status: implemented, authenticity: real, vms: "NETACP presents the DECnet device face _NET: + object-dispatch as EXECUTIVE-RESIDENT, cross-process-real state", evidence: "src/kernel-core/vms_devtab.c", notes: "P5 (rd vms-9ab, design vms-515 §3.3; vms_devtab_probe_net + src/vmsdecnet/engine/decnetd.c). The DECnet device _NET: is born in the executive I/O database at module init over the same primary NIC ETH0: rides (gated on the NIC -- no NIC, no _NET:, SS$_NOSUCHDEV, INV-6), so $ASSIGN/$GETDVI _NET: from a process that is NOT NETACP resolves a real DC$_SCOM device -- the §7.5 cross-process tell, same shape as the RTAn: proof. Asserted cross-process in tests/qemu/test_kmod_devtab.c (kmod leg) and via F$GETDVI _NET: in the shared acceptance battery. Object dispatch (42=CTERM) is executive-resident and cross-process-proven by the object-42->RTAn:->$GETDVI path (decnet$cterm-session-auth). NOT yet: a standalone NCP-style enumerable object REGISTRY query (its own executive ioctl, rd vms-9ab follow-on); the wire engine binary is not yet renamed NETACP.EXE (cosmetic, tracked)."}
  - {id: decnet$wire-isolation, kind: feature, status: implemented, authenticity: real, vms: "A2/A8 isolation: attacker wire-parsing runs at LOW privilege and hands NETACP's privileged control path a VALIDATED TYPED DESCRIPTOR; the privileged path parses no attacker bytes", evidence: "src/vmsdecnet/cterm/dnet_cterm_host.c", notes: "P5 (rd vms-9ab, design vms-515 §3.4; low-priv parse dnet_conn_descriptor_from_wire in src/vmsdecnet/cterm/dnet_cterm.c, privileged consumer dnet_cterm_host_open_desc here). The low-privilege bounded parse distils untrusted NSP-connect bytes into a struct dnet_conn_descriptor carrying no wire pointer, no length, and no credential material; the privileged session-creating path (mints RTAn:, $CREPRCs LOGINOUT) takes ONLY that descriptor and refuses an unvalidated or wrong-object one BEFORE any device/process exists. Proven: the low-priv seam under 200k-frame mutation fuzz in tests/vmsdecnet/test_dnet_cterm.c (no malformed frame yields a validated/steered descriptor; every rejected frame leaves it all-zero), and the privileged double-door on the shipped binary in DECNETD.EXE --isolation-test (no /dev/vms needed), run by the acceptance battery. 'OVMX never crashes a peer': every hostile field is bounded and refused cleanly."}
  - {id: decnet$set-host, kind: command, status: implemented, authenticity: real, vms: "SET HOST — DECnet remote-node connection (outbound client): full authenticated CTERM session to a real VAX", evidence: "src/vmsdcl/dcl_cmd_set.c", verified_against: "rd vms-a70, tests/lab/captures/decnet-sethost-dcl-20260911/ — OVMX --set-host to a real OpenVMS VAX V7.3 reached an authenticated live DCL and ran commands with output returned over the link (the session's own _RTA1: process appears in its own SHOW SYSTEM output)", notes: "DCL `SET HOST <node>` activates SYS$SYSTEM:DECNETD.EXE --set-host on the CALLER'S TERMINAL through the executive image activator (dcl_activate_image -> imgact_activate, with DCL's fork fallback -- the same path RUN uses, NOT a bare fork/exec). The client (src/vmsdecnet/engine/decnetd.c run_set_host_loop) opens a REAL NSP logical link to the remote's Session Control object 42, binds a CTERM terminal session, and bridges THIS process's local terminal to it. VMS-NATIVE terminal I/O (the anti-LARP core): the client does $ASSIGN SYS$INPUT/SYS$OUTPUT + $QIO IO$_SETMODE (OVMX pass-all selector IO$K_TT_PASSALL) + IO$_READVBLK/IO$_WRITEVBLK -- NEVER tcsetattr/cfmakeraw on fd 0/1; the termios that realises pass-all lives in the executive terminal driver (src/libvms/syssvc/sys_qio.c qio_terminal_setmode), below the $QIO interface. On teardown control returns with the canonical %REM-S-END (oracle docs/oracle/vax-sethost-cterm.console.txt). The remote authenticates FRESH (the carried --user is proxy only, never auto-login). The client contains NO fork/exec/openpty/dup2. Response decoders are bounded against a hostile remote (mutation fuzz of dnet_nsp_decode/dnet_cterm_rx, tests/vmsdecnet/test_dnet_cterm.c, clean under ASan/UBSan). LIVE-PROVEN end-to-end against a real OpenVMS VAX V7.3 (rd vms-a70, tests/lab/captures/decnet-sethost-dcl-20260911/): OVMX --set-host 1.1 drove CI -> CC -> NSP Link Service -> CTERM foundation negotiation (byte-exact vs the oracle) -> real VAX LOGINOUT -> authenticated DCL -> F$GETSYI(NODENAME)=VAX1 + SHOW SYSTEM returning VAX1's live process table (incl the session's OWN _RTA1: process) -> clean LOGOUT + NSP disconnect. The earlier CTERM-BIND FACADE is RETIRED: the CTERM foundation/Bind protocol was re-grounded byte-for-byte on the real oracle (the foundation short-TLV + msgtype-9 envelope codec, the host-speaks-first negotiation FSM, the NSP link-service credit grant after CC, and prompt-gated Read Data — one line per host read-solicit), oracle-anchored in tests/vmsdecnet/test_dnet_cterm.c. NOT yet: the INBOUND direction (real VAX -> OVMX-as-CTERM-server, decnet$cterm-session-auth) is not live-proven; general task-to-task ($QIO) and the outbound COPY-over-datalink client are separate rungs."}
  - {id: decnet$node-filespec-syntax, kind: feature, status: partial, authenticity: real, vms: "NODE\"acc\"::dev:[dir]file filespec syntax", evidence: "src/vmsrms/rms_parse.c", notes: "Syntax sets NAM$M_NODE and parses/reconstructs the node prefix. DCL COPY now ACTS on it (rd vms-8c2): a NODE:: spec routes to the DECnet FAL/DAP path and, since the outbound COPY-over-datalink client is not yet wired into a DCL process, reports honestly (%COPY-I-NETNOTWIRED) rather than mis-copying it as a local file — src/vmsdcl/dcl_cmd_file.c copy_spec_has_node. The outbound COPY command layer now EXISTS at host floor (DECNETD.EXE --copy / --copy-selftest, dnet_nodespec.c splitter; rd vms-ea8/vms-6a4 — see decnet$fal); the full outbound DCL->live-datalink bridge is the tracked follow-on."}
  - {id: decnet$dap, kind: protocol, status: verified, authenticity: real, vms: "DAP (Data Access Protocol) 5.6 message codec -- generic header (FLAGS STREAMID/LENGTH/LEN256/BITCNT/SYSPEC, blocked messages) + CONFIGURATION, ATTRIBUTES, ACCESS, CONTROL, CONTINUE, ACKNOWLEDGE, ACCESS COMPLETE, DATA, STATUS, NAME; extended-attribute messages decoded+bounded", evidence: "src/vmsdecnet/dap/dnet_dap.c", verified_against: "rd vms-a8a: every real OpenVMS VAX V7.3 DAP buffer in docs/oracle/vax-copy-fal-dap.* and tests/lab/captures/decnet-fal-dap-20261004/ decodes field by field to the values VMS put there (tests/vmsdecnet/test_dnet_dap.c), and OVMX's encoder output was accepted by a real VMS FAL through a full GET and PUT (fal-ovmxclient.pcap)", notes: "Re-grounded (rd vms-a8a) on the PUBLIC DAP 5.6 spec AA-K177A-TK field types (B / EX-n / I-n) and message layouts; the vms-8c2 cut's frame was invented (FLAGS always LENGTH, fixed widths, NAME=10, OSTYPE 1) and could not talk to real VMS. OVMX speaks DAP 5.6 and advertises in SYSCAP only sequential org + sequential FILE TRANSFER + blocking-to-response + 2-byte length. Decoder fully bounded (200k random + oracle-seeded mutation/truncation walks, ASan/UBSan): unknown trailing operand bytes from later DAP versions are ignored, segmented messages refused. NOT served (honest): block mode, record-at-a-time access, file checksum, indexed/relative, wildcards, extended-attribute content."}
  - {id: decnet$fal, kind: feature, status: partial, authenticity: real, vms: "FAL -- File Access Listener (DECnet Session Control object 17): inbound file COPY authenticated at connect + served/stored via RMS; the COPY node:: client", evidence: "src/vmsdecnet/fal/dnet_fal.c", verified_against: "INBOUND SERVER vs a real VMS COPY client (rd vms-d85 inbound, tests/lab/captures/decnet-fal-inbound-20261004/): OVMX's compiled dnet_fal_server_run served a real OpenVMS VAX V7.3 COPY in BOTH directions (VMS->OVMX PUT stored verbatim; OVMX->VMS GET through the DIRECTORY LIST + OPEN sequence VMS uses), pinned in CI by the replay test tests/vmsdecnet/test_dnet_fal_server.c. OUTBOUND CLIENT vs a real VMS FAL (rd vms-a8a, tests/lab/captures/decnet-fal-dap-20261004/fal-ovmxclient.pcap): OVMX's compiled dnet_fal_client_get/put, with the object-17 connect from dnet_cterm_sc_connect_build, completed a GET (records byte-identical) and a PUT (TYPE on the VAX prints them verbatim) against OpenVMS VAX V7.3, and mapped the remote file-not-found STATUS to SS$_NOSUCHFILE. INBOUND SERVER: DECNETD.EXE --fal-accept-test in the booted acceptance battery (real SYSUAF/Purdy auth, both directions over a real NSP link + RMS over the ACP, byte-verified, OVMX<->OVMX).", notes: "SECURITY SURFACE. An inbound object-17 connect CARRIES username+password in cleartext (oracle s1, protocol-mandated); FAL authenticates them through THE ONE authenticator (sysuaf_lookup + Purdy + disabled-account gate) BEFORE accepting, refuses with an NSP Disconnect on a bad password, wipes the password after the check. The connect carries FOUR counted access-control fields (user, password, account, usrdata) exactly as the real oracle frame (rd vms-a8a corrected an earlier three-field reading). DAP sequence per spec 5.1/5.2.1/5.2.2: ATTRIBUTES+ACCESS -> ATTRIBUTES..ACK; CONTROL CONNECT -> ACK; CONTROL GET/PUT RAC=sequential-file-transfer; DATA; ACCESS COMPLETE CLOSE -> RESPONSE. File I/O is rms_textfile_* (RMS over the ACP), fail-honest with no /dev/vms (Rule 9). Received records are $PUT verbatim to one RMS stream created at ACCESS time (so the NAME a VMS client requires is the real resultant spec); records sent are read as text lines. The server answers DIRECTORY LIST from RMS $PARSE/$SEARCH resultants (wildcards via RMS) and serves sequential file transfer (RAC 3) and sequential record access (RAC 0). Server omits DAP STV until ssdef values match real VMS (rd vms-ef2). PERSONA (rd vms-d85, R4 G3): an inbound access is served by a SYS$SYSTEM:FAL.EXE network server process NETACP $CREPRCs with the AUTHENTICATED user's UIC + default privileges (dnet_fal_proc.c), DAP moving through two executive link mailboxes, so the executive ACP checks every file it opens against the USER -- proven by DECNETD.EXE --fal-proc-accept-test in the booted battery (the SAME SYSTEM-only file through the SAME path is served to SYSTEM and refused to GUEST; the server's executive row carries GUEST's UIC [128,129]; a GUEST PUT into SYS$SYSROOT:[SYSMGR] is refused). The process-name + mailbox link is an OVMX-labelled channel (real VMS uses SYS$NET + _NET:; the _NET: server seam is rd vms-dda). NOT yet (filed, never faked): the outbound client running from a BOOTED OVMX over the live datalink (needs rd vms-1f69, booted DECnet node); the INBOUND server reached live from a real VMS COPY (live object-17 dispatch in NETACP onto the FAL server process); block mode."}
