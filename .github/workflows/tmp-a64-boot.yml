name: TMP aarch64 bootable iteration (vms-32aa, removed before merge)
on:
  push:
    branches: [work/vms-32aa-aarch64-boot]
jobs:
  a64-boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx
      - name: Build the arm64 bootable set natively (Dockerfile.bootable, TARGETARCH=arm64)
        run: |
          set -euo pipefail
          uname -m
          docker buildx build -f distro/Dockerfile.bootable --platform linux/arm64 \
            --load -t ovmx-boot-a64:ci .
      - name: Extract the boot artifacts
        run: |
          set -euo pipefail
          id=$(docker create ovmx-boot-a64:ci)
          mkdir -p "$RUNNER_TEMP/rel"
          for f in vmlinuz initramfs-ovmx-slim.cpio.gz ovmx-distrib.img ovmx-os.kit; do
            docker cp -L "$id:/boot/$f" "$RUNNER_TEMP/rel/$f"
          done
          docker rm "$id"
          ls -la "$RUNNER_TEMP/rel"
          file "$RUNNER_TEMP/rel/vmlinuz"
      - name: Boot it to login, run PARTS, check the version (release-acceptance harness)
        run: |
          set -euo pipefail
          V=$(sed -n 's/^#define[[:space:]]\+OVMX_PRODUCT_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' src/libvms/include/ovmx_identity.h | head -1)
          docker run --rm -e EXPECTED_PRODUCT_VERSION="$V" -e OVMX_GUEST_ARCH=aarch64 \
            -e BOOT_TIMEOUT=1500 -e SETUP_TIMEOUT=300 -e RUN_TIMEOUT=3600 \
            -v "$PWD/tests/qemu/test_release_acceptance_e2e.sh:/test.sh:ro" \
            -v "$RUNNER_TEMP/rel:/release:ro" \
            --entrypoint bash ovmx-boot-a64:ci /test.sh
