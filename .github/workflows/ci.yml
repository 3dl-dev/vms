          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: vmsrms builds and links for vax--netbsdelf' \
            || { echo "FAIL: did not see the vmsrms build+link PASS banner"; exit 1; }
          echo "$RAW" | grep -qiF 'file format elf32-vax' \
            || { echo "FAIL: vmsrms objects were not elf32-vax -- wrong target"; exit 1; }
          echo "$RAW" | grep -qiF 'Machine:                           Digital VAX' \
            || { echo "FAIL: vmsrms exe was not a VAX ELF"; exit 1; }
          echo "PASS: vmsrms built for netbsd-vax and a real ELF32 VAX exe linked over the full stack"

  # -----------------------------------------------------------------------
  # Job: NetBSD/vax vms module cross-compiles (rd vms-20b9, epic vms-8e8; P4-B).
  #
  # THE elf32-vax TWIN of netbsd-amd64-vms-crosscompile. Where that gate compiles
  # the whole OVMX executive `vms' kernel module (the shared src/kernel-core/
  # facilities + the src/kernel-netbsd/ backends) against NetBSD/amd64 kernel
  # headers with clang, THIS gate compiles the SAME module SRCS against NetBSD/vax
  # kernel headers with the pinned `vax--netbsdelf' gcc -- the 32-bit VAX (ILP32)
  # width class no other OVMX target exercises. It is the executive analog of the
  # vmsfs-core-elf32-vax gate: BUILD-ONLY, no emulator, no boot, -Werror,
  # relocatable-link, and a generated width-audit TU whose _Static_asserts pin the
  # ILP32 width class + the packed RB parent+colour word invariant + the intrusive
  # container node sizes/offsets. Findings: docs/audit-ilp32-vax-netbsd-exec.md.
  #
  # It reuses the SAME pinned vax--netbsdelf toolchain image as the libvmssys/
  # vmsprocess/libvms/vmsfs-core VAX jobs (shared gha layer cache, scope=cross-vax
  # -- no gcc rebuild) and mounts the SAME pinned NetBSD 10.1 syssrc kernel headers
  # the amd64 gate uses (tests/netbsd/netbsd_version.env, cached the same way). The
  # container image carries only the compiler + a NetBSD/vax libc sysroot; the
  # kernel headers are mounted read-only, exactly as the amd64 gate passes NBSRC.
  #
  # Module LOAD on real NetBSD/vax under SIMH + a live /dev/vms is B2 (rd
  # vms-f78bb), NOT this: B1 is the width-clean COMPILE. BUILD/TEST tooling, never
  # a runtime (Rule 9). Gated on the exec_netbsd_vax filter (which covers
  # src/kernel-core/** + src/kernel-netbsd/**, the executive sources the shared
  # netbsd_vax filter does NOT): push/merge_group/schedule always; on a PR only
  # when the executive core / NetBSD backends / cross inputs change.
  # -----------------------------------------------------------------------
  netbsd-vax-vms-crosscompile:
    name: NetBSD/vax vms module cross-compiles
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.exec_netbsd_vax == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      # The NetBSD/vax KERNEL headers come from the SAME pinned syssrc set the
      # amd64 gate uses (netbsd_version.env carries NETBSD_SYSSRC_URL/_SHA512).
      # Cache keyed on that env only -- an OVMX source change never re-downloads.
      - name: Cache NetBSD kernel sources (syssrc)
        uses: actions/cache@v4
        with:
          path: .netbsd-src
          key: netbsd-src-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-src-

      - name: Fetch + verify + extract NetBSD syssrc (kernel headers) if not cached
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . tests/netbsd/netbsd_version.env
          if [ ! -d .netbsd-src/usr/src/sys ]; then
            mkdir -p .netbsd-src
            curl -sSL -o /tmp/syssrc.tgz "$NETBSD_SYSSRC_URL"
            echo "$NETBSD_SYSSRC_SHA512  /tmp/syssrc.tgz" | sha512sum -c -
            tar xzf /tmp/syssrc.tgz -C .netbsd-src usr/src/sys usr/src/common
          fi

      - name: Cross-compile the executive vms module for elf32-vax (ILP32 width proof)
        run: |
          set +e
          RAW=$(docker run --rm \
                  -v "$GITHUB_WORKSPACE:/src" \
                  -v "$GITHUB_WORKSPACE/.netbsd-src:/nbsrc:ro" \
                  -w /src -e NBSRC=/nbsrc \
                  ovmx-cross-vax tools/cross-vax/build-vms-module-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: netbsd-vax vms module cross-compile exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: the OVMX executive vms module' \
            || { echo "FAIL: did not see the executive-module width-proof PASS banner"; exit 1; }
          echo "$RAW" | grep -qiF 'file format elf32-vax' \
            || { echo "FAIL: objects were not elf32-vax -- wrong target"; exit 1; }
          echo "PASS: the OVMX executive vms module compiled ILP32-clean + relocatable-linked to elf32-vax"

      - name: Teeth check (a deliberately-broken TU must fail the cross-compile)
        run: |
          set +e
          RAW=$(docker run --rm \
                  -v "$GITHUB_WORKSPACE:/src" \
                  -v "$GITHUB_WORKSPACE/.netbsd-src:/nbsrc:ro" \
                  -w /src -e NBSRC=/nbsrc -e CROSSCOMPILE_NEGCTL=1 \
                  ovmx-cross-vax tools/cross-vax/build-vms-module-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          [ "$RC" -eq 0 ] || { echo "FAIL: negctl run exited nonzero ($RC)"; exit 1; }
          echo "$RAW" | grep -qF 'PASS (negctl)' \
            || { echo "FAIL: negctl did not confirm the broken TU was rejected"; exit 1; }

  # -----------------------------------------------------------------------
  # vmsdcl-netbsd-vax (rd vms-1cb2, epic vms-8e8, P4-C; CLAUDE.md "Library Build
  # Order": ... vmsfs -> vmsrms -> vmsdcl). The TOP of the userspace library
  # graph and the LAST userspace library before the init+images integration:
  # the DCL command-language interpreter. BUILD-ONLY, over the pinned
  # `vax--netbsdelf` toolchain. It (0..0f) builds the whole elf32-vax dependency
  # stack (libvmssys, vmsprocess, libvms, vmslnm, vmsfs, vmsrms, vmsqueue),
  # (1) compiles every DCL translation unit through the CMake VMSDCL_STANDALONE
  # path -> libvmsdcl.a of elf32-vax objects, and (2) links a REAL vax--netbsdelf
  # DCL.EXE with --whole-archive (every DCL object must resolve -- a complete
  # shell, not just what crt0 reaches) against that stack + NetBSD libc +
  # libpthread + libm + libatomic. readline is OPTIONAL and absent from the
  # NetBSD/vax sysroot, so HAVE_READLINE stays undefined and DCL's own
  # non-readline line editor is used (the same degrade path the static musl QEMU
  # build takes); the gate asserts no readline symbol leaked in. DCL is
  # overwhelmingly string/parse work over ordinary POSIX; its integer symbols are
  # longwords (expr_val_t.ival is `long`, `%ld`), which on ILP32 VAX is the exact
  # VMS width -- self-consistent, no width fix. The genuinely Linux-only surface
  # (TCPIP SHOW/SET INTERFACE ifr_hwaddr/ifr_netmask/SIOCGIFHWADDR + /sys/class/net
  # -- the AF_INET networking engine, vms-67f) is substrate-guarded #if __linux__
  # and honestly degrades on netbsd-vax (no fabrication). DELIBERATELY NOT
  # emulation; BUILD/TEST tooling, never a runtime (Rule 9). Fast once the cross
  # toolchain image layer-caches (gha, shared scope=cross-vax). Gated on the
  # shared netbsd_vax filter: push/merge_group/schedule always; on a PR only when
  # the cross inputs change (src/vmsdcl/**, src/vmsqueue/**, and the lower
  # stack/cross).
  # -----------------------------------------------------------------------
  vmsdcl-netbsd-vax:
    name: vmsdcl cross-compiles for netbsd-vax (vms-1cb2)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Cross-compile vmsdcl for netbsd-vax + link a real ELF32 VAX DCL.EXE
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
                  ovmx-cross-vax tools/cross-vax/build-vmsdcl-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: netbsd-vax vmsdcl cross build/link exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: vmsdcl builds and links a DCL.EXE for vax--netbsdelf' \
            || { echo "FAIL: did not see the vmsdcl build+link PASS banner"; exit 1; }
          echo "$RAW" | grep -qiF 'file format elf32-vax' \
            || { echo "FAIL: vmsdcl objects were not elf32-vax -- wrong target"; exit 1; }
          echo "$RAW" | grep -qiF 'Machine:                           Digital VAX' \
            || { echo "FAIL: DCL.EXE was not a VAX ELF"; exit 1; }
          echo "$RAW" | grep -qF 'no undefined readline symbols' \
            || { echo "FAIL: readline auto-degrade assertion did not run"; exit 1; }
          echo "PASS: vmsdcl built for netbsd-vax and a real ELF32 VAX DCL.EXE linked over the full stack"

  # -----------------------------------------------------------------------
  # ovmx-init-netbsd-vax (rd vms-f2e, epic vms-8e8, P4-C boot; docs/design-p4-
  # netbsd-vax-boot.md §4.5). The boot orchestrator (STARTUP.EXE, PID 1) cross-
  # compiles + links for netbsd-vax against the NetBSD realization of the
  # boot-plumbing seam (src/ovmx_init/ovmx_boot_netbsd.c, the NetBSD twin of
  # ovmx_boot_linux.c from vms-28f). It builds the full elf32-vax userspace
  # library stack, asserts ovmx_init.c carries NO substrate #ifdef fork of the
  # boot logic (INV-DRIFT -- the split lives ONLY in the ovmx_boot backend),
  # confirms the NetBSD backend defines every ovmx_boot.h op and opens the REAL
  # /dev/vms (fail-honest, INV-6 / Rule 9), and links a real vax--netbsdelf
  # ELF32 STARTUP.EXE (dynamic, activated by NetBSD ld.elf_so -- Decision A,
  # vms-42d). This unblocks vms-5d1 (all images link+activate -> bootable-disk
  # assembly). DELIBERATELY NOT emulation (no qemu-system-vax); build/test
  # tooling, never a runtime (Rule 9). Fast once the cross toolchain image
  # layer-caches (gha, shared scope=cross-vax). Gated on the shared netbsd_vax
  # filter: push/merge_group/schedule always; on a PR only when the cross
  # inputs change (src/ovmx_init/** and the lower stack/cross).
  # -----------------------------------------------------------------------
  ovmx-init-netbsd-vax:
    name: ovmx_init cross-compiles for netbsd-vax (vms-f2e)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Cross-compile ovmx_init for netbsd-vax + link a real ELF32 VAX STARTUP.EXE
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
                  ovmx-cross-vax tools/cross-vax/build-ovmx-init-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: netbsd-vax ovmx_init cross build/link exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: ovmx_init (STARTUP.EXE) builds and links for vax--netbsdelf' \
            || { echo "FAIL: did not see the ovmx_init build+link PASS banner"; exit 1; }
          echo "$RAW" | grep -qiF 'file format elf32-vax' \
            || { echo "FAIL: ovmx_init objects were not elf32-vax -- wrong target"; exit 1; }
          echo "$RAW" | grep -qF 'OK: ovmx_init.c has no __NetBSD__/__linux__ boot-logic fork' \
            || { echo "FAIL: INV-DRIFT assertion (no substrate #ifdef fork) did not run"; exit 1; }
          echo "$RAW" | grep -qF 'OK: all 9 ovmx_boot.h ops defined by the NetBSD backend' \
            || { echo "FAIL: NetBSD backend did not define every ovmx_boot.h op"; exit 1; }
          echo "$RAW" | grep -qiF 'Machine:                           Digital VAX' \
            || { echo "FAIL: STARTUP.EXE was not a VAX ELF"; exit 1; }
          echo "PASS: ovmx_init built for netbsd-vax and a real ELF32 VAX STARTUP.EXE linked over the full stack"

  # -----------------------------------------------------------------------
  # ovmx-boot-images-netbsd-vax (rd vms-5d1, epic vms-8e8, P4-C boot; docs/
  # design-p4-netbsd-vax-boot.md §4.5). The FULL SET of OVMX boot images --
  # every image PID 1's boot path actually invokes, walking src/ovmx_init/
  # ovmx_init.c: STARTUP.EXE (ovmx_init) execs PROVISION.EXE (ovmx_provision,
  # vms-9b7), which execs DCL.EXE in-process on SYS$MANAGER:STARTUP.COM,
  # whose END-phase RUN/DETACHED-creates JOB_CONTROL.EXE (ovmx_job_control,
  # vms-8d2), which forks LOGINOUT.EXE (tools/vms_login.c) on the console,
  # which execs DCL.EXE (interactive, --login) -- cross-build + link for
  # netbsd-vax and are asserted ACTIVATABLE by the Decision-A contract
  # (vms-42d): ordinary NetBSD ELF32-vax dynamic executables, PT_INTERP ==
  # /usr/libexec/ld.elf_so (NOT OVMX-native IMGACT.EXE + .vms$sv symbol
  # vectors), with a resolvable NEEDED set. The umbrella script
  # (tools/cross-vax/build-boot-images-vax.sh) reuses the existing per-image
  # scripts unchanged for STARTUP.EXE and DCL.EXE (build-ovmx-init-vax.sh,
  # build-vmsdcl-vax.sh) and adds three new ones for the images that were not
  # yet covered (build-provision-vax.sh, build-job-control-vax.sh,
  # build-loginout-vax.sh), then runs the readelf/file activation assertion
  # against all five linked binaries. INV-DRIFT: no image's C source forks
  # logic on __NetBSD__/__linux__; PROVISION.EXE's one substrate difference
  # (its fatal-halt power-off) reuses the SAME ovmx_boot.h backend-object
  # seam (vms-28f) ovmx_init already uses, selected by CMake
  # (src/ovmx_provision/CMakeLists.txt), not a source #ifdef -- verified by
  # building ovmx_provision on the HOST (Linux) too, unregressed. NOT
  # emulation (no qemu-system-vax); a static ELF proof, never executed --
  # build/test tooling, never a runtime (Rule 9). Fast once the cross
  # toolchain image layer-caches (gha, shared scope=cross-vax). Gated on the
  # shared netbsd_vax filter: push/merge_group/schedule always; on a PR only
  # when the cross inputs change (the boot images' sources + tools/cross-vax/**).
  # -----------------------------------------------------------------------
  ovmx-boot-images-netbsd-vax:
    name: OVMX boot images link for netbsd-vax (vms-5d1)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd_vax == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the vax--netbsdelf cross toolchain image (shared gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Cross-compile + link + activation-assert the full OVMX boot image set for netbsd-vax
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
                  ovmx-cross-vax tools/cross-vax/build-boot-images-vax.sh 2>&1)
          RC=$?
          set -e
          echo "$RAW"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: netbsd-vax boot image set build/link/activation-assert exited nonzero ($RC)"
            exit 1
          fi
          echo "$RAW" | grep -qF 'ALL PROOFS PASSED: the full OVMX boot image set (STARTUP.EXE, PROVISION.EXE, DCL.EXE, JOB_CONTROL.EXE, LOGINOUT.EXE) builds, links, and activates via ld.elf_so for vax--netbsdelf' \
            || { echo "FAIL: did not see the boot-image-set PASS banner"; exit 1; }
          for img in STARTUP.EXE PROVISION.EXE DCL.EXE JOB_CONTROL.EXE LOGINOUT.EXE; do
            echo "$RAW" | grep -qF "-> $img: ELF32 Digital VAX, dynamically linked, interp=/usr/libexec/ld.elf_so" \
              || { echo "FAIL: $img did not pass the activation contract assertion"; exit 1; }
          done
          echo "PASS: all 5 OVMX boot images (STARTUP.EXE, PROVISION.EXE, DCL.EXE, JOB_CONTROL.EXE, LOGINOUT.EXE) cross-build, link, and activate via ld.elf_so for netbsd-vax"
