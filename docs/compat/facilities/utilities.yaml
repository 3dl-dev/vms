  - id: utilities$convert
    kind: utility
    status: partial
    authenticity: facade-risk
    vms: "CONVERT — file/record-format conversion utility"
    evidence: src/vmsdcl/dcl_cmd_misc.c:3158
    notes: "/FDL emits an honest %CONVERT-I-FDL 'accepted but ignored' informational (dcl_cmd_misc.c:3127), but the body is a line-by-line fgets/fputs copy that prints '%CONVERT-S-CONVERTED, N records converted' (dcl_cmd_misc.c:3158) — claiming a record-format conversion it did not perform. Real RMS record-format CONVERT tracked vms-558e. Still facade-risk."

