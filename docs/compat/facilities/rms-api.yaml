facility: rms-api
name: "RMS programmatic API — entry points, control blocks, file organizations"
domain: programming-interfaces
vms_ref: "OpenVMS Record Management Services Reference Manual"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  Record Management Services entry points, FAB/RAB/NAM/XAB control blocks, and the
  three file organizations. On the executive-present path every $OPEN/$CREATE/$ERASE
  drives the Files-11 ODS-2 ACP ($ASSIGN + IO$_ACCESS/IO$_CREATE/IO$_DELETE), with the
  pre-flip POSIX open()/creat() body kept only as the honest executive-absent fallback
  (rms_acp_absent -> rms_posix_*, vms-5f0). Sequential and Relative are real end to end.
  Cross-process locking, formerly the facility-wide gap (vms-407), is now real on the ACP
  path: file-level share arbitration (vms-50e) and per-record locking (vms-0dd) both run
  through the executive DLM ($ENQ/$DEQ, RMS$_RLK on conflict). Indexed (ISAM) is multi-key
  over the ACP path: alternate keys are authored from the XABKEY chain and read by
  key-of-reference via SIDR descent (honest narrower gap: index key compression is
  rejected fail-honest, RMS$_PLG). The C RTL file layer (stdio and descriptors) is an
  RMS client of these same $ entry points, not raw POSIX (vms-b90/9f8e). (Non-ACP/
  POSIX-defer handles hold no lock, honestly documented.)
last_reviewed: 2026-09-14
items:
  # --- Entry points: open/create/erase ---
  - {id: sys$open,       kind: routine, status: implemented, authenticity: real, vms: "Open an existing file", evidence: src/vmsrms/rms_core.c, notes: "executive-present path is $ASSIGN + IO$_ACCESS over the Files-11 ODS-2 ACP (rms_acp_open_file); filespec composes through executive directory/concealed logicals (vms-f05). rms_posix_open is the executive-absent fallback only (vms-5f0)"}
  - {id: sys$create,     kind: routine, status: implemented, authenticity: real, vms: "Create a new file", evidence: src/vmsrms/rms_core.c, notes: "executive-present path is IO$_CREATE(+ACCESS) of a fresh versioned file over the ACP (vms-bc7), fanning through directory/concealed logicals; rms_posix_create is the executive-absent fallback (vms-5f0). Active investigation: create into a user subdirectory ([USERS.GUEST]) can return RMS-E-CRE (vms-93b) — the common top-level/system-dir case is real"}
  - {id: sys$erase,      kind: routine, status: implemented, authenticity: real, vms: "Delete a file", evidence: src/vmsrms/rms_core.c, notes: "executive-present path is IO$_DELETE over the ACP; rms_posix_erase (local unlink) is the executive-absent fallback"}
  # --- Entry points: connect/disconnect/control ---
  - {id: sys$close,      kind: routine, status: implemented, authenticity: real, vms: "Close a file", evidence: src/vmsrms/rms_core.c}
  - {id: sys$connect,    kind: routine, status: implemented, authenticity: real, vms: "Connect a RAB to an open FAB", evidence: src/vmsrms/rms_core.c}
  - {id: sys$disconnect, kind: routine, status: implemented, authenticity: real, vms: "Disconnect a RAB", evidence: src/vmsrms/rms_core.c}
  - {id: sys$rewind,     kind: routine, status: implemented, authenticity: real, vms: "Rewind to start of file", evidence: src/vmsrms/rms_core.c}
  - {id: sys$flush,      kind: routine, status: implemented, authenticity: real, vms: "Flush buffers to disk", evidence: src/vmsrms/rms_core.c}
  - {id: sys$display,    kind: routine, status: implemented, authenticity: real, vms: "Report FAB/RAB/XAB fields to caller", evidence: src/vmsrms/rms_core.c, notes: "walks XABKEY/XABDAT/XABPRO and now XABFHC/XABALL, filled from the ODS-2 FAT retained on the open handle over the ACP (vms-dfa); $CREATE records the FAB's rfm/org/rat/mrs in the FAT and $CLOSE the longest record, and $OPEN loads rfm/rat/mrs back from it (vms-b447)"}
  - {id: sys$extend,     kind: routine, status: partial, authenticity: real, vms: "Extend a file's allocation (fab$l_alq blocks)", evidence: src/vmsrms/rms_core.c, notes: "vms-bc7: exec IO$_MODIFY allocates fab$l_alq more blocks (BITMAP.SYS + FH2 retrieval-pointer append) without moving EOF; caller-FAB validation is local"}
  # --- Entry points: record I/O (record locking now real via the DLM on the ACP path) ---
  - {id: sys$get,        kind: routine, status: implemented, authenticity: real, vms: "Read next/keyed record", evidence: src/vmsrms/rms_record.c, notes: "reads the record's VBNs through the ACP window; a default $GET takes a real per-record $ENQ (EX, child of the FAB file-access lock) — RMS$_RLK on a live conflict; RAB$M_NLK/RAB$M_RLK read modifiers honored (vms-0dd)"}
  - {id: sys$put,        kind: routine, status: implemented, authenticity: real, vms: "Write a new record", evidence: src/vmsrms/rms_record.c, notes: "writes the record's VBNs through the ACP window; holds no persistent record lock, matching VMS $PUT (vms-0dd)"}
  - {id: sys$update,     kind: routine, status: implemented, authenticity: real, vms: "Rewrite current record", evidence: src/vmsrms/rms_record.c, notes: "gated on the stream holding its record lock (rms_reclock_require_held); serialized by the DLM (vms-0dd)"}
  - {id: sys$delete,     kind: routine, status: implemented, authenticity: real, vms: "Delete current record", evidence: src/vmsrms/rms_record.c, notes: "gated on the held record lock like sys$update (vms-0dd)"}
  - {id: sys$find,       kind: routine, status: implemented, authenticity: real, vms: "Locate a record without transferring data", evidence: src/vmsrms/rms_record.c, notes: "same record-lock seam as sys$get (vms-0dd)"}
  - {id: sys$read,       kind: routine, status: implemented, authenticity: real, vms: "Block I/O: read virtual blocks (FAC BIO/BRO + GET)", evidence: src/vmsrms/rms_record.c, notes: "vms-254: RAB$L_BKT start VBN (0 = next block), USZ/RSZ/RBF/RFA per the RMS reference; IO$_READVBLK through the ACP window, partial transfer at end of file, RMS$_EOF past it, RMS$_FAC without block access. Proven over /dev/vms by tests/qemu/test_syssvc_rms_acp.c"}
  - {id: sys$write,      kind: routine, status: implemented, authenticity: real, vms: "Block I/O: write virtual blocks (FAC BIO/BRO + PUT)", evidence: src/vmsrms/rms_record.c, notes: "vms-254: IO$_WRITEVBLK through the ACP window, extending the file; the end of file moves byte-exact to the end of the transfer. Proven over /dev/vms by tests/qemu/test_syssvc_rms_acp.c"}
  # --- Entry points: parse/search ---
  - {id: sys$parse,      kind: routine, status: partial, authenticity: real, vms: "Parse a filespec against defaults", evidence: src/vmsrms/rms_parse.c, notes: "device-field logical names resolve iteratively through the executive LNM$FILE_DEV incl. concealed/rooted attrs (vms-d8e, vms-240); remaining gap is an executive device/volume DB (vms-dv1)"}
  - {id: sys$search,     kind: routine, status: implemented, authenticity: real, vms: "Wildcard directory search", evidence: src/vmsrms/rms_search.c, notes: "ACP $SEARCH; distinguishes RMS$_DNF (no such dir) from RMS$_NMF (no match)"}
  # --- C RTL file layer over RMS (corpus surface: fopen/fread/fwrite hit RMS, not raw POSIX) ---
  - {id: crtl$rms_file_layer, kind: feature, status: partial, authenticity: real, vms: "C RTL file descriptors and stdio as RMS clients (open/read/write/lseek/fstat/close, all of stdio)", evidence: src/vmsrms/crtl_rms_fd.c, notes: "vms-b90: a hook in the musl syscall funnel serves every file system call that names an RMS file through $OPEN/$CREATE/$READ/$WRITE/$GET/$DISPLAY/$ERASE/$RENAME; /dev /proc /sys /run stay the kernel's; stream files are byte streams over block I/O, record files read as lines; a directory opens as a $PARSE/$SEARCH wildcard context, so opendir/readdir/rewinddir/telldir/seekdir list its entries (NAME.TYP;VER, d_ino = the File ID) (vms-9f8e). Proven by the alpha crtl-fd gate (32-bit DEC C program; DCL writer + DCL TYPE reader). Every RMS-backed alpha DECC$SHR carries it (vms-9f8e: the FIX-record stdio veneer is no longer linked; all JOINT_CRTL_RMS_VENEER gates run over this layer). Partial: writing record files and mkdir/rmdir fail honestly (EOPNOTSUPP)"}
  - {id: rms$vms_abi_entry_points, kind: feature, status: partial, authenticity: real, vms: "RMS services by their upper-case names over FAB/RAB/NAM in the VMS byte layout (32-bit address fields), as DEC C clients pass them", evidence: src/vmsrms/rms_vmsabi.c, notes: "vms-692: SYS$PARSE and SYS$SEARCH take a VMS-layout FAB/NAM (src/libvms/include/vms/rms.h, offsets asserted against the Alpha V8.4 oracle), run on the RMS engine through internal blocks keyed by NAM$L_WCC, and return the expanded/resultant strings, component addresses, NAM$L_FNB, NAM$T_DVI, NAM$W_FID and NAM$W_DID. Proven by the alpha vmsabi-rms gate (32-bit DEC C program; DIRECTORY/FULL File ID cross-check). Partial: the other RMS services ($OPEN/$CREATE/$CONNECT/$GET/$PUT/...) are not yet on the VMS ABI; $PARSE does not fill NAM$W_DID until $SEARCH"}
  # --- Cross-process locking (was the facility-wide gap; now real on the ACP path) ---
  - {id: rms$file_share_locking, kind: feature, status: implemented, authenticity: real, vms: "File-level share/access arbitration (FAB fac/shr flags)", evidence: src/vmsrms/rms_core.c, notes: "vms-50e: sys$open/create map fab$b_fac/fab$b_shr to a DLM lock mode (NL/CR/CW/PR/PW/EX) $ENQ'd on the file's FID with NOQUEUE; RMS$_FLK on a real conflict, $DEQ'd at sys$close"}
  - {id: rms$record_locking, kind: feature, status: implemented, authenticity: real, vms: "Cross-process record locking (RAB rop modifiers)", evidence: src/vmsrms/rms_record.c, notes: "vms-0dd: per-record $ENQ, a child of the FAB file-access lock, arbitrated by the executive DLM; the one honest degradation is the non-ACP/POSIX-defer handle (access_lkid==0), which holds nothing and passes status through"}
  # --- Control blocks ---
  - {id: fab,     kind: struct, status: implemented, authenticity: real, vms: "File Access Block", evidence: src/vmsrms/include/rms/fab.h, notes: "all 3 orgs SEQ/REL/IDX, all 7 record formats UDF/FIX/VAR/VFC/STM/STMLF/STMCR"}
  - {id: rab,     kind: struct, status: implemented, authenticity: real, vms: "Record Access Block", evidence: src/vmsrms/include/rms/rab.h, notes: "RAB$M_FDL bit defined but no FDL behind it"}
  - {id: nam,     kind: struct, status: implemented, authenticity: real, vms: "Name Block", evidence: src/vmsrms/include/rms/nam.h, notes: "full component pointers + CNCL_DEV/ROOT_DIR/SEARCH_LIST flags; NAM$W_FID/NAM$W_DID (appended -- OVMX's NAM is not the VMS byte layout) filled by $OPEN/$CREATE/$SEARCH, $PARSE fills NAM$W_DID and clears NAM$W_FID (vms-6e28)"}
  - {id: xab$key, kind: struct, status: implemented, authenticity: real, vms: "XAB — key definition", evidence: src/vmsrms/include/rms/xab.h}
  - {id: xab$dat, kind: struct, status: implemented, authenticity: real, vms: "XAB — date/time", evidence: src/vmsrms/include/rms/xab.h, notes: "vms-5dd2: on the ACP path $DISPLAY fills it from the FH2 ident-area dates IO$_ACCESS returns (previously left untouched there). The ACP does not stamp dates at create yet, so OVMX-created files read zero dates (vms-ab49)"}
  - {id: xab$pro, kind: struct, status: implemented, authenticity: real, vms: "XAB — protection", evidence: src/vmsrms/include/rms/xab.h, notes: "vms-5dd2: on the ACP path $DISPLAY fills protection + owner UIC from the FH2 IO$_ACCESS returns (previously left untouched there)"}
  - {id: xab$fhc, kind: struct, status: implemented, authenticity: real, vms: "XAB — file header characteristics", evidence: src/vmsrms/include/rms/xab.h, notes: "struct XABFHC defined; $OPEN retains the ODS-2 FAT (rfm/rat/lrl/ebk/ffb/hbk/bkz/mrz/dxq/gbc/verlimit) on the handle and $DISPLAY fills it from the real header over the ACP (vms-dfa)"}
  - {id: xab$all, kind: struct, status: implemented, authenticity: real, vms: "XAB — allocation attributes", evidence: src/vmsrms/include/rms/xab.h, notes: "struct XABALL defined; $DISPLAY reports realized allocation (alq=hiblk, bkz, deq) from the ODS-2 FAT over the ACP; create-time input controls (aop/aln/loc) left 0 (honest) (vms-dfa)"}
  - {id: xab$_other, kind: struct, status: absent, authenticity: n/a, vms: "Remaining XAB types (SUM, RDT, ITM, TRM, RU)", scope_1_0: stretch, notes: "not declared"}
  - {id: rms$xab_silent_unsupported, kind: feature, status: implemented, authenticity: real, vms: "sys$display fills the XABs the caller chains", evidence: src/vmsrms/rms_core.c, notes: "XAB$C_FHC/XAB$C_ALL are now filled from the real ODS-2 FAT over the ACP, not silently skipped (vms-dfa). XABITM and other cods remain walked-over (documented, narrower than the old FHC/ALL facade)"}
  # --- File organizations ---
  - {id: rms$org_sequential, kind: feature, status: implemented, authenticity: real, vms: "Sequential file organization", evidence: src/vmsrms/rms_seq.c, notes: "all 7 record formats incl. VFC control area, VAR word-alignment"}
  - {id: rms$org_relative,   kind: feature, status: implemented, authenticity: real, vms: "Relative file organization", evidence: src/vmsrms/rms_rel.c, notes: "status-byte cells; record locking now via the DLM (see rms$record_locking)"}
  - {id: rms$org_indexed,    kind: feature, status: implemented, authenticity: real, vms: "Indexed (ISAM) file organization", evidence: src/vmsrms/rms_prolog3.c, notes: "genuine Files-11 Prolog-3 over the ACP: primary + alternate keys authored from the XABKEY chain (rms_idx_author_p3) and read by key-of-reference via SIDR descent (rms_p3_get_by_key). Honest narrower gap: index key compression rejected fail-honest (RMS$_PLG). The primary-key-only limitation was the DEAD .rms_idx sidecar (executive-absent defer, vms-165), not the live path (corrected vms-df8)"}
  - {id: rms$isam_alternate_key, kind: feature, status: implemented, authenticity: real, vms: "ISAM alternate-key access (RAB$B_REF)", evidence: src/vmsrms/rms_prolog3.c, notes: "RAB$B_REF key-of-reference is real over the ACP: secondaries authored from the XABKEY chain, read via SIDR descent (rms_p3_get_by_key -> rms_p3_sidr_lookup). Proven byte-exact by tests/vmsrms/test_prolog3_seckey.c (create + add secondary + rebind sees 2 keys + SIDR byte-exact across bucket splits/dup/delete-purge; host-runnable ctest -> implemented, not a real-VMS oracle). Was falsely reported absent/facade-risk against the dead rms_idx.c sidecar (corrected vms-df8)"}
