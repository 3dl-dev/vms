# Source of truth for the DCL-scripting row of the Compatibility Surface Register.
facility: dcl-scripting
name: "DCL Scripting / Flow Control ($STATUS, symbols, CALL, ON, DECK)"
domain: command-language
vms_ref: "OpenVMS DCL Dictionary; OpenVMS User's Guide (command procedures)"
scope_1_0: in
tier: 1
plan_ref: vms-8ad
summary: >
  Command-procedure control flow. The four worst honesty gaps are closed:
  $STATUS is stored/shown VMS-style ("%Xhhhhhhhh") and refreshed on
  command-not-found on the shared dispatch path (so a typo'd command in a .COM
  trips IF .NOT.$STATUS); CALL/SUBROUTINE and DECK/EOD are real constructs; and
  local symbols get a real per-command-level frame. Re-censused 2026-09-14
  against origin/main: unchanged in substance; evidence lines re-anchored.
  F$MODE remains the one narrow gap.
last_reviewed: 2026-11-02
items:
  - id: dcl-scripting$if-then-goto
    kind: feature
    status: verified
    authenticity: real
    vms: "IF/THEN, GOTO, GOSUB, labels"
    evidence: src/vmsdcl/dcl_script.c
    verified_against: "docs/oracle/semantics/ifx/vax73.txt (IF conditions) + docs/oracle/semantics/flow/vax73.txt (30 cases, VAX V7.3, captured twice, identical) via tests/dcl/test_if_expression_oracle.sh, tests/dcl/test_flow_oracle.sh + tests/qemu/test_semantic_oracle.sh"
    notes: "IF conditions evaluate expression operands with VMS precedence (ifx family, rd vms-c17a). The flow family byte-gates the rest: GOTO forward, backward, case-blind and to a label named by a symbol; a command after a label on its own line runs when GOTO lands there; a missing GOTO/GOSUB/CALL target ends the procedure level with %X10038148 even under SET NOON (%DCL-W-USGOTO, %DCL-W-USCALL); GOSUB nesting, RETURN's status (its operand, or $STATUS with STS$M_INHIB_MSG), RETURN with no GOSUB ignored; block IF/THEN/ELSE/ENDIF including an IF nested in a skipped block, THEN at the end of the IF line being a one-line IF (a later ELSE is %DCL-E-INVIFNEST); string conditions (\"YES\" true, \"abc\" false)."

  - id: dcl-scripting$on-condition
    kind: feature
    status: verified
    authenticity: real
    vms: "ON condition THEN ...; SET ON / SET NOON"
    evidence: src/vmsdcl/dcl_script.c
    verified_against: "docs/oracle/semantics/on/vax73.txt (33 cases, VAX V7.3) via tests/dcl/test_on_condition_oracle.sh + tests/qemu/test_semantic_oracle.sh"
    notes: "The on semantic-oracle family runs the same procedure on VAX V7.3 and on OVMX and byte-compares the transcripts. It covers: the default action (ERROR/SEVERE exit, WARNING goes on); ON WARNING/ERROR/SEVERE_ERROR against every severity, where an armed ON replaces the default, so under ON SEVERE_ERROR an ERROR goes on; the action is one-shot, CONTINUE included; GOTO/EXIT/CONTINUE actions; SET NOON/SET ON, and ON after SET NOON turns checking back on; per-level scope (a CALLed level starts at the default whatever its caller set); EXIT's status as an expression; EXIT with no status returning $STATUS with STS$M_INHIB_MSG set. The handler case reads $STATUS as the STRING it is on VMS (F$STRING($STATUS) = \"%X10000002\", rd vms-d80)."

  - id: dcl-scripting$call-subroutine
    kind: command
    status: verified
    authenticity: real
    vms: "CALL / SUBROUTINE / ENDSUBROUTINE"
    evidence: src/vmsdcl/dcl_script.c
    verified_against: "docs/oracle/semantics/flow/vax73.txt (FLOW.CALL.*) + docs/oracle/semantics/on/vax73.txt (every case runs in a CALLed SUBROUTINE) via tests/dcl/test_flow_oracle.sh, tests/dcl/test_on_condition_oracle.sh + tests/qemu/test_semantic_oracle.sh"
    notes: "CALL gives the subroutine a new command level with its own P1-P8 and local-symbol frame; it reads its caller's locals but its own assignments stay local. Unquoted CALL parameters are upcased, quoted ones keep case and blanks; $STATUS after CALL is the subroutine's exit status; a missing target is %DCL-W-USCALL and ends the calling level with %X10038148. A block's labels are local to it (ON.ONESHOT; dcl_find_label_in)."

  - id: dcl-scripting$deck-eod
    kind: feature
    status: implemented
    authenticity: real
    vms: "DECK / $EOD in-stream data"
    evidence: src/vmsdcl/dcl_cmd_process.c:1659
    notes: "A DECK block (vms-3983) reads in-stream lines verbatim to the EOD sentinel instead of parsing them as commands (dcl_cmd_process.c:1664-1677); former facade-risk retired. Exercised by test_scripting_status_call_deck.sh (DOLLAR_DATA_LINE_KEPT, AFTER_DECK)."

  - id: dcl-scripting$symbol-scoping
    kind: feature
    status: implemented
    authenticity: real
    vms: "Per-procedure local symbol scope"
    evidence: src/vmsdcl/dcl_symbol.c
    notes: "vms-2af frames: each @ invocation / CALL gets its own local-symbol table (SYM_MAX_FRAMES), inner levels read outer locals, the frame is torn down on RETURN, and SET SYMBOL/SCOPE=([NO]LOCAL,[NO]GLOBAL) is honoured. Former facade-risk (flat leaking table) retired. Exercised by test_symbol_scope.sh / test_symbol_scope_domain.sh with EXPECT_NOT isolation controls."

  - id: dcl-scripting$status-format
    kind: feature
    status: implemented
    authenticity: real
    vms: "$STATUS holds a VMS condition code, conventionally displayed %Xhhhhhhhh"
    evidence: src/vmsdcl/dcl_exec.c:165
    notes: "$STATUS is a STRING symbol holding the 32-bit condition value rendered %X%08X (dcl_set_status); F$STRING($STATUS) is that string, and an operator that needs an integer converts it radix-aware (F$INTEGER($STATUS), $STATUS + 1, .NOT. $STATUS). Measured on VAX V7.3 by the sym semantic-oracle family (SYM.STATUS.*, see dcl-scripting$symbol-types). Former facade-risk (plain decimal) retired."

  - id: dcl-scripting$symbol-types
    kind: feature
    status: verified
    authenticity: real
    vms: "A symbol is a STRING or an INTEGER; expressions convert between them by DCL's rules; full operator precedence including .NOT./.AND./.OR. and the comparisons"
    evidence: src/vmsdcl/dcl_exec.c
    verified_against: "docs/oracle/semantics/sym/vax73.txt (69 cases, VAX V7.3, captured twice, identical) via tests/dcl/test_sym_oracle.sh + tests/qemu/test_semantic_oracle.sh"
    notes: "rd vms-d80. A symbol keeps the type it was given, never re-derived from its text: A = \"007\" is the string 007, $STATUS the string %X00030001. Two strings concatenate (\"5\" + \"5\" = 55); with one integer operand, and for * / unary minus .NOT. .AND. .OR. and the integer comparisons, a string is converted: a valid integer (decimal with leading zeros and blanks, %X/%O/%D) is its value, T/Y is 1, anything else 0. The logical operators are bitwise (1 .OR. 2 = 3, .NOT. 0 = -1); a comparison yields 1 or 0 and may appear in an assignment. F$TYPE answers INTEGER for a string whose text is a valid integer, radix forms included. String-valued lexicals (F$STRING, F$EXTRACT, F$FAO ...) stay strings. SET ON/NOON leave $STATUS %X00030001."

  - id: dcl-scripting$status-refresh
    kind: feature
    status: implemented
    authenticity: real
    vms: "$STATUS is set after every command, including an unrecognized verb (IVVERB)"
    evidence: src/vmsdcl/dcl_exec.c:1534
    notes: "The highest-impact former bug. Command-not-found calls dcl_set_status(ctx, SS$_IVVERB) on the single shared dispatch path (dcl_exec.c:1534) used by both the REPL and .COM execution, so IF .NOT.$STATUS THEN GOTO err catches a typo'd command anywhere. Verb handlers and qualifier validation also set $STATUS (dcl_exec.c:1465/1470/1490). Exercised by test_scripting_status_call_deck.sh (STATUS_FALSE_ON_ERROR)."

  - id: dcl-scripting$f-mode
    kind: lexical
    status: implemented
    authenticity: real
    vms: "F$MODE reports INTERACTIVE/BATCH/OTHER/NETWORK per the actual process context"
    evidence: src/vmsdcl/dcl_lexical.c
    notes: "F$MODE() and F$GETJPI(pid,\"MODE\") read $GETJPI JPI$_MODE, the executive's classification of the process (its row's proc_type): INTERACTIVE for an interactive job's processes, OTHER for a detached one, BATCH for a batch job root (none runs: no batch engine). Formerly DCL guessed INTERACTIVE/BATCH from whether its own input was a terminal. NETWORK for a network object's server process: $CREPRC PRC$M_NETWRK (NETACP's FAL/MAIL creation) makes the executive mark the row NETWORK, so JPI$_MODE, JPI$_JOBTYPE and F$MODE() say NETWORK and SHOW USERS leaves it out by default, as VMS does. Proof tests/qemu/test_syssvc_dcl_fmode.c + defects.d/dcl-fmode-from-terminal.defect + defects.d/creprc-netwrk-not-classified.defect."
