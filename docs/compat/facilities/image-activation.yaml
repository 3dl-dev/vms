# Source of truth for the Image Activation row of the Compatibility Surface Register.
facility: image-activation
name: "Image Format + Activation (IMGACT, Shareable/Installed Images, TLS)"
domain: toolchain
vms_ref: "OpenVMS Linker Utility Manual; Programming Concepts Manual (image activation)"
scope_1_0: in
plan_ref: vms-ade
summary: >
  IMGACT.EXE activates images in-process via PT_INTERP (freestanding
  static-PIE); DCL, LOGINOUT, TCC and all shareable images activate natively
  through symbol vectors. Now exercised on Alpha as well as x86_64 (arch
  start.S + vms_transfer.S under arch/alpha, run_test_alpha.sh /
  run_vms_std_activation_alpha.sh). Installed images (Known Image DB) and TLS
  in activated images are real. Image container byte layout
  (.vms$sv/.vms$imp/.vms$rel/.vms$tls) is covered under the symbol-vectors
  facility.
last_reviewed: 2026-10-08
items:
  - {id: image-activation$imgact-pt-interp, kind: feature, status: verified, authenticity: real, vms: "IMGACT.EXE image activation via PT_INTERP", evidence: "src/imgact/imgact.c", verified_against: "src/imgact/test/ activation scripts incl. run_test.sh, run_test_x86_64.sh and run_test_alpha.sh / run_vms_std_activation_alpha.sh", notes: "Freestanding static-PIE, per-arch start.S (x86_64/aarch64/alpha)."}
