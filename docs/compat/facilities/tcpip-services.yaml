# Source of truth for the TCP/IP Services row of the Compatibility Surface Register.
facility: tcpip-services
name: "TCP/IP Services (UCX QIO + Sockets + EWA0:/BGn:)"
domain: networking
vms_ref: "OpenVMS TCP/IP Services for OpenVMS (UCX) manuals"
scope_1_0: in
plan_ref: vms-67f
summary: >
  Design-only, nothing built. No BG: device, no QIO network path, no usable
  socket API. The current DCL TCPIP verb is a facade — it opens a Linux
  AF_INET SOCK_DGRAM socket only to issue SIOCGIF* ioctls (interface
  introspection), configures nothing durable, and gives VMS code no stack.
  A NIC as a VMS device (EWA0:/BGn:) is also absent — QEMU boots with
  `-nic none`. 1.0 blocker (vms-67f).
last_reviewed: 2026-08-13
