  - {id: sys$mode_transition,  kind: feature,  status: verified,    authenticity: real,         vms: "Privilege-checked mode escalation gate", evidence: "src/kernel-core/vms_access.c:108-130", verified_against: "lab-VAX SDA (docs/oracle/vax73-privileges.md §2) — caught SETPRV mismapped to DETACH bit, fixed"}
  - {id: sys$setprv,           kind: routine,  status: verified,    authenticity: real,         vms: "vms_ioctl_setprv() — SETPRV can only narrow within the authorized mask, never exceed it", evidence: "src/kernel-core/vms_access.c:290", verified_against: "lab-VAX SDA READ SYS$SYSTEM:SYSDEF.STB (docs/oracle/vax73-privileges.md §2)"}
  - {id: privs$file_access_override, kind: feature, status: absent, authenticity: facade-risk, vms: "SYSPRV/BYPASS/READALL/GRPPRV override normal file protection checks", evidence: "src/kernel/vmsfs/vmsfs_blkdev.c:1256", scope_1_0: in, notes: "vmsfs_blkdev_permission() checks only uid==0/gid, zero SYSPRV refs — both over-grants (any root/SSH session) and under-grants (legit-SYSPRV non-root user denied). Tracked vms-f15/vms-36d, unfixed. Cross-listed to protection-acl."}
