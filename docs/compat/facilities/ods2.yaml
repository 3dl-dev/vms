facility: ods2
name: "ODS-2 on-disk file system + versioning"
domain: file-system
vms_ref: "OpenVMS File System (ODS-2) documentation; Files-11 On-Disk Structure"
scope_1_0: in
plan_ref: vms-0f3
summary: >
  Two distinct surfaces: the OVMX runtime filesystem (vmsfs.ko — its own honestly-labeled
  format, not byte-compatible) and a genuine Files-11 ODS-2 reader/writer for interop,
  byte-exact-verified against a real OpenVMS VAX volume from lab-2. File versioning is
  real and wired to DCL; COPY/CREATE has a versioning-semantics gap.
last_reviewed: 2026-08-13
