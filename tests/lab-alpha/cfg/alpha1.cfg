// alpha1.cfg -- AXPbox AlphaServer ES40 for the OVMX reference lab (rd vms-e2c)
//
// Purpose: a 64-bit OpenVMS oracle. Lab-1/lab-2 are OpenVMS VAX V7.3, which is
// 32-bit, so no VAX node can answer a question about quadword behaviour.
//
// Console is SERIAL ONLY on TCP 21264 -- headless, no X, no putty auto-launch.
// Single CPU with icache disabled: the AXPbox OpenVMS guide is explicit that
// SMP and the icache are where the emulator's known bugs live.

sys0 = tsunami
{
    memory.bits = 28;                       // 2^28 = 256 MB

    rom.srm          = "/data/training/vax/alpha/rom/cl67srmrom.exe";
    rom.decompressed = "/data/training/vax/alpha/rom/decompressed.rom";
    rom.flash        = "/data/training/vax/alpha/rom/flash.rom";
    rom.dpr          = "/data/training/vax/alpha/rom/dpr.rom";

    cpu0 = ev68cb
    {
        speed  = 800M;
        icache = false;
    }

    serial0 = serial
    {
        port = 21264;
    }

    pci0.15 = ali_ide
    {
        disk0.0 = file
        {
            file      = "/data/training/vax/alpha/disks/alpha1-sys.img";
            cdrom     = false;
            read_only = false;
        }
    }

    pci0.7 = ali
    {
        mouse.enabled = false;
        vga_console   = false;
    }

    pci0.19 = ali_usb
    {
    }
}
