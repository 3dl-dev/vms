  # is a parameter of the SAME script, not a forked copy (vms-cb5f). Unlike
  # the arm64 job, GitHub's runner IS x86_64, so this needs no QEMU binfmt
  # registration -- the alpine:3.20/amd64 container runs natively and DCL.EXE
  # activates directly, no qemu-user in the loop.
  # -----------------------------------------------------------------------
  dcl-native-x86_64:
    name: DCL.EXE VMS-native Link + Activate, x86_64 (vms-bdf done-condition)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
