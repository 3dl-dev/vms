# OVMX Configuration File
# OpenVMS-Compatible Linux Distribution

# VMS root directory (where SYS$SYSTEM etc. live)
VMS_ROOT=/vms

# System node name
NODE_NAME=OVMX

# Default file version limit (0 = unlimited)
VERSION_LIMIT=0

# Default protection for new files (SOGW)
DEFAULT_PROTECTION=S:RWED,O:RWED,G:RE,W:

# Enable VMS-style file versioning
FILE_VERSIONING=1

# Logical name daemon socket path
LNM_SOCKET=/tmp/ovmx/lnm.sock
