# SYS$ I/O Channel + QIO. See docs/design-compat-surface-register.md.
facility: sys-io
name: "SYS$ I/O Channel + QIO"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — I/O Services (QIO)"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  VMS ships ~10 channel/QIO services; OVMX declares 6. Executive-issued
  channels are real and cross-process: the console terminal (OPA0:), mailbox
  channels (vms_mbx.c) and BGn: sockets (vms_bg.c) route their QIOs into the
  executive. Channels assigned to ordinary/private devices remain per-process
  file descriptors, invisible cross-process (advisory). The 6th named routine,
  SYS$CANCEL (process-wide I/O cancellation), is registered under the
  sys-process facility to avoid a duplicate row.
last_reviewed: 2026-10-09
items:
  - {id: sys$assign, kind: routine, status: implemented, authenticity: advisory, vms: "Assign an I/O channel to a device", evidence: src/libvms/syssvc/sys_assign.c, notes: "console/mailbox/BGn: channels executive-routed (real, cross-process); ordinary channels are private per-process fds"}
  - {id: sys$dassgn, kind: routine, status: implemented, authenticity: advisory, vms: "Deassign an I/O channel", evidence: src/libvms/syssvc/sys_assign.c, notes: "same executive/private-channel split as sys$assign"}
  - {id: sys$qio, kind: routine, status: implemented, authenticity: advisory, vms: "Queue an I/O request (asynchronous)", evidence: src/libvms/syssvc/sys_qio.c, notes: "console/mailbox/BGn: channels executive-routed (real); ordinary channels are private per-process fds with no cross-process I/O queue"}
  - {id: sys$qiow, kind: routine, status: implemented, authenticity: advisory, vms: "Queue an I/O request (waits for completion)", evidence: src/libvms/syssvc/sys_qio.c, notes: "same executive/private-channel split as sys$qio"}
  - {id: sys$device_scan, kind: routine, status: implemented, authenticity: real, vms: "Scan for devices matching selection criteria", evidence: src/libvms/syssvc/sys_device.c}
  - {id: tt$class-driver, kind: feature, status: implemented, authenticity: real, vms: "Terminal class driver (TTDRIVER): type-ahead held UNECHOED and echoed when a read consumes it, after that read's prompt; standard and caller (P4) terminators; IO$_READPROMPT; IO$M_NOECHO / TIMED / PURGE / TRMNOECHO / NOFILTR / CVTLOW; ^Z echoes *EXIT*; ^X purges type-ahead; TTSYNC ^S/^Q hold/release output; PASSALL; a signal suspends a read rather than ending it", evidence: src/kernel-core/vms_tt.c, verified_against: "docs/oracle/keystroke/ TA.WAIT T, TA.WAIT.CR T, TA.CTRLX T byte-match the VAX V7.3 console (rd vms-f8c); tests/qemu/test_kmod_tt.c pins the bytes on a real pty", notes: "rd vms-f8c. ONE class driver in kernel-core, a line-discipline PORT per substrate (Linux tty_ldisc_ops, NetBSD linesw \"vms_tt\"): the substrate's own line discipline is REPLACED on the line, so no userspace termios ECHO/ICANON toggle remains anywhere. Binding a line to a unit needs CMKRNL, decided by the executive (vms_prot.h). STARTUP binds OPA0:; the network daemon binds each RTAn:; the console's binding survives a session hangup. DCL, LOGINOUT, MONITOR read with $QIO; a CRTL read(2) on the line is served by the same driver. A unit with no port answers SS$_DEVOFFLINE."}
  - {id: tt$line-editing, kind: feature, status: partial, authenticity: real, vms: "Terminal line editing: DELETE, ^U, ^R, ^X, cursor keys, ^A ^B ^D ^E ^F ^H ^J, insert/overstrike", evidence: src/kernel-core/vms_tt.c, notes: "rd vms-eda8. DELETE / ^U / ^R / ^X are the driver's (scope form; the hardcopy \\X\\ form under HARDCOPY). A cursor-key escape sequence is consumed as one key with no effect (it neither ends the read nor lands in the line). ^A ^D ^E ^F ^H ^J and insert/overstrike editing are not implemented yet."}
  - {id: tt$out-of-band, kind: feature, status: partial, authenticity: advisory, vms: "Out-of-band ^Y ^C ^O ^T delivered as ASTs ($QIO IO$_SETMODE IO$M_CTRLYAST / CTRLCAST / OUTBAND)", evidence: src/kernel-core/vms_tt.c, notes: "rd vms-f0fb. The DRIVER acts on ^Y/^C when typed (type-ahead discarded, an outstanding read ended SS$_ABORT) and raises the substrate interrupt DCL takes them as (SIGINT / SIGQUIT to the line's foreground group) -- not yet an AST. ^O and ^T are not out-of-band yet."}
  - {id: tt$carriage-control, kind: feature, status: absent, authenticity: n/a, vms: "VMS record carriage control on terminal output (implied-CC prefix/suffix, the <CR><NUL> prompt forms the console shows)", notes: "rd vms-fc4: nearly every keystroke-oracle step still differs here; needs lab $QIO probes to pin each rule, not inference"}
  - {id: tt$broadcast-redisplay, kind: feature, status: absent, authenticity: n/a, vms: "A broadcast ($BRKTHRU / REPLY) mid-read is written on its own lines and the prompt + partial line redisplayed", notes: "rd vms-53a"}
  - {id: tt$command-recall, kind: feature, status: absent, authenticity: n/a, vms: "DCL command recall through the terminal read (up-arrow / ^B / down-arrow)", notes: "rd vms-eb3d"}
  - {id: sys$_other, kind: routine, status: absent, authenticity: n/a, vms: "Remaining SYS$ I/O channel/QIO services beyond assign/dassgn/qio/qiow/device_scan (VMS ships ~10 total for the QIO/channel surface)"}
