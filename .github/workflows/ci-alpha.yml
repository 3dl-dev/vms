  #
  # HEAVY-EMULATOR TIER (schedule || workflow_dispatch), like alpha-boot-login:
  # a full Alpha cross-build + ~66-suite qemu-system-alpha run is ~45-60 min, off
  # the per-PR path. Conductor fires workflow_dispatch on the frozen SHA for the
  # green-by-SHA reap; nightly schedule catches drift on main.
  # -----------------------------------------------------------------------
  alpha-syssvc-suite:
    name: OVMX/Alpha public sys$ API tier RUNS LP64 on qemu-system-alpha, no-new-vs-baseline (vms-341)
    needs: changes
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.vax_p4_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build the alpha-linux-gnu cross toolchain image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-alpha
          file: tools/cross-alpha/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-alpha:latest
          cache-from: type=gha,scope=cross-alpha
          cache-to: type=gha,mode=max,scope=cross-alpha

      - name: "sys tier gate — boot qemu-system-alpha, run the whole test_syssvc_*/test_imgact_* suite over /dev/vms, assert no NEW failure beyond the documented environmental baseline"
        run: BASELINE=tools/cross-alpha/alpha-syssvc-baseline.txt tools/cross-alpha/run-syssvc-tests-alpha.sh
