summary: >
  Each VMS language ships a run-time library its compiled code links against
  (I/O, intrinsics, string/array support). None of the language-specific RTLs
  exist in OVMX (grep on origin/main: FOR$/COB$/BAS$/PAS$/PLI$ = 0 files). The
  language-INDEPENDENT RTLs they build on (LIB$/STR$/MTH$/OTS$) are catalogued in
  domain A and are the shared floor these would sit on — itself only partial.
