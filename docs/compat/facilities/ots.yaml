# OTS$ Object-Time-System RTL. See docs/design-compat-surface-register.md.
facility: ots
name: "OTS$ Object-Time-System RTL"
domain: programming-interfaces
vms_ref: "OpenVMS RTL Object Time System (OTS$) Manual"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  The OVMX ots$routines.h declares 44 OTS$ routines; 32 are implemented in
  rtl/ots_routines.c, broadly real.
  Gaps against the VMS OTS$ catalog (the 47 entry points of the RTL_Routines
  OTS$ help library): OTS$CVT_T_x (text to floating), the complex and
  floating OTS$POWxx/DIVCx/MULCx family, OTS$DIV_PK_LONG/SHORT (packed
  decimal), OTS$CNVOUT, OTS$CALL_PROC, OTS$JUMP_TO_BPV. (Rows once listed for
  OTS$CVT_T_P, OTS$CVT_P_T and an OTS$CMP_* family were removed 2026-10-21: no
  such routines exist in that catalog.)
last_reviewed: 2026-10-18
items:
  - {id: ots$cvt_l_ti, kind: routine, status: implemented, authenticity: real, vms: "Convert longword to trimmed integer string", evidence: src/libvms/rtl/ots_routines.c}
  - {id: ots$cvt_ti_l, kind: routine, status: implemented, authenticity: real, vms: "Convert trimmed integer string to longword", evidence: src/libvms/rtl/ots_routines.c}
  - {id: ots$cvt_l_tz, kind: routine, status: implemented, authenticity: real, vms: "Convert longword to zero-filled string", evidence: src/libvms/rtl/ots_routines.c}
  - {id: ots$cvt_l_to, kind: routine, status: implemented, authenticity: real, vms: "Convert longword to octal string", evidence: src/libvms/rtl/ots_routines.c}
  - {id: ots$_other_implemented, kind: routine, status: implemented, authenticity: real, vms: "Remaining implemented OTS$ numeric<->string conversion routines beyond the four named above (32 of the 44 declared routines are implemented)", evidence: src/libvms/rtl/ots_routines.c}
  - {id: ots$scopy_dxdx, kind: routine, status: implemented, authenticity: real, vms: "Copy string from any descriptor to any descriptor", evidence: src/libvms/rtl/ots_routines.c, notes: "Wraps the LIB$ string-descriptor engine (lib$scopy_*, lib$sget1_dd, lib$sfree1_dd); untransferred-byte count is the OTS return value. Exercised by tests/libvms/test_corpus_surface.c."}
  - {id: ots$scopy_r_dx, kind: routine, status: implemented, authenticity: real, vms: "Copy string by reference to a descriptor", evidence: src/libvms/rtl/ots_routines.c, notes: "Wraps the LIB$ string-descriptor engine (lib$scopy_*, lib$sget1_dd, lib$sfree1_dd); untransferred-byte count is the OTS return value. Exercised by tests/libvms/test_corpus_surface.c."}
  - {id: ots$sfree1_dd, kind: routine, status: implemented, authenticity: real, vms: "Free one dynamic descriptor", evidence: src/libvms/rtl/ots_routines.c, notes: "Wraps the LIB$ string-descriptor engine (lib$scopy_*, lib$sget1_dd, lib$sfree1_dd); untransferred-byte count is the OTS return value. Exercised by tests/libvms/test_corpus_surface.c."}
  - {id: ots$sfreen_dd, kind: routine, status: implemented, authenticity: real, vms: "Free N dynamic descriptors", evidence: src/libvms/rtl/ots_routines.c, notes: "Wraps the LIB$ string-descriptor engine (lib$scopy_*, lib$sget1_dd, lib$sfree1_dd); untransferred-byte count is the OTS return value. Exercised by tests/libvms/test_corpus_surface.c."}
