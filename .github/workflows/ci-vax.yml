name: CI / VAX / NetBSD-vax

# Sibling of ci.yml, split out by vms-1af (ci.yml was ~511KB, over GitHub's
# silent ~512000-byte non-comment workflow-file ceiling that produces
# conclusion=startup_failure with ZERO jobs and no pull_request run at all --
# see rd vms-1af / vms-e18e). Triggers, job names, and the needs-graph are
# carried over unchanged from the corresponding slice of the old ci.yml; only
# the shared `changes` path-filter job is now factored into the reusable
# ci-changes.yml (see that file's header) instead of being duplicated in
# every domain file. See ci-core-gates.yml for the per-PR/heavy-tier split
# rationale (vms-fb8) and the P4-only fast-path (vms-6e10), both of which
# apply identically here via the same `vax_p4_only` input and the same `if:`
# conditions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      vax_p4_only:
        description: 'P4-only fast-path: run only the VAX substrate chain + the P4 activation gate, skip the full heavy matrix (rd vms-6e10)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml


  # -----------------------------------------------------------------------
  # netbsd-vax-simh (vms-0041, epic vms-8e8 "OVMX/NetBSD SYSKRNL")
  #
  # The NetBSD/vax analogue of the QEMU executive jobs. There is no
  # qemu-system-vax (docs/design-ovmx-netbsd-syskrnl.md sec 6), so NetBSD/vax
  # boots under SIMH -- the same emulator the OpenVMS VAX labs use. This job
  # boots a REAL NetBSD/vax under SIMH and asserts `uname -srm` == the pinned
  # "NetBSD <ver> vax"; the negctl step proves the assertion can go red. It is
  # the proving ground P3/P4 of the epic build on. BUILD/TEST tooling, not a
  # runtime (Rule 9 / docs/runtime-target.md) -- SIMH is emulation, nothing runs
  # on the host.
  #
  # GATED like the heavy QEMU tiers: on push/merge_group/schedule the path
  # filter forces netbsd_vax=true so the full job runs; on a PR it runs only when
  # tests/lab-vax/** (or the workflow) changed, so ordinary PRs don't pay for it.
  #
  # INSTALL/BOOT SPLIT + CACHE. Installing NetBSD/vax on an emulated VAX is slow
  # (tens of minutes -- a ~1980s CPU under emulation). The install runs ONCE and
  # its output (the SIMH disk wd0.img + the verified ISO) is cached under
  # .boot-cache/lab-vax, keyed on the pinned NetBSD version + SIMH ref + anita
  # ref + the harness files. A cache hit makes the "install" step an instant
  # no-op and only the fast boot+assert steps run; a cache miss (first nightly,
  # or after a pin bump) pays the install once and actions/cache stores the disk
  # for subsequent runs.
  #
  # SIMH is a pure software VAX interpreter (no KVM needed), so it runs on a
  # stock ubuntu-latest runner -- only slowly. The cold-cache install is the one
  # heavy cost; if a GitHub-hosted runner cannot complete the install within the
  # job timeout, populate the cache on a capable/self-hosted runner (or prime it
  # from a local `tests/lab-vax/run-local.sh install`) and let this job restore
  # it. The steps below never stub the proof: smoke actually boots + asserts, and
  # a failure fails the job.
  # -----------------------------------------------------------------------
  netbsd-vax-simh:
    name: NetBSD/vax boots under SIMH (vms-0041)
    needs: changes
    # vms-fb8: SIMH boots STOCK NetBSD/vax (TCG, no OVMX source in the
    # smoke) and VAX has no KVM -- 312s of un-accelerable emulation. Like
    # the heavy QEMU e2e, run it on NON-PR events only; the ILP32 width
    # proof stays per-PR via the elf32-vax cross-compile jobs.
    # vms-6e10 KEEPER: intentionally NOT p4-only-gated -- this is the VAX
    # substrate chain the P4 fast-path exists to run.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the installed NetBSD/vax disk + verified ISO
        uses: actions/cache@v4
        with:
          path: .boot-cache/lab-vax
          # Bump implicitly via the pinned strings + harness hash. A NetBSD/SIMH/
          # anita pin change or an entrypoint/Dockerfile change invalidates the
          # cache and forces a fresh, reproducible install.
          key: lab-vax-netbsd10.1-simh2e0d51e-anitav2_18-${{ hashFiles('tests/lab-vax/Dockerfile', 'tests/lab-vax/entrypoint.sh') }}

      - name: Build the lab-vax image
        run: docker build -f tests/lab-vax/Dockerfile -t ovmx-vax-lab tests/lab-vax

      - name: Populate the cache (install NetBSD/vax once; no-op on a cache hit)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab install

      - name: Smoke — boot the cached disk and assert uname -srm is NetBSD/vax
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab smoke

      - name: Negative control — the uname assertion must be able to FAIL
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab negctl

  # -----------------------------------------------------------------------
  # netbsd-vax-substrate-prime (rd vms-e77, parent vms-bde). THE ONE WRITER of
  # the shared OVMX/vax substrate cache. It builds the SIMH-VAX modular kernel
  # (netbsd-OVMX) + the OVMX substrate (STARTUP.EXE, vms.kmod) ONCE per
  # source-state via a REAL green `run-boot.sh sysboot' (build the substrate,
  # boot NetBSD/vax under SIMH, master the OVMX system volume, boot PAST the
  # installed-system gate to PROVISION.EXE + assert) and SAVEs boot-artifacts/
  # + the modular-kernel marker. Every SIMH consumer job below RESTORES this
  # cache read-only instead of rebuilding the ~7.5-min kernel itself.
  #
  # CORRECTNESS CRUX (rd vms-e77): the cache key hashes EVERY input that feeds
  # the built substrate binaries -- the pinned NetBSD version, run-boot.sh, the
  # cross-vax build scripts + Dockerfile + vendored tarballs, and the full
  # src/{kernel-netbsd,kernel-core,ovmx_init} source trees -- so ANY
  # substrate-source change busts the key and forces a fresh build. A stale
  # kernel silently reused across a source change would give FALSE test results.
  # Because run-boot.sh reuses boot-artifacts/netbsd-OVMX + STARTUP.EXE/vms.kmod
  # WHEN PRESENT (it does not re-derive freshness from source), a restore-keys
  # PREFIX hit (an OLDER substrate) would otherwise be reused and then re-SAVED
  # under the new exact key -- canonising a stale substrate. The guard step
  # below DISCARDS any inexact (restore-keys) restore so the prime always
  # rebuilds fresh for a new source-state; only an EXACT key hit (same sources)
  # is reused warm. Mirrors netbsd-amd64-prime-cache (the amd64 writer).
  # -----------------------------------------------------------------------
  netbsd-vax-substrate-prime:
    name: NetBSD/vax OVMX substrate prime (modular kernel + STARTUP/vms.kmod)
    # vms-e7c5 twin: read-only pull of the PRIVATE prebuilt toolchain image from ghcr.
    permissions:
      packages: read
      contents: read
    needs: [changes, netbsd-vax-simh]
    # vms-6e10 KEEPER: intentionally NOT p4-only-gated -- the P4 fast-path's
    # whole purpose is to run this substrate prime (and the P4 gate below it).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The full NetBSD src tree + build.sh obj/tools are large, rebuildable scratch
    # -> keep them OUT of the disk cache (a literal /tmp path).
    env:
      KBUILD_DIR: /tmp/ovmx-vax-kbuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore the cached NetBSD/vax disk (primed by netbsd-vax-simh)
        uses: actions/cache/restore@v4
        with:
          path: .boot-cache/lab-vax
          key: lab-vax-netbsd10.1-simh2e0d51e-anitav2_18-${{ hashFiles('tests/lab-vax/Dockerfile', 'tests/lab-vax/entrypoint.sh') }}

      # THE ONE WRITER of the shared substrate cache (full actions/cache:
      # restore + save). Same key/path the restore-only consumer jobs use. The
      # key hashes EVERY input that feeds the built substrate binaries, so any
      # substrate-source or NetBSD-pin change busts it (correctness crux).
      - name: Cache the OVMX/vax substrate (modular kernel + STARTUP.EXE + vms.kmod) — WRITER
        id: substrate_cache
        uses: actions/cache@v4
        with:
          path: |
            .boot-cache/lab-vax/boot-artifacts
          key: vax-substrate-netbsd10.1-${{ hashFiles('tests/netbsd/netbsd_version.env', 'tests/lab-vax/run-boot.sh', 'tools/cross-vax/build-vax-modular-kernel.sh', 'tools/cross-vax/build-ovmx-init-vax.sh', 'tools/cross-vax/build-devvms-vax.sh', 'tools/cross-vax/Dockerfile', 'tools/cross-vax/*.tar.xz', 'src/kernel-netbsd/**', 'src/kernel-core/**', 'src/ovmx_init/**') }}
          restore-keys: |
            vax-substrate-netbsd10.1-

      # CORRECTNESS GUARD (rd vms-e77): cache-hit is 'true' ONLY on an exact key
      # match (identical substrate sources). A restore-keys PREFIX hit (an older
      # substrate) or a total miss both leave cache-hit != 'true'. run-boot.sh
      # reuses boot-artifacts/* WHEN PRESENT, so an older substrate restored via
      # the prefix would be reused and re-SAVED under the new exact key. Discard
      # it here so the prime always rebuilds fresh for a changed source-state;
      # an exact hit (same sources) is kept and reused warm.
      - name: Discard any inexact (restore-keys) substrate so the prime rebuilds fresh
        if: steps.substrate_cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .boot-cache/lab-vax/boot-artifacts \
                 .boot-cache/lab-vax/.ovmx-modular-kernel-installed
          echo "inexact substrate restore discarded — prime will rebuild the substrate from source"

      - name: Build the lab-vax image (SIMH + anita)
        run: docker build -f tests/lab-vax/Dockerfile -t ovmx-vax-lab tests/lab-vax

      # vms-e7c5 twin: PULL the source-hash-keyed prebuilt toolchain image from
      # ghcr (zero ftp.gnu.org fetch). SOURCE_HASH is the exact same
      # `git ls-files -s | sha256sum` over tools/cross-vax/{Dockerfile,*.tar.xz}
      # that the vax-toolchain-image build-push job uses, so the tag matches the
      # current sources. A missing tag (not yet seeded / registry hiccup) cleanly
      # FALLS THROUGH to the gha-cached build below (BUILD_FALLBACK=1). Tags the
      # result ovmx-cross-vax:latest either way, so downstream steps are unchanged.
      - name: Pull the prebuilt vax--netbsdelf toolchain image (source-hash tag) or fall back to build
        env:
          GHCR_IMG: ghcr.io/3dl-dev/ovmx-cross-vax
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s \
            tools/cross-vax/Dockerfile \
            'tools/cross-vax/*.tar.xz' \
            | sha256sum | cut -c1-16)
          echo "SOURCE_HASH=$SOURCE_HASH"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$GHCR_IMG:$SOURCE_HASH"; then
            docker tag "$GHCR_IMG:$SOURCE_HASH" ovmx-cross-vax:latest
            echo "PULLED prebuilt toolchain image $GHCR_IMG:$SOURCE_HASH (no gnu.org fetch)"
          else
            echo "no prebuilt image for $SOURCE_HASH — falling back to a gha-cached source build"
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Build the vax--netbsdelf cross toolchain image (gha layer cache)
        if: env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      # THE PRIME PROOF + WRITER PAYLOAD: a REAL green sysboot. This builds the
      # full substrate (cross_build -> build_kernel -> master_system_volume ->
      # ensure_modular_kernel -> make_boot_copy -> ensure_boot_install) into
      # boot-artifacts/ + touches the modular-kernel marker, then boots NetBSD/vax
      # under SIMH PAST the installed-system gate to the PROVISION.EXE exec and
      # asserts it. Not stubbed: if it fails the prime FAILS and actions/cache
      # SAVEs nothing (save only runs on job success) -- no bad cache is stored.
      - name: "Prime — build the OVMX/vax substrate and prove it with a REAL boot to PROVISION.EXE"
        run: tests/lab-vax/run-boot.sh sysboot

  # -----------------------------------------------------------------------
  # netbsd-vax-devvms (rd vms-f78bb, parent vms-476, epic vms-8e8; P4-B)
  #
  # The RUNTIME proof one rung above netbsd-vax-simh: not just "NetBSD/vax boots"
  # but "the OVMX EXECUTIVE runs on it". It boots the SAME cached NetBSD/vax disk
  # under SIMH, cross-builds the OVMX `vms' kernel module + userspace probe for
  # elf32-vax, DELIVERS them into the guest on a second CD, `modload's the module,
  # mknod's /dev/vms, and asserts a version/ping ioctl round-trips through the
  # real in-kernel /dev/vms (kif_transport_netbsd.c) -> "PROBE: PING OK". Plus the
  # INV-6 module-absent honest-failure control and the P4B_SKIP_LOAD teeth check.
  # The VAX analogue of the NetBSD/amd64 P2b job. BUILD/TEST tooling, not a
  # runtime (Rule 9): SIMH is emulation; nothing runs on the host.
  #
  # GATING: NIGHTLY (schedule) + manual (workflow_dispatch) ONLY -- NOT per-PR.
  # SIMH/vax is slow + disk-heavy; the per-PR value for this substrate is the
  # fast build-only cross-compile gate (exec-netbsd-vax, B1, rd vms-20b9) which
  # already runs per-PR. This job proves BEHAVIOUR and tolerates the slow TCG
  # wall-clock because nothing waits on it -- the same split the amd64 P2b/P2c
  # jobs use (design-p4 sec 6).
  #
  # It `needs' netbsd-vax-simh so that job primes the shared 10.1 disk cache
  # first; this job restores it and NEVER reinstalls in the hot path (design-p4
  # sec 5). run-devvms.sh wraps every SIMH invocation in a hard timeout.
  # -----------------------------------------------------------------------
  # -----------------------------------------------------------------------
  # vax-toolchain-image (vms-e7c5 twin for VAX): build ONCE, push to ghcr, keyed
  # by a hash of the toolchain SOURCES — the "once and for all" fix for the
  # recurring VAX-gate ftp.gnu.org flake, mirroring the alpha-toolchain-image job
  # (#804) exactly.
  #
  # ROOT CAUSE: every VAX gate below `docker build`s the vax--netbsdelf cross
  # toolchain image (tools/cross-vax/Dockerfile) from scratch on a gha-cache
  # miss, and that build fetched binutils-2.42 + gcc-13.3.0 from ftp.gnu.org. A
  # gnu.org outage HARD-FAILS gates that have nothing to do with the toolchain
  # sources (the cut-release VAX artifact build just died on
  # `wget binutils-2.42.tar.xz -> exit 4`). binutils is now VENDORED
  # (tools/cross-vax/binutils-2.42.tar.xz, SHA256-pinned) and gcc is a hardened
  # SHA256-checked mirror fetch, but a from-scratch image build is still a
  # network dependency we can eliminate for the gates.
  #
  # FIX: this job builds the image and PUSHES it to a PRIVATE ghcr package,
  # tagged by SOURCE_HASH = a 16-hex digest over the committed content of the
  # toolchain sources (the Dockerfile + the vendored *.tar.xz) via
  # `git ls-files -s | sha256sum`. Committed-content-based, so the tag CI
  # computes here and the tag the gates compute below are identical for the same
  # sources. The gates PULL that tag (zero gnu.org) and only fall back to
  # building if the tag is missing. A toolchain bump -> new hash -> this job
  # builds + pushes the new image (path-filtered on the sources; forced true on
  # any non-PR event; workflow_dispatch seeds the very first image manually while
  # gnu.org is up). Self-contained: pushes with the built-in GITHUB_TOKEN
  # (packages: write) — no external secret. The package is PRIVATE; the gates
  # read it with GITHUB_TOKEN (packages: read).
  # -----------------------------------------------------------------------
  vax-toolchain-image:
    name: vax-toolchain-image (vms-e7c5 twin)
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.vax_toolchain == 'true') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.vax_p4_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute SOURCE_HASH over the toolchain sources
        id: srchash
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s \
            tools/cross-vax/Dockerfile \
            'tools/cross-vax/*.tar.xz' \
            | sha256sum | cut -c1-16)
          echo "SOURCE_HASH=$SOURCE_HASH"
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io (built-in GITHUB_TOKEN)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Builds tools/cross-vax (whose Dockerfile COPYs the VENDORED
      # binutils-2.42.tar.xz so the binutils step is offline; only gcc is fetched,
      # hardened + SHA256-checked). push:true publishes both the source-hash tag
      # and :latest to the PRIVATE ghcr package. gha layer cache keeps an
      # unchanged-source rebuild (e.g. a main push) a cache hit — zero fetch.
      - name: Build and push the vax--netbsdelf cross toolchain image (source-hash + latest)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: true
          tags: |
            ghcr.io/3dl-dev/ovmx-cross-vax:${{ steps.srchash.outputs.source_hash }}
            ghcr.io/3dl-dev/ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

  netbsd-vax-devvms:
    name: /dev/vms live on NetBSD/vax under SIMH — PING (vms-f78bb)
    # vms-e7c5 twin: read-only pull of the PRIVATE prebuilt toolchain image from
    # ghcr (top-level default is contents:read only, no packages).
    permissions:
      packages: read
      contents: read
    needs: [changes, netbsd-vax-simh, netbsd-vax-substrate-prime]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.vax_p4_only == 'true') }}
    runs-on: ubuntu-latest
    # Heavier than the smoke job: on a cold cache it also cross-builds a custom
    # MODULAR NetBSD/vax kernel with build.sh (vax GENERIC omits the module
    # framework), so give it room. Warm netbsd-OVMX cache -> just boot+modload.
    timeout-minutes: 180
    # The full NetBSD src tree + build.sh obj/tools are large, rebuildable scratch
    # -> keep them OUT of the disk cache (a literal /tmp path; the `runner'
    # context is not available in a job-level env).
    env:
      KBUILD_DIR: /tmp/ovmx-vax-kbuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore the cached NetBSD/vax disk (primed by netbsd-vax-simh)
        uses: actions/cache/restore@v4
        with:
          path: .boot-cache/lab-vax
          key: lab-vax-netbsd10.1-simh2e0d51e-anitav2_18-${{ hashFiles('tests/lab-vax/Dockerfile', 'tests/lab-vax/entrypoint.sh') }}

      # rd vms-e77: RESTORE the shared OVMX/vax substrate (modular kernel +
      # STARTUP.EXE + vms.kmod) built ONCE by netbsd-vax-substrate-prime. Read-
      # only (this job never writes the cache). The key hashes every substrate-
      # source input + the NetBSD pin, so any substrate change busts it and no
      # stale kernel is ever silently reused across a source change (rd vms-e77).
      - name: Restore the shared OVMX/vax substrate (modular kernel + STARTUP/vms.kmod, restore-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            .boot-cache/lab-vax/boot-artifacts
          key: vax-substrate-netbsd10.1-${{ hashFiles('tests/netbsd/netbsd_version.env', 'tests/lab-vax/run-boot.sh', 'tools/cross-vax/build-vax-modular-kernel.sh', 'tools/cross-vax/build-ovmx-init-vax.sh', 'tools/cross-vax/build-devvms-vax.sh', 'tools/cross-vax/Dockerfile', 'tools/cross-vax/*.tar.xz', 'src/kernel-netbsd/**', 'src/kernel-core/**', 'src/ovmx_init/**') }}
          restore-keys: |
            vax-substrate-netbsd10.1-

      - name: Build the lab-vax image (SIMH + anita)
        run: docker build -f tests/lab-vax/Dockerfile -t ovmx-vax-lab tests/lab-vax

      # vms-e7c5 twin: PULL the source-hash-keyed prebuilt toolchain image from
      # ghcr (zero ftp.gnu.org fetch). SOURCE_HASH is the exact same
      # `git ls-files -s | sha256sum` over tools/cross-vax/{Dockerfile,*.tar.xz}
      # that the vax-toolchain-image build-push job uses, so the tag matches the
      # current sources. A missing tag (not yet seeded / registry hiccup) cleanly
      # FALLS THROUGH to the gha-cached build below (BUILD_FALLBACK=1). Tags the
      # result ovmx-cross-vax:latest either way, so downstream steps are unchanged.
      - name: Pull the prebuilt vax--netbsdelf toolchain image (source-hash tag) or fall back to build
        env:
          GHCR_IMG: ghcr.io/3dl-dev/ovmx-cross-vax
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s \
            tools/cross-vax/Dockerfile \
            'tools/cross-vax/*.tar.xz' \
            | sha256sum | cut -c1-16)
          echo "SOURCE_HASH=$SOURCE_HASH"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$GHCR_IMG:$SOURCE_HASH"; then
            docker tag "$GHCR_IMG:$SOURCE_HASH" ovmx-cross-vax:latest
            echo "PULLED prebuilt toolchain image $GHCR_IMG:$SOURCE_HASH (no gnu.org fetch)"
          else
            echo "no prebuilt image for $SOURCE_HASH — falling back to a gha-cached source build"
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Build the vax--netbsdelf cross toolchain image (gha layer cache)
        if: env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=gha,scope=cross-vax
          cache-to: type=gha,mode=max,scope=cross-vax

      - name: Prove — /dev/vms live on NetBSD/vax + PING (cross-build, custom MODULAR kernel, modload, ioctl)
        run: tests/lab-vax/run-devvms.sh prove

      - name: Negative control — skipping modload must redden the PING assertion
        run: tests/lab-vax/run-devvms.sh negctl

  # -----------------------------------------------------------------------
  # netbsd-vax-eflag (rd vms-4e7, parent vms-476, epic vms-8e8; P4-E;
  # blocked-on vms-f78bb). Scope is EVENT FLAGS ONLY -- the other boot-required
  # facilities (proctab/lnm/mbx/ast/access) are the separate vms-945e.
  #
  # The RUNTIME proof one rung above netbsd-vax-devvms's single-ioctl PING: not
  # just "one ioctl round-trips" but "a COMMON event flag cluster set by one OS
  # process is observed, and a blocked waiter is WOKEN, by a genuinely
  # DIFFERENT process" -- the INV-6-decisive property a per-process userspace
