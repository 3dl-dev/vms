  - {id: ssdef$_codes, kind: status-block, status: partial, authenticity: real, vms: "SS$_ condition-value constants (VMS ships ~500+)", evidence: src/libvms/include/ssdef.h, notes: "133 defined (re-counted 2026-10-21), every value checked against the V7.3/V8.4 $SSDEF by tools/compat/check_oracle_constants.py; common/executive subset, long tail absent"}
  - {id: rmsdef$_codes, kind: status-block, status: partial, authenticity: real, vms: "RMS$_ condition-value constants (VMS ships ~200+)", evidence: src/libvms/include/rmsdef.h, notes: "90 defined (re-counted 2026-10-21), values checked against the oracle $RMSDEF by tools/compat/check_oracle_constants.py"}
  - {id: sys$getmsg_text_table, kind: routine, status: implemented, authenticity: real, vms: "Message text table consumed by SYS$GETMSG (VMS ships real text for ~176 SS$+RMS$ codes)", evidence: src/libvms/syssvc/sys_msg.c, verified_against: "semantic oracle fao family (docs/oracle/semantics/fao/, MSG.* cases: ident/severity/facility/text flags, shared vs facility-specific numbers, NOMSG, short buffer): 59 cases, 0 differ in CI (ci-release-e2e run 39562817462, 2026-10-21)", notes: "rd vms-546. $GETMSG answers from the catalog observed on OpenVMS Alpha V8.4 (docs/oracle/messages/alpha84-msgcat*.txt), compiled in as src/libvms/include/ovmx_msgcat.inc by tools/oracle/messages/gen_msgcat.py (ctest msgcat_generated_current fails on drift): 1031 SYSTEM and 271 RMS messages among 1687 entries, plus CLI, SMG and LIB facility messages. A message of an uncaptured facility is NOMSG with SS$_MSGNOTFND, never invented text. Re-census 2026-10-21: the row described the retired 51-entry known_codes[] table."}
