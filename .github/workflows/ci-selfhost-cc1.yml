name: CI / Self-host cc1

# rd vms-b85 (gate vms-465, epic vms-678): GCC's cc1 BUILT ON OVMX/Alpha by the
# native toolchain, in CI. tools/cross-alpha/run-module-gp-activation-alpha.sh
# cc1build-gate runs BUILD_CC1.COM -- the 724 compiles, 8 archives and one link
# GCC's own Makefiles run for cc1 -- on qemu-system-alpha + the real /dev/vms
# executive. Under TCG that is hours, past one runner's 6 h cap, so it is split:
#   shard k of N  -- its own OVMX boot compiles every Nth source (CC1B_SHARD),
#                    asserts each compile succeeded, and reads the objects off
#                    its ODS-5 volume (vmsfs_master --ods5 extract);
#   link          -- the shards' objects are staged as GCCOBJ:[...]; one boot
#                    finds every one of them (FOUND), makes the archives with
#                    AR, links cc1 with GXX -> LINK, and the cc1 built there
#                    compiles hello.c -O0/-O2 to the cross cc1's assembly
#                    (DCL TYPE, assert_cc1b).
# Heavy tier only (docs: the iteration-speed CI policy): nightly + dispatch,
# never on a pull request or the merge queue.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'

permissions:
  contents: read
  packages: read   # GHCR mirror of the pinned base images (.github/actions/setup-buildx)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CC1B_SHARDS: 8

jobs:
  shard:
    name: "cc1 built on OVMX/Alpha -- shard ${{ matrix.k }} of 8 compiles its sources with the native toolchain (vms-b85)"
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build the alpha-linux-gnu cross toolchain image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-alpha
          file: tools/cross-alpha/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-alpha:latest
          cache-from: type=gha,scope=cross-alpha
          # cache-to omitted: ci-alpha.yml:alpha-boot-login is scope cross-alpha's one writer (rd vms-14da)

      - name: Build the alpha-dec-vms cross toolchain image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-alpha-vms
          file: tools/cross-alpha-vms/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-alpha-vms:latest
          cache-from: type=gha,scope=cross-alpha-vms
          # cache-to omitted: ci-alpha.yml:alpha-toolchain-image is scope cross-alpha-vms's one writer (rd vms-14da)

      - name: Restore the stage-2 C/C++ toolchain
        uses: actions/cache@v4
        with:
          path: .cxxtc
          key: alpha-cxx-tc-${{ hashFiles('tools/cross-alpha-vms/cxx/**', 'tools/cross-alpha-vms/patches/**', 'tools/cross-alpha-vms/Dockerfile', 'tools/cross-alpha-vms/musl-arch/**', 'src/libvms/include/**', 'src/vmslink/decc_crtl_map.txt', 'src/vmslink/libvms_shr.vec') }}

      - name: Restore the host GCC + GNU as images (keyed on everything they are built from)
        uses: actions/cache@v4
        with:
          path: |
            .boot-cache/alpha-modgp-gate/hostgcc/host-gcc/*.exe
            .boot-cache/alpha-modgp-gate/hostgcc/host-gcc/gccsrc.tar
            .boot-cache/alpha-modgp-gate/hostas/host-as/out/as.exe
          key: alpha-hostgcc-as-${{ hashFiles('tools/cross-alpha-vms/selfhost/**', 'tools/cross-alpha-vms/cxx/**', 'tools/cross-alpha-vms/patches/**', 'tools/cross-alpha-vms/Dockerfile', 'tools/cross-alpha-vms/musl-arch/**', 'src/libvms/**', 'src/vmslink/**', 'src/vmsrms/**') }}

      - name: "cc1build shard ${{ matrix.k }}/8 -- compile on qemu-system-alpha + /dev/vms; read the objects off the volume"
        env:
          OVMX_CXX_TOOLCHAIN: ${{ github.workspace }}/.cxxtc
          CC1B_SHARD: ${{ matrix.k }}/8
          CC1B_OBJ_OUT: ${{ github.workspace }}/.cc1b-out
          CC1B_BOOT_TIMEOUT: "18000"
        run: tools/cross-alpha/run-module-gp-activation-alpha.sh cc1build-gate
      - name: Keep the shard's objects
        uses: actions/upload-artifact@v4
        with:
          name: cc1b-shard-${{ matrix.k }}
          path: .cc1b-out
          if-no-files-found: error
          retention-days: 3
      - name: Keep the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc1b-shard-${{ matrix.k }}-log
          path: .boot-cache/alpha-modgp-gate/boot/modgpA.log
          if-no-files-found: ignore
          retention-days: 7

  link:
    name: "cc1 built on OVMX/Alpha -- AR + LINK from the shards' objects; the built cc1 writes the cross cc1's assembly for hello.c (vms-465)"
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build the alpha-linux-gnu cross toolchain image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-alpha
          file: tools/cross-alpha/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-alpha:latest
          cache-from: type=gha,scope=cross-alpha
          # cache-to omitted: ci-alpha.yml:alpha-boot-login is scope cross-alpha's one writer (rd vms-14da)

      - name: Build the alpha-dec-vms cross toolchain image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-alpha-vms
          file: tools/cross-alpha-vms/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-alpha-vms:latest
          cache-from: type=gha,scope=cross-alpha-vms
          # cache-to omitted: ci-alpha.yml:alpha-toolchain-image is scope cross-alpha-vms's one writer (rd vms-14da)

      - name: Restore the stage-2 C/C++ toolchain
        uses: actions/cache@v4
        with:
          path: .cxxtc
          key: alpha-cxx-tc-${{ hashFiles('tools/cross-alpha-vms/cxx/**', 'tools/cross-alpha-vms/patches/**', 'tools/cross-alpha-vms/Dockerfile', 'tools/cross-alpha-vms/musl-arch/**', 'src/libvms/include/**', 'src/vmslink/decc_crtl_map.txt', 'src/vmslink/libvms_shr.vec') }}

      - name: Restore the host GCC + GNU as images (keyed on everything they are built from)
        uses: actions/cache@v4
        with:
          path: |
            .boot-cache/alpha-modgp-gate/hostgcc/host-gcc/*.exe
            .boot-cache/alpha-modgp-gate/hostgcc/host-gcc/gccsrc.tar
            .boot-cache/alpha-modgp-gate/hostas/host-as/out/as.exe
          key: alpha-hostgcc-as-${{ hashFiles('tools/cross-alpha-vms/selfhost/**', 'tools/cross-alpha-vms/cxx/**', 'tools/cross-alpha-vms/patches/**', 'tools/cross-alpha-vms/Dockerfile', 'tools/cross-alpha-vms/musl-arch/**', 'src/libvms/**', 'src/vmslink/**', 'src/vmsrms/**') }}

      - name: The shards' objects
        uses: actions/download-artifact@v4
        with:
          pattern: cc1b-shard-[0-9]
          path: .cc1b-in
          merge-multiple: true
      - name: "cc1build link -- archives, cc1 linked, hello.c compared, on qemu-system-alpha + /dev/vms"
        env:
          OVMX_CXX_TOOLCHAIN: ${{ github.workspace }}/.cxxtc
          CC1B_OBJ_IN: ${{ github.workspace }}/.cc1b-in/gccobj
          CC1B_BOOT_TIMEOUT: "18000"
        run: tools/cross-alpha/run-module-gp-activation-alpha.sh cc1build-gate
      - name: Keep the built cc1 and the boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc1b-link-log
          path: .boot-cache/alpha-modgp-gate/boot/modgpA.log
          if-no-files-found: ignore
          retention-days: 7
