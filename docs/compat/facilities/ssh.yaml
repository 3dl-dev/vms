# Source of truth for the SSH row of the Compatibility Surface Register.
# SSH is a VSI OpenVMS surface (OpenSSH shipped as part of TCP/IP Services). It is
# wholly downstream of TCP/IP Services — there is no stack, so there is no SSH.
# sshd comes along when TCP/IP Services lands; init-wiring is not a surface.
facility: ssh
name: "SSH remote login"
domain: networking
vms_ref: "VSI OpenVMS TCP/IP Services — SSH server (OpenSSH port)"
scope_1_0: in
plan_ref: vms-67f
summary: >
  SSH login to an authenticated interactive (DCL) session, as VSI OpenVMS
  provides through TCP/IP Services. Absent because OVMX has no TCP/IP stack yet;
  it is entirely gated on the networking lane and arrives with it.
last_reviewed: 2026-08-13
items:
  - id: ssh$remote-login
    kind: feature
    status: absent
    authenticity: real
    scope_1_0: in
    vms: "SSH in and get an authenticated interactive DCL/LOGINOUT session"
    evidence: docs/design-tcpip-services-ovmx.md
    notes: >
      No TCP/IP stack, no NIC → SSH does not function. Blocked entirely on TCP/IP
      Services (tcpip-services, vms-67f); sshd comes along when the stack lands.
      Not faked — it simply is not reachable. (Implementation aside for whoever
      lands it: vmsshd code exists but currently runs the session euid=0 with no
      credential drop to the user's UIC — that must be fixed then, the way console
      LOGINOUT already drops identity via vms_kif_setident.)
