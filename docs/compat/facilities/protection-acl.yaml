  - {id: fileprot$delete_bit,   kind: feature, status: stub,        authenticity: advisory,     vms: "Delete (D) protection bit", evidence: "src/kernel-core/vmsfs_acp.c", notes: "vms-165 moved protection enforcement into the ACP (was vmsfs_blkdev.c); D-bit enforcement status needs a compat-refresh re-census against the ACP path"}
  - {id: sys$chkpro,            kind: routine, status: implemented, authenticity: advisory,     vms: "$CHKPRO — compute-only SOGW protection check helper", evidence: src/libvms/syssvc/sys_security.c, notes: "Correct logic, zero OVMX callers — computed but unused, honestly inert"}
