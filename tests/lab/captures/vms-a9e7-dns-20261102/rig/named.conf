// BIND 9 (the alpine "bind" package, upstream named, unmodified) on the server
// host of the vms-a9e7 DNS interop rig: authoritative for lab.test, no
// recursion, every query logged (querylog yes; run with -g, so on stderr -> named.log).
options {
    directory "/var/bind";
    listen-on port 53 { 192.168.77.1; };
    listen-on-v6 { none; };
    recursion no;
    querylog yes;
    allow-query { any; };
    pid-file "/run/named.pid";
};
zone "lab.test" IN {
    type master;
    file "/rig/lab.test.zone";
};
