    notes: "RECEIVE and LOCAL are built (rd vms-94a). A member's cat-0x0b op-0x04 ($CRELNM/$CRELNT/$DELLNM records, grounded against real V7.3 DEFINE/DEASSIGN/CREATE NAME_TABLE) is pulled, applied to the executive's clusterwide tables and answered. A late joiner pulls the database (op 0x05/0x06). Local $CRELNM/$TRNLNM/$DELLNM on LNM$SYSCLUSTER/LNM$CLUSTER_TABLE work on a node in no cluster. NOT built: originating this node's own changes to the other members. A local change while sharing a cluster is refused SS$_UNSUPPORTED rather than made unannounced. Also not built: answering a member's database request (op 0x05) and LNM$SYSTEM's search through LNM$SYSCLUSTER."

