  - {id: sys$dellnm, kind: routine, status: partial, authenticity: real, vms: "Delete a logical name from a table", evidence: src/libvms/syssvc/sys_logical.c, notes: "same LNM$SYSTEM-executive / PROCESS-JOB-GROUP-local split as sys$crelnm"}
