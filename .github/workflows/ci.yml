  # -----------------------------------------------------------------------
  # DCL-native ENDPOINT (pillar vms-ade / bead vms-b65.6) — S1 of self-hosting
  # (vms-116). The REAL src/vmsdcl shell (21 TUs) + src/vmsqueue links as a
  # VMS-native ET_DYN executable via LINK.EXE --executable --use {DECC$SHR + the
  # five OVMX shareables}: a 22-object main() program with the full intra-image
  # reloc set, 139 cross-image imports all bound, and its own single-object TLS.
  # IMGACT.EXE activates it (crt0 recovers argc/argv off the kernel stack) and
  # DCL runs a scripted session (SHOW TIME + A = 2+3 / SHOW SYMBOL A) to VMS-
  # correct output, clean exit. NO ld / NO ld.so — the operator's "all VMS" path.
  # -----------------------------------------------------------------------
  dcl-native:
    name: DCL.EXE VMS-native Link + Activate (self-hosting S1)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Link the real src/vmsdcl into DCL.EXE VMS-native + activate a scripted session through IMGACT.EXE (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/dcl-native DCL_EXPECT_LINK=1
              sh /src/src/imgact/test/run_dcl_native.sh
            '

  # -----------------------------------------------------------------------
  # tcc-object-native — S2 CRUX proof (bead vms-4ba.3, epic vms-4ba "self-host
  # S2: a C compiler as an OVMX image"). Builds stock, UNMODIFIED tinycc
  # (third-party/tcc), compiles hello.c with DEFAULT flags (no -gstabs, no
  # __thread), and asserts hello.o's real shape against the vms-4ba.2 reloc-
  # gap ruling: SHT_RELA-only (no SHT_REL), no ABS32, no TLSLE, printf stays
  # a real CALL26 import (not inlined). Then attempts the full DONE-condition
  # round-trip: LINK.EXE --executable --use {DECC$SHR + the five OVMX
  # shareables} -> HELLO.EXE, activated through IMGACT.EXE, expecting it to
  # print "hello" and exit 0 (mirrors mk_dcl.sh:112-115 / run_dcl_native.sh).
  #
  # GATED BY TCC_EXPECT_LINK (env flag, mirrors DCL_EXPECT_LINK above): set to
  # 1 here (BLOCKING) as of vms-9c1 — LINK.EXE's GOT-slot resolver now resolves
  # tcc's GOT references to DEFINED LOCAL symbols (statics, string-literal labels
  # 'L.n'). Previously tcc's arm64 backend GOT-references EVERY symbol including
  # locally-defined statics (arm64-gen.c arm64_sym(), unconditional for ELF),
  # while LINK.EXE only searched the GLOBAL symbol hash (build_symhash() skips
  # STB_LOCAL binds, link.c:755) — reporting the defined local as an undefined
  # GOT import. vms-9c1 gives every LOCAL-bind GOT reference a PER-OBJECT
  # (obj,sym) slot resolved via placed_addr(), so single-TU HELLO.EXE AND the
  # multi-TU cross-collision case (XTU.EXE, two TUs each with their own local
  # 'L.1') both link and activate. The full DONE-condition round-trip (tcc build
  # -> hello.o/tu*.o -> LINK.EXE --executable -> IMGACT activation) is now a hard
  # gate. Set TCC_EXPECT_LINK=0 only to soften the LINK.EXE step while iterating.
  # -----------------------------------------------------------------------
  tcc-object-native:
    name: tcc Object LINK.EXE Compatibility (S2 crux, musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build stock tcc, compile hello.c + cross-TU objects, LINK.EXE --executable + IMGACT activation (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/tcc-object-native TCC_EXPECT_LINK=1
              sh /src/src/imgact/test/run_tcc_object_native.sh
            '

  # -----------------------------------------------------------------------
  # tcc-native — S2 ENDPOINT proof (bead vms-4ba.4, epic vms-4ba "self-host
  # S2: a C compiler as an OVMX image"). Builds stock, UNMODIFIED tinycc AS a
  # VMS-native EXECUTABLE image (TCC.EXE, via the new src/vmslink/mk_tcc.sh
  # recipe: 11 tcc TUs compiled with the proven freestanding musl CFLAGS,
  # linked via LINK.EXE --executable --use {DECC$SHR + the five OVMX
  # shareables}). IMGACT.EXE activates TCC.EXE (no ld / no ld.so), the
  # ACTIVATED tcc compiles a real hello.c to hello.o, and that hello.o
  # round-trips through the vms-4ba.3 LINK.EXE path into HELLO.EXE, which
  # IMGACT-activates and prints "hello", exit 0.
  #
  # DECC$SHR gained 39 more PROCEDURE universals for this bead (libgcc IEEE-
  # quad long-double helpers + POSIX calls tcc needs) — see mk_decc_shr.sh's
  # vms-4ba.4 comment block. One tcc cross-image reference (`environ`,
  # tccrun.c's `-run` JIT path — dead code for `tcc -c`) is deliberately left
  # as a deferred import (--allow-undefined) rather than exported, because
  # exporting it hits a genuine LINK.EXE gap (universal-vector resolution runs
  # before BSS section placement) that is out of Systems-Engineer file-domain
  # to fix here; mk_tcc.sh hard-asserts the deferred count is exactly 1.
  #
  # TCC_EXPECT_LINK (mirrors DCL_EXPECT_LINK / the tcc-object-native job
  # above): set to 1 here (BLOCKING) — the vms-4ba.3 CRUX (vms-9c1) is closed,
  # so a LINK.EXE failure on TCC.EXE's own build or the hello.o round-trip is
  # a real regression.
  # -----------------------------------------------------------------------
  tcc-native:
    name: TCC.EXE VMS-native Link + Activate (self-hosting S2 endpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build TCC.EXE VMS-native, activate it, compile hello.c -> hello.o, round-trip through LINK.EXE + IMGACT.EXE (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/tcc-native TCC_EXPECT_LINK=1
              sh /src/src/imgact/test/run_tcc_native.sh
            '

  # -----------------------------------------------------------------------
  # tcc-rms — S2 RMS I/O proof (bead vms-4ba.5, epic vms-4ba). Sibling of
  # tcc-native: same six-producer graph + TCC.EXE build (mk_tcc.sh now also
  # compiles the OVMX RMS I/O shim, third-party/tcc/ovmx/ovmx_rms_io.c, and
  # defines OVMX_RMS_IO so tcc's own primary-source read and output-object
  # write route through sys$open/$connect/$get and sys$create/$connect/$put/
  # $close instead of raw open()/read()/write()). Proves the RMS path is
  # actually exercised (a real trace, byte-count cross-check, scratch-file
  # cleanup check — see run_tcc_rms.sh's header) and that the RMS-delivered
  # hello.o still round-trips through LINK.EXE + IMGACT exactly like the
  # vms-4ba.4 raw-POSIX build did.
  # -----------------------------------------------------------------------
  tcc-rms:
    name: TCC.EXE RMS File I/O (sys$open/$get read, sys$create/$put write)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build TCC.EXE with RMS I/O, activate it, compile hello.c -> hello.o via sys$open/$get + sys$create/$put, round-trip through LINK.EXE + IMGACT.EXE (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/tcc-rms TCC_EXPECT_LINK=1
              sh /src/src/imgact/test/run_tcc_rms.sh
            '

  # -----------------------------------------------------------------------
  # tcc-selfhost — S2 FIXPOINT proof (bead vms-4ba.6, epic vms-4ba). The
  # summit: tcc COMPILES tcc INSIDE OVMX. A gcc-built seed TCC.EXE (the only
  # Unix-compiler step, identical to tcc-native) is activated through IMGACT
  # (no gcc, no ld.so) and compiles every one of tcc's 12 TUs — reading each
  # .c and writing each .o through RMS — into a SECOND TCC.EXE (LINK.EXE
  # --executable). That gen-2 compiler then compiles hello.c into a running
  # image ('hello', exit 0), AND recompiles tcc a THIRD time producing objects
  # BYTE-IDENTICAL to gen-2 — the classic self-host fixpoint. The compiler now
  # reproduces itself with no Unix compiler in the loop.
  #
  # The ONE OVMX adaptation that makes tcc-built-tcc work: tcc emits its
  # pointer-initializer tables (tcc_options[] etc.) into a `.data.ro` section
  # created SHF_ALLOC-only (upstream tcc's own linker adds SHF_WRITE at final
  # link via GNU_RELRO; a `tcc -c` object never gets that fixup). OVMX's
  # LINK.EXE applies data-pointer relocations only to WRITABLE sections (gcc
  # dodges this via .data.rel.ro WITH SHF_WRITE), so without the fix every
  # `.data.ro` pointer in a tcc-built binary lands NULL and gen-2 tcc matches
  # no CLI option. Fixed by a define-gated OVMX seam in the vendored tcc
  # (third-party/tcc/src/tccelf.c shf_RELRO, activated by -DOVMX_DATA_RO_WRITABLE
  # in src/vmslink/mk_tcc.sh) — emit `.data.ro` writable, matching gcc's
  # pre-RELRO .data.rel.ro. Entirely in tcc/mk_tcc.sh scope; NOT a link.c change.
  # mk_decc_shr.sh also exports one more libgcc quad helper (__negtf2) that a
  # self-hosted tcc emits where gcc inlined it, keeping gen-2's deferred set to
  # exactly one dead-for-`-c` reference (environ), same as gen-1.
  #
  # TCC_EXPECT_LINK (default 1, BLOCKING — mirrors tcc-native/tcc-rms): a
  # LINK.EXE failure on any generation's build is a real regression.
  # -----------------------------------------------------------------------
  tcc-selfhost:
    name: TCC.EXE Self-Host Fixpoint (tcc compiles tcc inside OVMX, S2 summit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: gen-1 seed TCC.EXE -> gen-1 compiles all tcc TUs under IMGACT -> gen-2 TCC.EXE -> gen-2 compiles+runs hello -> gen-2==gen-3 byte-identity (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make linux-headers >/dev/null
              export CC=gcc WORK=/tmp/tcc-selfhost TCC_EXPECT_LINK=1
              sh /src/src/imgact/test/run_tcc_selfhost.sh
            '
