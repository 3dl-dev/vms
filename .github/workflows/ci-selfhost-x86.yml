  # 'L.1') both link and activate. The full DONE-condition round-trip (tcc build
  # -> hello.o/tu*.o -> LINK.EXE --executable -> IMGACT activation) is now a hard
  # gate. Set TCC_EXPECT_LINK=0 only to soften the LINK.EXE step while iterating.
