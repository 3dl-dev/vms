  # vmslnm+vmsfs+vmsrms-netbsd-vax (rd vms-271, epic vms-8e8, P4-C; CLAUDE.md
  # "Library Build Order": ... libvms -> vmslnm -> vmsfs -> vmsrms -> vmsdcl).
