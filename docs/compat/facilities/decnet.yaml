  - {id: decnet$routing-adjacency, kind: feature, status: implemented, authenticity: real, vms: "Phase IV routing adjacency state machine (DOWN/INITIALIZING/UP) + hello cadence / listen timers", evidence: "src/vmsdecnet/routing/dnet_adjacency.c", notes: "Pure clock-injectable SM over the Hello codec; T3=15s oracle-captured (vms-3be), BCT3MULT spec-derived. Tested tests/vmsdecnet/test_dnet_adjacency.c (rd vms-b15)."}
  - {id: decnet$nsp-transport, kind: protocol, status: implemented, authenticity: real, vms: "NSP transport codec + live logical link — Connect Initiate/Confirm, Link Service (flow-control credit), Data, Ack, teardown PDUs", evidence: "src/vmsdecnet/nsp/dnet_nsp.c", verified_against: "rd vms-a70: a live NSP logical link ran END-TO-END, BIDIRECTIONALLY, against a real OpenVMS VAX V7.3 (tests/lab/captures/decnet-sethost-dcl-20260911/) — CI -> CC -> Link Service credit-grant/ack -> multi-segment Data both directions -> data-ack -> Disconnect Initiate/Confirm clean teardown. Connect Initiate also byte-identical against docs/decnet-provenance-register.md sec 4.6 specimen #3.", notes: "The live transport engine (src/vmsdecnet/engine) NOW drives a real logical link over the datalink; the CC / Link Service (MSGFLG 0x10) / Data / Ack / DI / DC PDUs are all wire-exercised against a real VAX (were previously self-round-trip only). Link Service added rd vms-a70 (the client's post-CC credit grant, ACKNUM from real link state, INV-6). Tested tests/vmsdecnet/test_dnet_nsp.c + test_dnet_link.c (rd vms-6986)."}
  - {id: decnet$task-to-task, kind: feature, status: absent, authenticity: n/a, vms: "Task-to-task DECnet communication (logical-link $QIO / FAL)", evidence: "docs/design-decnet-ovmx.md", scope_1_0: in, notes: "The codecs exist but the engine boundary has not moved — no socket/AF_PACKET engine binds them into a live link."}
  - {id: decnet$ncp, kind: command, status: partial, authenticity: real, vms: "NCP — Network Control Program (node/executor configuration)", evidence: "src/vmsdecnet/ncp/ncp.c", notes: "Real NCP.EXE driving a persisted database: SET/DEFINE NODE, CLEAR/PURGE NODE, SHOW KNOWN NODES, SHOW NODE, SET/SHOW EXECUTOR (ADDRESS/NAME/STATE), and SET/DEFINE/SHOW/CLEAR/PURGE OBJECT (the Session Control object registry — number/name/file, e.g. 42=CTERM, 17=FAL; rd vms-f52, dnet_objectdb), with VMS-faithful SHOW layout and honest errors. Grammar/layout from the public NCP manual (Rule 8). NOT yet: circuits, lines, counters, LOOP, and the SET(volatile)/DEFINE(permanent) split — OVMX keeps one persisted DB per entity today (counters/circuit/reachability state must be read from the live executive, never invented — INV-6). Config-only; it does not itself start the network. AUTHENTICITY NOTE: the node + object databases persist at a Linux host path (/etc/ovmx/decnet/), not through the VMS file layer at SYS$SYSTEM: (NETNODE_REMOTE.DAT etc.) — that faithfulness refinement is tracked separately (rd vms-20e), out of scope here."}
  - {id: decnet$node-database, kind: feature, status: implemented, authenticity: real, vms: "Persisted remote-node database + node NAME<->address resolution", evidence: "src/vmsdecnet/ncp/dnet_nodedb.c", notes: "The NCP node table: add/update/clear, case-insensitive unique node names, ascending-address SHOW ordering, and persistence (atomic save + tolerant load). Provides the name<->address resolution the SET HOST / NODE:: paths need. On-disk format is a documented OVMX plain-text layout at a Linux host path (labelled OVMX choice — NOT VMS NETNODE_REMOTE.DAT binary through SYS$SYSTEM; rd vms-20e tracks moving it behind the VMS file layer). Unit: tests/vmsdecnet/test_dnet_nodedb.c (rd vms-1e9)."}
  - {id: decnet$object-database, kind: feature, status: implemented, authenticity: real, vms: "Persisted DECnet OBJECT database (Session Control object registry: number/name/file)", evidence: "src/vmsdecnet/ncp/dnet_objectdb.c", notes: "The NCP object table managed by SET/DEFINE/SHOW/CLEAR/PURGE OBJECT: add/update keyed by object NUMBER, unique object names, an optional servicing FILE, ascending-number SHOW ordering, persistence (atomic save + tolerant load). The registry of Session Control objects the node offers (42=CTERM, 17=FAL, ...). On-disk format is a documented OVMX plain-text layout at a Linux host path (labelled OVMX choice — NOT the VMS permanent object database binary; the VMS-file-layer move rides rd vms-20e). HONEST SCOPE: access-control fields (USER/PROXY/PASSWORD) and the volatile/permanent SET-vs-DEFINE split are filed follow-ons; this is the CONFIG surface, distinct from the executive's live runtime object dispatch (decnet$netacp-device-face). Library unit + first NCP command-dispatch tests: tests/vmsdecnet/test_dnet_objectdb.c + test_dnet_ncp_object.sh (rd vms-f52)."}
  - {id: decnet$sc-connect, kind: protocol, status: verified, authenticity: real, vms: "DNA Session Control CONNECT message — destination/source end-user descriptors + access-control fields", evidence: "src/vmsdecnet/cterm/dnet_cterm.c", verified_against: "docs/oracle/vax-sethost-cterm.pcap frame 5 (rd vms-558, real OpenVMS VAX V7.3 -> V7.3 SET HOST): the twenty connect-data bytes decode field-for-field and OVMX re-emits them BYTE-IDENTICAL, asserted in tests/vmsdecnet/test_dnet_cterm.c against the specimen array", notes: "Oracle-CORRECTED the #1013 cut, which emitted format 1 for the destination object where the real VAX sends format 0. Establishes the security fact vms-f40 rests on: the access-control fields (RQSTRID/PASSWRD/ACCOUNT) are EMPTY on a real SET HOST, so the carried node::user is PROXY/accounting info and the remote must authenticate fresh. Decoder is fully bounded against attacker-controlled bytes (truncation/over-long/unknown-format all refused) and never retains a wire-supplied password."}
  - {id: decnet$cterm-session-auth, kind: feature, status: partial, authenticity: real, vms: "Inbound SET HOST (Session Control object 42) reaches an AUTHENTICATED LOGINOUT prompt on a virtual terminal (RTAn:)", evidence: "src/vmsdecnet/cterm/dnet_cterm_host.c", notes: "An inbound object-42 connect mints an RTAn: THROUGH THE EXECUTIVE (VMS_IOCTL_TERM_CREATE -> vms_devtab_add_terminal; the executive picks the unit) and creates a process running the real SYS$SYSTEM:LOGINOUT.EXE on it via $CREPRC PRC$M_INTER|PRC$M_LOGINOUT -- the SAME primitive the console login uses (vms-3e9/vms-f881). The daemon holds no credential, spawns nothing, and the carried username reaches no decision; there is no fork/execvp/openpty anywhere above the VMS layer (standing gate tests/integration/test_creprc_session_primitive.sh check 5, both directions + negctl). NOT yet: one session at a time, no CTERM read-solicitation flow (byte-transparent pump), no DCL `SET HOST` client wiring (decnet$set-host), no live-VAX bracket. The authentication proof (challenged, bad credentials REFUSED, $GETDVI RTAn: cross-process) is DECNETD.EXE --cterm-accept-test against the real /dev/vms + real LOGINOUT, run by the shared acceptance battery in the booted image -- it FAILS honestly where the executive is absent (INV-6), it does not degrade to a stub. CTERM FOUNDATION PROTOCOL RE-GROUNDED (rd vms-a70): the CTERM foundation/Bind wire protocol is NO LONGER a facade -- it was re-grounded byte-for-byte on the real oracle (the foundation short-TLV + msgtype-9 envelope codec, host-speaks-first negotiation FSM, NSP link-service credit grant, prompt-gated Read Data) and PROVEN interoperable with a real OpenVMS VAX V7.3 in the OUTBOUND direction: OVMX's SET HOST client drove a full authenticated CTERM session to a live DCL on a real VAX (decnet$set-host, tests/lab/captures/decnet-sethost-dcl-20260911/). This row (the INBOUND server: real VAX -> OVMX object 42 -> OVMX LOGINOUT on RTAn:) stays PARTIAL because the executive session/auth machinery here is real + unit/accept-proven (--cterm-accept-test) but the INBOUND live-VAX bracket (a real VAX initiating SET HOST into OVMX-as-server) is not yet run -- it needs the full booted OVMX-on-VAX executive; tracked as vms-a70 direction B. What IS oracle-proven with a real VAX: Session Control CONNECT + datalink + routing + NSP + the CTERM foundation exchange, all the way to an authenticated remote DCL (decnet$sc-connect + decnet$nsp-transport + decnet$set-host)."}
  - {id: decnet$netacp-device-face, kind: feature, status: implemented, authenticity: real, vms: "NETACP presents the DECnet device face _NET: + object-dispatch as EXECUTIVE-RESIDENT, cross-process-real state", evidence: "src/kernel-core/vms_devtab.c", notes: "P5 (rd vms-9ab, design vms-515 §3.3; vms_devtab_probe_net + src/vmsdecnet/engine/decnetd.c). The DECnet device _NET: is born in the executive I/O database at module init over the same primary NIC ETH0: rides (gated on the NIC -- no NIC, no _NET:, SS$_NOSUCHDEV, INV-6), so $ASSIGN/$GETDVI _NET: from a process that is NOT NETACP resolves a real DC$_SCOM device -- the §7.5 cross-process tell, same shape as the RTAn: proof. Asserted cross-process in tests/qemu/test_kmod_devtab.c (kmod leg) and via F$GETDVI _NET: in the shared acceptance battery. Object dispatch (42=CTERM) is executive-resident and cross-process-proven by the object-42->RTAn:->$GETDVI path (decnet$cterm-session-auth). NOT yet: a standalone NCP-style enumerable object REGISTRY query (its own executive ioctl, rd vms-9ab follow-on); the wire engine binary is not yet renamed NETACP.EXE (cosmetic, tracked)."}
  - {id: decnet$wire-isolation, kind: feature, status: implemented, authenticity: real, vms: "A2/A8 isolation: attacker wire-parsing runs at LOW privilege and hands NETACP's privileged control path a VALIDATED TYPED DESCRIPTOR; the privileged path parses no attacker bytes", evidence: "src/vmsdecnet/cterm/dnet_cterm_host.c", notes: "P5 (rd vms-9ab, design vms-515 §3.4; low-priv parse dnet_conn_descriptor_from_wire in src/vmsdecnet/cterm/dnet_cterm.c, privileged consumer dnet_cterm_host_open_desc here). The low-privilege bounded parse distils untrusted NSP-connect bytes into a struct dnet_conn_descriptor carrying no wire pointer, no length, and no credential material; the privileged session-creating path (mints RTAn:, $CREPRCs LOGINOUT) takes ONLY that descriptor and refuses an unvalidated or wrong-object one BEFORE any device/process exists. Proven: the low-priv seam under 200k-frame mutation fuzz in tests/vmsdecnet/test_dnet_cterm.c (no malformed frame yields a validated/steered descriptor; every rejected frame leaves it all-zero), and the privileged double-door on the shipped binary in DECNETD.EXE --isolation-test (no /dev/vms needed), run by the acceptance battery. 'OVMX never crashes a peer': every hostile field is bounded and refused cleanly."}
  - {id: decnet$set-host, kind: command, status: implemented, authenticity: real, vms: "SET HOST — DECnet remote-node connection (outbound client): full authenticated CTERM session to a real VAX", evidence: "src/vmsdcl/dcl_cmd_set.c", verified_against: "rd vms-a70, tests/lab/captures/decnet-sethost-dcl-20260911/ — OVMX --set-host to a real OpenVMS VAX V7.3 reached an authenticated live DCL and ran commands with output returned over the link (the session's own _RTA1: process appears in its own SHOW SYSTEM output)", notes: "DCL `SET HOST <node>` activates SYS$SYSTEM:DECNETD.EXE --set-host on the CALLER'S TERMINAL through the executive image activator (dcl_activate_image -> imgact_activate, with DCL's fork fallback -- the same path RUN uses, NOT a bare fork/exec). The client (src/vmsdecnet/engine/decnetd.c run_set_host_loop) opens a REAL NSP logical link to the remote's Session Control object 42, binds a CTERM terminal session, and bridges THIS process's local terminal to it. VMS-NATIVE terminal I/O (the anti-LARP core): the client does $ASSIGN SYS$INPUT/SYS$OUTPUT + $QIO IO$_SETMODE (OVMX pass-all selector IO$K_TT_PASSALL) + IO$_READVBLK/IO$_WRITEVBLK -- NEVER tcsetattr/cfmakeraw on fd 0/1; the termios that realises pass-all lives in the executive terminal driver (src/libvms/syssvc/sys_qio.c qio_terminal_setmode), below the $QIO interface. On teardown control returns with the canonical %REM-S-END (oracle docs/oracle/vax-sethost-cterm.console.txt). The remote authenticates FRESH (the carried --user is proxy only, never auto-login). The client contains NO fork/exec/openpty/dup2. Response decoders are bounded against a hostile remote (mutation fuzz of dnet_nsp_decode/dnet_cterm_rx, tests/vmsdecnet/test_dnet_cterm.c, clean under ASan/UBSan). LIVE-PROVEN end-to-end against a real OpenVMS VAX V7.3 (rd vms-a70, tests/lab/captures/decnet-sethost-dcl-20260911/): OVMX --set-host 1.1 drove CI -> CC -> NSP Link Service -> CTERM foundation negotiation (byte-exact vs the oracle) -> real VAX LOGINOUT -> authenticated DCL -> F$GETSYI(NODENAME)=VAX1 + SHOW SYSTEM returning VAX1's live process table (incl the session's OWN _RTA1: process) -> clean LOGOUT + NSP disconnect. The earlier CTERM-BIND FACADE is RETIRED: the CTERM foundation/Bind protocol was re-grounded byte-for-byte on the real oracle (the foundation short-TLV + msgtype-9 envelope codec, the host-speaks-first negotiation FSM, the NSP link-service credit grant after CC, and prompt-gated Read Data — one line per host read-solicit), oracle-anchored in tests/vmsdecnet/test_dnet_cterm.c. NOT yet: the INBOUND direction (real VAX -> OVMX-as-CTERM-server, decnet$cterm-session-auth) is not live-proven; general task-to-task ($QIO) and the outbound COPY-over-datalink client are separate rungs."}
  - {id: decnet$node-filespec-syntax, kind: feature, status: partial, authenticity: real, vms: "NODE\"acc\"::dev:[dir]file filespec syntax", evidence: "src/vmsrms/rms_parse.c", notes: "Syntax sets NAM$M_NODE and parses/reconstructs the node prefix. DCL COPY now ACTS on it (rd vms-8c2): a NODE:: spec routes to the DECnet FAL/DAP path and, since the outbound COPY-over-datalink client is not yet wired into a DCL process, reports honestly (%COPY-I-NETNOTWIRED) rather than mis-copying it as a local file — src/vmsdcl/dcl_cmd_file.c copy_spec_has_node. Full outbound DCL->datalink bridge is a tracked follow-on."}
  - {id: decnet$dap, kind: protocol, status: implemented, authenticity: real, vms: "DAP (Data Access Protocol) message codec — CONFIGURATION/ATTRIBUTES/ACCESS/CONTROL/DATA/STATUS/NAME/ACCESS-COMPLETE encode+decode", evidence: "src/vmsdecnet/dap/dnet_dap.c", verified_against: "docs/oracle/vax-copy-fal-dap.* (rd vms-cd3): the message SEQUENCE + carried values (filename, resolved full spec, owner UIC, verbatim records) are the real VAX<->VAX COPY's ground truth; the per-field framing is the PUBLIC DAP spec", notes: "Pure byte codec, self-round-tripping. CLEAN-ROOM (Rule 8): message set + generic framing from the public DEC DAP functional specification; sequence + credential/object/carried-value semantics from the oracle. FULLY BOUNDED against hostile input — decoder fuzzed 200k inputs + every truncated prefix, ASan/UBSan-clean (tests/vmsdecnet/test_dnet_dap.c). HONEST SCOPE (INV-6): the field sub-framing is NOT asserted byte-identical to the real-VAX DAP sub-framing (the oracle §3 does not transcribe every sub-field); two OVMX nodes interoperate over it faithfully, byte-level stock-VAX FAL wire interop is a filed follow-on."}
  - {id: decnet$fal, kind: feature, status: partial, authenticity: real, vms: "FAL — File Access Listener (DECnet Session Control object 17): inbound file COPY authenticated at connect + served/stored via RMS; the COPY node:: client", evidence: "src/vmsdecnet/fal/dnet_fal.c", verified_against: "DECNETD.EXE --fal-accept-test in the booted acceptance battery (tests/qemu/lib/dcl_acceptance_battery.sh): real SYSUAF/Purdy auth (GUEST/GUEST accepted, a wrong password + DISABLED/DISUSER refused) then a sequential file transferred BOTH directions through real DAP over an NSP link + real RMS over the ACP, byte-verified", notes: "SECURITY SURFACE. An inbound object-17 connect CARRIES the username+password (oracle §1 — the OPPOSITE of CTERM's empty creds); FAL authenticates them through THE ONE faithful authenticator (sysuaf_lookup + sysuaf_authenticate Purdy + the disabled-account gate, the SAME path LOGINOUT/SSHD use) BEFORE accepting the link, and REFUSES with an NSP Disconnect on a bad password — the FAL analogue of the no-auth-CTERM hole (INV-6, no file served on an unauthenticated connect). The connect-carried creds are decoded by a bounded, fuzz-clean decoder (dnet_fal_access_decode) that never over-reads and wipes the password after the check. File I/O is rms_textfile_* (RMS over the ODS-2 ACP), fail-honest with no /dev/vms — no userspace fallback that fakes a transfer (Rule 9). No fork/exec/openpty/dup2, no raw-fd/termios file mechanics. HONEST FLOOR (no executive, runs anywhere): DECNETD.EXE --fal-selftest proves the client emits a real object-17 connect carrying the creds + the honest refusal + the DAP-over-NSP transport pump. NOT yet (filed follow-ons, never faked): the outbound COPY client wired into a DCL process over the live datalink; advanced DAP (indexed/relative files, wildcards, DIRECTORY, block mode, proxy-instead-of-password access); byte-level stock-VAX FAL wire interop; network-access-class (NETMBX) enforcement distinct from the password/DISUSER gates."}
