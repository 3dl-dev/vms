facility: logical-namespace
name: "Logical-name namespace (tables, search lists, concealed/rooted)"
domain: file-system
vms_ref: "OpenVMS System Services Reference Manual ($CRELNM/$TRNLNM); OpenVMS DCL Concepts Manual"
scope_1_0: in
plan_ref: vms-96e2
summary: >
  The four standard logical-name tables, iterative translation, concealed/rooted and
  search-list logicals. System/Group/Job are executive-resident (vms.ko, no host
  fallback per INV-6) and QEMU-verified cross-process; Process is correctly local
  (VMS scopes it per-process too). $CRELNT is not yet declared.
last_reviewed: 2026-08-31
