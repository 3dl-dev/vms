summary: >
  Moved from design-only to a real, running MMK.EXE (vendored MadGoat MMK
  built as an OVMX-native image via mk_mmk.sh, plus a host ctest that links the
  same sources against the OVMX RTL). MMK reads a real descrip.mms through
  OVMX RMS, parses it with the actual lib$table_parse engine driven by the
  ported PARSE_TABLES.MAR grammar (vms-486, now built -DOVMX_MMK_PRODUCTION),
  resolves the command line through CLI$ compiled-CLD, and emits the correct
  dependency-ordered build PLAN. Gap (honest): actual command EXECUTION rides a
  deferred DCL-subprocess/mailbox/AST drive — the parse+plan half is done, the
  run half is not. RTL prerequisites (CLI$, LIB$TPARSE, SYS$FILESCAN,
  SYS$SETDDIR, LIB$GET_FOREIGN) are complete. Self-host gate.
