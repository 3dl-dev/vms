# Source of truth for the connection-manager row of the Compatibility Surface Register.
facility: connection-manager
name: "Connection manager / membership / quorum / rejoin"
domain: clustering
vms_ref: "OpenVMS Cluster Systems manual (connection manager, quorum algorithm)"
scope_1_0: in
plan_ref: vms-694
summary: >
  Full HELLO/disconnect/reconnect/depart finite-state machines, byte-exact
  against mined wire captures. Quorum recompute (including quorum disk) is real,
  driven by wire-grounded per-node VOTES — daemon-resident (scsd), executive
  cutover deferred. Cluster membership now crosses into the executive: vms.ko
  owns a real membership block that scsd populates from its live connection view
  and SHOW CLUSTER reads through /dev/vms (the userspace file bridge is retired).
  Membership/rejoin is a single 3-party member-driven join FSM — VMS's own model
  has no distinct rejoin state either.
  SCOPE CAVEAT (vms-110b): the wire join and the quorum/membership arithmetic run
  in the userspace SCSD daemon, which the shipping runtime does NOT auto-start at
  boot — so a BOOTED OVMX is not yet a cluster member. The executive membership
  block is real, but a booted node joining a real VAX end-to-end is unbuilt.
last_reviewed: 2026-08-31
items:
  - id: connection-manager$hello-protocol
    kind: protocol
    status: verified
    authenticity: real
    vms: "HELLO / disconnect / reconnect / depart connection state machines"
    evidence: src/vmsscs/scs_hello.c
    verified_against: "mined lab captures"
    notes: "scs_hello.c, scs_disc.c, scs_recnx.c (10-state CSB), scs_depart.c — byte-exact against mined wire captures."

  - id: connection-manager$quorum
    kind: feature
    status: implemented
    authenticity: real
    vms: "CEVOTES/QUORUM recompute, including quorum disk as a virtual voting member"
    evidence: src/vmsscs/scs_quorum.c
    notes: >
      The documented connection-manager quorum arithmetic (VMScluster Systems for
      OpenVMS sec 2.3.5; mined CM transcript 5-node worked example reproduced in the
      unit test). Per-node VOTES are wire-grounded from the peer's own report
      (cm_quorum_note_peer_votes reads the peer's mv.votes), not fabricated. Computed
      daemon-resident in scsd, not yet executive-resident — the votes/quorum cutover
      into vms.ko is deferred (vms-551 follow-on). Note scsd is not auto-started at
      boot (vms-110b), so this arithmetic runs only when the hand-launched SCSD probe
      is driven, not on a booted OVMX node.

  - id: connection-manager$membership-rejoin
    kind: feature
    status: implemented
    authenticity: real
    vms: "Cluster membership join / rejoin"
    evidence: src/vmsscs/scsd.c
    notes: >
      3-party member-driven join FSM (scsd.c enum join_step); no distinct rejoin
      state, matching VMS's own model. §4(O.38): 4/5 member-oracle reliable after
      fixing OVMX's own XITDONE self-verdict bug; residual 1/5 is real member-side
      loss, not an OVMX defect (operator call).
      SCOPE (vms-110b): this is the userspace SCSD probe (hand-launched, kubectl-
      exec'd onto a lab pod's br0) joining a real VAX cluster — a real wire join by
      the daemon, NOT a booted OVMX node. A booted OVMX auto-starting SCS and joining
      a cluster is unbuilt: nothing spawns scsd at boot.

  - id: connection-manager$executive-membership
    kind: feature
    status: implemented
    authenticity: real
    vms: "Cluster membership visible to the executive ($GETSYI/SHOW CLUSTER see a real cluster)"
    evidence: src/kernel-core/vms_lock.c
    notes: >
      vms-551 / vms-967d / vms-8d4. vms.ko owns a module-global membership block
      (struct vms_cluster_member{csid,sysid,scsnode[16],state}, up to 96 nodes,
      separate from the CSID-only dlm_member_csids). The block is REAL and
      executive-resident: scsd's scsd_publish_membership writes it via
      VMS_IOCTL_CLUSTER_MEMBER_SET/CLEAR (0x39/0x3a) and SHOW CLUSTER reads it via the
      wired CLUSTER_MEMBER_GET (0x3b) — the userspace /var/run/ovmx/cluster_state file
      bridge (an INV-6/Rule-9 userspace-to-userspace path) is fully retired
      (vms-967d). NOTMEMBER (executive reachable, 0 members, SS$_NORMAL) is honestly
      distinct from NOSUCHDEV (executive unreachable, 2680).
      WHAT IS PROVEN — the executive block itself, single-node:
      tests/qemu/test_syssvc_cluster_member.c ioctl-SETs member records against a real
      /dev/vms and reads them back field-by-field; tests/integration/test_show_cluster_
      membership.sh is a host honest-absence gate (NO QEMU boot) proving SHOW CLUSTER
      reads the executive and fails NOSUCHDEV without it. This is NOT 2/3 booted OVMX
      nodes forming a cluster over the wire (the prior "Proven on real 2/3-node QEMU"
      wording overclaimed — the records are ioctl-injected, not wire-joined).
      NOT built (vms-110b): a BOOTED OVMX runtime does not auto-start SCS — nothing
      spawns scsd at boot (VMS$VMS.DAT registers only JOB_CONTROL as a STDRV
      component; ovmx_init.c:953 merely STAGES SCSD.EXE as an on-demand image). So a
      booted node never populates this block from a real join; today it is fed only by
      the ioctl test or by the hand-launched SCSD probe. "The executive sees a real
      cluster" end-to-end on a booted node is the unbuilt gap.
      Also deferred: votes/quorum and $GETSYI cutover into the executive; today's
      membership block carries no votes field.
