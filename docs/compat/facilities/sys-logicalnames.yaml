facility: sys-logicalnames
name: "SYS$ Logical-Name Services"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — SYS$CRELNM, SYS$DELLNM, SYS$TRNLNM"
scope_1_0: in
tier: 1
plan_ref: vms-d37
summary: >
  The 3 SYS$ logical-name entry points (CRELNM/DELLNM/TRNLNM) are all
  implemented. LNM$SYSTEM is executive-resident: create/delete/translate go
  through /dev/vms (vms_kif_lnm_define/_delete/_translate) so a name defined
  in LNM$SYSTEM by one process is visible to every other process on the node,
  with no per-process fallback if the executive is absent (fails honestly
  with SS$_NOSUCHDEV, per Rule 9/INV-6). LNM$PROCESS/JOB/GROUP tables remain
  process-private in a local logical_table[] array; JOB/GROUP executive
  residency (making them visible across the processes of a job/group, as on
  real VMS) is the deferred half of vms-d37.
last_reviewed: 2026-08-13
