# Source of truth for the DCL-verbs row of the Compatibility Surface Register.
facility: dcl-verbs
name: "DCL Command Verbs (breadth)"
domain: command-language
vms_ref: "OpenVMS DCL Dictionary"
scope_1_0: in
tier: 1
plan_ref: vms-8ad
summary: >
  OVMX's static builtin_verbs[] dispatch table (dcl_builtin.c) carries 58 verbs
  against VMS's ~150 (SET/SHOW count as ~30-subverb umbrellas each, not single
  verbs). Breadth is catalogued as items rather than one row per verb; each
  notable missing verb family and the SET/SHOW umbrella depth get their own
  item. Since the last census CALL/SUBROUTINE and DECK/EOD landed as real
  constructs (see dcl-scripting.yaml), retiring two former facade-risk rows.
last_reviewed: 2026-08-31
items:
  - id: dcl-verbs$breadth
    kind: feature
    status: partial
    authenticity: real
    vms: "~150 DCL verbs (VMS DCL Dictionary), SET/SHOW as ~30-subverb umbrellas each"
    evidence: src/vmsdcl/dcl_builtin.c
    notes: "58 of ~150 verbs present in builtin_verbs[] (ACCOUNTING ANALYZE APPEND ASSIGN ATTACH BACKUP CLOSE CONTINUE CONVERT COPY CREATE DEASSIGN DEFINE DELETE DIFFERENCES DIRECTORY DISMOUNT DUMP EDIT EXIT FTP HELP INITIALIZE INQUIRE INSTALL LIBRARY LINK LOGOUT MAIL MONITOR MOUNT OPEN PHONE PING PIPE PRINT PRODUCT PURGE READ RECALL RENAME REPLY REQUEST RUN SEARCH SET SHOW SORT SPAWN STOP SUBMIT SYSGEN SYSMAN TCPIP TELNET TYPE WAIT WRITE). Real breadth gap, not a facade."

  - id: dcl-verbs$call-subroutine
    kind: command
    status: implemented
    authenticity: real
    vms: "CALL / SUBROUTINE / ENDSUBROUTINE — command-procedure subroutine calls"
    scope_1_0: in
    evidence: src/vmsdcl/dcl_exec.c:1354
    notes: "Landed since last census: CALL transfers to a labelled SUBROUTINE block with its own command level and P1-P8, RETURN propagates status (dcl_exec.c:1354/1367/1377, dcl_script.c). Exercised by tests/dcl/test_scripting_status_call_deck.sh."

  - id: dcl-verbs$deck-eod
    kind: command
    status: implemented
    authenticity: real
    vms: "DECK / $EOD — in-stream data deck delimiting"
    scope_1_0: in
    evidence: src/vmsdcl/dcl_cmd_process.c:1659
    notes: "Landed since last census (vms-3983): DECK suspends the first-'$'-line terminator so an in-stream data block is read verbatim to the EOD sentinel (default $EOD; DECK/DOLLAR=string names another). Former facade-risk (data lines mis-parsed as commands) retired. See dcl-scripting.yaml."

  - id: dcl-verbs$queue-verbs
    kind: command
    status: absent
    authenticity: advisory
    vms: "START/QUEUE, STOP/QUEUE, INITIALIZE/QUEUE — real VMS queue-management verb syntax"
    scope_1_0: in
    evidence: src/vmsdcl/dcl_cmd_set.c
    notes: "The VMS verb spellings START/QUEUE and INITIALIZE/QUEUE are not present (typing START -> honest %DCL-W-IVVERB, not a facade); the function is reshaped as SET QUEUE/START,/STOP,/PAUSE (cmd_set_queue). Honest syntax deviation, documented. See queues.yaml."

  - id: dcl-verbs$allocate-deallocate
    kind: command
    status: absent
    authenticity: n/a
    vms: "ALLOCATE / DEALLOCATE — device allocation verbs"
    scope_1_0: in

  - id: dcl-verbs$set-host
    kind: command
    status: absent
    authenticity: n/a
    vms: "SET HOST — DECnet/LAT terminal connection to another node"
    scope_1_0: in
    evidence: src/vmsdcl/dcl_cmd_set.c
    notes: "A cmd_set_host SET sub-verb exists but the DECnet/LAT terminal-connection semantics depend on the networking lane (out until DECnet/LAT land)."

  - id: dcl-verbs$patch
    kind: command
    status: absent
    authenticity: n/a
    vms: "PATCH — interactive image binary patch utility"
    scope_1_0: stretch

  - id: dcl-verbs$standalone-sda
    kind: command
    status: absent
    authenticity: n/a
    vms: "Standalone SDA (crash-dump analysis boot path)"
    scope_1_0: stretch
    notes: "Interactive ANALYZE/SYSTEM exists (see utilities.yaml); standalone crash-dump SDA does not."

  - id: dcl-verbs$debug
    kind: command
    status: absent
    authenticity: n/a
    vms: "DEBUG — symbolic debugger"
    scope_1_0: stretch

  - id: dcl-verbs$merge
    kind: command
    status: absent
    authenticity: n/a
    vms: "MERGE — merge utility for sorted files"
    scope_1_0: stretch
    notes: "Companion to SORT; see utilities.yaml SORT item."

  - id: dcl-verbs$set-show-umbrella
    kind: feature
    status: partial
    authenticity: real
    vms: "SET (~30 sub-verbs) / SHOW (~30 sub-verbs) umbrella depth"
    evidence: src/vmsdcl/dcl_cmd_set.c:2145
    notes: "SET dispatches 22 real sub-handlers (DEFAULT PROMPT VERIFY TERMINAL PROTECTION PASSWORD ON/NOON SYMBOL MESSAGE CONTROL PROCESS FILE UIC WORKING_SET TIME HOST AUDIT ACCOUNTING VOLUME ENTRY QUEUE) rejecting unknown keywords with %DCL-W-IVKEYW; SHOW dispatches 28 real sub-handlers (dcl_cmd_show.c). Each real, not facaded, but short of VMS's ~30-each full set."
