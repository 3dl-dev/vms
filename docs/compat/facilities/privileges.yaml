# Source of truth for the Privileges row of the Compatibility Surface Register.
facility: privileges
name: "Privileges (Definition + Enforcement)"
domain: system-management
vms_ref: "OpenVMS Guide to System Security ch. 3 (Privileges)"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  All 39 VMS privilege bits are defined. Mode-transition and SETPRV
  enforcement in the kernel executive are real and verified — including a
  bit-position bug (SETPRV mismapped to DETACH) caught and fixed against
  lab-VAX SDA. File-access privilege overrides are PARTLY real: the
  Files-11 ACP honors BYPASS, READALL, and SYSPRV in its access check
  (vms-165) and GRPPRV (vms-768). ALTPRI, SYSLCK and OPER are checked in the
  executive (vms-768).
last_reviewed: 2026-09-14
items:
  - {id: prvdef$bits,          kind: struct,   status: implemented, authenticity: n/a,         vms: "39 VMS privilege bit definitions", evidence: src/libvms/include/prvdef.h}
  - {id: sys$mode_transition,  kind: feature,  status: verified,    authenticity: real,         vms: "Privilege-checked access-mode escalation gate ($SETMODE)", evidence: "src/kernel-core/vms_access.c:93", verified_against: "lab-VAX SDA (docs/oracle/vax73-privileges.md §2) — caught SETPRV mismapped to DETACH bit, fixed", notes: "vms_ioctl_setmode. Re-census 2026-09-14: line ref stable (:93)."}
  - {id: sys$setprv,           kind: routine,  status: verified,    authenticity: real,         vms: "$SETPRV — enable/disable process privileges within the authorized mask", evidence: "src/kernel-core/vms_access.c:320", verified_against: "lab-VAX SDA READ SYS$SYSTEM:SYSDEF.STB (docs/oracle/vax73-privileges.md §2)", notes: "vms_ioctl_setprv; SETPRV can only narrow within the authorized mask, never exceed it. Re-census 2026-09-14: line ref stable (:320)."}
  - {id: privs$altpri_syslck_oper, kind: feature, status: implemented, authenticity: real, vms: "ALTPRI ($SETPRI above the authorized priority), SYSLCK (LCK$M_SYSTEM), OPER ($BRKTHRU to every terminal / user)", evidence: src/kernel-core/vms_proctab.c, verified_against: "docs/oracle/semantics/privchk/vax73.txt (OpenVMS VAX V7.3); tests/qemu/test_syssvc_privilege_enforce.c", notes: "vms-768: without ALTPRI a raise above the authorized priority succeeds at the authorized priority; SS$_NOSYSLCK without SYSLCK; SS$_NOOPER without OPER. Not done: the authorized priority is the DEFPRI default 4 for every process (UAF PRIOR is not read yet); a non-system lock resource is not yet qualified by UIC group, so an LCK$M_SYSTEM lock and a group lock of the same name are one resource."}
  - {id: privs$file_access_override, kind: feature, status: implemented, authenticity: real, vms: "SYSPRV/BYPASS/READALL/GRPPRV override normal file protection checks", evidence: src/kernel-core/vms_prot.h, scope_1_0: in, notes: "The Files-11 ACP's acp_check_access (vmsfs_acp.c) decides through vms_prot_check_acl() (vms_prot.h), shared by every object class: BYPASS lifts all access control, READALL grants read (and a file's execute), SYSPRV confers the SYSTEM protection category, and GRPPRV confers it for an object owned by the accessor's own UIC group (OpenVMS VAX V7.3 oracle, docs/oracle/vax73-acl.md GRPPRV). Proof tests/qemu/test_syssvc_privilege_enforce.c with one negative control per privilege: defects.d/acp-readall-ignored, acp-bypass-ignored, acp-sysprv-ignored, acp-grpprv-ignored. Cross-listed to protection-acl."}
