# release.yml - cut an OVMX release bundle and publish it to GitHub Releases
# (vms-644, epic vms-a84 RELEASE ENGINEERING).
#
# This is the "ship THROUGH the machinery" trigger (release-engineering
# pillar): pushing a release-shaped tag (e.g. `0.4`, `0.3-1`, `v1.0.0`) is the
# deliberate, human-authorized act that starts a release. On that tag push
# this workflow runs the SAME machinery a developer would run by hand --
# tools/cut-release.sh then tools/publish-release.sh -- so a published release
# is never hand-assembled: it is the reproducible bundle, its generated notes,
# and its checksums, attached to a GitHub Release.
#
# It deliberately does NOT create the tag; the tag push is the input. The
# reproducibility / acceptance / upgrade gates run in ci.yml on the pushed
# commit; publish-release.sh independently re-verifies the bundle's SHA256SUMS
# before uploading, so corrupt bytes are never published.
#
# workflow_dispatch is provided so a maintainer can also cut+publish an
# existing tag by hand, and choose a draft (default) so the final "make it
# public" click stays with a human -- publishing is the one externally-visible
# step, and defaulting to a draft keeps it gated.

name: Cut and Publish Release

on:
  push:
    tags:
      # Release-shaped tags only: 0.4, 0.3-1, V0.4-2, v1.0.0, 1.2.3 ...
      # GitHub tag filters are CASE-SENSITIVE and have no alternation, so every
      # accepted spelling needs its own literal glob. The prefix may be absent,
      # lowercase 'v', or uppercase 'V' -- this repo has SHIPPED all three: bare
      # `0.3-8`, then `V0.3-9` / `V0.4` / `V0.4-1`..`V0.4-4` -- and a `-N` point
      # suffix is allowed on every form. Missing any one variant means a real
      # release tag pushes but silently never publishes: that is exactly the
      # V0.3-9..V0.4-4 gap (6 tags, 0 releases) this list closes (vms-644).
      # Non-release tags (wip/*, migration/*) still match nothing here.
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+-[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to cut and publish (e.g. 0.4)'
        required: true
      draft:
        description: 'Publish as a draft (default true; the final public step stays manual)'
        type: boolean
        default: true

# Creating a GitHub Release needs write access to repository contents.
permissions:
  contents: write
  packages: read   # GHCR mirror of the pinned base images (vms-9a6, .github/actions/setup-buildx)

jobs:
  # aarch64 ships in V1.0 (rd vms-b58, epic vms-0ad0). Its bootable set is
  # built natively on an arm64 runner (under binfmt on x86_64 the userland
  # stages take hours) by tools/cut-release-aarch64.sh, from the SAME tagged
  # commit and SOURCE_DATE_EPOCH cut-release.sh uses; cut-and-publish then
  # hands it to cut-release.sh (--aarch64-dir), which refuses a set stamped
  # with any other commit/clock. A failed aarch64 build fails this job, and
  # cut-and-publish needs it: no aarch64, no release.
  cut-aarch64:
    name: cut the aarch64 bootable set (arm64 runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      built: ${{ steps.cut.outputs.built }}
    steps:
      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout (same tooling ref as cut-and-publish)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.tag.outputs.tag }}
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx
      - name: Build the aarch64 set from the tagged commit
        id: cut
        env:
          OVMX_MODULE_SIGNING_KEY_PEM: ${{ secrets.OVMX_MODULE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          COMMIT=$(git rev-parse "$TAG^{commit}")
          SDE=$(git log -1 --format=%ct "$COMMIT")
          SRC="$RUNNER_TEMP/src"; mkdir -p "$SRC"
          git archive --format=tar "$COMMIT" | tar -x -C "$SRC"
          if [ ! -f "$SRC/distro/kernel/ovmx-arm64.config" ]; then
            echo "%CUT-AARCH64-I-PREAARCH64: $TAG predates aarch64 release support -- cut-release.sh will omit aarch64 for this historical cut"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${OVMX_MODULE_SIGNING_KEY_PEM:-}" ]; then
            KEYFILE="$(mktemp)"
            printf '%s\n' "$OVMX_MODULE_SIGNING_KEY_PEM" > "$KEYFILE"
            export OVMX_MODULE_SIGNING_KEY="$KEYFILE"
          fi
          tools/cut-release-aarch64.sh --src-dir "$SRC" --out-dir "$RUNNER_TEMP/aarch64" \
            --commit "$COMMIT" --source-date-epoch "$SDE"
          [ -n "${KEYFILE:-}" ] && rm -f "$KEYFILE" || true
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Hand the aarch64 set to cut-and-publish
        if: steps.cut.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-release-set
          path: ${{ runner.temp }}/aarch64/
          retention-days: 3
          if-no-files-found: error

  cut-and-publish:
    name: cut-release + publish to GitHub Releases
    needs: cut-aarch64
    runs-on: ubuntu-latest
    # A full containerized cut is ~25-30 min cold (kernel + VMS-native
    # toolchain + QEMU image); mirror cut-release-reproducible's budget.
    timeout-minutes: 150

    steps:
      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            # A tag pushed here is a deliberate release; publish it (not a draft).
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      # CHECKOUT REF -- tooling vs. content:
      #   * push of a release tag  -> check out the TAG. The release is cut by
      #     the tooling present AT that commit (reproducible: the tag carries
      #     both its source and the scripts that build it).
      #   * workflow_dispatch      -> check out the DISPATCHED ref (github.sha,
      #     i.e. the branch you ran the workflow from), so a manual re-publish
      #     runs the CURRENT release TOOLING (cut-release.sh + publish-
      #     release.sh, incl. fixes like the asset-name-collision fix) while
      #     still building the requested tag's SOURCE: cut-release.sh
      #     git-archives `--ref <tag>` and gen_release_notes.py walks to that
      #     tag's commit. This is exactly how you re-publish a historical tag
      #     (e.g. V0.5-4..V0.5-8, which cut fine but hit the by-basename asset
      #     collision) with fixed tooling without rewriting an immutable tag.
      - name: Checkout (tooling ref; tag for a push, dispatched ref for a manual re-publish)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.tag.outputs.tag }}
          # gen_release_notes.py walks history from the previous release tag and
          # cut-release.sh git-archives the requested tag, so the whole history
          # and all tags must be present.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      # Cut the reproducible bundle from the tagged commit into a known dir.
      # Sign modules with the persistent OVMX signing key from Actions secrets
      # (vms-19ed): the private key is NEVER in git, but releases all share it,
      # so their module signatures/keyring are deterministic release-to-release
      # (vms-d73) and form one stable trust anchor. Absent (e.g. a fork build)
      # -> cut-release.sh mints an ephemeral key and only the signature bytes
      # vary. The secret is written to a temp file the script reads via
      # OVMX_MODULE_SIGNING_KEY, then removed.
      - name: Fetch the aarch64 set cut-aarch64 built
        if: needs.cut-aarch64.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aarch64-release-set
          path: ${{ runner.temp }}/aarch64-prebuilt

      - name: Cut the release bundle
        env:
          OVMX_MODULE_SIGNING_KEY_PEM: ${{ secrets.OVMX_MODULE_SIGNING_KEY }}
        run: |
          if [ -n "${OVMX_MODULE_SIGNING_KEY_PEM:-}" ]; then
            KEYFILE="$(mktemp)"
            printf '%s\n' "$OVMX_MODULE_SIGNING_KEY_PEM" > "$KEYFILE"
            export OVMX_MODULE_SIGNING_KEY="$KEYFILE"
            echo "release signing: using persistent key from secrets.OVMX_MODULE_SIGNING_KEY"
          else
            echo "release signing: no OVMX_MODULE_SIGNING_KEY secret -- ephemeral key (signatures not reproducible)"
          fi
          A64=()
          if [ "${{ needs.cut-aarch64.outputs.built }}" = "true" ]; then
            A64=(--aarch64-dir "$RUNNER_TEMP/aarch64-prebuilt")
          fi
          tools/cut-release.sh --ref "${{ steps.tag.outputs.tag }}" \
            --out-dir "${{ github.workspace }}/dist/release-cut" "${A64[@]}"
          [ -n "${KEYFILE:-}" ] && rm -f "$KEYFILE" || true

      # The notes list exactly what the TAG ships (V0.7-9: notes generated from
      # the cut-branch commit missed two PRs the merge queue folded into the
      # tagged commit). cut-release.sh generated them with --ref <tag>; this
      # proves the commit list == git log <previous tag>..<tag> before anything
      # is published.
      - name: Release notes list exactly what the tag ships
        run: |
          python3 tools/check_release_notes.py --tag "${{ steps.tag.outputs.tag }}" \
            --notes "$(ls "${{ github.workspace }}"/dist/release-cut/RELEASE-NOTES-*.md | head -1)"

      # Publish artifacts + generated notes. --no-record-notes: committing the
      # in-tree notes record is a source change for a PR, not something a
      # tag-triggered publish should push back to the branch. The publisher
      # re-verifies SHA256SUMS before any upload.
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT_FLAG=""
          if [ "${{ steps.tag.outputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          tools/publish-release.sh \
            --bundle-dir "${{ github.workspace }}/dist/release-cut" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --no-record-notes \
            $DRAFT_FLAG

      # Notify openvmx-site of the cut so its follow-ons (track-release.yml,
      # track-cluster-demo.yml, rd vms-cdbd) fire on the tag instead of waiting
      # for their own poll. Fully OFF the release critical path: this step is
      # best-effort (continue-on-error) and runs LAST, after the tag is already
      # published above -- a dispatch failure (or the token being unset) never
      # reds this job or blocks/holds a release.
      #
      # NEEDS PROVISIONING: secrets.SITE_DISPATCH_TOKEN -- a PAT (or GitHub App
      # token) scoped to `repo` on 3dl-dev/openvmx-site, since github.token only
      # authorizes repository_dispatch within ITS OWN repo. Absent, this step
      # is a harmless no-op (curl gets a 401/404, continue-on-error swallows
      # it) and both listener workflows fall back to their own schedule/manual
      # dispatch. Provisioning that token is a credential/security-posture
      # decision reserved to the operator, not made here.
      - name: Notify openvmx-site (repository_dispatch release-tagged) — off critical path
        # Only a release that actually PUBLISHED is announced: the site must not
        # build a demo for a tag whose cut or publish failed.
        if: success() && steps.tag.outputs.tag != ''
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "no secrets.SITE_DISPATCH_TOKEN provisioned -- skipping (openvmx-site falls back to its own poll/manual dispatch)."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: token ${SITE_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/3dl-dev/openvmx-site/dispatches \
            -d "$(printf '{"event_type":"release-tagged","client_payload":{"tag":"%s"}}' "$TAG")"
