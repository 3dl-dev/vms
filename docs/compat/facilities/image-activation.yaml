  - {id: image-activation$native-alpha-eihd, kind: feature, status: partial, authenticity: real, scope_1_0: in, vms: "Activation of an OpenVMS Alpha native image (EIHD/EISD/EIAF .EXE LINKed on real VMS), unchanged, with its SYS$/LIB$/DECC$ calls bound by symbol-vector offset and its own native shareables activated", evidence: "tools/cross-alpha/run-module-gp-activation-alpha.sh", notes: "rd vms-3b3f. CI alpha-native-image (native-gate) runs images LINKed on the lab Alpha V8.4 node from our own MACRO-32 sources (tests/native-images/alpha/) on the booted executive, and their output and $STATUS must match the node's. HELLO calls SYS$QIOW and LIB$PUT_OUTPUT. RETST returns a condition value. CSTDIO calls DECC$PUTS and DECC$TXPRINTF through DECC$SHR, which the system logical DECC$SHR resolves to SYS$SHARE:DECC$SHR_EV56. MAIN3 and MAIN4 are two-module images using our own shareable MYSHR: GSMATCH LEQUAL is checked against the ident each was linked with (MAIN4 against MYSHR 1.0 gives %X100020BC), and DEFINE MYSHR redirects the activation. The refusals give the real statuses: a missing shareable %X100388B2, a text file %X104D8CFC. The reader and fixup steps are checked on the real images by imgact_eihd_parse_unit and test_imgact_eihd (negctl eihd-lp-pair-swapped, eihd-spec-no-default-type, eihd-gsmatch-leq-ignores-major). Partial: the vector images provide only the entries with an ABI-compatible OVMX implementation (src/vmslink/vms_vectors/*.vec: 7 system services incl. SYS$IMGSTA, LIB$PUT_OUTPUT, 7 DECC$ routines), and any other entry fails activation with SS$_UNSUPPORTED. A shareable is located only in SYS$SHARE or SYS$SYSTEM; another device or directory in its translation is refused. .ADDRESS, code-address and PSB fixups, and shareable initialization, are refused. SYS$IMGSTA does not establish a traceback handler. The CLI callback argument is not passed. C RTL buffers are not flushed by an image exit handler (line-buffered terminal output is unaffected). %Lf X_float long double is not supported."}
  - {id: image-activation$native-vax-isd, kind: feature, status: absent, authenticity: n/a, scope_1_0: in, vms: "Activation of an OpenVMS VAX native image (IHD/ISD .EXE LINKed on real VMS) on OVMX/VAX", evidence: "src/imgact/imgact_eihd.h", notes: "rd vms-3b3f. Not started: Alpha came first, because OVMX/Alpha already runs the Alpha calling standard and its page size matches. A VAX image calls system services at fixed S0 addresses, and these collide with the NetBSD-VAX kernel's own S0 mapping."}
