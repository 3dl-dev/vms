# SYS$ Process/System Information. See docs/design-compat-surface-register.md.
facility: sys-procinfo
name: "SYS$ Process/System Information (GETJPI/GETSYI)"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — SYS$GETJPI, SYS$GETJPIW, SYS$GETSYI, SYS$GETSYIW"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  GETJPI/GETJPIW/GETSYI/GETSYIW are all implemented and real for most
  JPI$_/SYI$_ item codes. GETJPI resolves its target through the executive
  (vms_kif_getjpi_prcnam by name within the caller's UIC group, or
  vms_kif_getjpi_pid by VMS PID, or self) — cross-process, not a per-process
  fake. GETSYI cluster items (SCSNODE/SCSSYSTEMID/CLUSTER_MEMBER) read the
  executive membership block.
last_reviewed: 2026-08-31
items:
