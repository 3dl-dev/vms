# SYS$ Security Services. See docs/design-compat-surface-register.md.
facility: sys-security
name: "SYS$ Security Services ($SETPRV/$CHKPRO/$CHECK_ACCESS)"
domain: programming-interfaces
vms_ref: "OpenVMS System Services Reference Manual — Security Services"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  SYS$SETPRV is now executive-authoritative (vms-pv1): the mask change routes
  through /dev/vms (vms_kif_setprv), which authorizes the request against this
  process's permanent/authorized mask — a caller reaching outside it gets the
  authorized subset with SS$_NOTALLPRIV and cannot widen the authorized mask
  (SS$_NOPRIV) — and owns the resulting state; if /dev/vms is unreachable it
  fails honestly (no per-process fake grant, INV-6). The PCB is now a cache of
  executive-owned state, not the authority. SYS$CHKPRO is implemented with
  correct SOGW protection-check logic but advisory because zero OVMX callers
  currently invoke it. SYS$CHECK_ACCESS (a legacy second-opinion access check)
  was deliberately removed by design (vms-2b8) as a good anti-facade precedent,
  not a gap to fill. Rights-database and auditing services belong to other
  facilities (system-management domain).
