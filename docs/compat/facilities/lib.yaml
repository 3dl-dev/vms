summary: >
  starlet.h/lib headers declare 207 LIB$ symbols with no stub markers
  remaining. Broad genuine coverage across arithmetic/bit ops, char-scan,
  CLI/spawn (incl. a real CLI$ FSM parser), date/time, queue, symbol, tree,
  VM, translation tables, output, event flags, logical names, and misc
  groups. Notable named gaps: LIB$ISHFT/ISHFTC, LIB$TRIM, LIB$DO_COMMAND,
  LIB$SFREE_WAIT. LIB$TPARSE/LIB$TABLE_PARSE — formerly the known gap — are
  now a real FSM with backtracking (vms-9f6, CLOSED).
last_reviewed: 2026-08-13
