  - {id: ots$sfree1_dd, kind: routine, status: implemented, authenticity: real, vms: "Free one dynamic descriptor", evidence: src/libvms/rtl/ots_routines.c, notes: "Wraps the LIB$ string-descriptor engine (lib$scopy_*, lib$sget1_dd, lib$sfree1_dd); untransferred-byte count is the OTS return value. Exercised by tests/libvms/test_corpus_surface.c."}
  - {id: ots$sfreen_dd, kind: routine, status: implemented, authenticity: real, vms: "Free N dynamic descriptors", evidence: src/libvms/rtl/ots_routines.c, notes: "Wraps the LIB$ string-descriptor engine (lib$scopy_*, lib$sget1_dd, lib$sfree1_dd); untransferred-byte count is the OTS return value. Exercised by tests/libvms/test_corpus_surface.c."}
