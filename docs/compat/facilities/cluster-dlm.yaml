    verified_against: "PARTIAL coverage only — host units tests/cluster/host/test_dlm_ldwv.c (LVB read + wait-for visibility, injected/fake master) + tests/cluster/host/test_dlm_requester.c; N-node simulator scenarios tests/cluster/sim/scenarios/dlm_directory.c (directory routing) + tests/cluster/sim/scenarios/dlm_requester.c (simulated peers); tests/cluster/host/test_codec_dlm.c (REBUILD/DLKSRCH frame codec). The multi-node real-/dev/vms proofs (run_dlm_harness_h8/_h9/_h10/_h10b/_e84/_ec75.sh — LVB write/read crossing, dynamic remaster, directory-ownership refusal, distributed deadlock) were RETIRED with the userspace SCSD daemon in the #1052 executive-resident pivot; their gated multi-node successor through the now-landed SCS arm is still being re-established (vms-1ee; see the 2026-09-14 UPDATE below) — status stays verified->implemented pending that re-established proof. PROGRESS (rd vms-1ee): blocker 1 of 3 CLEARED. The Lock Directory Weight Vector now builds on a real multi-node cluster: when NO peer has advertised a LOCKDIRWT (none can -- no wire byte is pinned for a remote system, FC-P3.2) the local node WITHHOLDS its own SYSGEN weight so p. 6-32's all-zero reading applies cluster-wide, which is the one directory every node computes identically. Gated: the fallback is refused the instant ANY PEER advertises a real weight (split-brain: an all-zero answer to a peer computing a weighted vector is two directories for one resource). Proven on the live 2-node rig -- both executives now report the vector built on the unadvertised reading, where every previous run reported it not rebuilt (tests/qemu/captures/ldwv-fallback-20260911.log); teeth in tests/cluster/host/test_dlm_ldwv.c (club_local_withhold_builds_when_peers_unknown + club_local_withhold_refused_when_a_peer_advertised). UPDATE 2026-09-14 (re-census against origin/main b64d6b57): blockers (2) and (3) are now CLEARED IN CODE -- the SCS arm has LANDED. (2) src/kernel-core/vms_dlm_scs.c now EXISTS and is implemented (1668 lines, the dlm_arm_* family binding codec+FSM to SCS); it is built in all three targets (src/kernel/Makefile, src/kernel-netbsd/Makefile, distro/kernel/drivers-ovmx/vms/Kbuild) and STARTED from the executive (vms_dlm_scs_start at src/kernel-core/vms_devtab.c:2888), and it now has real callers on BOTH legs in src/kernel-core/vms_cnxman.c: the send-to-CSID origination entry cnxman_dlm_send() and the receive leg cnxman_dlm_rx() (invoked from the message-dispatch path, which hands an inbound DLM body to the arm's handle_request). (3) The DLM codec is no longer frame-absolute: src/kernel-core/vms_cluster_codec_dlm.c now exposes a body-relative *_parse_body(body,len,...) family (enq_request/enq_response/dir_hash/rebuild/deq/blkast/valblk) with frame-absolute entries layered over the SAME implementation (dlm_body_of slices at VMS_OFF_SYSAP_BODY), and the receive path parses the 132-byte SYSAP body directly, so DLM frames ARE parsed on receive -- the E73 body/frame mismatch is resolved. (The frame-level symbol the FSM header once cited, cnxman_barrier_rx_frame, still does not exist by that name; it is SUPERSEDED by the body-relative receive route cnxman_dlm_rx, not added.) Proof of the arm today: test_dlm_scs_arm (tests/cluster/host, the two-proof shape -- the arm is not host-linkable, so a driven trust-anchor against the real CSB derivation plus a wiring/order scan of the shipping files), plus live 2-node captures on disk (tests/lab/captures/dlm-arm-2node-20260911.log, ldwv-fallback/ldwv-splitbrain-gate-20260911, and the vms-727 LVB-crossing 2-node captures). REMAINING before this row can move past implemented: (a) a GATED live multi-node /dev/vms successor that exercises remaster (H10a/b) + LVB crossing (H8/H9) + distributed deadlock (H11) END-TO-END through the landed arm, as the replacement for the retired run_dlm_harness_h8/_h9/_h10/_h10b/_e84/_ec75 proofs -- the 2-node captures above are PRESENT but whether they fully discharge the remaster/deadlock slice is NOT confirmed in this census (state unverified, needs lane confirmation, vms-1ee); and (b) for verified specifically, a real-VAX DLM wire capture to replace the OVMX-DERIVED byte layout (Rule 8, 'NOT VMS-authentic' per the scs-transport row) with an oracle byte-gate. Status therefore stays IMPLEMENTED, not verified."
