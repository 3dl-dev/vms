name: Set up Docker Buildx (no anonymous Docker Hub dependency)
description: >-
  docker/setup-buildx-action with (1) the BuildKit image taken from the digest-pinned GHCR
  mirror (.github/mirror-images.lock, written by the mirror-base-images workflow) when it is
  readable with the job's GITHUB_TOKEN, else from mirror.gcr.io, and (2) docker.io base-image
  pulls inside builds tried through mirror.gcr.io first (Hub remains the last resort).
  Anonymous Docker Hub pulls from shared runner IPs intermittently fail (vms-9a6).
runs:
  using: composite
  steps:
    - name: Pick the BuildKit image
      id: bk
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        ACTOR: ${{ github.actor }}
      run: |
        set -u
        lock="${GITHUB_ACTION_PATH}/../../mirror-images.lock"
        digest=$(awk '$1=="moby-buildkit"{print $4}' "$lock" 2>/dev/null | head -1)
        img="mirror.gcr.io/moby/buildkit:buildx-stable-1"
        if [ -n "$digest" ] && echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 \
           && docker buildx imagetools inspect "ghcr.io/${OWNER}/mirror/moby-buildkit@${digest}" >/dev/null 2>&1; then
          img="ghcr.io/${OWNER}/mirror/moby-buildkit@${digest}"
        fi
        echo "BuildKit image: $img"
        echo "image=$img" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=${{ steps.bk.outputs.image }}
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
