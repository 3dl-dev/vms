summary: >
  SYS$SETPRV is implemented but advisory: privileges are tracked in the PCB
  with no privileged-mode transition unless already privileged. SYS$CHKPRO
  is implemented with correct SOGW protection-check logic but advisory
  because zero OVMX callers currently invoke it. SYS$CHECK_ACCESS (a legacy
  second-opinion access check) was deliberately removed by design (vms-2b8)
  as a good anti-facade precedent, not a gap to fill. Rights-database and
  auditing services belong to other facilities (system-management domain).
