facility: librarian
name: "LIBRARIAN (.OLB Object Libraries + .TLB/.HLB)"
domain: toolchain
vms_ref: "OpenVMS LIBRARIAN Utility Reference Manual; VSI OpenVMS DCL Dictionary (LIBRARY)"
scope_1_0: in
plan_ref: vms-59a
summary: >
  LIBRARIAN.EXE now EXISTS and is built + installed to SYS$SYSTEM (was
  design-only at the last census). It creates/maintains .OLB object libraries
  — an OVMX-labeled `ar` container of .OBJ (ELF) members (Rule 8: VMS's LBR
  byte layout is unpublished) — with /CREATE /INSERT /DELETE /LIST /EXTRACT,
  and LINK.EXE resolves undefined symbols by selectively pulling members. The
  DCL LIBRARY command drives the same .OLB path plus OVMX text/help libraries
  (.TLB/.HLB, an OVMX "LBRO" format, Rule 8). Proven end-to-end (build .OLB →
  link → activate → run) and byte-identical-twice (reproducible archives).
last_reviewed: 2026-08-31
