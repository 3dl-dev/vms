summary: >
  STS$V/M/S_* bitfield layout complete and oracle-pinned. SS$_ codes: 95 of
  VMS's ~500+ defined (common/executive subset, long tail absent). RMS$_ codes:
  81 of ~200+ defined. SYS$GETMSG message text: 51 of 176 SS$+RMS$ codes have
  real oracle-pinned text; unknown codes fall back to a generic
  "%FAC-S-XXXX message number N" string, not VMS-authentic. Facility number
  registry: 6 of VMS's ~300+ facilities defined, so getmsg/decode for most
  facilities falls to generic NONAME. starlet.h declares only ~86-192 sys$
  symbols vs several hundred in real VMS.
