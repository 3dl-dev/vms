summary: >
  VMS ships ~45 MTH$ routines; 42 are declared in the OVMX header and
  implemented, wrapping libm and broadly real. MTH$INIT_RANDOM_NUMBER_GENERATOR
  is absent. MTH$RANDOM uses an OVMX-invented LCG that has not been validated
  against VMS's actual PRNG algorithm.
