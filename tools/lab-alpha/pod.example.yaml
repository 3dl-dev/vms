apiVersion: v1
kind: Pod
metadata:
  name: corpusalpha-1
  namespace: ovmx-lab
  labels: { app: corpusalpha, owner: corpus-lane }
spec:
  nodeSelector: { kubernetes.io/hostname: k3s-worker }
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
  - name: alphalab
    image: 192.168.2.43:30500/ovmx-alphalab:8
    imagePullPolicy: IfNotPresent
    env:
    - { name: POD_NAME, value: corpusalpha-1 }
    - { name: LAB_ROOT, value: /lab }
    - { name: AXPBOX_VERSION, value: "1.2.0" }
    - { name: NODES, value: "alpha1" }
    - { name: GOLDEN, value: "alpha1-sys.golden.img" }
    - { name: MEDIA, value: "" }
    securityContext: { capabilities: { add: ["NET_ADMIN"] }, privileged: false }
    resources:
      requests: { cpu: "25m", memory: "2Gi" }
      limits: { cpu: "2200m", memory: "2Gi" }
    volumeMounts:
    - { name: vax-lab, mountPath: /lab }
    - { name: tun, mountPath: /dev/net/tun }
  volumes:
  - name: vax-lab
    persistentVolumeClaim: { claimName: vax-lab-pvc }
  - name: tun
    hostPath: { path: /dev/net/tun, type: CharDevice }
