      granted queue n_granted 1->0 (direct resmaster readback, counter_rose=1 gated).
      The full async emit->receive->deliver wire is proven 2-node, not just the
      grant-reply half. No fabricated wire reply or
      grant (INV-6).
  - id: cluster-dlm$remaster-lvb-deadlock
    kind: feature
    status: implemented
    authenticity: real
    vms: "LVB replication, dynamic remastering (directory + lock state), directory-ownership guard, distributed deadlock detection"
    evidence: src/kernel-core/vms_lock.c
    verified_against: "PARTIAL coverage only — host units tests/cluster/host/test_dlm_ldwv.c (LVB read + wait-for visibility, injected/fake master) + tests/cluster/host/test_dlm_requester.c; N-node simulator scenarios tests/cluster/sim/scenarios/dlm_directory.c (directory routing) + tests/cluster/sim/scenarios/dlm_requester.c (simulated peers); tests/cluster/host/test_codec_dlm.c (REBUILD/DLKSRCH frame codec). The multi-node real-/dev/vms proofs (run_dlm_harness_h8/_h9/_h10/_h10b/_e84/_ec75.sh — LVB write/read crossing, dynamic remaster, directory-ownership refusal, distributed deadlock) were RETIRED with the userspace SCSD daemon in the #1052 executive-resident pivot and have NO real-/dev/vms multi-node successor today — status downgraded verified->implemented pending re-established proof (vms-1ee). PROGRESS (rd vms-1ee): blocker 1 of 3 CLEARED. The Lock Directory Weight Vector now builds on a real multi-node cluster: when NO peer has advertised a LOCKDIRWT (none can -- no wire byte is pinned for a remote system, FC-P3.2) the local node WITHHOLDS its own SYSGEN weight so p. 6-32's all-zero reading applies cluster-wide, which is the one directory every node computes identically. Gated: the fallback is refused the instant ANY PEER advertises a real weight (split-brain: an all-zero answer to a peer computing a weighted vector is two directories for one resource). Proven on the live 2-node rig -- both executives now report the vector built on the unadvertised reading, where every previous run reported it not rebuilt (tests/qemu/captures/ldwv-fallback-20260911.log); teeth in tests/cluster/host/test_dlm_ldwv.c (club_local_withhold_builds_when_peers_unknown + club_local_withhold_refused_when_a_peer_advertised). STILL BLOCKING the multi-node proofs, both scoped: (2) src/kernel-core/vms_dlm_scs.c -- the arm binding codec+FSM to SCS -- is ABSENT (4 declared entry points, no implementer, no caller), and needs a cnxman send-to-CSID entry plus a DLM leg in the receive route; (3) the DLM codec is FRAME-ABSOLUTE (offsets 80/81/92/96/102/118+, and it takes a struct vms_frame_info) while the only inbound path, cnxman_vc_message(), delivers a 132-byte SYSAP BODY -- the E73 class of mismatch -- so body-relative entry points must be added before any DLM frame can be parsed on receive. The frame-level entry the FSM header cites (cnxman_barrier_rx_frame) does not exist."
    notes: >
      The former "remain absent" cluster of the DLM epic. The code implements each
      part below and was originally proven on a live multi-node /dev/vms rail, but
      those multi-node proofs (the run_dlm_harness_* QEMU harnesses referenced below)
