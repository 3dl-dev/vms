# System Logical Name Definitions
# Format: TABLE LOGICAL_NAME EQUIVALENCE [ATTRIBUTES]
# Loaded by LNM daemon and init script on startup

SYSTEM SYS$SYSTEM /vms/sys$system
SYSTEM SYS$LIBRARY /vms/sys$library
SYSTEM SYS$MANAGER /vms/sys$manager
SYSTEM SYS$HELP /vms/sys$help
SYSTEM SYS$SCRATCH /tmp
SYSTEM SYS$NODE OVMX
SYSTEM TT /dev/tty
SYSTEM SYS$DISK /
SYSTEM DECW$DISPLAY /dev/null
SYSTEM SYS$OUTPUT /dev/tty
SYSTEM SYS$INPUT /dev/tty
SYSTEM SYS$ERROR /dev/tty
SYSTEM SYS$COMMAND /dev/tty
SYSTEM SYS$SYSROOT /vms
SYSTEM SYS$SYSDEVICE /

# ---------------------------------------------------------------------
# Login banners (LOGINOUT).
#
# SYS$ANNOUNCE is displayed BEFORE the "Username:" prompt.
# SYS$WELCOME  is displayed AFTER a successful login.
#
# Both are left UNDEFINED here, as OpenVMS ships them: with no SYS$WELCOME
# the built-in OVMX banner is displayed, and with no SYS$ANNOUNCE nothing
# is displayed before the prompt. Uncomment to override.
#
# An equivalence string beginning with '@' names a FILE whose contents are
# displayed -- use that for a multi-line banner.
#
# SYSTEM SYS$ANNOUNCE Unauthorized access is prohibited.
# SYSTEM SYS$WELCOME  @SYS$MANAGER:WELCOME.TXT
