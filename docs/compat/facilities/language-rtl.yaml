facility: language-rtl
name: "Language-specific run-time libraries (FOR$/COB$/BAS$/PAS$)"
domain: languages
vms_ref: "VSI OpenVMS language RTL references"
scope_1_0: undecided
plan_ref: vms-082
summary: >
  Each VMS language ships a run-time library its compiled code links against
  (I/O, intrinsics, string/array support). None of the language-specific RTLs
  exist in OVMX — grep on origin/main for FOR$/COB$/BAS$/PAS$/PLI$ across src/**
  returns 0 files. The language-INDEPENDENT RTLs they build on (LIB$/STR$/MTH$/
  OTS$) are catalogued in domain A and are the shared floor these would sit on —
  itself only partial, and short exactly the pieces the language RTLs need.
