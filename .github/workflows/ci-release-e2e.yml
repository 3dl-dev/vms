          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: boot_scsnode_hostname_e2e SKIPPED in CI — this gate must actually run the real boot, never skip silently." >&2
            exit 1
          fi
          exit "$rc"

  # -----------------------------------------------------------------------
  # Job 2d: cluster params authored at SYSBOOT> -> booted system reflects them
  # (vms-46c gap #2, conversational boot)
  #
  # The conversational-boot MECHANISM (SYSBOOT> halts pre-banner on the boot
  # flag; SHOW/SET/USE/WRITE/CONTINUE against SYS$SYSTEM:OVMXVMSSYS.PAR) landed
  # with vms-b81; test_sysboot_conversational.sh (boot-smoke job above) proves
  # it for a STRING parameter and the pre-banner/persistence semantics. THIS
  # gate proves the part that does not: a NUMERIC cluster-identity parameter
