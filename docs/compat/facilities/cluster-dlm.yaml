  - id: cluster-dlm$mixed-single-master
    kind: feature
    status: implemented
    authenticity: real
    vms: "Mixed cluster, ONE master per resource, at ANY LOCKDIRWT: an OVMX $ENQ resolves a root resource's directory node through the weight vector and goes there -- a real VMS member included -- and a VMS member's $ENQ on a resource OVMX masters is served by OVMX (Davis p. 6-31 outcomes (a)/(b)/(c), p. 6-51)"
    evidence: src/kernel-core/vms_lock.c
    verified_against: "tests/cluster/host/test_dlm_mixed_master.c (R1, the widest in the directory: the REAL engine + the REAL CLUB's weight vector + the REAL directory table + the REAL requester FSM + the REAL codec on one path. At the V7.3 DEFAULT LOCKDIRWT 0 on every member: an OVMX-first name the vector directs AT THE VAX leaves as exactly one op-0x01 addressed there, carrying the value vms_dlm_name_hash_proven() computes for the resource's identity at body[128:132] and that identity at body[44:48], with nothing granted locally; a name the same vector directs HERE is mastered here. The VAX-first direction -- the resource's master is the VAX, this node did NOT master it twice, the request carries the hash THE VAX put on the wire, the grant lands and the local process holds EX; the OVMX-first direction -- the mastery is recorded in this node's own directory under the full identity, the VAX's lookup is answered SELF, its EX queues, NOQUEUE is DENIED, and the local $DEQ leaves the lock granted FOR the VAX's CSID; a VAX convert takes its resource from the LOCK it names, not from the frame's stale span; the departure -- exactly the departed CSID's locks released and the local waiter granted EX. NEGATIVE CONTROLS in the same file: an empty directory still masters locally, and an identity OUTSIDE THE PROVEN COVERAGE of the resource-name hash (supervisor mode) puts ZERO frames at the VAX while still granting the lock locally and counting it. tests/cluster/sim/scenarios/dlm_mixed_evacuation.c (R2: both systems' independently built vectors name the SAME directory node for all 65536 keys and the work really is split 32768/32768; an OVMX-first name whose directory is the VAX reaches a scripted VAX DIRECTORY which checks both that it arrived at the node its OWN vector names and that the value is the one the identity hashes to, then answers -- 0xf9 completes the $ENQ by assuming mastery, 0xf8 records the master and re-addresses; then the evacuation sequence on the virtual clock through the shipping FSM's retransmit beat). tests/cluster/host/test_lock_dir.c (the engine: computed-else-learned, the computed value IS the function's output, the same value in any membership, the wire overriding a computed value and counting it -- AND THE BOOT-CRITICAL FLOOR, which is what PR #1578's lab regression cost: with a cluster stack bound, in all three vector states (no committed vector, every entry ours, another system named), a $ENQ on every name length 1..31 at every access mode succeeds, 124 combinations, with nothing on the wire for the ones that cannot be routed). tests/cluster/host/test_dlm_dir.c (the table, keyed by exact identity). tests/cluster/host/test_dlm_scs_arm.c (the arm's gate placement, and that the BLKAST gate is NOT widened). Negative controls: tests/cluster/host/host_defects.sh dlm-own-directory-not-consulted, dlm-dir-matched-by-name-alone, dlm-engine-extrapolates-the-hash, dlm-hash-coverage-claims-too-much -- each reddens exactly its named assertion set. NOT PROVEN HERE: the real-VAX lab leg (rd vms-025/vms-db2a/vms-b5b0 done-conditions)."
    notes: >
      rd vms-025 + vms-db2a + vms-c27 condition 3 (rd vms-4d3), generalised and the
      interim retired by rd vms-b5b0. MEASURED HOLE, both horns: vms_lock.c's
      dir_resolve() answered "this node" for every name while any member was
      non-OVMX, and the local $ENQ path never consulted the directory entries THIS
      NODE HOLDS -- so a real VAX that locked a name first (its lookup answered and
      recorded here, naming the VAX) and a local $ENQ on the same name gave TWO
      masters for one resource; and the other way round, a VAX's lookup for a name
      this node already mastered was answered "you master it", making the VAX a
      second master.
      WHAT THE INTERIM WAS, AND WHAT RETIRED IT. The first fix was confined to a
      configuration -- every real VMS member at LOCKDIRWT 0 and the OVMX member above
      0, which makes the committed weight vector consist entirely of OVMX entries, so
      a directory decision needed no resource-name hash at all. That confinement, the
      all-OVMX gate on routing, and OVMX's own stand-in directory hash are all GONE:
      the VMS resource-name hash is determined and PROVEN (see the
      cluster-dlm$name-hash row), so the vector is consulted PER RESOURCE in every
      configuration and ONE function decides a resource's directory node cluster-wide.
      HOW A RESOURCE IS ROUTED, in one line, and every term is an executive read: the
      value is the one some system in this cluster put on the wire for that exact
      resource identity if this node holds it, else the one vms_dlm_name_hash_proven()
      computes for the identity; the directory node is ldwv[(value >> 16) mod n]; the
      directory is consulted if it is this node, and the request is addressed there if
      it is not. When this executive can produce NEITHER a value NOR a vector answer,
      the resource is mastered on THIS NODE ONLY -- see the fourth honest gap below.
      THE RESOURCE IDENTITY IS NOW PART OF THE NAMESPACE (rd vms-b5b0, closing this
      row's own former gap 3). A VMS resource name is qualified by the enqueuing
      process's UIC group -- 0 for a LCK$M_SYSTEM name -- and by the access mode
      ($ENQ, system services reference), and the same two values are the resource's
      identity on the wire (body[44:46], body[46]). The engine carries them on every
      resource block, matches on them in every lookup, writes them on every frame that
      names a resource, and files a learned hash under them: the directory no longer
      answers across resource domains, and the hash a frame carries is a value OF the
      identity beside it. A cross-node request that does not state an identity is
      REFUSED by the master door; a CONVERT states none (a real VAX leaves that span
      stale) and takes its resource from the lock its own handle names.
      WHAT IS ASSERTED ON THE WIRE, all of it an executive read at the moment of the
      frame (INV-6): the op-0x01/0x07 request to the master or the directory node,
      carrying the resource's identity and the value this executive holds for it; the
      GRANT and DENY replies, built from the LKB the engine just stamped; and the
      directory's own 0xf9/0xf8 answers. Nothing is echoed frame-to-frame. RULE C now
      admits exactly four REQUEST shapes at a member this executive cannot prove runs
      this implementation (op-0x01, 0x07, 0x06, 0x03 -- each grounded on real
      VAX<->VAX traffic with no span OVMX would have to invent), asked of the codec
      per frame and applied by the connection manager per destination.
      HONEST GAPS, NOT PAPERED, each with its own counter: (1) the BLOCKING AST
      (op 0x05) is still NOT emitted at a system that has not proved it runs this
      implementation -- its mode-context pair at body[30:32] is observed and not
      pinned, so OVMX would have to write a zero where every real frame carries data;
      the engine's decision is real and proven, the frame is withheld and counted
      (blkasts_no_wire_op), and a source-scan assertion keeps the gate from being
      widened without a capture. (2) A DEFERRED GRANT is not originated: a cat-0x82
      grant at a system that did not just ask breaks RULE A and no capture grounds an
      uncorrelated grant (deferred_grants_no_wire_op counts what the master owes). So
      a VMS member QUEUED at an OVMX master is granted in this executive's lock
      database and learns of it on its next request, not from an unsolicited frame.
      (3) A RESOURCE THIS EXECUTIVE CANNOT ROUTE is mastered on THIS NODE ONLY, not
      refused and not routed (rd vms-b5b0, after PR #1578's lab run: refusing reached
      the ACP and killed STARTUP.COM, which is the answer Baron's ruling on rd vms-dc2
      calls "NEVER"). Two ways to get there, two counters, and the first of each is
      announced on the console: no committed weight vector at the moment the resource
      was first locked (vms_lock_dlm_dir_no_vector -- a node forming or joining, or a
      transition in flight; p. 6-33 discards directory information at Phase 1), or no
      provable value for its identity (vms_lock_dlm_dir_hash_uncovered). NOTHING goes
      on the wire for such a resource, so this node asserts nothing about it to
      anybody; the residual is that if a real VMS member masters the same resource
      there are two masters for it until a rebuild re-masters (FC-P5.3..5.5). That is
      the pre-proof floor, now narrow, counted and announced rather than silent.
      (4) A SUB-RESOURCE is not routed by a hash of its own: only a tree's ROOT is
      looked up (p. 6-31/6-32), and a resource block has a parent here only when the
      parent lock is a real LOCAL lock -- which means this node masters that tree, so
      it masters the sub-resource. A $ENQ under a PROXY parent is named at the root
      instead. No value is ever computed for a sub-resource (its value is a property
      of its parent too, rd vms-4fb finding 3, and none was ever captured).
      Every frame this node puts in front of a system it cannot prove runs this
      implementation is counted separately (cnxman's dlm_mixed_sends).
  - id: cluster-dlm$grant-correlation
    kind: feature
    status: implemented
    authenticity: real
    vms: "A master's answer to a remote $ENQ is a frame the REQUESTER CAN CORRELATE: it returns the requester's own lock handle unchanged, assigns the master's handle in the master's slot, carries the grant record whose body[34]=0xfa is the outcome, returns the master resource's value block, and carries no granted mode (a grant means the mode that was asked for)"
    evidence: src/kernel-core/vms_cluster_codec_dlm.c
    verified_against: "tests/cluster/host/test_codec_dlm.c test_real_grant_is_reproduced (R1, THE ACCEPTANCE PROOF: a REAL OpenVMS VAX V7.3 master's grant and the request it answered 155 us earlier, both captured off the same wire and carried as the fixtures dlm-real-enq-request / dlm-real-enq-grant with the loader's clean-room custody check; OVMX's builder reproduces that grant on 126 of 132 body bytes -- every byte this codec owns. The six it does not write are body[0:4], the connection manager's transaction envelope, and body[52:54], an SCS-layer word: both asserted to be left ZERO rather than minted). tests/cluster/host/test_dlm_echo_guard.c (R1, the echo guard driven by the REAL storm bytes: the captured request/answer pair replayed a thousand times yields exactly VMS_DLM_ECHO_MAX_SAME answers and then silence, counted, with the console line raised once; a dialogue that MOVES is never capped at 5000 frames; the cap is per-system and a crowd of other systems cannot flush it). tests/cluster/sim/scenarios/dlm_mixed_evacuation.c a_grantable_remote_request_is_answered_correlatably (R2, the lab configuration exactly: an OVMX process holds NL, a VMS member asks EX, the engine grants at once and the frame built from the request carries the VMS node's own handle back while OUR handle sits in the master's slot). tests/cluster/host/test_dlm_scs_arm.c (the echo guard is asked on the ONE path every reply passes through, and a withheld answer is counted). Negative controls: tests/cluster/host/host_defects.sh dlm-grant-handles-swapped, dlm-grant-record-omitted, dlm-echo-guard-never-caps -- each reddens exactly its named assertion set. NOT PROVEN HERE: the real-VAX lab leg (a booted OVMX master granting a real VAX's $ENQW with zero retransmits, rd vms-b5b0's done-condition)."
    notes: >
      rd vms-b5b0, after a MEASURED request storm in the 2026-10-09 evacuation lab.
      WHAT HAPPENED. An OVMX process took NL on EVAC$WORKLOAD, so OVMX mastered it;
      ten seconds later VAX1 $ENQW'd EX. NL conflicts with nothing, so the request was
      grantable at once and OVMX answered -- but its answer carried the two lock
      handles in each other's slots, no grant record (so body[34], the outcome byte,
      read 0x00, a value no real answer carries) and the granted mode in a byte every
      real grant clears. VAX1's own handle appeared NOWHERE in the frame, so it could
      not match the completion to its lock: it re-sent the same request 65,356 times
      in 63.7 s (1026/s, median gap 0.362 ms) and OVMX answered 65,340 of them. No
      bugcheck on either VAX -- an operator stopped it.
      WHAT THE SLOTS REALLY ARE. body[20:24] is the MASTER's handle and body[24:28]
      the REQUESTER's. The earlier reading came from SDA SHOW LOCKS, which reports a
      lock id without saying which node it lives on; the capture settles it two ways:
      36 of 36 op-0x03 releases name their lock at body[20:24] with the value the
      master's grant returned, and a requester's very first frame already carries its
      own handle at body[24:28], before any master could have told it. This CORRECTS
      two rows of docs/cluster-protocol-spec.md 4(f).1 that were marked GROUNDED
      byte-exact vs SDA; the byte values in them are unchanged, only which side each
      belongs to.
      AND A GRANT CARRIES NO MODE. body[30] is cleared in 38 of 38 real grants. The
      granted mode is therefore read off THIS node's own proxy LKB -- the mode the
      lock asked for -- and never taken as a zero off the wire, which would have
      granted NL to a lock that asked for EX.
      THE GRANT RECORD IS THE GRANT'S, NOT A VALUE-BLOCK MARKER. It rides on every
      grant including grants whose block is all zero, so it cannot mark the block's
      presence; the block is body[36:52] either way, which a real c2-seq grant proves
      by returning the exact 16 bytes the requester had written (the dlm-grant-valblk
      specimen, vms-727's read crossing). That span OVERLAPS a request's identity and
      first name bytes -- the two layouts never co-occur, and "clearing the name
      length" on a grant destroys five bytes of the block.
      HOW A GRANT IS BUILT NOW, and this is the structural fix: the master ECHOES THE
      REQUEST and overwrites only what a grant owns. Every other byte in the frame --
      the requester's handle, the directory hash, the stale tail of its own buffer --
      is the REQUESTER's own, handed back. A builder that lays out fields itself can
      put them in the wrong slots; one that echoes cannot.
      THE ECHO GUARD (src/kernel-core/vms_dlm_echo_guard.c), the teeth that make this
      failure class self-limiting whatever causes it next: a reply is staged only
      while the (requester, request bytes, answer bytes) triple keeps CHANGING. Once
      it repeats more than VMS_DLM_ECHO_MAX_SAME times in a row this node STOPS
      ANSWERING that requester's identical request, counted (answers_capped) and said
      once on the console. Any change resets the run, so a retransmit answered
      identically a few times and a rebuild burst of hundreds of DIFFERENT records are
      untouched. The bound is an OVMX DESIGN VALUE, not a VMS one -- no published VMS
      limit exists and none was reverse-engineered (Rule 8) -- chosen above every
      retransmit ladder observed on this cluster's wire. It is a sameness rule rather
      than a rate limit because a rate limit has to guess what "too fast" is for a VAX
      on a quiet LAN. Withholding an answer asserts nothing about another system's
      state (INV-6): the requester's own ladder and timeout decide what follows,
      exactly as if this node had crashed.
  - id: cluster-dlm$name-hash
    kind: feature
    status: implemented
    authenticity: real
    vms: "The DLM resource-name hash: the value a directory lookup carries at body[128:132] and the index into the Lock Directory Weight Vector (Davis p. 6-49/6-50) -- computed for a root resource inside the PROVEN COVERAGE, refused outside it"
    evidence: src/kernel-core/vms_dlm_hash.c
    verified_against: "tests/cluster/host/test_dlm_hash.c (R1: 963 derivation rows + 253 HELD-OUT rows frozen in the corpus commit before any derivation + a 533-key FORWARD PREDICTION from a capture that did not exist when the function was frozen, all reproduced exactly; the 81 pre-registered triples of the driven run agree with the C function; and the three PROVEN-COVERAGE constants are DERIVED in the test from the corpus and the driven run's score, so a hand-widened mask reddens). Lab: tests/lab/captures/vms-c6e-heldout-20261008/ -- a real OpenVMS VAX V7.3 driven with 81 (name, mode, group) triples whose predicted values were committed and pushed BEFORE the VAX was asked to lock anything: 55 observed on the wire, 55 MATCH, 0 MISMATCH, 26 never put on the wire, plus 541 further live root values on the same capture all matching. Negative controls: tests/cluster/host/host_defects.sh dlm-hash-empty-name-not-refused, dlm-hash-coverage-claims-too-much, dlm-engine-extrapolates-the-hash."
    notes: >
      rd vms-66fe (the determination), rd vms-c6e (the held-out proof), rd vms-b5b0
      (routing on it). PROVENANCE, and it is the whole reason this row may exist:
      Baron's ruling on rd vms-dc2 (2026-10-08) extends Rule 8's scope exactly far
      enough to permit determining this one function BLACK-BOX from the (name, value)
      pairs real OpenVMS nodes broadcast IN THE CLEAR on every directory lookup, and
      from nothing else -- never from a VSI/HPE binary, a disassembly, a listing or
      source. The determination used 963 such pairs and was then proven on 253 held
      out of it, on a 533-key capture written after the function was frozen, and on a
      driven real-VAX run whose predictions were committed first.
      Method, hypothesis by hypothesis: docs/design-dlm-name-hash.md.
      THE PROVEN COVERAGE IS A MEASUREMENT, NOT A POLICY, and outside it NO FRAME IS
      BUILT: access modes 0, 1 and 3 are observed and SUPERVISOR mode (2) is not; UIC
      groups 0, 1, 300 and 16382 are observed, which exercises group bits 0..13, and
      bits 14/15 are not; every name length 1..31 is observed except 23 and 29 (both
      pre-registered in the driven run and never put on the wire by the VAX). A WRONG
      value costs the cluster -- it makes the directory node scan the wrong chain,
      miss the name and install the sender as master of a resource somebody else
      already masters, at 35 frames a second (memory cluster-promotion-gap). The two
      length gaps close with one lab errand (lock a 23- and a 29-character root name
      on a real VAX and score the capture); the mode and group gaps need a driven run
      that exercises them.
      WITHHOLDING A FRAME IS NOT REFUSING THE CALLER, and conflating the two broke a
      booted node (rd vms-b5b0, PR #1578's lab run): with a cluster stack bound the
      engine answered SS$_UNSUPPORTED to its own ACP -- 74 file operations failed with
      3658 and STARTUP.COM died on "%RMS-E-FNF, error opening
      SYS$STARTUP:VMS$VMS.DAT", looping until DCL was OOM-killed. Baron's ruling on
      rd vms-dc2 had already judged that answer ("option (B) ... NEVER"). So a
      resource whose identity is outside the coverage is MASTERED ON THIS NODE ONLY
      (option A, honestly labelled), the fallback is COUNTED
      (vms_lock_dlm_dir_hash_uncovered) and the first one is ANNOUNCED on the console
      -- "%DLM, resource-name hash coverage: ... mastered on THIS NODE ONLY". ONE
      configuration needs no value at all: when every entry of the committed vector is
      this node's, "value mod n" cannot select anyone else, so the resource is still
      resolved correctly and still goes through this node's own directory table
      (vms_ldwv_directs_everything_here, p. 6-32).
      THE LIVE FALSIFICATION DETECTOR. The function is a determination, not a theorem,
      so the executive checks it in production: a frame naming an identity this node
      had already COMPUTED a value for, and carrying a different value, makes the WIRE
      value win and raises vms_lock_dlm_dir_hash_computed_wrong(). It must read 0 on
      every real cluster; a nonzero reading means the coverage masks claim more than
      the evidence carries.
      SUB-RESOURCES ARE OUT OF SCOPE: a sub-resource's value is a property of its
      parent too (rd vms-4fb finding 3), so no pair can be learned for one and none
      was used. This function answers for ROOT resources only, and the engine never
      calls it for a resource with a parent.
  - id: cluster-dlm$scs-transport
    kind: feature
    status: implemented
    authenticity: real
    vms: "DLM SYSAP SCS connection + lock-request message class (ENQ/GRANT/DEQ/BLKAST/REBUILD/DLKSRCH) between cluster nodes"
    evidence: src/kernel-core/vms_cluster_codec_dlm.c
    verified_against: "tests/cluster/host/test_codec_dlm.c (DLM frame encode/decode + op validators: ENQ/GRANT/DENY/CONVERT fixture round trip + the op-0d rebuild-record echo); tests/qemu/test_syssvc_dlm_xnode.c (the receive handler GRANTS/QUEUES/DEQs and delivers BLKAST on a real /dev/vms executive, rungs 2/3/H5/H6). (The former run_dlm_harness_h0.sh..ec75 QEMU harnesses were retired with the userspace SCSD daemon in the executive-resident pivot, #1052. NOTE — the REBUILD-on-remaster and DLKSRCH distributed-deadlock op HANDLING those harnesses exercised at runtime on real /dev/vms has no equivalent successor test today; see the cluster-dlm remaster-lvb-deadlock row.)"
    notes: >
      vms-94c rung 1, extended through H11. A DLM message rides as a p.4-13 SCS
      application message (MTYPE 10) with its body at SCA content offset 58 (the
      scs_mscp.c nesting). The transport is real and the receive handler GRANTS,
      QUEUES, delivers BLKAST, rebuilds on remaster, and runs the deadlock search —
      the full ENQ-class op set is handled on a real /dev/vms executive (single-node
      dispatch, tests/qemu/test_syssvc_dlm_xnode.c); the H0..H11 multi-node QEMU
      harnesses were retired in #1052 with no multi-node successor (vms-1ee).
    wire_format:
      provenance: >
        TWO provenance classes, kept distinct (Rule 8). (A) SEMANTIC field
        VALUES are authentic OpenVMS $LCKDEF from src/libvms/include/lckdef.h,
        oracle-pinned by LIBRARIAN + MACRO-32 on the OpenVMS VAX V7.3 oracle:
        lock grant modes LCK$K_NLMODE..LCK$K_EXMODE (0..5), $ENQ flags LCK$M_*,
        and the 16-byte value block (LCK$C_VALBLK_LEN). The public $ENQ/$DEQ
        interface (System Services Reference; Programming Concepts, Lock
        Management) and the directory/master resolution ALGORITHM (VSI OpenVMS
        Cluster Systems manual; IDSM lock-management chapter, documented 3-case
        directory lookup) define what a request carries and how it routes.
        (B) The BYTE LAYOUT below is a LABELLED OVMX DESIGN CHOICE — VSI/HPE do
        NOT publish the lock manager's SCS message byte layout and Rule 8 forbids
        disassembly. As with docs/design-link-native-toolchain.md, OVMX defines
        its own self-describing layout, uses it OVMX<->OVMX, and will replace it
        with the authentic layout once a real VAX DLM capture is obtained on the
        reference lab (the field SET is stable; only the offsets change). NOT
        VMS-authentic; never described as such.
      transport: "Ethernet(14) + NISCA seq-msg header [0:42] + SCS envelope [42:58] (MTYPE 10, Con.ID pair) + DLM body [58:138]. Header+envelope byte-identical to every SYSAP application message."
      opcodes: "OVMX-derived: ENQ=1, GRANT=2, DEQ=3, BLKAST=4, REBUILD=5 (H10b remaster lock rebuild), DLKSRCH=6 (H11 distributed deadlock search, SEARCH/VICTIM)."
      body_layout: >
        OVMX-derived, little-endian, body-relative offsets (body base = SCA
        content 58): [0]u8 op; [1]u8 mode (LCK$K_); [2:4]u16 flags (LCK$M_);
        [4:8]u32 requester lock handle; [8:12]u32 master lock handle;
        [12:16]u32 VMS status; [16:20]u32 requester CSID; [20:24]u32 master CSID;
        [24]u8 namelen(0..31); [25]u8 parent-present; [26:28]u16 reserved;
        [28:32]u32 parent lock handle; [32:48] 16-byte value block;
        [48:80] 32-byte resource name. Body length 80; SCA content length 138.
        (H10b/H11 reuse this frame; the deadlock search carries the initiator,
        chased-holder, and running-min victim ids in the handle/CSID and value-block
        slots — an OVMX design choice, Rule 8.)
