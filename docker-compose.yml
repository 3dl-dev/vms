services:
  ovmx:
    build: .
    image: ovmx:latest
    ports:
      - "127.0.0.1:2222:22"
    stdin_open: true
    tty: true
    restart: unless-stopped

  build:
    build:
      context: .
      target: builder
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/src
    working_dir: /src
    entrypoint: ["bash", "-c"]
    command: ["cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_TOOLS=ON && cmake --build build -j$(nproc) && cd build && ctest --output-on-failure"]
    profiles: ["dev"]
