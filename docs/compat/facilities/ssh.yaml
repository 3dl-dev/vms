# Source of truth for the SSH row of the Compatibility Surface Register.
# SSH is a VSI OpenVMS surface (OpenSSH shipped as part of TCP/IP Services),
# downstream of TCP/IP Services. It rides the executive BGn: socket path.
facility: ssh
name: "SSH remote login"
domain: networking
vms_ref: "VSI OpenVMS TCP/IP Services — SSH server (OpenSSH port)"
scope_1_0: in
plan_ref: vms-9ef
summary: >
  The SSH SERVER itself is not yet present. The faithful target (rd vms-9ef) is
  the REAL upstream OpenSSH port compiled NATIVELY on the TCP/IP + OVMX
  substrate (VMS C-RTL / DECC$SHR, the DECC$SOCKET/$QIO BGn: socket surface, a
  VMS PTY, and the genuine network-login -> LOGINOUT -> DCL path), shipping
  inside the TCP/IP Services kit. That port does not yet build, because the
  substrate it needs is still being built up (rd vms-9ef tree, R1-R4).
  An earlier hand-rolled stand-in — VMSSSHD.EXE plus a --wrap veneer over an
  OpenSSH binary and a $CREPRC(LOGINOUT) handoff shim — was RETIRED (rd
  vms-d916) because it was LARP, not the real port: green-of-a-stand-in counts
  as nothing (INV-6). What DOES exist and is unit-tested are the substrate seams
  the real port will bind: the ordered fail-closed credential drop
  (cred_drop.c) and the fail-honest executive identity (ssh_ident.c) — both
  already consumed by the TCP/IP inetd per-service run-as drop — plus the OVMX
  TERM->device mapping (term_map.c), unit-tested but not yet wired into a
  production caller, and, in the executive, the network-login pre-auth
  stamp (VMS_IOCTL_TERM_SETLOGIN/GETLOGIN, vms-65b) and the BGn: server socket
  path (bind/listen/accept over genuine $QIO, vms-698). The capability is
  reported honestly as not-yet-present rather than as a green facade.
last_reviewed: 2026-09-15
