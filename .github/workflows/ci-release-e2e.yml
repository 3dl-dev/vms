  # -----------------------------------------------------------------------
  # Job 2e: @CLUSTER_CONFIG_LAN.COM authors cluster identity -> reboot ->
  # adopted (vms-23b9 rung 1, the V0.7 "clustering done" gate)
  #
  # A USER configures THIS node's cluster identity by running the DOCUMENTED
  # VMS-faithful operator procedure -- @SYS$MANAGER:CLUSTER_CONFIG_LAN.COM, the
  # CHANGE path from docs/cluster-configuration-guide.md -- INTERACTIVELY over
