  - id: utilities$sort
    kind: utility
    status: implemented
    authenticity: real
    vms: "SORT — record sort utility with /KEY=(position,size,datatype)"
    evidence: src/vmsdcl/dcl_cmd_misc.c:194
    notes: "SORT/KEY=(POSITION:n,SIZE:m[,DESCENDING]) sorts on the [pos,size] field, not the whole line (dcl_cmd_misc.c:199-201); /KEY is a declared CDU_VT_LIST qualifier and is no longer silently ignored (vms-e76, facade-risk -> real). /REVERSE and whole-line (no /KEY) unchanged. Documented gaps, not facades: secondary keys (multiple /KEY tie-breaking) use the first key only, and MERGE is a separate absent utility."

