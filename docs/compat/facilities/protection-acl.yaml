# Source of truth for the protection-acl row of the Compatibility Surface Register.
facility: protection-acl
name: "File Protection (SOGW/UIC) + ACLs"
domain: system-management
vms_ref: "OpenVMS Guide to System Security ch. 5 (Protecting Data)"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  SOGW/UIC protection is kernel-enforced and real for the common case. The
  Delete bit is advisory-only. $CHKPRO computes correctly but nothing calls
  it. The legacy $CHECK_ACCESS 2nd-opinion routine was deliberately removed
  (vms-2b8) rather than left as a facade — a precedent, not a gap. ACLs are
  undefined beyond constants. SYSPRV/BYPASS/READALL override is absent
  (cross-ref privileges).
last_reviewed: 2026-08-13
