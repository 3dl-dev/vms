              export CC=gcc ARCH=x86_64 WORK=/tmp/dcl-native-x86_64 DCL_EXPECT_LINK=1
              sh /src/src/imgact/test/run_dcl_native.sh
            '

  # -----------------------------------------------------------------------
  # LOGINOUT-native (vms-c39, pillar vms-ade, sibling of dcl-native above).
  # tools/vms_login.c links as a VMS-native ET_DYN executable via LINK.EXE
  # --executable --use {DECC$SHR + the six OVMX shareables} (mk_loginout.sh) --
  # the OTHER real EXECUTABLE consumer of the graph, closing the gap Baron's
  # 2026-08-06 ruling found: the 0.1 dynamic-linking proof covered DCL.EXE only,
  # not the full login chain. IMGACT.EXE activates LOGINOUT.EXE and it
  # authenticates SYSTEM against the REAL shipped SYSUAF.DAT, entirely inside
  # the VMS-native image, with NO ld / NO ld.so. With no /dev/vms in this
  # container it correctly refuses the session (%OVMX-F-NOIDENT) rather than
  # faking success into DCL.EXE -- CLAUDE.md Rule 9's "fail honestly", not a
  # test limitation. See run_login_native.sh's header for the full proof shape
  # and what is left for a QEMU harness to extend.
  # -----------------------------------------------------------------------
  login-native:
