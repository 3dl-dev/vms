    evidence: src/vmsdcl/dcl_cmd_misc.c
    notes: "Slice exercised by tests/dcl/test_differences.sh (not a full-coverage oracle)."

  - id: utilities$convert
    kind: utility
    status: partial
    authenticity: facade-risk
    vms: "CONVERT — file/record-format conversion utility"
    evidence: src/vmsdcl/dcl_cmd_misc.c:2604
    notes: "/FDL now emits an honest %CONVERT-I-FDL 'accepted but ignored' informational, but the body is still a line-by-line fgets/fputs copy that then prints '%CONVERT-S-CONVERTED, N records converted' — reporting a record-format conversion it did not perform. Still facade-risk."

