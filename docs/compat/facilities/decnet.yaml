  - {id: decnet$nsp-transport, kind: protocol, status: implemented, authenticity: real, vms: "NSP transport codec + live logical link — Connect Initiate/Confirm, Link Service (flow-control credit), Data, Ack, teardown PDUs", evidence: "src/vmsdecnet/nsp/dnet_nsp.c", verified_against: "rd vms-a70: a live NSP logical link ran END-TO-END, BIDIRECTIONALLY, against a real OpenVMS VAX V7.3 (tests/lab/captures/decnet-sethost-dcl-20260911/) — CI -> CC -> Link Service credit-grant/ack -> multi-segment Data both directions -> data-ack -> Disconnect Initiate/Confirm clean teardown. Connect Initiate also byte-identical against docs/decnet-provenance-register.md sec 4.6 specimen #3.", notes: "The live transport engine (src/vmsdecnet/engine) NOW drives a real logical link over the datalink; the CC / Link Service (MSGFLG 0x10) / Data / Ack / DI / DC PDUs are all wire-exercised against a real VAX (were previously self-round-trip only). Link Service added rd vms-a70 (the client's post-CC credit grant, ACKNUM from real link state, INV-6). Tested tests/vmsdecnet/test_dnet_nsp.c + test_dnet_link.c (rd vms-6986)."}
  - {id: decnet$datalink, kind: feature, status: implemented, authenticity: real, vms: "NETACP Ethernet datalink — Phase IV routing (ethertype 0x6003) over the node's circuit, sourced from the algorithmic station address AA-00-04-00-<LE16(area*1024+node)>", evidence: "src/kernel-core/vms_l2.c", notes: "rd vms-1f69. On the booted runtime NETACP (DECNETD.EXE) opens its raw L2 datalink THROUGH THE EXECUTIVE: the kernel owns the AF_PACKET socket (VMS_IOCTL_L2_OPEN/SEND/RECV, src/kernel-core/vms_l2.c) and the open is gated on the VMS PHY_IO privilege — a booted VMS process holds no CAP_NET_RAW and needs none (the V0.7-6 %DECNETD-E-NOSOCKET EPERM is gone). The booted/static build links the executive backend ONLY (src/libdatalink ovmx_datalink_exec, CMake OVMX_DATALINK_VIA_EXECUTIVE, default ON for OVMX_STATIC on Linux): no AF_PACKET code is in that image, so there is no runtime fallback. L2_OPEN takes an optional STATION address the executive validates (the NIC hwaddr or the DNA Phase IV block AA-00-04-00-xx-xx, else SS$_BADPARAM; src/kernel/vms_l2_station.h) and then STAMPS as the source of every frame sent on the handle; NETACP asks for its Phase IV algorithmic address. Unicast to that address reaches the handle because L2_OPEN puts the NIC in promiscuous mode. PROVEN: station accept/refuse + the executive-stamped source observed on the wire by an ETH_P_ALL tap (tests/qemu/test_syssvc_l2_datalink.c section 6, kmod leg, real virtio NIC); booted DECNETD opening the datalink via the executive with station AA-00-04-00-2A-04 and transmitting endnode hellos, and SS$_NOPRIV without PHY_IO (shared acceptance battery, driven on lo since that VM has no NIC); policy unit tests/vmsdecnet/test_l2_station.c. NOT YET: a real VAX listing the booted OVMX node as reachable/adjacent (the dnlab-1 lab bracket), and the NetBSD/VAX substrate (exec_l2_* there are contract-only, so DECNETD on VAX keeps bpf(4)). The host/lab build keeps the AF_PACKET probe backend (CAP_NET_RAW) as an RE instrument."}
  - {id: decnet$task-to-task, kind: feature, status: absent, authenticity: n/a, vms: "Task-to-task DECnet communication (logical-link $QIO / FAL)", evidence: "docs/design-decnet-ovmx.md", scope_1_0: in, notes: "The codecs exist but the engine boundary has not moved — no socket/AF_PACKET engine binds them into a live link."}
  - {id: decnet$ncp, kind: command, status: partial, authenticity: real, vms: "NCP — Network Control Program (node/executor configuration)", evidence: "src/vmsdecnet/ncp/ncp.c", notes: "Real NCP.EXE driving a persisted database: SET/DEFINE NODE, CLEAR/PURGE NODE, SHOW KNOWN NODES, SHOW NODE, SET/SHOW EXECUTOR (ADDRESS/NAME/STATE, and MAXIMUM LINKS -- the bound NETACP sizes its inbound logical-link pool from, rd vms-f91; unset it is the VMS default 32 a real VAX shows (Baron 2026-10-08; per-node share 3, rd vms-9cd)), and SET/DEFINE/SHOW/CLEAR/PURGE OBJECT (the Session Control object registry — number/name/file, e.g. 42=CTERM, 17=FAL; rd vms-f52, dnet_objectdb), with VMS-faithful SHOW layout and honest errors. Grammar/layout from the public NCP manual (Rule 8). NOT yet: circuits, lines, counters, LOOP, and the SET(volatile)/DEFINE(permanent) split — OVMX keeps one persisted DB per entity today (counters/circuit/reachability state must be read from the live executive, never invented — INV-6). Config-only; it does not itself start the network (@SYS$MANAGER:STARTNET does, gated on the executor database NCP writes). STORAGE (rd vms-1f69, subsumes vms-20e): the executor, node and object databases persist at SYS$SYSTEM:NETNODE_LOCAL.DAT / NETNODE_REMOTE.DAT / NETOBJECT.DAT THROUGH THE VMS FILE LAYER (RMS over the Files-11 ODS-2 ACP, src/vmsdecnet/ncp/dnet_ncpstore.c), the same store NETACP reads; a write that cannot reach the file fails honestly (%NCP-E-CFGWRERR/DBWRERR naming the VMS file) — the old /etc/ovmx/decnet Linux default is gone (OVMX_DECNET_* env vars remain only as the host-test hook). The record LAYOUT inside those files is OVMX's documented text (labelled in each file's header), NOT the VMS binary indexed format (Rule 8). Booted proof: NCP SET EXECUTOR ADDRESS/NAME/STATE then SHOW EXECUTOR + F$SEARCH of NETNODE_LOCAL.DAT in the shared acceptance battery; host: tests/vmsdecnet/test_dnet_ncp_executor.sh + test_dnet_ncpstore.c."}
  - {id: decnet$node-database, kind: feature, status: implemented, authenticity: real, vms: "Persisted remote-node database + node NAME<->address resolution", evidence: "src/vmsdecnet/ncp/dnet_nodedb.c", notes: "The NCP node table: add/update/clear, case-insensitive unique node names, ascending-address SHOW ordering, and persistence (atomic save + tolerant load). Provides the name<->address resolution the SET HOST / NODE:: paths need. Persists at SYS$SYSTEM:NETNODE_REMOTE.DAT through the VMS file layer (RMS over the ACP, dnet_ncpstore; rd vms-1f69, subsumes vms-20e) — read by NCP and by NETACP's SET HOST name resolution from the same store. The record layout inside the file is a documented OVMX plain-text layout (labelled OVMX choice in the file header — NOT the VMS binary indexed format). Unit: tests/vmsdecnet/test_dnet_nodedb.c (rd vms-1e9) + test_dnet_ncpstore.c."}
  - {id: decnet$object-database, kind: feature, status: implemented, authenticity: real, vms: "Persisted DECnet OBJECT database (Session Control object registry: number/name/file)", evidence: "src/vmsdecnet/ncp/dnet_objectdb.c", notes: "The NCP object table managed by SET/DEFINE/SHOW/CLEAR/PURGE OBJECT: add/update keyed by object NUMBER, unique object names, an optional servicing FILE, ascending-number SHOW ordering, persistence (atomic save + tolerant load). The registry of Session Control objects the node offers (42=CTERM, 17=FAL, ...). Persists at SYS$SYSTEM:NETOBJECT.DAT through the VMS file layer (RMS over the ACP, dnet_ncpstore; rd vms-1f69, subsumes vms-20e); the record layout inside is a documented OVMX plain-text layout (labelled OVMX choice — NOT the VMS permanent object database binary). HONEST SCOPE: access-control fields (USER/PROXY/PASSWORD) and the volatile/permanent SET-vs-DEFINE split are filed follow-ons; this is the CONFIG surface, distinct from the executive's live runtime object dispatch (decnet$netacp-device-face). Library unit + first NCP command-dispatch tests: tests/vmsdecnet/test_dnet_objectdb.c + test_dnet_ncp_object.sh (rd vms-f52)."}
  - {id: decnet$sc-connect, kind: protocol, status: verified, authenticity: real, vms: "DNA Session Control CONNECT message — destination/source end-user descriptors + access-control fields", evidence: "src/vmsdecnet/cterm/dnet_cterm.c", verified_against: "docs/oracle/vax-sethost-cterm.pcap frame 5 (rd vms-558, real OpenVMS VAX V7.3 -> V7.3 SET HOST): the twenty connect-data bytes decode field-for-field and OVMX re-emits them BYTE-IDENTICAL, asserted in tests/vmsdecnet/test_dnet_cterm.c against the specimen array", notes: "Oracle-CORRECTED the #1013 cut, which emitted format 1 for the destination object where the real VAX sends format 0. Establishes the security fact vms-f40 rests on: the access-control fields (RQSTRID/PASSWRD/ACCOUNT) are EMPTY on a real SET HOST, so the carried node::user is PROXY/accounting info and the remote must authenticate fresh. Decoder is fully bounded against attacker-controlled bytes (truncation/over-long/unknown-format all refused) and never retains a wire-supplied password."}
  - {id: decnet$cterm-session-auth, kind: feature, status: partial, authenticity: real, vms: "Inbound SET HOST (Session Control object 42) reaches an AUTHENTICATED LOGINOUT prompt on a virtual terminal (RTAn:)", evidence: "src/vmsdecnet/cterm/dnet_cterm_hostfsm.c", verified_against: "WIRE PROTOCOL, live (rd vms-a70 direction B, tests/lab/captures/decnet-sethost-inbound-20261005/): a real OpenVMS VAX V7.3 typed SET HOST 1.44 into OVMX's COMPILED CTERM host FSM (lab harness: NSP carried by ctermprobe.py, the session a pty stand-in script, NOT LOGINOUT) -- the VAX displayed the host's prompt, sent Username and a no-echo Password, sent a command line the host received, displayed the host's output, and on logout printed %REM-S-END. Byte-level: tests/vmsdecnet/test_dnet_cterm_host.c pins the Bind Request, Characteristics, message 23, Start Read and Write encodings to the bytes real VAX hosts sent (docs/oracle/vax-sethost-cterm.pcap, tests/lab/captures/decnet-sethost-dcl-20260911/), replays a real VAX client session through the FSM, and fuzzes 200k mutated client segments under ASan/UBSan.", notes: "SESSION: an inbound object-42 connect mints an RTAn: THROUGH THE EXECUTIVE (VMS_IOCTL_TERM_CREATE -> vms_devtab_add_terminal; the executive picks the unit) and creates a process running the real SYS$SYSTEM:LOGINOUT.EXE on it via $CREPRC PRC$M_INTER|PRC$M_LOGINOUT -- the SAME primitive the console login uses (vms-3e9/vms-f881). The daemon holds no credential, spawns nothing, and the carried username reaches no decision; there is no fork/execvp/openpty anywhere above the VMS layer (standing gate tests/integration/test_creprc_session_primitive.sh check 5, both directions + negctl). The authentication proof (challenged, bad credentials REFUSED, $GETDVI RTAn: cross-process) is DECNETD.EXE --cterm-accept-test against the real /dev/vms + real LOGINOUT in the booted acceptance battery; it FAILS honestly where the executive is absent (INV-6). WIRE (rd vms-a70 direction B): NETACP's object-42 sessions no longer speak the OVMX-invented flat CTERM PDUs (which a real VMS client cannot parse, and which waited for the client to speak first). They run dnet_cterm_hostfsm, the host role as a VMS host speaks it: on link-up the HOST sends the foundation Bind Request; on Bind Accept it sends Common Data {CTERM Initiate, Characteristics INPUT-COUNT-STATE} and {CHARACTER-ATTRIBUTES ^C}; on the server's Initiate it answers with VMS message 23 and caps its segments at the server's max message; RTAn: output goes as CTERM Writes; input is SOLICITED with Start Read, the unterminated tail of the output (Username: / $ ) riding in the read as its prompt, a no-echo read when the RTAn: has echo off (the Password: read); Read Data and out-of-band characters go to the RTAn:; the session process exiting sends its last output then Unbind 02 03 00. Every decoder is bounded. Two deliberate differences from a VAX host, both honest: the Initiate advertises OVMX's real max message (1020, one NSP segment) where VAX sends 7696; and OVMX sends no VMS-private QIO-passthrough message 15 (its session reaches the host as a byte stream, so there is nothing to pass through). OVMX's own SET HOST client also reads this host (raw Write + prompt-carrying Start Read). ORIGINATING TERMINAL (rd vms-14b): a VMS server's Initiate carries its terminal in parameter 4 (beyond the spec's 1-3; the value is the documented IO$_SENSEMODE characteristics-buffer layout -- class, DT$ type, width, TT$ with page in its high byte, TT2$); the host FSM decodes it (pinned on three real VAX client Initiates: LA36/132/page 0, LA36/132/24, VT100/80/24 -- tests/vmsdecnet/test_dnet_cterm_host.c) and NETACP records type, width, page and the conveyed characteristics on the RTAn:'s executive row (VMS_IOCTL_TERM_SETCHAR, privileged, RTAn: only; TT$/TT2$ bit positions from the V7.3 node's own TTDEF/TT2DEF, docs/oracle/vax73-starlet-defs/), so SHOW TERMINAL prints Device_Type: LA36 as the oracle (vax-rta-show-terminal.txt), SHOW DEVICE/FULL 'device type LA36', and $GETDVI/F$GETDVI DEVTYPE/TT_PAGE read it back; booted proof in --cterm-accept-test and tests/qemu/test_syssvc_showterm.c. The RTAn:'s SHOW TERMINAL characteristic grid then matches the oracle RTAn:'s byte for byte (test_syssvc_showterm). Not from the wire: Interactive, VMS Style Input, DEC_CRT5, Ansi_Color (no V7.3 TT$/TT2$ bit) and Set_speed (the oracle shows it while the conveyed TT2$V_SETSPEED is 0, so its display sense is unestablished) keep their minted values; a DT$ code no oracle has spelled prints no name. NOT yet: a real VAX SET HOST into a BOOTED OVMX node, i.e. this wire FSM and the executive RTAn:/LOGINOUT session proven together live (the booted OVMX<->OVMX leg is tests/integration/decnet_set_host_live.sh on the executive CI runner); the RTAn: terminal's echo is a substrate pty echo the host discards (the server echoes, as on VMS); no CTERM-level out-of-band character set (^Y/^C arrive as read terminators)."}
  - {id: decnet$netacp-device-face, kind: feature, status: implemented, authenticity: real, vms: "NETACP presents the DECnet device face _NET: + object-dispatch as EXECUTIVE-RESIDENT, cross-process-real state", evidence: "src/kernel-core/vms_devtab.c", notes: "P5 (rd vms-9ab, design vms-515 §3.3; vms_devtab_probe_net + src/vmsdecnet/engine/decnetd.c). The DECnet device _NET: is born in the executive I/O database at module init over the same primary NIC ETH0: rides (gated on the NIC -- no NIC, no _NET:, SS$_NOSUCHDEV, INV-6), so $ASSIGN/$GETDVI _NET: from a process that is NOT NETACP resolves a real DC$_SCOM device -- the §7.5 cross-process tell, same shape as the RTAn: proof. Asserted cross-process in tests/qemu/test_kmod_devtab.c (kmod leg) and via F$GETDVI _NET: in the shared acceptance battery. Object dispatch (42=CTERM) is executive-resident and cross-process-proven by the object-42->RTAn:->$GETDVI path (decnet$cterm-session-auth). NOT yet: a standalone NCP-style enumerable object REGISTRY query (its own executive ioctl, rd vms-9ab follow-on); the wire engine binary is not yet renamed NETACP.EXE (cosmetic, tracked)."}
  - {id: decnet$wire-isolation, kind: feature, status: implemented, authenticity: real, vms: "A2/A8 isolation: attacker wire-parsing runs at LOW privilege and hands NETACP's privileged control path a VALIDATED TYPED DESCRIPTOR; the privileged path parses no attacker bytes", evidence: "src/vmsdecnet/cterm/dnet_cterm_host.c", notes: "P5 (rd vms-9ab, design vms-515 §3.4; low-priv parse dnet_conn_descriptor_from_wire in src/vmsdecnet/cterm/dnet_cterm.c, privileged consumer dnet_cterm_host_open_desc here). The low-privilege bounded parse distils untrusted NSP-connect bytes into a struct dnet_conn_descriptor carrying no wire pointer, no length, and no credential material; the privileged session-creating path (mints RTAn:, $CREPRCs LOGINOUT) takes ONLY that descriptor and refuses an unvalidated or wrong-object one BEFORE any device/process exists. Proven: the low-priv seam under 200k-frame mutation fuzz in tests/vmsdecnet/test_dnet_cterm.c (no malformed frame yields a validated/steered descriptor; every rejected frame leaves it all-zero), and the privileged double-door on the shipped binary in DECNETD.EXE --isolation-test (no /dev/vms needed), run by the acceptance battery. 'OVMX never crashes a peer': every hostile field is bounded and refused cleanly."}
  - {id: decnet$set-host, kind: command, status: implemented, authenticity: real, vms: "SET HOST — DECnet remote-node connection (outbound client): full authenticated CTERM session to a real VAX", evidence: "src/vmsdcl/dcl_cmd_set.c", verified_against: "rd vms-a70, tests/lab/captures/decnet-sethost-dcl-20260911/ — OVMX --set-host to a real OpenVMS VAX V7.3 reached an authenticated live DCL and ran commands with output returned over the link (the session's own _RTA1: process appears in its own SHOW SYSTEM output)", notes: "DCL `SET HOST <node>` activates SYS$SYSTEM:DECNETD.EXE --set-host on the CALLER'S TERMINAL through the executive image activator (dcl_activate_image -> imgact_activate, with DCL's fork fallback -- the same path RUN uses, NOT a bare fork/exec). The client (src/vmsdecnet/engine/decnetd.c run_set_host_loop) opens a REAL NSP logical link to the remote's Session Control object 42, binds a CTERM terminal session, and bridges THIS process's local terminal to it. VMS-NATIVE terminal I/O (the anti-LARP core): the client does $ASSIGN SYS$INPUT/SYS$OUTPUT + $QIO IO$_SETMODE (OVMX pass-all selector IO$K_TT_PASSALL) + IO$_READVBLK/IO$_WRITEVBLK -- NEVER tcsetattr/cfmakeraw on fd 0/1; the termios that realises pass-all lives in the executive terminal driver (src/libvms/syssvc/sys_qio.c qio_terminal_setmode), below the $QIO interface. On teardown control returns with the canonical %REM-S-END (oracle docs/oracle/vax-sethost-cterm.console.txt). The remote authenticates FRESH (the carried --user is proxy only, never auto-login). The client contains NO fork/exec/openpty/dup2. Response decoders are bounded against a hostile remote (mutation fuzz of dnet_nsp_decode/dnet_cterm_rx, tests/vmsdecnet/test_dnet_cterm.c, clean under ASan/UBSan). LIVE-PROVEN end-to-end against a real OpenVMS VAX V7.3 (rd vms-a70, tests/lab/captures/decnet-sethost-dcl-20260911/): OVMX --set-host 1.1 drove CI -> CC -> NSP Link Service -> CTERM foundation negotiation (byte-exact vs the oracle) -> real VAX LOGINOUT -> authenticated DCL -> F$GETSYI(NODENAME)=VAX1 + SHOW SYSTEM returning VAX1's live process table (incl the session's OWN _RTA1: process) -> clean LOGOUT + NSP disconnect. The earlier CTERM-BIND FACADE is RETIRED: the CTERM foundation/Bind protocol was re-grounded byte-for-byte on the real oracle (the foundation short-TLV + msgtype-9 envelope codec, the host-speaks-first negotiation FSM, the NSP link-service credit grant after CC, and prompt-gated Read Data — one line per host read-solicit), oracle-anchored in tests/vmsdecnet/test_dnet_cterm.c. NOT yet: the INBOUND direction is wire-proven against a real VAX only through the lab harness (decnet$cterm-session-auth), not yet into a booted OVMX; general task-to-task ($QIO) and the outbound COPY-over-datalink client are separate rungs."}
  - {id: decnet$node-filespec-syntax, kind: feature, status: partial, authenticity: real, vms: "NODE\"acc\"::dev:[dir]file filespec syntax", evidence: "src/vmsrms/rms_parse.c", notes: "Syntax sets NAM$M_NODE and parses/reconstructs the node prefix. DCL COPY now ACTS on it (rd vms-8c2): a NODE:: spec routes to the DECnet FAL/DAP path and, since the outbound COPY-over-datalink client is not yet wired into a DCL process, reports honestly (%COPY-I-NETNOTWIRED) rather than mis-copying it as a local file — src/vmsdcl/dcl_cmd_file.c copy_spec_has_node. The outbound COPY command layer now EXISTS at host floor (DECNETD.EXE --copy / --copy-selftest, dnet_nodespec.c splitter; rd vms-ea8/vms-6a4 — see decnet$fal); the full outbound DCL->live-datalink bridge is the tracked follow-on."}
  - {id: decnet$dap, kind: protocol, status: verified, authenticity: real, vms: "DAP (Data Access Protocol) 5.6 message codec -- generic header (FLAGS STREAMID/LENGTH/LEN256/BITCNT/SYSPEC, blocked messages) + CONFIGURATION, ATTRIBUTES, ACCESS, CONTROL, CONTINUE, ACKNOWLEDGE, ACCESS COMPLETE, DATA, STATUS, NAME; extended-attribute messages decoded+bounded", evidence: "src/vmsdecnet/dap/dnet_dap.c", verified_against: "rd vms-a8a: every real OpenVMS VAX V7.3 DAP buffer in docs/oracle/vax-copy-fal-dap.* and tests/lab/captures/decnet-fal-dap-20261004/ decodes field by field to the values VMS put there (tests/vmsdecnet/test_dnet_dap.c), and OVMX's encoder output was accepted by a real VMS FAL through a full GET and PUT (fal-ovmxclient.pcap)", notes: "Re-grounded (rd vms-a8a) on the PUBLIC DAP 5.6 spec AA-K177A-TK field types (B / EX-n / I-n) and message layouts; the vms-8c2 cut's frame was invented (FLAGS always LENGTH, fixed widths, NAME=10, OSTYPE 1) and could not talk to real VMS. OVMX advertises DAP 7.2 (rd vms-b2f: a VMS V7.3 client issues a remote RENAME only to a DAP 7+ FAL; two-link lab probe 2026-10-08) with the DAP 5.6 field layout its SYSCAP selects, and advertises in SYSCAP only sequential org + sequential FILE TRANSFER + blocking-to-response + 2-byte length. Decoder fully bounded (200k random + oracle-seeded mutation/truncation walks, ASan/UBSan): unknown trailing operand bytes from later DAP versions are ignored, segmented messages refused. DATE AND TIME (A-18 dates + RVN), PROTECTION and an empty SUMMARY are encoded and decoded (rd vms-277a, DIRECTORY/FULL). NOT served (honest): block mode, file checksum, indexed/relative, KEY DEFINITION / ALLOCATION / ACL content."}
  - {id: decnet$fal, kind: feature, status: partial, authenticity: real, vms: "FAL -- File Access Listener (DECnet Session Control object 17): inbound file COPY authenticated at connect + served/stored via RMS; the COPY node:: client", evidence: "src/vmsdecnet/fal/dnet_fal.c", verified_against: "INBOUND SERVER vs a real VMS COPY client (rd vms-d85 inbound, tests/lab/captures/decnet-fal-inbound-20261004/): OVMX's compiled dnet_fal_server_run served a real OpenVMS VAX V7.3 COPY in BOTH directions (VMS->OVMX PUT stored verbatim; OVMX->VMS GET through the DIRECTORY LIST + OPEN sequence VMS uses), pinned in CI by the replay test tests/vmsdecnet/test_dnet_fal_server.c. OUTBOUND CLIENT vs a real VMS FAL (rd vms-a8a, tests/lab/captures/decnet-fal-dap-20261004/fal-ovmxclient.pcap): OVMX's compiled dnet_fal_client_get/put, with the object-17 connect from dnet_cterm_sc_connect_build, completed a GET (records byte-identical) and a PUT (TYPE on the VAX prints them verbatim) against OpenVMS VAX V7.3, and mapped the remote file-not-found STATUS to SS$_NOSUCHFILE. INBOUND SERVER: DECNETD.EXE --fal-accept-test in the booted acceptance battery (real SYSUAF/Purdy auth, both directions over a real NSP link + RMS over the ACP, byte-verified, OVMX<->OVMX).", notes: "SECURITY SURFACE. An inbound object-17 connect CARRIES username+password in cleartext (oracle s1, protocol-mandated); FAL authenticates them through THE ONE authenticator (sysuaf_lookup + Purdy + disabled-account gate) BEFORE accepting, refuses with an NSP Disconnect on a bad password, wipes the password after the check. The connect carries FOUR counted access-control fields (user, password, account, usrdata) exactly as the real oracle frame (rd vms-a8a corrected an earlier three-field reading). DAP sequence per spec 5.1/5.2.1/5.2.2: ATTRIBUTES+ACCESS -> ATTRIBUTES..ACK; CONTROL CONNECT -> ACK; CONTROL GET/PUT RAC=sequential-file-transfer; DATA; ACCESS COMPLETE CLOSE -> RESPONSE. File I/O is rms_textfile_* (RMS over the ACP), fail-honest with no /dev/vms (Rule 9). Received records are $PUT verbatim to one RMS stream created at ACCESS time (so the NAME a VMS client requires is the real resultant spec); records sent are read as text lines. The server answers DIRECTORY LIST from RMS $PARSE/$SEARCH resultants (wildcards via RMS) and serves sequential file transfer (RAC 3) and sequential record access (RAC 0). REMOTE DIRECTORY/FULL, TYPE, DELETE, RENAME (rd vms-277a, tests/lab/captures/decnet-fal-verbs-20261008/): DIRECTORY LIST answers in the VAX FAL's shape -- one blocked segment of NAME(volume) NAME(directory) NAME(file), the ATTRIBUTES / SUMMARY / DATE AND TIME / PROTECTION messages DISPLAY asks for (filled from the real ODS-2 header via rms_file_attr; FOP/DEV/SBN and every DAP 7-only field omitted, INV-6), ACK, ACCESS COMPLETE; ACCESS ERASE ($ERASE) and ACCESS RENAME + NAME ($RENAME, the ACP's atomic MOVE) run as the FAL server process so the executive ACP decides protection. STATUS bytes for not-found (0x4032 + STV 0x0910), a protection-refused DELETE (0x4055 + STV 0x24), a protection-refused RENAME (0x405f) and a protection-refused OPEN/TYPE (answered FNF, as the VAX FAL does) are the real VAX FAL's, byte for byte; the STV values are real-VMS condition values, not OVMX ssdef numbers (rd vms-ef2). Pinned in CI by replaying all 17 captured links through the server (test_dnet_fal_server.c), and on the booted executive by --fal-proc-accept-test (GUEST refused DELETE/RENAME of a SYSTEM-only file with those bytes; SYSTEM deletes/renames its own, read back via RMS). SYSCAP advertises SUMMARY, DATE AND TIME, PROTECTION, RENAME and WILDCARD (bits 24/26/27/37/38), and DIRECTORY LIST ACKs each file only when both peers speak DAP 7+ (byte-identical to the VAX<->VAX captures; a DAP 5.6 client rejects it) -- from the live real-VAX bracket (tests/lab/captures/decnet-fal-verbs-20261008/live-bracket/, BUG_DAP 0001A006 / RMS-F-SUPPORT / RMS-F-WLD). DAP 7.2 (rd vms-b2f): a VMS V7.3 client sends a remote RENAME only to a FAL at DAP 7+, so OVMX advertises 7.2; in the 2026-10-08 live bracket at 7.2 (live-bracket/falverbs-live3-*, OVMX's compiled server under the lab driver) VAX1's RENAME, DIRECTORY/FULL, wildcard TYPE, DELETE ;*, the refused DELETE (RMS-E-PRV) and RENAME (RMS-F-RMV), and NOFILES all completed as against a VAX FAL, and a 7.2 client rejects a DIRECTORY LIST without the per-file ACK (BUG_DAP 0001A007); six of its links are replayed byte for byte in test_dnet_fal_server.c. Grounded on a second VAX-to-VAX capture (vax-to-vax-sys-login/): a VMS client resolves wildcards itself by DIRECTORY LIST and names each file (TYPE re-exchanges CONFIGURATION per file on one link, served), a DIRECTORY/FULL file whose header the user may not read is NAME + STATUS PRV then CONTINUE TRANSFER, a protection-refused OPEN is PRV 0x4055 STV 0x24, VFC files carry FSZ, and a DIRECTORY miss is named only with its directory (else STATUS alone). NOT served: wildcard OPEN/RENAME sent to the server (honest STATUS unsupported; no VMS client sends one), the VFC fixed-control bytes in DATA records, DAP 7 extras (type-18 File ID, binary dates). PERSONA (rd vms-d85, R4 G3): an inbound access is served by a SYS$SYSTEM:FAL.EXE network server process NETACP $CREPRCs with the AUTHENTICATED user's UIC + default privileges (dnet_fal_proc.c), DAP moving through two executive link mailboxes, so the executive ACP checks every file it opens against the USER -- proven by DECNETD.EXE --fal-proc-accept-test in the booted battery (the SAME SYSTEM-only file through the SAME path is served to SYSTEM and refused to GUEST; the server's executive row carries GUEST's UIC [128,129]; a GUEST PUT into SYS$SYSROOT:[SYSMGR] is refused). The process-name + mailbox link is an OVMX-labelled channel (real VMS uses SYS$NET + _NET:; the _NET: server seam is rd vms-dda). NOT yet (filed, never faked): the outbound client running from a BOOTED OVMX over the live datalink (needs rd vms-1f69, booted DECnet node); the INBOUND server reached live from a real VMS COPY (live object-17 dispatch in NETACP onto the FAL server process); block mode."}
  - {id: decnet$mail11, kind: feature, status: partial, authenticity: real, vms: "MAIL-11 -- inbound DECnet mail (Session Control object 27): a remote MAIL SEND to NODE::USER is received by a MAIL_SERVER.EXE network server process and stored in the recipient's mail file, read by OVMX MAIL", evidence: "src/vmsdecnet/mail/dnet_mail11.c", verified_against: "rd vms-47fd: LIVE -- a real OpenVMS VAX V7.3 MAIL SEND to OVMX::SYSTEM delivered to a booted OVMX and read back with OVMX MAIL (tests/lab/captures/decnet-live-brackets-20261008/); the real OpenVMS VAX V7.3 VAX1->VAX2 capture tests/lab/captures/decnet-mail11-20261008/ replayed through the compiled receiver by tests/vmsdecnet/test_dnet_mail11.c (replies byte-identical: 01 00 00 00 acceptance, %MAIL-E-NOSUCHUSR status + text + 00, final status) and, booted, through NETACP to a real MAIL_SERVER.EXE by DECNETD --mail11-accept-test with OVMX MAIL reading the stored message back (dcl_acceptance_battery).", notes: "Partial: inbound only (no outbound SEND to NODE::USER), one observed connect-option set (other MAIL-11 dialects refused honestly), MAIL_SERVER runs as the MAIL object account with SYSPRV and creates a recipient's mail file owned by the recipient (XABPRO owner on $CREATE; the ACP refuses a foreign owner without SYSPRV/BYPASS, a system-group UIC, or GRPPRV within the group). Store = OVMX-original id-tagged sequential file SYS$LOGIN-dir OVMX_MAIL.MAI over RMS, not the VMS MAIL.MAI ISAM layout."}
