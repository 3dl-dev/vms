# Source of truth for the ODS-2 file system row of the Compatibility Surface Register.
# See docs/design-compat-surface-register.md.
facility: ods2
name: "ODS-2 on-disk file system + versioning"
domain: file-system
vms_ref: "OpenVMS File System (ODS-2) documentation; Files-11 On-Disk Structure"
scope_1_0: in
plan_ref: vms-0f3
summary: >
  SYS$DISK is a genuine Files-11 ODS-2 volume read and written through the executive
  ACP (in vms.ko), byte-exact-verified against a real OpenVMS VAX volume from lab-2.
  (The former OVMX runtime filesystem — a separate vmsfs.ko VFS driver with its own
  honestly-labeled non-byte-compatible format — was retired by vms-165 when the ACP
  became the sole runtime SYS$DISK path.) File versioning is real and wired to DCL, and
  COPY now honors VMS output version-defaulting (highest+1, never a silent overwrite).
last_reviewed: 2026-08-31
