name: Set up Docker Buildx (no anonymous Docker Hub dependency)
description: >-
  docker/setup-buildx-action with (1) the BuildKit image taken from the digest-pinned GHCR
  mirror (.github/mirror-images.lock, written by the mirror-base-images workflow) when it is
  readable with the job's GITHUB_TOKEN, else from mirror.gcr.io, and (2) docker.io base-image
  pulls inside builds tried through mirror.gcr.io first (Hub remains the last resort).
  Anonymous Docker Hub pulls from shared runner IPs intermittently fail (vms-9a6).
runs:
  using: composite
  steps:
    # The classic docker daemon too (rd vms-d6c). Scripts that run a plain
    # `docker build` (tools/cross-alpha/*.sh, tools/cross-vax/*.sh, the cut-release
    # VAX/Alpha artifact builds) use the daemon's own "default" builder, not the
    # BuildKit builder configured below, so their FROM debian:* went straight to
    # Docker Hub and failed on its anonymous-pull rate limit (429) -- #1595 run
    # 37987950134, PR1 run 37991202498. Give the daemon the same mirror.
    - name: Docker daemon pulls through mirror.gcr.io first
      uses: ./.github/actions/docker-mirror
    # Best-effort ghcr login first: the registry layer caches
    # (type=registry,ref=ghcr.io/.../ovmx-cache) and the prebuilt images are
    # read through it. A failed login only costs the cache, never the job.
    - name: Log in to ghcr.io (layer cache + prebuilt images)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
      run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 || echo "::warning::ghcr login failed; registry caches unavailable"
    - name: Pick the BuildKit image
      id: bk
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        ACTOR: ${{ github.actor }}
      run: |
        set -u
        lock="${GITHUB_ACTION_PATH}/../../mirror-images.lock"
        digest=$(awk '$1=="moby-buildkit"{print $4}' "$lock" 2>/dev/null | head -1)
        img="mirror.gcr.io/moby/buildkit:buildx-stable-1"
        if [ -n "$digest" ] && echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 \
           && docker buildx imagetools inspect "ghcr.io/${OWNER}/mirror/moby-buildkit@${digest}" >/dev/null 2>&1; then
          img="ghcr.io/${OWNER}/mirror/moby-buildkit@${digest}"
        fi
        # Pull it now, retried, so the builder starts from a local image: a
        # registry that answered the inspect above can still time out on the
        # pull (ghcr.io i/o timeout, merge-queue run 38328033367). If the GHCR
        # copy cannot be pulled, fall back to the public mirror.
        pull() { for i in 1 2 3; do docker pull -q "$1" >/dev/null 2>&1 && return 0; sleep $((i * 10)); done; return 1; }
        if ! pull "$img"; then
          echo "::warning::could not pull $img -- falling back to the public mirror"
          img="mirror.gcr.io/moby/buildkit:buildx-stable-1"
          pull "$img" || echo "::warning::could not pre-pull $img either; setup-buildx will try"
        fi
        echo "BuildKit image: $img"
        echo "image=$img" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
      with:
        driver-opts: image=${{ steps.bk.outputs.image }}
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
