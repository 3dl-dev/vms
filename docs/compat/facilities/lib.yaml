# LIB$ Run-Time Library. See docs/design-compat-surface-register.md.
facility: lib
name: "LIB$ Run-Time Library"
domain: programming-interfaces
vms_ref: "OpenVMS RTL Library (LIB$) Manual"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  117 distinct LIB$ entry points are implemented across rtl/lib_*.c (the
  LIB$ include surface declares 254 symbols; 1 stub marker remains in
  lib$routines.h). Broad genuine coverage across arithmetic/bit ops, char-scan,
  CLI/spawn (incl. a real CLI$ FSM parser), date/time, queue, symbol, tree,
  VM, translation tables, output, event flags, logical names, and misc
  groups. Notable named gap: the floating LIB$EMODx/LIB$POLYx arithmetic
  jackets. (Rows once listed for LIB$ISHFT,
  LIB$ISHFTC, LIB$TRIM and LIB$SFREE_WAIT were removed 2026-10-21: no such
  routines exist in the VMS LIB$ catalog -- the 227 entry points of the
  RTL_Routines LIB$ help library; the shift intrinsics are compiler
  built-ins and trimming is STR$TRIM.) LIB$TPARSE/LIB$TABLE_PARSE — formerly the known gap — are
  now a real FSM with backtracking (vms-9f6, CLOSED).
last_reviewed: 2026-09-14
items:
  - {id: lib$_arith_bitops, kind: routine, status: partial, authenticity: real, vms: "Arithmetic/bit-manipulation group (LIB$ADDX, LIB$SUBX, LIB$BBSS/BBCC, LIB$EMUL, ...; VMS ships ~16)", evidence: src/libvms/rtl/lib_arith.c, notes: "Present: LIB$ADAWI ADDX SUBX EMUL EDIV BBCCI BBSSI EXTV EXTZV INSV FFC FFS CRC CRC_TABLE. Absent: the floating jackets LIB$EMODx and LIB$POLYx (F/D/G/H/S/T)."}
  - {id: lib$_charscan, kind: routine, status: implemented, authenticity: real, vms: "Character-scan group (LIB$SCANC, LIB$LOCC, LIB$SKPC, ...; VMS ships ~6)", evidence: src/libvms/rtl/lib_strconv.c, notes: "Proof tests/libvms/test_lib_rtl_batch2.c + tests/qemu/test_syssvc_lib_movtuc.c + defects.d/lib-movtuc-stop-untranslated.defect. Every VAX character-string-instruction jacket is present: LIB$LOCC LIB$MATCHC LIB$SCANC LIB$SKPC LIB$SPANC LIB$MOVC3 LIB$MOVC5 LIB$MOVTC and (the last gap) LIB$MOVTUC, which returns the 1-based position of the source character that TRANSLATES to the stop character (0 if none), never writes the stop character, and pads with the untranslated fill character or leaves the remainder unchanged when fill is omitted (RTL Library manual)."}
  - {id: lib$_cli_spawn, kind: routine, status: implemented, authenticity: real, vms: "CLI/spawn group (LIB$SPAWN, LIB$GET_INPUT, LIB$GET_COMMAND, CLI$ FSM parser, ...; VMS ships ~10)", evidence: src/libvms/rtl/lib_common.c, notes: "~10/10 present, including a real CLI$ FSM parser"}
  - {id: lib$do_command, kind: routine, status: implemented, authenticity: real, vms: "Execute a DCL command string programmatically", evidence: src/libvms/rtl/lib_symbol.c, notes: "Over the CLI callback channel (ovmx_cli.h, OVMX_CLI_OP_DO_COMMAND): DCL keeps the command, the image ends without returning (SYS$EXIT, or an in-process image unwinds to DCL), and DCL executes the command at its current level so $STATUS is the command's (src/vmsdcl/dcl_cmd_process.c dcl_activate_image). LIB$_NOCLI with no CLI; a CLI refusal is returned; a command over the documented 255 characters is LIB$_INVARG (OVMX's refusal of an over-length argument). Proof tests/libvms/test_lib_symtab.c, tests/qemu/test_syssvc_lib_do_command.c + defects.d/lib-do-command-returns.defect, and DCL end to end in tests/qemu/test_run_status_e2e.sh (SYMSET.EXE with OVMX_DOCMD)."}
