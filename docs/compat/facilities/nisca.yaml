# Source of truth for the nisca row of the Compatibility Surface Register.
facility: nisca
name: "NISCA/NISCS LAN transport"
domain: clustering
vms_ref: "OpenVMS Cluster Systems manual; NISCA/NISCS wire protocol (Systems Application A)"
scope_1_0: in
plan_ref: vms-694
summary: >
  The LAN transport under SCS: genuine raw-Ethernet frames on the LAVC/SCA
  ethertype, not a UDP/IP tunnel standing in for the real wire. Now the
  EXECUTIVE's own port driver (PEDRIVER role, PEA0:) rather than a userspace
  daemon's raw socket — FC-P3.9 deleted that daemon.
last_reviewed: 2026-09-03
items:
  - id: nisca$lan-transport
    kind: protocol
    status: implemented
    authenticity: real
    vms: "NISCA/SCA raw-Ethernet transport, ethertype 0x6007 (LAVC/SCA)"
    evidence: src/kernel-core/vms_pe.c
    notes: >
      FC-P0.9. The datalink is opened IN KERNEL CONTEXT (exec_l2_open(), the
      exec_kbackend seam: AF_PACKET on Linux, the NetBSD equivalent on the vax
      substrate), so a booted node needs no CAP_NET_RAW anywhere in userspace --
      there is no userspace raw socket on the cluster path at all any more. Real
      frames on 0x6007, never a UDP/IP tunnel.
      The HELLO multicast address is derived from the cluster group number as
      real VMS does it -- AB-00-04-01-<LE16(group + 0x100)>, the mapping VMS
      prints for itself at SYSMAN CONFIGURATION SHOW CLUSTER_AUTHORIZATION --
      and the SAME derived value is both the transmit destination and the
      address enabled in the LAN device's multicast filter, so the two cannot
      diverge (rd vms-147; through V0.7 the derivation omitted the +0x100 and
      was correct for group 1 only). Grounded on three real-VMS oracles
      (V7.3/VAX group 1, V5.5-2H4/VAX group 257, V8.4/Alpha group 2026), pinned
      with refutations in tests/cluster/host/test_codec_hello.c.
      The group is on the wire a SECOND time, at abs 22..23 of every SCA frame,
      as a plain LE16(group) -- a different encoding of the same number, not
      the same arithmetic as the address. Both are read from the ONE
      CLUSTER_AUTHORIZE record in pe_build_identity(), so they cannot diverge
      (rd vms-b34; through V0.7 abs 22 was the constant 0x0001, right for
      group 1 only -- a real group-257 OpenVMS VAX V7.3 member discarded every
      VC STACK OVMX sent it and the circuit never opened). Four oracles
      (V7.3/VAX group 1, V7.3/VAX group 257, V5.5-2H4/VAX group 257,
      V8.4/Alpha group 2026), pinned with refutations in the same test; the
      port's emit/refuse behaviour in tests/cluster/host/test_pe_group_on_wire.c.
      A frame carrying another cluster's group is refused and counted, never
      processed.
      PROVEN AT R1/R2/R3, in CI: tests/cluster/host/test_pe_*.c (the pure port
      FSM: channels, HELLO cadence, circuit formation, TIMVCFAIL, sequence/ack);
      the N-node simulator's virtual LAN; tests/qemu/test_cluster_vc.sh drives
      CLUSTER_DIAG_PORT against a real /dev/vms on a booted node.
      NOT claimed: interoperation with a real VAX's PEDRIVER on a live LAN --
      that is R5, LAB-DEFERRED.

  - id: nisca$discovery-revisions
    kind: protocol
    status: implemented
    authenticity: real
    vms: "NISCA discovery HELLO — both observed on-wire revisions"
    evidence: src/kernel-core/vms_cluster_codec_hello.c
    notes: >
      rd vms-0f8. OVMX's discovery corpus was harvested entirely from OpenVMS
      VAX V7.3 nodes (message class 0x05, 120-byte SCA content). A real OpenVMS
      VAX V5.5-2H4 node speaks a SECOND revision of the same HELLO: class 0x03,
      114-byte content, no abs 128-133 tail, and two differing marker words
      at abs 94/126 -- and NOTHING else different, field position for field
      position, across 53 captured frames in which the only span that moves is
      the live tick at abs 96 (docs/cluster-protocol-spec.md 4(b.c3)). (This
      entry once counted abs 22 as a third marker; it is the CLUSTER GROUP
      number, LE16 -- the two specimens compared came from clusters 1 and 257
      -- corrected under rd vms-b34, which also stopped the port echoing a
      peer's group back at it.) Through
      V0.7 the executive classified every such frame family 0/UNCLASSIFIED and
      counted it badclass.
      The codec now carries both revisions as a TABLE, keyed on the class byte
      AND the exact content length, so a class-0x03 frame at any other length
      stays UNKNOWN and is counted rather than guessed at. The port LEARNS
      which revision a peer speaks off that peer's own frame -- per channel for
      directed frames, port-wide first-wins for the multicast advertisement --
      the same on-wire-assignment discipline already used for the cluster join
      nonce and the abs 47-67 discovery-format span, never a version table
      compiled in. No meaning is claimed for the differing marker values; they
      are carried as data exactly as the 0x05 revision's already are, and every
      field that asserts something about THIS node (SCSNODE, SCSSYSTEMID,
      hardware MAC, incarnation, tick) stays this node's own and is never
      echoed.
      PROVEN AT R1 (CI) AND R5 (live, against a REAL OpenVMS VAX V5.5-2H4):
      the browser-demo capture tests/lab/captures/vms-0f8-browser-c03-channel-20260923/
      shows Node C->OVMX badclass fall from 553-of-553 to 402-of-1838 -- and
      every residual is ONE non-discovery shape (that node's SCS envelope,
      format byte 0x03, a SEPARATE second revision, NOT decoded). The sec 4(a).1
      channel opened bidirectionally in this revision: one b2 from the member,
      186 b3 from OVMX, 184 b4 CONFIRMs back, and OVMX's reply carries the
      cluster join nonce it LEARNED off that member's own b2 (77 11 7a 7d),
      its own SCSNODE/SCSSYSTEMID/MAC, and the peer's revision markers.
      In CI: tests/cluster/host/test_codec_hello.c (classification,
      parse, byte-exact round trip of the real specimen, and the refusals) and
      tests/cluster/host/test_pe_rev_c3.c (the real 128 bytes through
      pe_fsm_rx: badclass 0, peer identity off the wire, the reply emitted in
      the peer's revision carrying our own identity, plus 257 truncations and
      bit-flips that must not fault). Specimen provenance: the multicast
      hello-c3-vaxc-v55.spec and the DIRECTED b2 hello-c3-vaxc-directed-b2.spec
      under tests/cluster/host/fixtures/, both origin `capture`, both hashed in
      docs/clean-room/reference-captures.sha256.
      NOT claimed, and the reason CN=2 does not yet form: this revision's SCS
      LAYER. The same V5.5 node's SCS envelope carries format byte 0x03 at
      abs 31 rather than the 4(d) constant 0x13, msgtype 0x01 rather than the
      4(g) phase-2 0x41, and a body 16 bytes shorter -- a SEPARATE second
      revision on which OVMX's whole SCS/CM/DLM stack is keyed, and of which
      exactly ONE specimen exists (that node's round-0 START, retransmitted
      because nothing answered it). It is not decoded and this register does
      not extrapolate it. Nor is a 4(k) padded frame claimed in the discovery
      revision -- none has ever been observed, so the port DECLINES to probe
      such a peer and records that it declined, rather than credit a packet
      size it never proved.

  - id: nisca$pea0-device
    kind: feature
    status: implemented
    authenticity: real
    vms: "PEA0: — the LAN cluster port device"
    evidence: src/kernel-core/vms_pe.c
    notes: >
      FC-P0.9/FC-P0.11. The port comes up from the executive at
      VMS_IOCTL_CLUSTER_START, gated on the VAXCLUSTER the SYSGEN load actually
      committed: VAXCLUSTER=0 means NO PEA0: and no HELLO at all (the honest
      silence INV-6 requires, refused twice over -- at the boot-path gate and
      again inside vms_pe_start). Its state is readable through
      CLUSTER_DIAG_PORT, which returns SS$_NOSUCHDEV with an all-zero row rather
      than a placeholder channel or circuit.
      PROVEN: R1 (test_pe_view.c, test_cluster_boot_gate.c), R4 negctl
      (tests/qemu/test_cluster_start_negctl.sh). R5 lab-deferred.
