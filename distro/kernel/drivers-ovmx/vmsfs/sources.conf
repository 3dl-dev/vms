# OVMX module source manifest for vmsfs.ko (read by overlay-ovmx-drivers.sh).
#
# One glob per line, relative to the OVMX repo root; flattened into
# drivers/ovmx/vmsfs/ at kernel-build time. Blank lines and '#' comments are
# ignored. See vms/sources.conf for the full contract.
#
# vmsfs.ko = the thin VFS/bio backend (src/kernel/vmsfs) + the substrate-
# agnostic ODS-2 core (src/kernel-core/vmsfs). This set MUST mirror
# src/kernel/vmsfs/Makefile's `vmsfs-y` -- see vmsfs/Kbuild.
src/kernel/vmsfs/*.c
src/kernel/vmsfs/*.h
src/kernel-core/vmsfs/*.c
src/kernel-core/vmsfs/*.h
# The genuine ODS-2 codec compiled KERNEL-RESIDENT (rd vms-4a8, epic vms-208):
# reader/writer/path/bdev + its kernel block seam (ods2_block_kern.c) and
# private headers (ods2_block.h, ods2_kcompat.h). vmsfs/Kbuild's vmsfs-y selects
# exactly the kernel objects; ods2_block_posix.c / ods2_edit.c are staged but
# NOT built (userspace-only), the same way src/kernel/vmsfs/*.c stages more than
# vmsfs-y compiles.
src/vmsfs/ods2/*.c
src/vmsfs/ods2/*.h
# The codec's PUBLIC header is #include'd by a SUBDIR path (#include
# "vmsfs/ods2.h"); stage it preserving that component (see the '->' convention
# in overlay-ovmx-drivers.sh) so the flat module dir resolves it via -I$(src).
src/vmsfs/include/vmsfs/ods2.h -> vmsfs/
