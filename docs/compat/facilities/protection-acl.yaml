# Source of truth for the protection-acl row of the Compatibility Surface Register.
facility: protection-acl
name: "File Protection (SOGW/UIC) + ACLs"
domain: system-management
vms_ref: "OpenVMS Guide to System Security ch. 5 (Protecting Data)"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  SOGW/UIC protection is kernel-enforced by the Files-11 ACP and VERIFIED
  against a real /dev/vms over a real-VAX ODS-2 fixture (test_syssvc_acp_access):
  a genuinely unprivileged non-owner is refused SS$_NOPRIV where a system-group
  process succeeds — same code, opposite verdict. The Delete bit is not enforced
  in the ACP check (advisory). $CHKPRO computes correctly but nothing calls it.
  The legacy $CHECK_ACCESS 2nd-opinion routine was deliberately removed (vms-2b8)
  rather than left as a facade. ACLs on files are stored and enforced by the
  executive ACP (vms-d404, docs/oracle/vax73-acl.md). Privilege
  overrides (BYPASS/READALL/SYSPRV) are honored in the ACP; GRPPRV is not
  (cross-ref privileges).
last_reviewed: 2026-10-08
items:
  - {id: fileprot$sogw_uic,     kind: feature, status: verified, authenticity: real, vms: "SOGW protection mask, UIC-based, executive-enforced (denies on category miss)", evidence: "src/kernel-core/vmsfs_acp.c:1022", verified_against: "tests/qemu/test_syssvc_acp_access.c — SOGW/UIC enforcement proven against a real /dev/vms over the real-VAX ODS-2 fixture (tests/ods2/real_vax_ods2.dsk). A re-exec'd child that setgid/setuid'd to [100,100] is refused SS$_NOPRIV where the system-group parent succeeds; per-file-class protections (SYSUAF World:none, RIGHTSLIST World:R, DCL.EXE World:RE) each pinned. Built by CMake glob + run by tests/qemu/init.sh against a real vms.ko in the positive kernel-executive CI job.", notes: "vms-165 moved SOGW/UIC enforcement into acp_check_access (nibble-per-category System/Owner/Group/World, set-bit-denies; directory read maps to EXECUTE traversal, vms-548b). Re-census 2026-09-14: unchanged, line ref refreshed (was :861)."}
  - {id: fileprot$delete_bit,   kind: feature, status: stub,     authenticity: advisory, vms: "Delete (D) protection bit", evidence: "src/kernel-core/vmsfs_acp.c:1022", notes: "acp_check_access wants only Read/Write (and Execute for directory traversal); the Delete bit is never a wanted right in the check, so it is not enforced — advisory. Re-census 2026-09-14: unchanged, line ref refreshed (was :861)."}
  - {id: sys$chkpro,            kind: routine, status: implemented, authenticity: real, vms: "$CHKPRO - may a subject access an object (protection code, ACL, privileges)", evidence: src/libvms/syssvc/sys_security.c, verified_against: "docs/oracle/semantics/chkpro/vax73.txt (69 cases, OpenVMS VAX V7.3) through the semantic-oracle gate and tests/libvms/test_chkpro.c; tests/qemu/test_syssvc_rights_acl.c (the caller's executive rights list after $GRANTID) and test_syssvc_rightslist.c (a $CREATE_USER_PROFILE subject)", notes: "vms-d404: CHP$_ACCESS/FLAGS/OWNER/PROT/ACL/UIC/PRIV/RIGHTS; the subject is a user profile or the caller as the executive holds it. The protection code denies only RWED (CONTROL is the ACL's); a matching ACE that does not grant is final for group and world; BYPASS grants, READALL only with CHP$M_USEREADALL and no matching ACE, SYSPRV and GRPPRV give the system category. A compute service: it decides, the ACP enforces. Object profiles (objpro) SS$_UNSUPPORTED; output items not filled."}
  - {id: sys$create_user_profile, kind: routine, status: implemented, authenticity: real, vms: "$CREATE_USER_PROFILE - a user's security profile for $CHKPRO", evidence: src/libvms/syssvc/sys_security.c, verified_against: "tests/qemu/test_syssvc_rightslist.c over the shipped SYSUAF.DAT/RIGHTSLIST.DAT on a mounted ODS-2 volume; docs/oracle/semantics/chkpro/vax73.txt CUP.*", notes: "vms-d404: UIC and authorized (CHP$M_DEFPRIV: default) privileges from SYSUAF.DAT, the identifiers the user holds from RIGHTSLIST.DAT; RMS$_RNF for an unknown or empty name as V7.3 answers. The profile's layout is OVMX's own (opaque to callers)."}
  - {id: sys$check_access,      kind: routine, status: absent,   authenticity: n/a,      vms: "$CHECK_ACCESS legacy 2nd-opinion access check", evidence: "", notes: "Deliberately removed (vms-2b8) rather than kept as a redundant/driftable facade — represented as absent by design, a positive anti-facade precedent, not a gap to close"}
  - {id: acldef$acls,           kind: feature, status: partial,  authenticity: real,     vms: "Access Control List entries (ACEs) on files/objects", evidence: "src/kernel-core/vmsfs_acp.c (acp_acl_match, acp_acl_op)", verified_against: "tests/qemu/test_syssvc_acl.c against a real /dev/vms over the real-VAX ODS-2 fixture; behaviour and on-disk layout from docs/oracle/vax73-acl.md (OpenVMS VAX V7.3)", notes: "vms-d404: identifier ACEs stored in the FH2 access control area (top of the header, acoffset..rsoffset) as V7.3 stores them; the ACP access check takes the first matching identifier ACE (DEFAULT ACEs skipped); a denying ACE leaves only the system and owner fields; CONTROL required to change an ACL; ADD replaces an ACE for the same identifiers, DELETE keeps PROTECTED ACEs. Not done: an ACL longer than the primary header (VMS continues it in an extension header) is SS$_ACLFULL; DEFAULT ACEs and DEFAULT_PROTECTION are not propagated to files created in a directory; general identifiers match only once the process rights list exists (vms-7d5a), UIC identifiers and * match now."}
  - {id: sys$parse_acl,         kind: routine, status: implemented, authenticity: real, vms: "$PARSE_ACL - ACE text to binary", evidence: src/libvms/syssvc/sys_security.c, verified_against: tests/qemu/test_syssvc_acl.c, notes: "vms-d404: IDENTIFIER (UIC, wildcard, *, names via RIGHTSLIST), OPTIONS, ACCESS and DEFAULT_PROTECTION ACEs; SS$_IVACL / SS$_NOSUCHID with the error position at the failing clause, as SET ACL reports it on V7.3."}
  - {id: sys$format_acl,        kind: routine, status: implemented, authenticity: real, vms: "$FORMAT_ACL - binary ACE to text", evidence: src/libvms/syssvc/sys_security.c, verified_against: tests/qemu/test_syssvc_acl.c, notes: "vms-d404: SHOW ACL's text for identifier and DEFAULT_PROTECTION ACEs; width/terminator/indent arguments are not applied."}
  - {id: sys$get_security,      kind: routine, status: partial,  authenticity: real,     vms: "$GET_SECURITY - read an object's security profile", evidence: src/vmsrms/rms_core.c, verified_against: tests/qemu/test_syssvc_acl.c, notes: "vms-d404: class FILE only: OSS$_OWNER, OSS$_PROTECTION, OSS$_ACL_LENGTH, OSS$_ACL_READ from the executive ACP; other classes SS$_NOCLASS."}
  - {id: sys$set_security,      kind: routine, status: partial,  authenticity: real,     vms: "$SET_SECURITY - change an object's security profile", evidence: src/vmsrms/rms_core.c, verified_against: tests/qemu/test_syssvc_acl.c, notes: "vms-d404: class FILE ACL edits (OSS$_ACL_ADD_ENTRY/DELETE_ENTRY/DELETE/DELETE_ALL), OSS$M_LOCAL held until OSS$M_RELCTX; owner/protection items SS$_UNSUPPORTED."}
  - {id: dcl$set_acl,           kind: command, status: implemented, authenticity: real, vms: "SET ACL / SHOW ACL / DIRECTORY/ACL, DIRECTORY/SECURITY", evidence: src/vmsdcl/dcl_cmd_set.c, verified_against: tests/qemu/test_syssvc_acl.c, notes: "vms-d404: output and messages as V7.3 prints them (docs/oracle/vax73-acl.md)."}
  - {id: fileprot$priv_override, kind: feature, status: partial, authenticity: real,     vms: "SYSPRV/BYPASS/READALL/GRPPRV override of normal SOGW checks", evidence: "src/kernel-core/vmsfs_acp.c:1053", scope_1_0: in, notes: "acp_check_access honors BYPASS (lifts all), READALL (grants read), and SYSPRV (SYSTEM category) — real. GRPPRV is not consulted, hence partial. Tracked vms-f15/vms-36d. Full detail under privileges; cross-listed here as the file-access-facing half. Re-census 2026-09-14: unchanged, line ref refreshed (was :861)."}
