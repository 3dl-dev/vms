# Size budgets for the arm64 OVMX kernel (rd vms-c5f); sourced by
# tests/kernel-config/check_kernel_budget.sh. Bytes. MAX = regression ceiling
# (~5-10% over the measured value), MIN = over-strip floor (the diet must not
# silently drop hardware). Raise a MAX only with a reason in the commit.
#
# Measured 2026-11-02, pinned Linux 6.12.103, arm64 defconfig + virt.config
# + ovmx-arm64.config + ovmx-diet.config:
#   vmlinuz 23798272 (V0.7-14 release: 23798272, unchanged -- the arm64 Image
#   is not compressible, and the pruned categories were =m there already)
#   module tree 9620826 bytes (553 zstd modules); initramfs 1441953 (V0.7-14)
VMLINUZ_MAX=25000000
VMLINUZ_MIN=20000000
MODULES_MAX_BYTES=10500000
MODULES_MIN_BYTES=7500000
MODULES_MIN_COUNT=450
INITRAMFS_MAX=1700000
