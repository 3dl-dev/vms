# Source of truth for the Privileges row of the Compatibility Surface Register.
facility: privileges
name: "Privileges (Definition + Enforcement)"
domain: system-management
vms_ref: "OpenVMS Guide to System Security ch. 3 (Privileges)"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  All 39 VMS privilege bits are defined. Mode-transition and SETPRV
  enforcement in the kernel executive are real — including a bit-position
  bug (SETPRV mismapped to DETACH) caught and fixed against lab-VAX SDA.
  File-access privilege overrides (SYSPRV/BYPASS/READALL/GRPPRV) are never
  consulted by the filesystem permission hook — a distinct, unfixed gap.
last_reviewed: 2026-08-13
items:
