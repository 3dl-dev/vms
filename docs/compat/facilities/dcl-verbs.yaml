domain: command-language
vms_ref: "OpenVMS DCL Dictionary"
scope_1_0: in
tier: 1
plan_ref: vms-8ad
summary: >
  OVMX's static builtin_verbs[] dispatch table (dcl_builtin.c) carries 55 verbs
  against VMS's ~150 (SET/SHOW count as ~30-subverb umbrellas each, not single
  verbs). Breadth catalogued as items rather than one row per verb; each notable
  missing verb family and the SET/SHOW umbrella depth get their own item.
