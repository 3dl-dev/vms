  - {id: ods2$versioning, kind: feature, status: implemented, authenticity: real, vms: "File versioning (;N)", evidence: src/vmsrms/rms_core.c, notes: "rms_next_version; wired to DCL via dcl_filespec.c's resolve_version_suffix — bare names resolve to highest ;N"}
  - {id: ods2$case_fold, kind: feature, status: implemented, authenticity: real, vms: "Filename case-fold", evidence: src/vmsfs/vmsfs_case.c, notes: "case-insensitive/case-preserving resolution (VMS stores uppercase); dedicated module, still live in LIBVMSFS$SHR"}
  - {id: ods2$protection, kind: feature, status: implemented, authenticity: real, vms: "SOGW protection mapping", evidence: src/vmsfs/vmsfs_protect.c, notes: "pinned to VSI wiki; second-opinion check deleted (vms-2b8); enforcement solely at syscall layer, matching VMS delegation to the executive"}
  - {id: ods2$copy_versioning, kind: feature, status: implemented, authenticity: real, vms: "COPY output version-defaulting vs. ODS-2 versioning", evidence: src/vmsdcl/dcl_cmd_file.c, notes: "resolve_out_version (cmd_copy): no output version -> highest+1 (unversioned if none existed), never a silent overwrite; explicit ;n that exists is an error unless /NEW_VERSION bumps to highest+1 — the old in-place fopen(\"wb\") facade is gone (VSI DCL Dictionary COPY/RENAME defaulting)"}
  - {id: ods5$codec, kind: feature, status: verified, authenticity: real, vms: "Files-11 L5 (ODS-5) codec: level-5 home block/SCB, FI5 ident area, directory name types, case-blind name order", evidence: tests/ods2/test_ods5_real.c, verified_against: "rd vms-7e7e: real OpenVMS Alpha V8.4 volumes made by INITIALIZE/STRUCTURE=5 (tests/lab/captures/ods5-alpha-20261022/, RESULTS.md R1-R8): the codec decodes every header and directory record, and rebuilds both real directories ([TEST], [S]) byte for byte from their files, case-blind merge included", notes: "Codec layer only. The executive ACP does not yet MOUNT a level-5 volume (it still refuses it, SS$_DEVNOTMOUNT) and vmsfs_master cannot master one: rd vms-7e7e continues. UCS-2 names are decoded and ordered but cannot cross the ACP's 8-bit name ABI (rd vms-f1a2). The upper-case fold above U+00FF and for U+00B5 is assumed, not probed."}
  - {id: ods5$master, kind: feature, status: implemented, authenticity: real, vms: "INITIALIZE/STRUCTURE=5 equivalent: master an ODS-5 volume (vmsfs_master --ods5)", evidence: tests/ods2/test_ods5_write.c, notes: "rd vms-7e7e. The volume writer at level 5 recreates the real Alpha V8.4 [TEST] directory record for record and its headers' layout and FI5 names (tests/lab/captures/ods5-alpha-20261022). The reserved files keep OVMX's VAX-validated ODS-2 layout (ident at word 54; the real Alpha's are at word 40), so a mastered ODS-5 volume is not yet byte-identical to a real INITIALIZE/STRUCTURE=5 one and has not been MOUNTed by a real Alpha. Names are mastered as the tree builder spells them (upper case); real mixed-case names are vms-408."}
