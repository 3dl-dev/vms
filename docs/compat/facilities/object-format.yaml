# Source of truth for the Object File Format row of the Compatibility Surface Register.
facility: object-format
name: "Object File Format"
domain: toolchain
vms_ref: "VSI OpenVMS Linker Utility Manual (object module format)"
scope_1_0: in
plan_ref: vms-ade
summary: >
  LINK.EXE ingests standard ELF relocatable objects and `ar` whole-archive
  containers, not VAX/Alpha OBJ$ record-based object modules. Symbol
  resolution and relocation semantics are real; the on-disk object container
  is OVMX's own (ELF) where VMS's OBJ$ record format is not published at
  byte level (Rule 8) — not presented as VMS-authentic.
