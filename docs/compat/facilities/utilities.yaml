  - id: utilities$product
    kind: utility
    status: verified
    authenticity: real
    vms: "PRODUCT / PCSI — software product installation utility"
    evidence: tools/ovmx_kit_pack.c
    verified_against: "install-boot-e2e CI gate (vms-96ec rooted [SYS0.SYSCOMMON] layout)"
    notes: "INSTALL/SHOW PRODUCT/SHOW HISTORY real; rooted-layout install proven end-to-end."

  - id: utilities$sort
    kind: utility
    status: implemented
    authenticity: real
    vms: "SORT — record sort utility with /KEY=(position,size,datatype)"
    evidence: src/vmsdcl/dcl_cmd_misc.c
    notes: "SORT/KEY=(POSITION:n,SIZE:m[,DESCENDING]) sorts on the [pos,size] field, not the whole line; /KEY is a declared CDU_VT_LIST qualifier and is no longer silently ignored (vms-e76). /REVERSE and whole-line (no /KEY) unchanged. Follow-ups (documented gaps, not facades): secondary keys (multiple /KEY tie-breaking) use the first key only, and MERGE is a separate absent utility."

  - id: utilities$differences
    kind: utility
    status: partial
