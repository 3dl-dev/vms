# Source of truth for the cluster-dlm row of the Compatibility Surface Register.
facility: cluster-dlm
name: "Cluster-wide Distributed Lock Manager"
domain: clustering
vms_ref: "OpenVMS Cluster Systems manual; $ENQ/$DEQ/$GETLKI system services"
scope_1_0: in
plan_ref: vms-694
summary: >
  The ENQ-class distributed lock manager is IMPLEMENTED and executive-resident:
  all DLM state is real executive state (resource blocks, granted/waiting queues,
  origin records), no per-process fake ever answers (INV-6), and absence is an
  honest SS$_UNSUPPORTED. On a real /dev/vms executive the SINGLE-NODE rungs are
  proven via tests/qemu/test_syssvc_dlm_xnode.c (injected cross-node CSID): the
  register-after-open handshake (rung 0, vms-4b6); the transport, receive-side
  grant, block-then-grant queue, and async reply wire (rungs 1-3/H5,
  vms-94c/e8f1/904c/6ca); and the blocking-AST holder-side receive (H6,
  vms-76d/#918). The executive-resident SCS DLM arm (src/kernel-core/vms_dlm_scs.c,
  send + receive legs) has landed, and 2-node LAB CAPTURES exist for the LVB
  crossing, the LDWV fallback, and the rebuild paths.

  NOT YET RE-PROVEN end-to-end (implemented, not verified): the MULTI-NODE rungs --
  LVB write/read crossing (H8/H9), dynamic remaster (H10a/b), directory-ownership
  refusal (e84), and the distributed-deadlock single-victim search (H11). Their
  original real-/dev/vms QEMU harnesses (run_dlm_harness_h8/_h9/_h10/_h10b/_e84/
  _ec75) were RETIRED with the userspace SCSD daemon in the #1052 executive-resident
  pivot; a GATED multi-node /dev/vms successor through the landed SCS arm is still
  being re-established (vms-1ee) and there is no multi-node DLM CI leg yet
  (vms-1da5). The wire byte layout is OVMX-DERIVED, not yet gated against a real-VAX
  DLM oracle capture (Rule 8; see the scs-transport row). See kernel-executive.yaml
  for the single-node lock manager this builds on. Further DEPTH beyond the
  ENQ-class engine: the concurrent-both-initiate deadlock idempotence proof (vms-04f
  -- global-min selection ships and is code-verified, now exercised by a host FSM
  proof) and a real app-process cross-node lock ACQUISITION path (vms-d1f, post-1.0
  -- an application $ENQ of a remotely-mastered resource still returns the honest
  SS$_UNSUPPORTED "0.4" stub).
