  # "%OVMX-F-SYSINIT, ... DCL.EXE is absent" halt) and reaches %STDRV-I-STARTUP
  # -- the line print_stdrv_begun() emits IMMEDIATELY before run_startup() execs
  # SYS$SYSTEM:PROVISION.EXE -- i.e. it boots far enough to exec PROVISION.EXE
  # from the mounted system volume. The sysboot-negctl step is its teeth: booting
  # the SAME disk with the FLAT test volume (no DCL.EXE) MUST halt the gate and
  # MUST NOT reach %STDRV-I-STARTUP, proving it is specifically the mastered
  # system volume that carries the boot past the gate (Rule 7).
