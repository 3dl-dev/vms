# Size budgets for the x86_64 OVMX kernel (rd vms-c5f); sourced by
# tests/kernel-config/check_kernel_budget.sh. Bytes. MAX = regression ceiling
# (~5-10% over the measured value), MIN = over-strip floor (the diet must not
# silently drop hardware). Raise a MAX only with a reason in the commit.
#
# Measured 2026-11-02, pinned Linux 6.12.103, x86_64 defconfig
# + ovmx-x86_64.config + ovmx-diet.config:
#   vmlinuz      8950784   (before the diet, V0.7-14 release: 13566976; -34%)
#   module tree  12081869  (134 zstd modules; before: none shipped -- the old
#                           kernel had ~14 modules and no module tree at all)
#   initramfs    599216    (V0.7-14 release; the diet does not touch it -- boot-
#                           critical + OVMX modules only)
VMLINUZ_MAX=9500000
VMLINUZ_MIN=6500000
MODULES_MAX_BYTES=13300000
MODULES_MIN_BYTES=9000000
MODULES_MIN_COUNT=110
INITRAMFS_MAX=700000
