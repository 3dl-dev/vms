  - {id: acldef$acls,           kind: feature, status: absent,      authenticity: n/a,          vms: "Access Control List entries (ACEs) on files/objects", evidence: src/libvms/include/acldef.h, scope_1_0: stretch, notes: "Constants only, not built"}
  - {id: fileprot$priv_override, kind: feature, status: absent,     authenticity: facade-risk,  vms: "SYSPRV/BYPASS/READALL/GRPPRV override of normal SOGW checks", evidence: "src/kernel-core/vmsfs_acp.c", scope_1_0: in, notes: "vms-165 moved enforcement into the ACP (acp_check_access references SYSPRV); status may now be partly implemented — needs a compat-refresh re-census. Tracked vms-f15/vms-36d. Full detail under privileges; cross-listed here as the file-access-facing half."}
