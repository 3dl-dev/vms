name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Full-coverage triggers: on ALL of these the path filter forces every output
  # true (see the `changes` job), so the complete suite runs -- the union that
  # gates `main` is unchanged. merge_group runs the full suite on the batched
  # result before it lands (full coverage before merge, zero per-PR latency).
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly full suite, 07:17 UTC. Runs every job unconditionally, including
    # the path-filtered heavy tiers and the harness negative controls lifted off
    # the per-PR path. Coverage is MOVED here, never deleted.
    - cron: '17 7 * * *'

# Least-privilege GITHUB_TOKEN for every job in this workflow (jobs may narrow
# further, none may widen without saying so here). Nothing in this file needs
# write scope: no step uses `secrets.`, `gh`, or `git push`; the only actions
# are checkout/cache (read), upload-artifact (Actions runtime token, not
# GITHUB_TOKEN), and docker build-push-action with `push: false`. If a job ever
# needs to write (comment on a PR, push a tag, upload SARIF), grant that scope
# on THAT job rather than widening this block.
permissions:
  contents: read

# Per-PR latency: a new push to a PR cancels that PR's in-flight run so the queue
# is not clogged by superseded commits. NEVER cancels main, merge_group, or the
# nightly schedule -- each needs a complete run of the full suite.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -----------------------------------------------------------------------
  # changes: test-impact / path filter. Decides which heavy tiers a PR actually
  # needs (quality-preserving: same inputs -> same verdict). On any NON-PR event
  # every output is forced true, so the FULL suite runs and no coverage is lost;
  # filtering only ever narrows the per-PR tier. `.github/workflows/**` is in
  # every filter, so a CI change re-runs everything.
  # -----------------------------------------------------------------------
  changes:
    name: Decide affected subsystems (path filter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.decide.outputs.core }}
      toolchain: ${{ steps.decide.outputs.toolchain }}
      kernel: ${{ steps.decide.outputs.kernel }}
      boot: ${{ steps.decide.outputs.boot }}
      release: ${{ steps.decide.outputs.release }}
      netbsd: ${{ steps.decide.outputs.netbsd }}
      netbsd_vax: ${{ steps.decide.outputs.netbsd_vax }}
      vmsfs_core_vax: ${{ steps.decide.outputs.vmsfs_core_vax }}
      exec_netbsd_vax: ${{ steps.decide.outputs.exec_netbsd_vax }}
      aarch64_boot: ${{ steps.decide.outputs.aarch64_boot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - '.github/workflows/**'
              - 'CMakeLists.txt'
              - 'src/**'
              - 'tests/**'
              - 'third-party/**'
              - 'tools/**'
              - 'docs/install-guide.md'
              - 'docs/upgrade-guide.md'
            toolchain:
              - '.github/workflows/**'
              - 'CMakeLists.txt'
              - 'src/vmslink/**'
              - 'src/imgact/**'
              - 'src/libvms/**'
              - 'src/libvmssys/**'
              - 'src/vmsprocess/**'
              - 'src/vmslnm/**'
              - 'src/vmsfs/**'
              - 'src/vmsrms/**'
              - 'src/vmsdcl/**'
              - 'src/vmsqueue/**'
              - 'third-party/tcc/**'
              - 'tools/**'
              - 'distro/rootfs/vms/SYS0/SYSCOMMON/SYSEXE/BUILD.COM'
            kernel:
              - '.github/workflows/**'
              - 'src/kernel/**'
              - 'src/kernel-core/**'
              - 'src/libvms/syssvc/**'
              - 'src/libvmssys/vms_kif.*'
              - 'tests/qemu/**'
            boot:
              - '.github/workflows/**'
              - 'distro/**'
              - 'src/ovmx_init/**'
              - 'src/libvms/include/sysgen_params.h'
              - 'tests/qemu/test_persistent_boot.sh'
              - 'tests/qemu/test_release_e2e.sh'
              - 'tests/qemu/test_executive_integral.sh'
              - 'tests/qemu/test_distrib_boot.sh'
              - 'tests/qemu/test_virtio_nic.sh'
              - 'tests/qemu/test_startup_phase_driver.sh'
              - 'tests/qemu/test_boot_conformance.sh'
              - 'tests/qemu/test_boot_scsnode_hostname_e2e.sh'
              - 'tests/qemu/run_boot_scsnode_hostname_e2e.sh'
              - 'tests/uat/**'
            release:
              - '.github/workflows/**'
              - 'tools/cut-release.sh'
              - 'tools/publish-release.sh'
              - 'tools/gen_release_notes.py'
              - 'tools/check_guide_drift.py'
              - 'distro/Dockerfile.bootable'
              - 'tools/ovmx_kit_pack.c'
              - 'tools/vmsfs_master.c'
              - 'src/libvms/include/ovmx_identity.h'
              - 'src/libvms/include/ovmx_kit_format.h'
              - 'src/kernel/vmsfs/vmsfs_ondisk.h'
              - 'src/product/**'
              - 'tests/qemu/test_upgrade_e2e.sh'
              - 'tests/qemu/run_upgrade_e2e.sh'
              - 'tests/qemu/test_product_install_e2e.sh'
              - 'tests/qemu/run_product_install_e2e.sh'
              - 'tests/qemu/test_install_boot_e2e.sh'
              - 'tests/qemu/run_install_boot_e2e.sh'
              - 'tests/qemu/test_release_acceptance_e2e.sh'
              - 'tests/qemu/run_release_acceptance_e2e.sh'
              - 'tests/qemu/test_release_install.sh'
              - 'tests/qemu/run_release_install.sh'
              - 'tests/qemu/release_install_inner.sh'
              - 'tests/qemu/test_parts_demo_e2e.sh'
              - 'docs/install-guide.md'
              - 'docs/upgrade-guide.md'
              - 'tests/integration/test_guide_drift.sh'
              - 'tests/integration/test_guide_drift_negctl.sh'
              - 'tests/integration/test_publish_release.sh'
            netbsd:
              - '.github/workflows/**'
              - 'tests/netbsd/**'
              - 'src/kernel-netbsd/**'
              - 'src/kernel-core/**'
              - 'src/kernel/vmsfs/vmsfs_ondisk.h'
              - 'src/libvmssys/kif_transport.h'
              - 'src/libvmssys/kif_transport_netbsd.c'
            netbsd_vax:
              - '.github/workflows/**'
              - 'tests/lab-vax/**'
              - 'tools/cross-vax/**'
              - 'src/libvmssys/**'
              - 'src/vmsprocess/**'
              - 'src/libvms/**'
              - 'src/vmslnm/**'
              - 'src/vmsfs/**'
              - 'src/vmsrms/**'
              - 'src/vmsqueue/**'
              - 'src/vmsdcl/**'
              - 'src/ovmx_init/**'
              - 'src/ovmx_provision/**'
              - 'src/ovmx_job_control/**'
              - 'tools/vms_login.c'
              - 'tools/loginout_display.c'
              - 'tools/loginout_display.h'
              - 'tools/mail_notify.c'
              - 'tools/vms_mail_notify.h'
              - 'tools/CMakeLists.txt'
              - 'docs/design-ovmx-netbsd-syskrnl.md'
              - 'docs/design-p4-netbsd-vax-boot.md'
              - 'docs/audit-ilp32-vax-libvmssys.md'
            vmsfs_core_vax:
              - '.github/workflows/**'
              - 'tools/cross-vax/**'
              - 'src/kernel-core/vmsfs/**'
              - 'src/kernel/vmsfs/vmsfs_ondisk.h'
              - 'docs/audit-ilp32-vax-vmsfs.md'
            exec_netbsd_vax:
              - '.github/workflows/**'
              - 'tools/cross-vax/**'
              - 'src/kernel-core/**'
              - 'src/kernel-netbsd/**'
              - 'tests/netbsd/netbsd_version.env'
              - 'docs/audit-ilp32-vax-netbsd-exec.md'
            aarch64_boot:
              - '.github/workflows/**'
              - 'tests/qemu-aarch64/**'
              - 'src/libvmssys/**'

      - name: Decide (force every output true on non-PR events)
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "core=${{ steps.filter.outputs.core }}"
              echo "toolchain=${{ steps.filter.outputs.toolchain }}"
              echo "kernel=${{ steps.filter.outputs.kernel }}"
              echo "boot=${{ steps.filter.outputs.boot }}"
              echo "release=${{ steps.filter.outputs.release }}"
              echo "netbsd=${{ steps.filter.outputs.netbsd }}"
              echo "netbsd_vax=${{ steps.filter.outputs.netbsd_vax }}"
              echo "vmsfs_core_vax=${{ steps.filter.outputs.vmsfs_core_vax }}"
              echo "exec_netbsd_vax=${{ steps.filter.outputs.exec_netbsd_vax }}"
              echo "aarch64_boot=${{ steps.filter.outputs.aarch64_boot }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "core=true"
              echo "toolchain=true"
              echo "kernel=true"
              echo "boot=true"
              echo "release=true"
              echo "netbsd=true"
              echo "netbsd_vax=true"
              echo "vmsfs_core_vax=true"
              echo "exec_netbsd_vax=true"
              echo "aarch64_boot=true"
            } >> "$GITHUB_OUTPUT"
          fi
  # -----------------------------------------------------------------------
  # Job: aarch64 system-emulation boot proof (rd vms-f66)
  #
  # The aarch64 positioning lane. Every other positioning arch has a
  # system-emulation boot proof -- x86_64 (tests/qemu/, the vms.ko executive),
  # NetBSD/amd64 (tests/netbsd/, qemu-system-x86_64), NetBSD/vax (SIMH). aarch64
  # had NONE: it was only ever exercised under *user-mode* QEMU binfmt (the ~25
  # link-native/imgact arm64 jobs) and its branches in run-qemu.sh /
  # tests/qemu/run_tests.sh were dead code with no aarch64 QEMU host to run them
  # (rd vms-c83). This job boots a REAL arm64 Linux kernel under *system-mode*
  # qemu-system-aarch64 -machine virt and runs a genuine OVMX freestanding
  # EM_AARCH64 artifact as PID 1 -- the aarch64 analogue of the Alpha
  # syscall/crt0 proof (commit c0a663dc), one rung higher (system emulation, not
  # user-mode qemu-alpha).
  #
  # BLOCKING. The harness itself carries the negative control (an EM_X86_64
  # /init the arm64 kernel must refuse to exec), so a green here means the
  # positive boot really was aarch64. This step adds an OUTER negative control:
  # a deliberately-broken PASS marker must redden the job, proving the grep has
  # teeth. TOOLING, NOT A RUNTIME (Rule 9): booting a kernel in QEMU to test the
  # freestanding layer is exactly what tests/qemu and tests/netbsd already do;
  # the Rule-9 gate inspects only src/** C/H, so nothing here trips it.
  # -----------------------------------------------------------------------
  aarch64-system-boot:
    name: aarch64 System-Emulation Boot Proof (QEMU)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.aarch64_boot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the aarch64 boot-proof image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/qemu-aarch64/Dockerfile
          push: false
          load: true
          tags: ovmx-aarch64-boot:latest
          cache-from: type=gha,scope=aarch64-boot
          cache-to: type=gha,mode=max,scope=aarch64-boot

      - name: Boot arm64 kernel under qemu-system-aarch64, run OVMX EM_AARCH64 init as PID 1
        run: |
          set +e
          RAW=$(docker run --rm ovmx-aarch64-boot:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: aarch64 boot proof exited nonzero ($RC)"
            exit 1
          fi
          echo "$OUTPUT" | grep -qF 'OVMX_AARCH64_SYSMODE_PASS' \
            || { echo "FAIL: did not see the OVMX aarch64 PASS marker on the guest console"; exit 1; }
          echo "$OUTPUT" | grep -qF 'uname machine == aarch64' \
            || { echo "FAIL: guest never asserted uname machine == aarch64 -- the arch check has no teeth"; exit 1; }
          echo "$OUTPUT" | grep -qF 'aarch64 SYSTEM-EMULATION BOOT PROOF: PASSED' \
            || { echo "FAIL: harness did not report its own PASSED banner (negative control may not have run)"; exit 1; }
          echo "PASS: OVMX freestanding EM_AARCH64 layer booted as PID 1 on a real arm64 kernel under qemu-system-aarch64"

      - name: NEGATIVE CONTROL — a wrong PASS marker must redden the harness
        run: |
          set +e
          # Point the harness at a marker the guest will never print. A correct
          # harness then fails the positive proof (marker absent) and exits 1.
          RAW=$(docker run --rm -e PASS=NEVER_EMITTED_MARKER ovmx-aarch64-boot:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT" | tail -20
          if [ "$RC" -eq 0 ]; then
            echo "FAIL: harness exited 0 while keyed on a marker that is never printed -- the grep has no teeth."
            exit 1
          fi
          echo "PASS: harness correctly went RED when keyed on an absent marker -- the assertion has teeth"

  # -----------------------------------------------------------------------
  # Job 1: Build and unit test (host, shared libs, readline)
  # -----------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    # vms-32e grew the register negative-control suite 49->62 controls and added a
    # per-control citation check, taking this job from ~17m (main) to ~20m+ on the
    # same runner class. The 20m cap left under 3 minutes of margin; raised for
    # headroom. Suite runtime growth is tracked in rd (vms-32e).
    #
    # userspace_service_register_negctl (the suite above) is TORN OUT / de-gated
    # (vms-b44) and no longer runs in this job at all -- this job's wall time is
    # therefore now well under 35m, not measured down since de-gating only ever
    # frees headroom. Left as-is rather than guessed down; re-derive from a
    # measurement if this is ever revisited.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          # Cache-key hygiene, not a correctness fix (vms-fb9 r7, vms-ecf r5):
          # strace, then libssh-dev, were added to the install list below.
          # restore-keys already falls back to any apt-${{ runner.os }}-
          # prefix, so apt-get install would still succeed and fetch them on a
          # stale-key cache hit -- this bump only avoids re-downloading them
          # every run.
          key: apt-${{ runner.os }}-cmake-gcc-readline-strace-libssh
          restore-keys: apt-${{ runner.os }}-

      # libssh-dev IS NOT OPTIONAL FOR THIS JOB, and the reason is a gate
      # rather than a feature (vms-ecf r5). This job runs ctest, which runs
      # tests/integration/test_userspace_service_register.sh. That gate derives
      # the universe of sys$ services from WHAT THE PRODUCT EXPORTS: it
      # compiles every product .c file and reads the sys$ symbols out of the
      # objects with nm, because both source-text readings of the universe were
      # escaped together by one asm-label rename (vms-f26). src/vmsssh/vmssshd.c
      # is a product source and includes <libssh/libssh.h>, so without this
      # package the scan compiles 126 of 127 files and the gate REFUSES TO
      # CERTIFY -- "a service could hide behind a build error", its own words.
      #
      # THAT REFUSAL IS CORRECT AND MUST NOT BE WEAKENED. It is the same
      # property as the -Wno-* flag probe next to it: a price that cannot be
      # computed must refuse, not certify. The legal fixes are to make the
      # condition unreachable (this line) or to declare the exclusion in the
      # gate's header; silently skipping the file, allowlisting it, or
      # tolerating a short count are not among them. Removing libssh-dev here
      # does not "skip an optional component" -- it turns the register red.
      #
      # WHAT IT DOES NOT DO, measured rather than assumed because the
      # expectation going in was wrong: it does NOT add test entries. ctest -N
      # reports 53 with libssh-dev and 53 without -- identical. src/vmsssh
      # (the daemon) is the part CMake skips when libssh is missing and it
      # registers no tests; tests/vmsssh (the term_mapping unit test) has no
      # libssh dependency and is configured either way, deliberately
      # (CMakeLists.txt:171). So this package changes exactly one thing that
      # ctest can see: the register gate can compile 127 of 127 product
      # sources instead of 126, and stops refusing.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc make libc6-dev libreadline-dev strace libcap2-bin \
            libssh-dev musl-tools

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'src/**/*.c', 'src/**/*.h', 'src/**/*.S') }}
          restore-keys: cmake-build-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_TOOLS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      # tests/libvms/test_protection.c (vms-2b8) synthesizes a caller UIC in
      # a forked child to drive sys$chkpro's SYSTEM-category discrimination
      # (its own comment, "synthesize_direct", has the full account). Its
      # PREFERRED mechanism is a plain setgid()+setuid() to a synthetic
      # (gid, uid), which needs CAP_SETGID/CAP_SETUID -- granted here as file
      # capabilities because this runner is not root. Its FALLBACK
      # mechanism (an unprivileged user namespace) is what this grant works
      # around: Ubuntu 24.04's ubuntu-latest image restricts unprivileged
      # CLONE_NEWUSER via AppArmor by default, which reddened all six of
      # this test's discriminating assertions (MEASURED, vms-2b8 round 12 --
      # reproduced locally with `sysctl user.max_user_namespaces=0` and
      # fixed by this same grant). Do not remove this step to "simplify" the
      # job: without it the suite still runs (the fallback tries), but on
      # THIS runner it fails honestly rather than skipping, per the suite's
      # own rule that a skipped discriminating case is a failing one.
      #
      # THE GRANT ITSELF IS NO LONGER WRITTEN HERE (rd vms-bd7). It used to be
      # an inline `sudo setcap` on this line, and that is precisely why the dev
      # seat was red while this job was green: the workshop host restricts
      # unprivileged CLONE_NEWUSER the same way ubuntu-latest does, but nothing
      # there ran this step, so the same commit produced 9/9 here and 3/9 there
      # and four separate agents reported the dev-seat red as noise. The grant
      # now lives in tests/libvms/grant_protection_caps.sh, which this step and
      # a ctest FIXTURES_SETUP fixture both call -- one mechanism, both hosts.
      # This step is therefore redundant with the fixture and is kept anyway, so
      # that a failure to grant is attributable to a named step in the log
      # rather than to a line of fixture output.
      - name: Grant test_libvms_protection the two capabilities its synthetic-UIC mechanism needs
        run: tests/libvms/grant_protection_caps.sh build/bin/test_libvms_protection

      - name: Test
        run: |
          sudo mkdir -p /vms/SYS0/SYSCOMMON/{SYSEXE,SYSLIB,SYSMGR,SYSHLP}
          sudo chmod -R 777 /vms
          cd build
          # kif_caller_census_negctl / userspace_service_register_negctl /
          # terminal_identity_negctl (vms-819d's 3 slow-labelled per-control
          # harness self-tests) are TORN OUT / de-gated (vms-b44, same ruling
          # as vms-49f / CLAUDE.md Rule 9): each reran a source-scan gate
          # against a mutated sandbox copy of the tree -- a string relation
          # over the tree's own self-declaration, never touching vms.ko,
          # QEMU, or /dev/vms. They are no longer registered with ctest at
          # all (scripts remain in tests/integration/ as manual lint). The
          # `-LE slow` filter below is kept for what still legitimately
          # carries the label: tests/qemu's opt-in QEMU-boot tests (e.g.
          # parts_demo_e2e). Every PRODUCT gate -- unit tests, the positive
          # census/register authenticity gates, all integration gates --
          # still runs on every PR.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ctest --output-on-failure -LE slow
          else
            ctest --output-on-failure
          fi

  # -----------------------------------------------------------------------
  # Job 3: Persistent boot smoke test (QEMU)
  #
  # Builds the bootable image, boots QEMU twice with the same disk:
  #   Boot 1: blank disk → STARTUP.EXE initializes, formats, installs
  #   Boot 2: same disk  → STARTUP.EXE detects installed system, skips install
  # Proves install-once / boot-many persistence across reboots.
  # -----------------------------------------------------------------------
  persistent-boot:
    name: Persistent Boot Smoke Test
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.boot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bootable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run persistent boot smoke test
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_persistent_boot.sh:/test.sh:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

      # vms-9b7. THE RELEASE PATH: boot -> provision -> boot. The operator's
      # "%OVMX-F-EXECINIT, no SYSTEM record in SYS$SYSTEM:SYSUAF.DAT" happened
      # on exactly this path and NO COMMITTED TEST COVERED IT -- the persistent
      # boot test above boots the same disk three times but never CHANGES
      # SYSUAF between boots, so a system whose authorization file is edited
      # (the entire point of having one) was untested end to end. Runs four
      # cases: two controls that isolate the failure to the position of the
      # sixth field separator rather than to the write path, the row that
      # reproduced the halt, and a fail-stop negative control (SYSUAF with no
      # SYSTEM row) proving this rig can still go red.
      - name: Release e2e — boot, provision, boot
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_release_e2e.sh:/test.sh:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

      # vms-0ff. Reuses the image built above (no extra build). Boots the REAL
      # runtime twice: once with the executive present (must come up), once
      # with vms.ko removed from the initramfs (must NOT come up). The second
      # boot is a negative control — it proves this check can actually go red,
      # which is the only thing that distinguishes a gate from decoration.
      - name: The executive is integral — OVMX must not boot without it
        run: |
          IDENTITY=${{ github.workspace }}/src/libvms/include/ovmx_identity.h
          PRODUCT_NAME=$(sed -n 's/^#define[[:space:]]\+OVMX_PRODUCT_NAME[[:space:]]\+"\([^"]*\)".*/\1/p' "$IDENTITY" | head -1)
          PRODUCT_VERSION=$(sed -n 's/^#define[[:space:]]\+OVMX_PRODUCT_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' "$IDENTITY" | head -1)
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_executive_integral.sh:/test.sh:ro \
            -e "EXPECTED_BOOT_BANNER=$PRODUCT_NAME $PRODUCT_VERSION" \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

      # vms-8ab. Reuses the image built above (no extra build). Boots the SLIM
      # initramfs against /boot/ovmx-distrib.img — the PRE-INSTALLED distribution
      # disk the mastering stage produced at build time — and drives a real
      # SYSTEM/MANAGER login over the console, proving DCL/LOGINOUT/IMGACT and
      # the SYSLIB shareables all resolve FROM THE MASTERED DISK (the slim
      # initramfs carries none of them). Nothing installed this disk; vmsfs_master
      # did. This is the §6 mount-or-halt shape that unblocks stripping install
      # out of PID 1 (vms-2f0).
      - name: Distribution disk boots to login (pre-installed, no self-install)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_distrib_boot.sh:/test.sh:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

      # vms-21a. Reuses the image built above (no extra build). Boots the same
      # pre-installed distribution disk and, over a real login session, proves
      # STARTUP.COM is now a real STDRV phase driver: SHOW LOGICAL SYS$STARTUP
      # names the measured multi-value search list, SYS$STARTUP:/SYS$MANAGER:
      # carry the phase-driver's data files and the new site files, and
      # SYS$MANAGER:OVMX.CONF is verified absent from the booted, mounted
      # system disk (not merely deleted from the source tree).
      - name: STARTUP.COM phase driver — SYS$STARTUP search list, OVMX.CONF gone
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_startup_phase_driver.sh:/test.sh:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

      # vms-1fb. Reuses the image built above (no extra build). Boots the
      # pre-installed distribution disk and asserts the boot console's
      # FACILITY+IDENT SEQUENCE against a sequence pinned from the OpenVMS
      # Alpha 8.4 oracle capture (docs/design-boot-faithful.md §3.5/§3.7):
      # banner-first ordering, %STDRV-I-STARTUP begun exactly once with no
      # invented "completed" line, oracle-shaped timestamp (space-padded
      # day, hundredths not milliseconds), and the borrowed-VMS-facility
      # fixes the §3.7 audit made (%STARTUP-I-SYSDISK/MOUNTED/MODFAIL ->
      # %OVMX-).
      - name: Boot console sequence conformance vs. the OpenVMS oracle
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_boot_conformance.sh:/test.sh:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

      # vms-7bd (parent vms-67f, TCP/IP Services). Reuses the image built above
      # (no extra build). Proves the QEMU runtime gets a virtio-net NIC: the
      # launcher's arg construction (user-mode SLIRP default, opt-in tap/bridge,
      # no inbound by default, -nodefaults kept) AND a real boot where the guest
      # kernel enumerates the virtio-net Ethernet controller with the DEFAULT
      # user-mode NIC, the PXE ROM is suppressed, and the executive still
      # attaches (adding the NIC did not regress boot). run-qemu.sh +
      # Dockerfile.bootable are bind-mounted at /src so the arg-construction
      # checks run here too, not just the boot check. This is the LINUX-LAYER
      # NIC only; the VMS device face (EWAn:) is downstream (vms-3be/vms-9d2).
      - name: virtio-net NIC present on the QEMU runtime (vms-7bd)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/qemu/test_virtio_nic.sh:/test.sh:ro \
            -v ${{ github.workspace }}/distro/boot/run-qemu.sh:/src/distro/boot/run-qemu.sh:ro \
            -v ${{ github.workspace }}/distro/Dockerfile.bootable:/src/distro/Dockerfile.bootable:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

  # -----------------------------------------------------------------------
  # cut-release-reproducible (vms-d73, epic vms-a84 RELEASE ENGINEERING)
  #
  # tools/cut-release.sh is the FIRST piece of release-engineering machinery:
  # a repeatable "cut a release" command replacing the previous hand-rolled
  # per-cut process (build the image, copy artifacts out, hand-write
  # checksums). This job is that command's ground-source proof:
  #
  #   1. Run cut-release.sh TWICE, from the SAME commit, each with
  #      --no-cache so the two builds share nothing (a cache hit would prove
  #      cache reuse, not reproducibility) — and diff the four release
  #      artifacts (vmlinuz, initramfs-ovmx-slim.cpio.gz, ovmx-distrib.img,
  #      ovmx-os.kit) byte-for-byte.
  #   2. Recompute SHA256SUMS against the actual bundle bytes and compare
  #      against what the script wrote, so a bug in the script's own
  #      checksum step cannot self-certify.
  #   3. Reuse the EXISTING boot-smoke harness (tests/qemu/test_distrib_boot.sh
  #      — the same one persistent-boot above runs against a normal build) to
  #      boot the freshly-cut bundle's own vmlinuz/initramfs/distrib.img to a
  #      real SYSTEM login prompt, rather than reinventing that proof.
  #
  # Two full containerized builds (~25-30 min cold each per boot.sh) make this
  # the heaviest job in the workflow; it is gated behind the `release` path
  # filter so ordinary PRs that do not touch release-engineering surfaces
  # don't pay for it, and still runs in full on push/merge_group/schedule.
  # -----------------------------------------------------------------------
  cut-release-reproducible:
    name: cut-release is byte-reproducible + boots (vms-d73)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # First independent cut. --no-cache on both cuts is the point: this
      # proves the BUILD is reproducible, not that BuildKit's cache is.
      - name: Cut release A (clean tree, no cache)
        run: |
          tools/cut-release.sh --no-cache --out-dir "${{ github.workspace }}/dist/release-a"

      - name: Cut release B (independent clean tree, no cache)
        run: |
          tools/cut-release.sh --no-cache --out-dir "${{ github.workspace }}/dist/release-b"

      # The manifest's own "cut_at_utc" field legitimately differs between
      # the two invocations (it is wall-clock metadata ABOUT the cut, not a
      # build input) -- the reproducibility claim is scoped to the four real
      # release artifacts and their checksums, which is exactly what this
      # step compares. SHA256SUMS also carries no such field, so it is
      # compared byte-for-byte too, not just semantically. RELEASE-NOTES-
      # <version>.md (vms-55a) is generated from git history that is fixed
      # for a given commit and carries no wall-clock stamp of its own (see
      # tools/gen_release_notes.py's header) -- it belongs in this same
      # byte-identical set, found by glob since its name is version-suffixed.
      - name: Assert the two cuts are byte-identical
        run: |
          set -euo pipefail
          A="dist/release-a"
          B="dist/release-b"
          FAIL=0
          NOTES_A=$(basename "$(ls "$A"/RELEASE-NOTES-*.md)")
          for f in vmlinuz initramfs-ovmx-slim.cpio.gz ovmx-distrib.img ovmx-os.kit ovmx-os.kit.manifest.txt "$NOTES_A" SHA256SUMS; do
            if cmp -s "$A/$f" "$B/$f"; then
              echo "OK: $f is byte-identical across both cuts"
            else
              echo "FAIL: $f DIFFERS between the two independent cuts"
              cmp "$A/$f" "$B/$f" || true
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "Reproducibility check FAILED"; exit 1; }
          echo "All release artifacts + release notes + SHA256SUMS are byte-identical across two independent --no-cache cuts."

      # Defense in depth against a bug in the script's own checksum step:
      # recompute sha256 directly against the shipped bytes and compare
      # against what release-manifest.json / SHA256SUMS claim.
      - name: Recompute checksums and compare against the emitted manifest
        run: |
          set -euo pipefail
          cd dist/release-a
          sha256sum -c SHA256SUMS
          for f in vmlinuz initramfs-ovmx-slim.cpio.gz ovmx-distrib.img ovmx-os.kit; do
            REAL=$(sha256sum "$f" | awk '{print $1}')
            # Each artifact is emitted as a single JSON line (cut-release.sh
            # printf's one object per line, no embedded newlines) -- a plain
            # grep+sed extraction is exact and needs no JSON library.
            CLAIMED=$(grep "\"component\": \"$f\"" release-manifest.json | sed -n 's/.*"sha256": "\([a-f0-9]*\)".*/\1/p')
            [ -n "$CLAIMED" ] || { echo "FAIL: $f not found in release-manifest.json"; exit 1; }
            [ "$REAL" = "$CLAIMED" ] || { echo "FAIL: $f real=$REAL manifest=$CLAIMED"; exit 1; }
            echo "OK: release-manifest.json sha256 for $f matches the actual artifact bytes"
          done

      # THE BOOT PROOF. Reuses tests/qemu/test_distrib_boot.sh verbatim
      # against the CUT bundle's own artifacts (bind-mounted at the fixed
      # /boot/ paths the script expects) instead of reinventing it — the same
      # QEMU boot-to-login assertions persistent-boot already runs against a
      # normal (non-cut) build.
      - name: Boot the freshly-cut bundle to a login prompt
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dist/release-a/vmlinuz:/boot/vmlinuz:ro \
            -v ${{ github.workspace }}/dist/release-a/initramfs-ovmx-slim.cpio.gz:/boot/initramfs-ovmx-slim.cpio.gz:ro \
            -v ${{ github.workspace }}/dist/release-a/ovmx-distrib.img:/boot/ovmx-distrib.img:ro \
            -v ${{ github.workspace }}/tests/qemu/test_distrib_boot.sh:/test.sh:ro \
            ubuntu:24.04 \
            bash -c "apt-get update -qq && apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-efi-aarch64 cpio >/dev/null 2>&1 && bash /test.sh"

  # -----------------------------------------------------------------------
  # Job 2c: install -> UPGRADE -> boot (vms-f05, epic vms-a84 RELEASE ENGINEERING)
  #
  # Fresh install is proven (Job 2 above, Job 2b's PARTS demo, vms-df9's
  # product-install-e2e); a 0.N -> 0.N+1 UPGRADE preserving user state was
  # completely untested before this job -- exactly where real systems break.
  # Cuts TWO real tools/cut-release.sh bundles (never hand-faked "0.N"/
  # "0.N+1"): BASELINE from a fixed, recorded commit
  # (28a929b2, "tests: install->UPGRADE->boot e2e gate scaffolding" -- the
  # commit right before this same PR bumped OVMX_PRODUCT_VERSION V0.1 ->
  # V0.2) and UPGRADE from this workflow's own commit (HEAD). This is a
  # deliberately PINNED historical pair, not a rolling N/N+1 -- it exists to
  # structurally prove the upgrade MECHANISM once, against a real version
  # jump this repository actually made. Re-pinning it to a later pair (or
  # making it roll forward automatically each release) is tracked
  # separately, not done here (no gold-plating this item's scope).
  #
  # tests/qemu/test_upgrade_e2e.sh's own header carries the history: PRODUCT
  # INSTALL's do_install() used to overwrite every kit-listed file
  # unconditionally, including SYS$MANAGER:SYSTARTUP_VMS.COM (shipped BY
  # the kit) -- so a site customization appended to that file did NOT
  # survive an upgrade (assertion (b)). FIXED by vms-2c9 (kit-format
  # "seed once" metadata, OVMX_KIT_ENTRY_FLAG_SEED_ONCE): (b) now passes
  # alongside (a) user-data survival, (c) the version bump, and (d) the
  # machine still booting after the upgrade. This job is a REAL, FULLY
  # ENFORCING gate -- no `continue-on-error`, every assertion is expected
  # to pass on every run, and a red run here blocks the merge.
  # -----------------------------------------------------------------------
  upgrade-e2e:
    name: install -> UPGRADE -> boot e2e (vms-f05)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cut the BASELINE release (pinned commit, pre version-bump)
        run: |
          tools/cut-release.sh --ref 28a929b2 --out-dir "${{ github.workspace }}/dist/upgrade-baseline"

      - name: Cut the UPGRADE release (this commit)
        run: |
          tools/cut-release.sh --ref HEAD --out-dir "${{ github.workspace }}/dist/upgrade-upgrade"

      - name: Build host tools (INITIALIZE.EXE, vmsfs_master)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TOOLS=ON -DBUILD_TESTS=OFF
          cmake --build build -j"$(nproc)" --target vms_initialize vmsfs_master

      - name: Build bootable image (qemu tooling only -- boots the two cuts' own artifacts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: install -> UPGRADE -> boot e2e
        id: upgrade_e2e
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
          OVMX_BASELINE_RELEASE_DIR="${{ github.workspace }}/dist/upgrade-baseline" \
          OVMX_UPGRADE_RELEASE_DIR="${{ github.workspace }}/dist/upgrade-upgrade" \
            tests/qemu/run_upgrade_e2e.sh
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: upgrade_e2e SKIPPED in CI — this gate must actually run the real boot+upgrade, never skip silently." >&2
            exit 1
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

  # -----------------------------------------------------------------------
  # Job 2c2: PRODUCT INSTALL /DESTINATION -> boot the INSTALLED target as its
  # own system disk (vms-96ec, parent vms-718, gates the vms-37f R1 e2e).
  #
  # THE COVERAGE THAT WAS MISSING. product_install_e2e proves a /DESTINATION
  # install lands runnable bytes on a mounted DATA volume; it never boots that
  # target. Every booting e2e above (persistent-boot, distrib_boot, the
  # release-acceptance gates) boots the PRE-MASTERED ovmx-distrib.img, already
  # rooted+concealed by vmsfs_master -- never a freshly /DESTINATION-installed
  # target. So the on-disk SHAPE a /DESTINATION install produces was never
  # booted, which is exactly how vms-649 found PRODUCT INSTALL wrote a FLAT
  # [SYSEXE] layout instead of the rooted, concealed [SYS0.SYSCOMMON.SYSEXE] a
  # bootable system disk requires (a flat target halts %OVMX-F-SYSINIT --
  # DCL.EXE absent under the rooted path STARTUP resolves). This job installs
  # the OS kit onto a blank INITIALIZEd disk and then BOOTS that disk as the
  # sole DKA0: system disk (slim bootstrap initramfs) to a SYSTEM login. It is
  # a REAL, FULLY ENFORCING gate -- OVMX_QEMU_FULL_E2E=1, and a SKIP (exit 77)
  # is a hard failure, so the opt-in that hid this class of bug is NOT the CI
  # cover here. Same shape as upgrade-e2e above.
  # -----------------------------------------------------------------------
  install-boot-e2e:
    name: install /DESTINATION -> boot the installed target -> login (vms-96ec)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build host tools (INITIALIZE.EXE)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TOOLS=ON -DBUILD_TESTS=OFF
          cmake --build build -j"$(nproc)" --target vms_initialize

      - name: Build bootable image (qemu tooling + the OS kit staged at SYS$UPDATE:)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: install /DESTINATION -> boot installed target -> login
        id: install_boot_e2e
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
            tests/qemu/run_install_boot_e2e.sh
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: install_boot_e2e SKIPPED in CI — this gate must actually install and boot the target, never skip silently." >&2
            exit 1
          fi
          exit "$rc"

  # -----------------------------------------------------------------------
  # Job 2c3: THE R1 RELEASE-ACCEPTANCE GATE — media -> menu install -> SEPARATE
  # container -> login -> PRODUCT SHOW (vms-37f, parent vms-718, docs/design-
  # vms-faithful-install.md §3.3 "Release e2e"). Blocks vms-dd1.
  #
  # WHAT IT UNIFIES. install_menu_e2e drives the full OVMX$INSTALL.COM menu but
  # inside ONE container; install_boot_e2e boots a /DESTINATION-installed target
  # but via a raw DCL command, ONE container; docker_persistent_disk crosses a
  # real container boundary but drives PID 1's auto-install, not the menu. This
  # job is the intersection none of them cover: the FULL MENU-DRIVEN install in
  # container 1, the target surviving into a SEPARATE `docker run` (container 2)
  # that boots it ALONE and logs in + PRODUCT SHOW PRODUCT + DIRECTORY, and a
  # container 3 re-boot proving first-boot ran once.
  #
  # THE RED-FIRST PROOF IS BUILT IN (the vms-9b7 standing rule). The gate keeps
  # every drive at cache=writethrough and MECHANICALLY asserts it; then its own
  # NEGATIVE CONTROL re-runs the SAME fully-successful menu install but onto a
  # CONTAINER-LOCAL disk (OVMX_NEGCTL_LOCAL_TARGET=1) so it never reaches the
  # shared host file, and asserts the following verify CANNOT boot an installed
  # system. If a successful install that never touched the shared file still
  # verified, the "boundary" would be vacuous and the gate reddens — so a run
  # where the cross-container property does NOT hold fails this job. Deterministic
  # (no guest-writeback-timing dependence), so the gate is not flaky.
  #
  # A REAL, FULLY ENFORCING gate — OVMX_QEMU_FULL_E2E=1, and a SKIP (exit 77) is
  # a hard failure, so the opt-in that keeps `ctest` cheap is NOT the CI cover
  # here. Same shape as install-boot-e2e above. The gate closes the REAL
  # acceptance loop: container 1 sets a KNOWN non-default SYSTEM password during
  # install and asserts AUTHORIZE persisted it to the target SYSUAF
  # (%UAF-I-SAVED), and container 2 logs in with THAT install-set password —
  # possible now that vms-8b6 (#385, cross-process mounted-device visibility) and
  # vms-581 (#378, RMS CREATE on a mounted vmsfs volume) are in base. (A separate
  # SET TERMINAL/NOECHO display gap remains, captured as a NOTE, not scored.)
  # -----------------------------------------------------------------------
  release-install-e2e:
    name: R1 release e2e — media→menu install→separate container→login→PRODUCT SHOW (vms-37f)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build host tools (INITIALIZE.EXE)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TOOLS=ON -DBUILD_TESTS=OFF
          cmake --build build -j"$(nproc)" --target vms_initialize

      - name: Build bootable image (qemu tooling + install media + the OS kit)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: media -> menu install -> separate container -> login -> PRODUCT SHOW (incl. the no-flush negative control)
        id: release_install
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
          OVMX_INITIALIZE_EXE="${{ github.workspace }}/build/bin/INITIALIZE.EXE" \
            tests/qemu/run_release_install.sh
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: release_install SKIPPED in CI — this gate must actually install across a container boundary, never skip silently." >&2
            exit 1
          fi
          exit "$rc"

  # -----------------------------------------------------------------------
  # Job 2d: GENERALIZED RELEASE-ACCEPTANCE GATE (vms-a86f, epic vms-a84
  # RELEASE ENGINEERING)
  #
  # The PARTS 0.2 demo below (Job 2b) is PARTS-0.2-SPECIFIC and boots the DEV
  # bootable image built straight from the working tree -- it has never once
  # booted the actual thing a release recipient receives, and nothing checks
  # that the shipped version matches what was cut. This job is that
  # generalized, versioned proof:
  #
  #   1. Cuts a REAL release bundle via tools/cut-release.sh (vms-d73) --
  #      never a hand-built artifact.
  #   2. Boots that CUT bundle's own vmlinuz/initramfs-ovmx-slim.cpio.gz/
  #      ovmx-distrib.img (bind-mounted into the ovmx-boot image, which here
  #      supplies qemu-system-x86_64 and general boot tooling ONLY -- same
  #      convention as upgrade-e2e above; the image's own baked-in /boot/* is
  #      never touched).
  #   3. Runs the SAME PARTS acceptance scenario as parts_demo_e2e (login ->
  #      @PARTS_SETUP -> $ PARTS -> keyed RMS lookups -> DIRECTORY
  #      corroboration) against the CUT artifact instead of a dev build.
  #   4. Asserts `$ PRODUCT SHOW PRODUCT` on the booted artifact reports
  #      EXACTLY the OVMX_PRODUCT_VERSION the cut recorded in its own
  #      release-manifest.json.
  #
  # THE NEGATIVE CONTROL (second step below): reruns the identical gate
  # against the SAME cut bundle, but with a deliberately wrong expected
  # version substituted in (OVMX_EXPECTED_PRODUCT_VERSION_OVERRIDE) and
  # OVMX_SKIP_PARTS_SCENARIO=1 (a fast boot+login+version-check-only run --
  # no need to repeat the ~25-minute RMS load just to prove a string
  # disagrees). This step is EXPECTED to fail (rc=1); the step inverts that
  # expectation itself, so a run where the gate does NOT fail on a version
  # mismatch is what turns this job red -- proving the version-match
  # assertion above is a real, enforcing gate rather than one that always
  # reports success no matter what it is fed.
  # -----------------------------------------------------------------------
  release-acceptance-e2e:
    name: Release-acceptance gate — boot the CUT artifact, verify shipped version (vms-a86f)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cut the release bundle (tools/cut-release.sh, never hand-built)
        run: |
          tools/cut-release.sh --out-dir "${{ github.workspace }}/dist/release-acceptance"

      - name: Build bootable image (qemu tooling only -- boots the cut bundle's own artifacts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release-acceptance gate — boot the cut artifact, run the PARTS scenario, verify the shipped version
        id: acceptance
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
          OVMX_RELEASE_DIR="${{ github.workspace }}/dist/release-acceptance" \
            tests/qemu/run_release_acceptance_e2e.sh
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: release_acceptance_e2e SKIPPED in CI — this gate must actually run the real boot+demo, never skip silently." >&2
            exit 1
          fi
          exit "$rc"

      - name: NEGATIVE CONTROL — a wrong expected version must redden the gate
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
          OVMX_RELEASE_DIR="${{ github.workspace }}/dist/release-acceptance" \
          OVMX_EXPECTED_PRODUCT_VERSION_OVERRIDE="V0.0-NEGATIVE-CONTROL-DOES-NOT-EXIST" \
          OVMX_SKIP_PARTS_SCENARIO=1 \
            tests/qemu/run_release_acceptance_e2e.sh
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "FATAL: the negative control PASSED against a deliberately wrong expected version — the version-match gate is not actually enforcing." >&2
            exit 1
          fi
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: the negative control SKIPPED instead of running for real — cannot prove the gate reddens." >&2
            exit 1
          fi
          echo "Negative control confirmed: the gate correctly reddened (exit $rc) on a genuine version disagreement."
          exit 0

  # -----------------------------------------------------------------------
  # Job 2b: PARTS 0.2 Demo E2E (vms-1c8, epic vms-2579/vms-5dd)
  #
  # The OVMX 0.2 "killer app" demo, end to end, against a REAL docker+QEMU
  # boot of the actual shipped image (tests/qemu/test_parts_demo_e2e.sh, see
  # that file's header for exactly what it proves and why nothing else does):
  # boot -> SYSTEM/MANAGER login -> `@SYS$UPDATE:PARTS_SETUP.COM` -> the bare
  # foreign command `$ PARTS` -> a 10000-record RMS indexed load with keyed
  # lookups -> zero /tmp leaks -> an INDEPENDENT `$ DIRECTORY
  # SYS$SCRATCH:PARTS.DAT` from the SAME session corroborating the file
  # really exists (not just PARTS's own stdout claim).
  #
  # This is a REAL, EXECUTED proof, never a CI substitute: the harness
  # (tests/qemu/run_parts_demo_e2e.sh) only SKIPs (exit 77) when docker
  # itself is unavailable, which is never true on this runner, so the step
  # below fails loudly if it ever sees that exit code instead of silently
  # passing — a lane that can't boot vms.ko and run the demo is "unproven
  # here", not proven otherwise (CLAUDE.md Rule 9).
  #
  # Runs whenever a PR touches the surfaces this demo exercises (DCL/vmsfs/
  # RMS/boot assembly) or on any push/schedule/merge_group, same convention
  # as persistent-boot above.
  # -----------------------------------------------------------------------
  parts-demo-e2e:
    name: PARTS 0.2 Demo E2E (real boot, RMS load, DIRECTORY corroboration)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' || needs.changes.outputs.boot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bootable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: PARTS 0.2 demo e2e — boot, install, run, verify
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
            tests/qemu/run_parts_demo_e2e.sh
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: parts_demo_e2e SKIPPED in CI — this gate must actually run the real boot+demo, never skip silently." >&2
            exit 1
          fi
          exit "$rc"

  # -----------------------------------------------------------------------
  # Job 2c: SCSNODE -> real hostname across reboot (vms-b6a7)
  #
  # STARTUP.EXE's SYSBOOT role reads SYS$SYSTEM:OVMXVMSSYS.PAR and sets the
  # actual Linux hostname from SCSNODE (the hardcoded sethostname("OVMX", 4)
  # is gone). Boots the ACTUAL mastered bootable image TWICE per case (the
  # closest thing OVMX's platform has to "reboot" — see the gate's own
  # header): once to SYSGEN SET SCSNODE / WRITE CURRENT (or, in the negative
  # case, DELETE the seeded parameter file), once to prove what the next
  # boot does with it. See tests/qemu/test_boot_scsnode_hostname_e2e.sh for
  # the full two-case sequence (positive: SCSNODE follows across reboot;
  # negative: missing/corrupt .PAR on an installed disk boots on defaults
  # with an honest OVMX-facility warning, never a fabricated VMS message).
  #
  # Same SKIP_RETURN_CODE 77 => hard CI failure convention as parts-demo-e2e
  # above: this gate must actually run the real boot, never skip silently.
  # -----------------------------------------------------------------------
  boot-scsnode-hostname-e2e:
    name: SCSNODE -> real hostname across reboot (vms-b6a7)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.boot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bootable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SCSNODE -> hostname e2e — boot, SYSGEN, reboot, verify
        run: |
          set +e
          OVMX_QEMU_FULL_E2E=1 OVMX_BOOT_IMAGE=ovmx-boot:latest \
            tests/qemu/run_boot_scsnode_hostname_e2e.sh
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "FATAL: boot_scsnode_hostname_e2e SKIPPED in CI — this gate must actually run the real boot, never skip silently." >&2
            exit 1
          fi
          exit "$rc"

  # -----------------------------------------------------------------------
  # Job 3b: Kernel Executive (vms-e4d, epic vms-6b8 PHASE 0 HARD BARRIER)
  #
  # This is the ONLY CI job that boots a real kernel, insmods vms.ko, and runs
  # executive assertions against /dev/vms. Before this job existed, NO CI job
  # ever loaded vms.ko (persistent-boot above runs entirely inside Docker,
  # which has no /dev/vms) — so every executive facility (access modes, ASTs,
  # event flags, the lock manager) was provably untested in CI, and userspace
  # code drifted toward per-process fakes that report success without ever
  # touching the executive. tests/qemu/Dockerfile builds vms.ko + vmsfs.ko
  # against a real Ubuntu kernel, assembles an initramfs with statically-linked
  # test programs (ENQ/CONVERT/DEQ round-trips, AST delivery, event-flag
  # clusters, access-mode/privilege checks, cross-process lock arbitration,
  # vmsfs mount/read/write), and boots QEMU on the serial console via
  # tests/qemu/run_tests.sh, which exits nonzero if any suite failed.
  #
  # Docker here is BUILD/TEST TOOLING (produces the kernel module + boots the
  # real kernel in QEMU) — it is NOT standing in as the runtime; nothing in
  # this job talks to /dev/vms from inside a container's own namespace, it
  # boots an independent guest kernel that loads the module for real.
  # -----------------------------------------------------------------------
  kernel-executive:
    name: Kernel Executive (vms.ko via /dev/vms, QEMU)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.kernel == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Content-addressed gha layer cache: the vms.ko/vmsfs.ko + initramfs image
      # is rebuilt only when the kernel/rootfs sources change, not every run --
      # this is what keeps the real /dev/vms executive proof fast enough to stay
      # in the pre-merge tier for kernel-touching PRs (never demoted to nightly).
      # load: true keeps `docker run ovmx-ktest:latest` below working unchanged.
      - name: Build kernel executive test image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/qemu/Dockerfile
          push: false
          load: true
          tags: ovmx-ktest:latest
          cache-from: type=gha,scope=kernel-executive
          cache-to: type=gha,mode=max,scope=kernel-executive

      - name: Boot QEMU, insmod vms.ko, run executive assertions against /dev/vms
        run: |
          set +e
          RAW=$(docker run --rm ovmx-ktest:latest 2>&1)
          RC=$?
          set -e
          # QEMU's serial console emits CRLF; normalise so line-anchored
          # matching below is not defeated by a trailing \r.
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "FAIL: kernel-executive harness exited nonzero"
            exit 1
          fi

          # ---------------------------------------------------------------
          # WHY THIS IS NOT A COUNT ASSERTION (vms-1d9 round 5)
          #
          # A nonzero exit code alone does not catch a suite that silently
          # stops being built/staged/run while everything else stays green:
          # if tests/qemu/Dockerfile's qemu_syssvc_tests build or its
          # test_syssvc_* glob-copy step quietly drops a registered test,
          # init.sh's TOTAL_PASS/TOTAL_FAIL both just get smaller and the
          # job still exits 0. Two previous attempts at closing that gap
          # both failed, each proven by a real podman build + QEMU boot:
          #
          #   round 3: pinned the EXACT tally ('11 suites passed, 0 failed').
          #            Strong against a drop, but turns the job RED the
          #            moment a legitimate new test_syssvc_*.c is ADDED --
          #            defeating the glob-based generality this item exists
          #            to deliver for vms-ef1 / vms-as1 / vms-pv1.
          #   round 4: replaced it with a FLOOR (>= 11) plus a HAND-
          #            MAINTAINED suite-name list whose own comment said it
          #            is not updated when a suite is added. So every suite
          #            added after that point was permanently unprotected:
          #            adversary added a suite, dropped it from the
          #            initramfs, and got '11 suites passed, 0 failed',
          #            rc 0, 'PASS: all checks satisfied'.
          #
          # This version DERIVES the expected suite set from the checkout at
          # CI time and asserts, per suite, on the machine-readable verdict
          # line init.sh prints ("=== SUITE <name> rc=<exit code> ===").
          # No count, no hand-maintained list. Consequences:
          #   * suite ADDED   -> its source appears in the derived set, it is
          #                      asserted automatically, job stays GREEN
          #   * suite DROPPED -> source present, verdict line absent -> RED
          #   * suite FAILS   -> verdict line says rc!=0 -> RED
          # All three directions are proven by real podman+QEMU runs (see
          # vms-1d9 notes), not by inspection.
          # ---------------------------------------------------------------
          EXPECTED=$(cd "$GITHUB_WORKSPACE" && ls tests/qemu/test_kmod_*.c tests/qemu/test_syssvc_*.c \
                     | xargs -n1 basename | sed 's/\.c$//' | sort)
          echo "Derived expected suites from the checkout:"
          echo "$EXPECTED" | sed 's/^/  /'

          # `|| true`: grep -c exits 1 on an empty set, and GitHub runs `run:`
          # steps under `bash -e`, so without it an empty derived set would
          # abort the step with no diagnostic instead of hitting the explicit
          # floor check below.
          N_EXPECTED=$(echo "$EXPECTED" | grep -c . || true)
          # Monotone FLOOR on the number of suite SOURCES, not on any tally.
          # The derived set above cannot notice a suite whose .c file was
          # deleted outright (the set simply shrinks), so this catches that.
          # It is a floor, so ADDING suites never requires touching it; only
          # deliberately removing a suite does, which is the intended
          # forcing function (see project Rule: do not delete the test that
          # exposed a defect).
          if [ "$N_EXPECTED" -lt 12 ]; then
            echo "FAIL: only $N_EXPECTED suite sources under tests/qemu (expected at least 12)."
            echo "A tests/qemu/test_kmod_*.c or test_syssvc_*.c was deleted. Deleting an executive"
            echo "suite is not a way to make this gate pass -- see vms-6b8."
            exit 1
          fi

          # init.sh prints one verdict line per staged binary it actually
          # execs, carrying the binary's REAL exit status. A missing line
          # proves the binary never ran (dropped by the build or the
          # initramfs copy); rc!=0 proves it ran and failed.
          BAD=""
          for suite in $EXPECTED; do
            line=$(echo "$OUTPUT" | grep -F "=== SUITE $suite rc=" | tail -1)
            if [ -z "$line" ]; then
              BAD="$BAD
            $suite: NEVER RAN (no verdict line -- not built, or not staged into the initramfs)"
              continue
            fi
            rc=$(printf '%s' "$line" | sed -n 's/.*rc=\([0-9][0-9]*\).*/\1/p')
            if [ "$rc" != "0" ]; then
              BAD="$BAD
            $suite: rc=$rc (expected 0; rc=77 means it reported an honest SKIP inside the one job that HAS a real /dev/vms)"
            fi
          done
          echo "$OUTPUT" | grep -qF 'PASS: vms.ko loaded, /dev/vms present' \
            || BAD="$BAD
            vms.ko: did not load / /dev/vms absent"
          echo "$OUTPUT" | grep -qF 'PASS: vmsfs.ko loaded, filesystem registered' \
            || BAD="$BAD
            vmsfs.ko: did not load / filesystem not registered"

          if [ -n "$BAD" ]; then
            echo "FAIL: kernel-executive suite verdicts not all clean:$BAD"
            exit 1
          fi

          # Aggregate cross-check: init.sh's own tally must agree that
          # nothing failed. This is deliberately NOT a count -- it catches a
          # suite that failed inside init.sh's accounting without producing
          # a verdict line at all (e.g. a harness edit that reorders them),
          # and it proves the harness reached its own accounting rather than
          # panicking or timing out mid-run.
          echo "$OUTPUT" | grep -qE '=== FINAL RESULTS: [0-9]+ suites passed, 0 suites failed ===' \
            || { echo "FAIL: expected a '<N> suites passed, 0 suites failed' split -- a suite failed, or the harness never reached its own accounting (panic/timeout)"; exit 1; }

          echo "PASS: all $N_EXPECTED derived suites ran with rc=0 against a real /dev/vms, both modules loaded"

  # -----------------------------------------------------------------------
  # Job 3c: Kernel Executive — negative control (vms-e4d)
  #
  # Proves the kernel-executive gate above can actually fail. Builds the SAME
  # harness with --build-arg NEGATIVE_CONTROL=1, which patches init.sh to skip
  # insmod of vms.ko (simulating the executive being absent) while everything
  # else — building vms.ko itself, loading vmsfs.ko, the test binaries — stays
  # real. Every test that opens /dev/vms then fails ("cannot open /dev/vms")
  # instead of silently passing. (This comment used to add "the same
  # SS$_NOSUCHDEV path sys_lock.c already takes"; that path was DELETED by
  # vms-0ff — an unreachable executive is now prevented at boot, not reported
  # per call. The harness is a test rig deliberately booted without an
  # executive, which is why it can still observe a state the product cannot.)
  # run_tests.sh exits 1 in that case, so
  # THIS job inverts the check: it PASSES only if the container run fails,
  # and FAILS (catching a regression in the harness itself) if the container
  # run unexpectedly succeeds while the executive is supposed to be absent.
  # This is what keeps "a CI job that cannot fail is decoration" from
  # regressing silently — it re-proves the gate can trip on every push.
  # -----------------------------------------------------------------------
  kernel-executive-negative-control:
    name: Kernel Executive — Negative Control (proves the gate can fail)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernel executive test image WITHOUT loading vms.ko
        run: |
          docker build -f tests/qemu/Dockerfile \
            --build-arg NEGATIVE_CONTROL=1 \
            -t ovmx-ktest-negctl:latest .

      - name: Assert the harness FAILS for the RIGHT REASON when the executive is absent
        run: |
          set +e
          RAW=$(docker run --rm ovmx-ktest-negctl:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -eq 0 ]; then
            echo "FAIL: expected the kernel-executive harness to fail with vms.ko unloaded, but it exited 0"
            echo "This means a broken executive assertion would NOT fail CI -- the exact defect class vms-6b8 exists to kill."
            exit 1
          fi

          # A nonzero exit alone proves nothing: a missing QEMU binary, a boot
          # panic, run_tests.sh's hard-coded 120s TIMEOUT, or a runner OOM would
          # ALL make this job go green for the WRONG reason. Assert the actual
          # REASON the harness reported, not merely that something failed.
          echo "$OUTPUT" | grep -qF 'cannot open /dev/vms' \
            || { echo "FAIL: did not see the expected 'cannot open /dev/vms' failure text -- the job may have gone red for an unrelated reason (QEMU missing, boot panic, run_tests.sh timeout, runner OOM), not because the executive is absent"; exit 1; }

          # ---------------------------------------------------------------
          # PER-SUITE VERDICTS, DERIVED FROM THE CHECKOUT (vms-1d9)
          #
          # This block replaces an exact tally pin ('3 suites passed, N
          # suites failed'). The pin's own comment argued "the brittleness IS
          # the feature", and for detecting a suite that stops depending on
          # /dev/vms that was true -- but it bought that with two defects,
          # both proven by real podman builds + QEMU boots, not by argument:
          #
          # (a) IT BROKE ON A LEGITIMATE ADDITION. Adding one
          #     test_syssvc_*.c that honestly needs /dev/vms moved the split
          #     by one and turned THIS job red for a correct change -- which
          #     defeats the glob-based generality vms-1d9 exists to hand to
          #     vms-ef1 / vms-as1 / vms-pv1.
          #
          # (b) IT COULD NOT SEE A PER-SUITE REGRESSION. A tally is a sum:
          #     one suite silently vanishing and another silently starting
          #     to fail cancel out, and init.sh funnels an honest skip (77)
          #     and a failed assertion (1) into the SAME counter, so a suite
          #     whose assertions all failed produced byte-identical
          #     accounting to the clean tree.
          #
          # Fix for both: assert the PER-SUITE exit code init.sh now prints
          # ("=== SUITE <name> rc=<code> ==="), against a suite set DERIVED
          # from `ls tests/qemu/test_*.c` at CI time. Nothing is maintained
          # by hand, and each suite is judged on its own verdict:
          #
          #   test_syssvc_*      -> rc MUST be exactly 77 (honest skip).
          #        These link the real src/libvms public sys$ API. The suite
          #        returns 77 ONLY if every device-absent assertion it made
          #        passed (`return fail > 0 ? 1 : EXIT_SKIP`), and those
          #        assertions are that a public sys$ entry point called with
          #        no executive present DID NOT REPORT SUCCESS. So:
          #           rc=77 -> no sys$ entry point fabricated a success.
          #           rc=1  -> one did, or another assertion failed. RED.
          #           rc=0  -> the suite claims outright success with no
          #                    /dev/vms at all. RED.
          #        NOTE what is deliberately NOT asserted: any particular
          #        status VALUE. vms-0ff ruled that OVMX has no
          #        "executive absent" state to have a VMS-defined status for
          #        (PID 1 refuses to boot without it), and the per-call
          #        SS$_NOSUCHDEV returns sys_lock.c used to make were
          #        DELETED as a fiction. Pinning a value here would freeze
          #        that superseded contract into a gate. What survives the
          #        ruling is strictly the absence of a fabricated success,
          #        which is a property, not a VMS behaviour -- and it is
          #        observable only in this rig, which is deliberately booted
          #        without an executive (see this job's header).
          #        CONTRACT for future test_syssvc_*.c (vms-ef1, vms-as1,
          #        vms-pv1): the suite MUST require a real /dev/vms and MUST
          #        exit 77 when it is absent, never 0.
          #
          #   test_kmod_vmsfs*   -> rc MUST be 0.
          #        POSITIVE control paired with the negatives: vmsfs has no
          #        dependency on vms.ko, so it must still fully pass with the
          #        executive absent. If the harness were failing
          #        indiscriminately (gutted, always-fail, boot broken), this
          #        would fail too and every negative assertion here would be
          #        proving nothing about the executive specifically.
          #
          #   every other test_kmod_* -> rc MUST be nonzero.
          #        Raw-ioctl executive tests; they cannot pass without
          #        /dev/vms. An rc=0 here means something is faking the
          #        executive.
          #
          # Nothing is maintained by hand; adding a suite of any of the three
          # kinds is absorbed automatically.
          # ---------------------------------------------------------------
          EXPECTED=$(cd "$GITHUB_WORKSPACE" && ls tests/qemu/test_kmod_*.c tests/qemu/test_syssvc_*.c \
                     | xargs -n1 basename | sed 's/\.c$//' | sort)
          # `|| true`: grep -c exits 1 on an empty set, and GitHub runs `run:`
          # steps under `bash -e`, so without it an empty derived set would
          # abort the step with no diagnostic instead of hitting the explicit
          # floor check below.
          N_EXPECTED=$(echo "$EXPECTED" | grep -c . || true)
          echo "Derived expected suites from the checkout ($N_EXPECTED):"
          echo "$EXPECTED" | sed 's/^/  /'

          # SUITE-COUNT FLOOR. The derived set above is drop-detecting for a
          # suite that stops RUNNING, but blind to one whose .c is DELETED
          # outright -- the expected set just shrinks with it. This floor is
          # the guard against that, and it is the count on the tree at the
          # time this line was written. It is a MINIMUM, so adding suites
          # never requires touching it; only deliberately deleting one does,
          # which is the intended forcing function.
          #
          # 12 -> 13 (vms-9fc adds test_kmod_bind). RECOMPUTED FROM THE MERGED
          # TREE, not carried over from either side of the conflict: vms-9fc
          # was branched while this block was still an exact-tally pin
          # ('3 suites passed, N suites failed') and had bumped that pin
          # instead. Two branches each adding one executive suite both write
          # "N+1", git merges them cleanly, and the truth is "N+2" -- which is
          # why this figure is derived by building the NEGATIVE_CONTROL=1 image
          # and reading the verdicts, never by editing a number.
          if [ "$N_EXPECTED" -lt 13 ]; then
            echo "FAIL: only $N_EXPECTED suite sources under tests/qemu (expected at least 13) -- a suite source was deleted."
            echo "Deleting an executive suite is not a way to make this gate pass."
            exit 1
          fi

          BAD=""
          N_SYSSVC=0
          for suite in $EXPECTED; do
            line=$(echo "$OUTPUT" | grep -F "=== SUITE $suite rc=" | tail -1)
            if [ -z "$line" ]; then
              BAD="$BAD
            $suite: NEVER RAN (no verdict line -- not built, or not staged into the initramfs)"
              continue
            fi
            rc=$(printf '%s' "$line" | sed -n 's/.*rc=\([0-9][0-9]*\).*/\1/p')
            case "$suite" in
              test_syssvc_*)
                N_SYSSVC=$((N_SYSSVC+1))
                if [ "$rc" = "0" ]; then
                  BAD="$BAD
            $suite: rc=0 -- claims SUCCESS through the public sys\$ API with NO /dev/vms present. A fake pass; expected the honest-skip code 77."
                elif [ "$rc" != "77" ]; then
                  # rc=1 (or any non-77, non-0 code) does NOT by itself mean a
                  # fabricated success -- it only means "77 was not reached".
                  # That has (at least) two distinct causes: a device-absent
                  # assertion inside the suite failed (fabricated success,
                  # vms-6b8's signature defect), OR some other assertion in
                  # the suite failed for an unrelated reason. Printing one of
                  # those as THE cause is a claim the suite's own FAIL lines
                  # can refute (proven on PR #46, run 30725753152: both
                  # fabricated-success assertions PASSED, DCL.EXE crashing was
                  # the real defect). So report the CONDITION and paste this
                  # suite's own FAIL lines and let the reader attribute --
                  # vms-c9c.
                  suite_fails=$(printf '%s\n' "$OUTPUT" | awk -v target="$suite" '
                    /^=== SUITE / {
                      if ($0 ~ ("^=== SUITE " target " rc=")) { printf "%s", buf; exit }
                      buf=""
                      next
                    }
                    { buf = buf $0 "\n" }
                  ' | grep -F "FAIL:" || true)
                  # `|| true`: grep -F exits 1 when this suite printed NO
                  # FAIL: line at all -- the crash/segfault/killed-by-signal
                  # shape (rc=139, rc=141/SIGPIPE, etc: real data per
                  # CLAUDE.md Rule 9, not noise), where the process died
                  # before reaching an assertion. This whole step runs under
                  # bash -e (set at the top of this step), so an unguarded
                  # grep here previously aborted the ENTIRE step with ZERO
                  # diagnostic the instant a test_syssvc_* suite crashed
                  # instead of failing an assertion -- reproduced with
                  # tools/replay_ci_kernel_executive.py against a synthetic
                  # rc=139/no-FAIL-line capture (vms-a3c). Same idiom, same
                  # reason, as the N_EXPECTED `grep -c . || true` above.
                  if [ -z "$suite_fails" ]; then
                    suite_fails="(no FAIL: line was printed for this suite -- consistent with a crash, a killed process, or an exit before any assertion ran; NOT consistent with a specific assertion having been identified)"
                  fi
                  BAD="$BAD
            $suite: rc=$rc -- expected the honest-skip code 77. Not reaching 77 has AT LEAST two known causes: a device-absent assertion inside the suite failing (a fabricated success, vms-6b8's signature defect), or another assertion failing for an unrelated reason -- both print the suite's own FAIL line(s), pasted below when present. This condition is not proven exhaustive; a suite that crashes before printing anything (see below) is a THIRD observed shape that produces neither:
            $suite_fails"
                fi
                ;;
              test_kmod_vmsfs*)
                if [ "$rc" != "0" ]; then
                  BAD="$BAD
            $suite: rc=$rc -- expected 0. vmsfs does not depend on vms.ko, so it must still pass with the executive absent; if it fails, the harness is failing indiscriminately and the negative assertions prove nothing."
                fi
                ;;
              *)
                if [ "$rc" = "0" ]; then
                  BAD="$BAD
            $suite: rc=0 -- a raw-ioctl executive test PASSED with no /dev/vms. Something is faking the executive."
                fi
                ;;
            esac
          done

          if [ "$N_SYSSVC" -lt 1 ]; then
            BAD="$BAD
            no test_syssvc_* suite ran at all -- the userspace public-sys\$ layer is not in the initramfs, so the silent-fallback gate above checked nothing."
          fi

          # vms.ko must NOT have loaded (that is the scenario), and vmsfs.ko
          # must have -- the paired negative/positive at module-load level.
          echo "$OUTPUT" | grep -qF 'FAIL: vms.ko load or /dev/vms creation failed' \
            || BAD="$BAD
            vms.ko: expected the load to fail (NEGATIVE_CONTROL skips the insmod) but no such failure was reported -- the negative control may not have been applied at all."
          echo "$OUTPUT" | grep -qF 'PASS: vmsfs.ko loaded, filesystem registered' \
            || BAD="$BAD
            vmsfs.ko: did not load with the executive absent -- the harness may be failing indiscriminately rather than isolating the executive dependency."

          if [ -n "$BAD" ]; then
            echo "FAIL: negative control did not go red for the RIGHT REASON:$BAD"
            exit 1
          fi

          # Proves the harness reached its own accounting rather than
          # panicking or timing out. Deliberately NOT a count (see above).
          echo "$OUTPUT" | grep -qE '=== FINAL RESULTS: [0-9]+ suites passed, [0-9]+ suites failed ===' \
            || { echo "FAIL: the harness never reached its own FINAL RESULTS accounting -- boot panic, QEMU missing, or run_tests.sh timeout, not an executive-absent failure"; exit 1; }

          echo "PASS: harness went red for the RIGHT REASON -- executive absent, all $N_SYSSVC public-sys\$ suite(s) returned the honest-skip code 77 (so no sys\$ entry point fabricated a success), every executive-dependent raw-ioctl suite failed, and vmsfs's independent facility still passed"

  # -----------------------------------------------------------------------
  # Job 3b-netbsd: OVMX/NetBSD amd64 harness (vms-7f7, epic vms-8e8 Phase 2a)
  #
  # De-risks the OVMX/NetBSD SYSKRNL (epic vms-8e8) on a KNOWN architecture
  # before the VAX arch port: there is NO qemu-system-vax, so the whole NetBSD
  # executive is first proven on NetBSD/amd64 under qemu-system-x86_64 (see
  # docs/design-ovmx-netbsd-syskrnl.md §6). This job boots a real NetBSD/amd64
  # guest (installed from the pinned official release via anita), drives its
  # serial console, and asserts `uname -srm` == "NetBSD <version> amd64". It is
  # the foundation P2b (a `vms` pseudo-device on NetBSD) and P2c (an executive
  # facility test against a real /dev/vms on NetBSD) build on.
  #
  # Docker here is BUILD/TEST TOOLING (CLAUDE.md Rule 9 / docs/runtime-target.md),
  # exactly like the Linux kernel-executive job above: it boots an independent
  # NetBSD guest in QEMU to TEST it. NetBSD-as-a-real-runtime is the product goal
  # of epic vms-8e8; a QEMU harness that boots it for testing is not a runtime.
  #
  # GATING mirrors the expensive executive jobs: it never runs on an unrelated
  # PR (only when tests/netbsd/** or the workflow changes), and always on
  # push/merge_group/schedule.
  #
  # RUNNER-CAPABILITY CAVEAT (honest, per the anti-fake rule): GitHub-hosted
  # runners have no /dev/kvm, so the guest runs under TCG. drive_netbsd.py
  # detects this and still boots for real -- it is slower, not faked. The
  # NetBSD install is done ONCE and the resulting disk image + download mirror
  # are cached (actions/cache, keyed on the pinned release), so only a COLD
  # cache pays the full TCG install cost; warm runs just boot the cached image.
  # The first cold run on a fresh cache is the one at risk of the 120-minute
  # cap under TCG; if that proves too tight on GitHub's runners, this job wants
  # a KVM-capable (self-hosted or larger) runner -- it is wired and real, the
  # only open question is the cold-install budget on the stock runner.
  #
  # The NEGATIVE CONTROL is a step in THIS job, not a separate one, because it
  # reuses the warm cache the positive step just populated: it re-boots the same
  # image asserting a deliberately WRONG arch (sparc64) and requires the harness
  # to go RED -- proving the assertion has teeth for a couple of minutes of boot,
  # not a second full install.
  # -----------------------------------------------------------------------
  # Job: NetBSD/amd64 vms module cross-compiles (rd vms-2d9). THE PER-PR NetBSD
  # GATE -- BUILD ONLY, no QEMU, no console, no boot, ~1-2 min. It cross-compiles
  # the `vms' kernel module (src/kernel-netbsd/) + the SHARED facility source
  # (src/kernel-core/vms_eflag.c) against the pinned NetBSD/amd64 kernel headers
  # with clang -target x86_64-unknown-netbsd, and relocatable-links them. This is
  # the honest per-PR value: the facility logic is byte-identical Linux-side, so
  # what a PR must catch is a NetBSD-backend / header-API DRIFT that breaks the
  # NetBSD build -- a pure compile+link question. The full "does it RUN on NetBSD"
  # proof (boot + module load + INV-6 cross-process event-flag proof) is the
  # NIGHTLY console-driven harnesses below: QEMU-TCG on GitHub-hosted runners (no
  # /dev/kvm) is too slow/variable for a reliable per-PR emulator test, so its
  # coverage is MOVED to schedule, never deleted (validated in Phase C #393).
  netbsd-amd64-vms-crosscompile:
    name: NetBSD/amd64 vms module cross-compiles
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang (NetBSD cross target)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang

      # Cache the extracted NetBSD kernel sources, keyed on the pinned release
      # (netbsd_version.env carries NETBSD_SYSSRC_URL/_SHA512). No OVMX-source
      # component -- a source change never re-downloads.
      - name: Cache NetBSD kernel sources (syssrc)
        uses: actions/cache@v4
        with:
          path: .netbsd-src
          key: netbsd-src-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-src-

      - name: Fetch + verify + extract NetBSD syssrc (kernel headers) if not cached
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . tests/netbsd/netbsd_version.env
          if [ ! -d .netbsd-src/usr/src/sys ]; then
            mkdir -p .netbsd-src
            curl -sSL -o /tmp/syssrc.tgz "$NETBSD_SYSSRC_URL"
            echo "$NETBSD_SYSSRC_SHA512  /tmp/syssrc.tgz" | sha512sum -c -
            tar xzf /tmp/syssrc.tgz -C .netbsd-src usr/src/sys usr/src/common
          fi

      - name: Cross-compile the vms module + shared kernel-core (clang, NetBSD/amd64 kernel)
        run: OVMX_REPO="$PWD" NBSRC="$PWD/.netbsd-src" CC=clang bash tests/netbsd/crosscompile.sh

      - name: NEGATIVE CONTROL — a deliberately-broken TU must fail the cross-compile
        run: OVMX_REPO="$PWD" NBSRC="$PWD/.netbsd-src" CC=clang CROSSCOMPILE_NEGCTL=1 bash tests/netbsd/crosscompile.sh

  # -----------------------------------------------------------------------
  # Job: NetBSD/amd64 vmsfs module cross-compiles (rd vms-308, P4-VFS V4). THE
  # PER-PR NetBSD GATE for the ODS-2 vnode/VFS backend -- BUILD ONLY, no QEMU, no
  # console, no boot, ~1-2 min. It cross-compiles the ODS-2 vnode module
  # (src/kernel-netbsd/vmsfs/) + the SHARED substrate-neutral ODS-2 core
  # (src/kernel-core/vmsfs/*.c) against the pinned NetBSD/amd64 kernel headers
  # with clang -target x86_64-unknown-netbsd, and relocatable-links them. The
  # ODS-2 logic is byte-identical to the Linux vmsfs.ko side (it IS the same core
  # sources), so what a PR must catch is a NetBSD-backend / header-API DRIFT that
  # breaks the NetBSD vmsfs build -- a pure compile+link question. The full "does
  # it mount + read on NetBSD" proof runs NIGHTLY (schedule/dispatch) under
  # QEMU-TCG (netbsd-amd64-vmsfs-mount), never on a per-PR runner. This is the
  # ODS-2 sibling of netbsd-amd64-vms-crosscompile (the executive module gate),
  # and reuses the SAME cached NetBSD syssrc.
  netbsd-amd64-vmsfs-crosscompile:
    name: NetBSD/amd64 vmsfs module cross-compiles
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.netbsd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang (NetBSD cross target)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang

      # Same cache + key as the executive cross-compile job (netbsd_version.env
      # pins the release); a source change never re-downloads the headers.
      - name: Cache NetBSD kernel sources (syssrc)
        uses: actions/cache@v4
        with:
          path: .netbsd-src
          key: netbsd-src-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-src-

      - name: Fetch + verify + extract NetBSD syssrc (kernel headers) if not cached
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . tests/netbsd/netbsd_version.env
          if [ ! -d .netbsd-src/usr/src/sys ]; then
            mkdir -p .netbsd-src
            curl -sSL -o /tmp/syssrc.tgz "$NETBSD_SYSSRC_URL"
            echo "$NETBSD_SYSSRC_SHA512  /tmp/syssrc.tgz" | sha512sum -c -
            tar xzf /tmp/syssrc.tgz -C .netbsd-src usr/src/sys usr/src/common
          fi

      - name: Cross-compile the vmsfs module + shared ODS-2 core (clang, NetBSD/amd64 kernel)
        run: OVMX_REPO="$PWD" NBSRC="$PWD/.netbsd-src" CC=clang bash tests/netbsd/crosscompile-vmsfs.sh

      - name: NEGATIVE CONTROL — a deliberately-broken TU must fail the cross-compile
        run: OVMX_REPO="$PWD" NBSRC="$PWD/.netbsd-src" CC=clang CROSSCOMPILE_NEGCTL=1 bash tests/netbsd/crosscompile-vmsfs.sh

  # -----------------------------------------------------------------------
  # Job: PRIME the shared NetBSD install cache (rd vms-2d9). THE KEYSTONE of
  # reliable NetBSD CI. This job runs FIRST and ALONE and is the ONLY writer of
  # the shared installed-disk cache: it restores the shared image if present, or
  # does the single unavoidable cold TCG install (~30-40min), and lets
  # actions/cache SAVE it. The three test jobs `needs:` this job and RESTORE the
  # warm image (restore-only), so they never install. This serialises the one
  # cold install into a single job with generous headroom, instead of three test
  # jobs racing three parallel ~30min cold installs -- which timed out and, being
  # cancelled, never saved the cache, leaving every future run cold (permanent
  # red). It installs via the P2c driver in PRIME_ONLY mode (install + exit; no
  # boot/build/proof), which uses the SAME shared workdir + sets the test jobs
  # reuse.
  netbsd-amd64-prime-cache:
    name: NetBSD/amd64 Prime Install Cache (QEMU)
    needs: changes
    # NIGHTLY only (rd vms-2d9): this feeds the console-driven jobs, which are all
    # nightly now (QEMU-TCG on GitHub runners is too slow/variable for reliable
    # per-PR emulator tests). The per-PR NetBSD gate is the fast build-only
    # cross-compile job (netbsd-amd64-vms-crosscompile), no QEMU.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75    # a genuine cold TCG install is ~30-40min; rest is headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # THE ONE WRITER of the shared cache (full actions/cache: restore + save).
      # Same key/path as the restore-only test jobs.
      - name: Cache installed NetBSD image (shared, version-keyed) — WRITER
        uses: actions/cache@v4
        with:
          path: .netbsd-cache
          key: netbsd-amd64-install-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-amd64-install-

      - name: Build NetBSD harness image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/netbsd/Dockerfile
          push: false
          load: true
          tags: ovmx-netbsd-ktest:latest
          cache-from: type=gha,scope=netbsd-harness
          cache-to: type=gha,mode=max,scope=netbsd-harness

      - name: Install (or restore) the shared NetBSD disk; prime the cache
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/.netbsd-cache"
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  -e PRIME_ONLY=1 -e HARNESS_TIMEOUT=4200 \
                  --entrypoint /netbsd/run_p2c.sh \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: priming the shared NetBSD install cache failed ($RC)"
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "cache primed, exiting 0" \
            || { echo "FAIL: prime driver did not report the shared disk installed"; exit 1; }
          ls "$GITHUB_WORKSPACE"/.netbsd-cache/anita-netbsd-shared-*/wd0.img >/dev/null 2>&1 \
            || { echo "FAIL: shared wd0.img not present after prime"; exit 1; }
          echo "PASS: shared NetBSD disk installed; actions/cache will SAVE it warm for every test job"

  netbsd-amd64-harness:
    name: NetBSD/amd64 Executive Harness (QEMU)
    needs: [changes, netbsd-amd64-prime-cache]
    # NIGHTLY only (rd vms-2d9) — console-driven QEMU boot+drive, too flaky for
    # per-PR under TCG. The per-PR build gate is netbsd-amd64-vms-crosscompile.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache the installed NetBSD disk image + anita download mirror. Keyed on
      # the pinned release/harness sources (netbsd_version.env lives under
      # tests/netbsd/**), so a version bump or a harness change invalidates it
      # and forces a fresh install; otherwise a warm cache skips the slow
      # TCG install entirely.
      # SHARED installed-disk cache (rd vms-2d9). All three NetBSD/amd64 jobs use
      # the IDENTICAL key = f(NetBSD version + ISO sha + anita version) via
      # netbsd_version.env, and the same path, so ONE cold install serves all
      # three and NO OVMX-source change ever invalidates it (the OVMX module is
      # built in-guest after boot, never baked into the disk).
      # RESTORE-ONLY (rd vms-2d9): this test job never WRITES the cache. The
      # prime job (a `needs:' of this job) already installed and SAVED the shared
      # image, so we only restore it and always boot a WARM disk (~8min) -- the
      # driver finds the image present and never installs. restore-only also means
      # a timed-out/failed test job can never save a partial/corrupt image.
      - name: Restore shared NetBSD image (version-keyed, restore-only)
        uses: actions/cache/restore@v4
        with:
          path: .netbsd-cache
          key: netbsd-amd64-install-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-amd64-install-
          fail-on-cache-miss: false

      - name: Build NetBSD harness image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/netbsd/Dockerfile
          push: false
          load: true
          tags: ovmx-netbsd-ktest:latest
          cache-from: type=gha,scope=netbsd-harness
          cache-to: type=gha,mode=max,scope=netbsd-harness

      - name: Boot NetBSD/amd64, drive the console, assert uname -srm
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/.netbsd-cache"
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "FAIL: NetBSD/amd64 harness exited nonzero ($RC)"
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "PASS: uname -srm printed 'NetBSD 10.1 amd64'" \
            || { echo "FAIL: did not see the asserted uname line -- job may have gone green without the real assertion"; exit 1; }
          echo "$OUTPUT" | grep -qF 'NetBSD/amd64 HARNESS PASSED' \
            || { echo "FAIL: harness did not report its own PASSED banner"; exit 1; }
          echo "PASS: NetBSD/amd64 booted under QEMU and uname -srm asserted as 'NetBSD 10.1 amd64'"

      - name: NEGATIVE CONTROL — a wrong expected arch must redden the harness
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  -e EXPECT_ARCH=sparc64 \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -eq 0 ]; then
            echo "FAIL: harness exited 0 while asserting the WRONG arch (sparc64) -- the uname assertion has no teeth."
            exit 1
          fi
          # Went red for the RIGHT reason: the assertion, not a build/boot break.
          echo "$OUTPUT" | grep -qF "FAIL: uname -srm did not print 'NetBSD 10.1 sparc64'" \
            || { echo "FAIL: nonzero exit but not the expected assertion-mismatch reason -- the negative control may have failed for an unrelated cause (build/boot/timeout)"; exit 1; }
          echo "PASS: harness correctly went RED when asserting the wrong arch -- the assertion has teeth"

  # -----------------------------------------------------------------------
  # Job 3b-netbsd-p2b: OVMX/NetBSD `vms' pseudo-device (vms-bfe, epic vms-8e8 P2b)
  #
  # Builds P2a's harness image, then boots the cached NetBSD/amd64 guest and:
  #   - builds the OVMX/NetBSD `vms' cdevsw pseudo-device (src/kernel-netbsd/)
  #     in-guest with the NetBSD kernel-module toolchain (comp + syssrc),
  #   - builds the userspace probe, which reaches /dev/vms THROUGH the transport
  #     seam (src/libvmssys/kif_transport_netbsd.c),
  #   - INV-6 NEGATIVE CONTROL: runs the probe with the module NOT loaded and
  #     requires an HONEST device-absent failure (SS$_NOSUCHDEV) -- never a fake,
  #   - modloads the module, mknod's /dev/vms, and asserts one version/ping ioctl
  #     round-trips (PROBE: PING OK).
  #
  # Gated exactly like the P2a job: push/merge_group/schedule always, and on PRs
  # only when tests/netbsd/** or the P2b src (src/kernel-netbsd/**, the transport
  # seam) changes -- given the boot + in-guest build cost. It uses its OWN cache
  # (comp + syssrc make its installed image different from P2a's), keyed on the
  # pinned release + the P2b driver. TOOLING, NOT A RUNTIME (Rule 9): it boots a
  # real NetBSD to build and load a real kernel module and test it, exactly as
  # tests/qemu/ does for the Linux vms.ko executive.
  #
  # Runner-capability caveat (honest, same as P2a): GitHub-hosted runners have no
  # /dev/kvm, so the guest runs under TCG. A COLD cache pays a full install that
  # now also fetches comp + syssrc, which is the run at risk of the 120-minute
  # cap; a warm cache boots, builds one small module, and probes in a few minutes.
  # If the cold TCG install proves too tight, this job wants a KVM-capable runner;
  # the harness itself is real either way.
  netbsd-amd64-vms-pseudodev:
    name: NetBSD/amd64 vms Pseudo-Device (QEMU)
    needs: [changes, netbsd-amd64-prime-cache]
    # NIGHTLY only (rd vms-2d9) — console-driven QEMU build+modload+PING, too flaky
    # for per-PR under TCG. The per-PR build gate is netbsd-amd64-vms-crosscompile.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Separate cache from P2a: the P2b image installs comp + syssrc, so its
      # wd0.img is a different, larger image. Keyed on the pinned release + the
      # P2b driver (which owns the set list); the driver/probe/kmod sources are
      # rebuilt in-guest every run, so they do NOT need to invalidate the image.
      # SHARED installed-disk cache (rd vms-2d9) -- IDENTICAL key/path to the
      # P2a and P2c jobs, so one install serves all three; version-keyed only.
      # RESTORE-ONLY (rd vms-2d9): this test job never WRITES the cache. The
      # prime job (a `needs:' of this job) already installed and SAVED the shared
      # image, so we only restore it and always boot a WARM disk (~8min) -- the
      # driver finds the image present and never installs. restore-only also means
      # a timed-out/failed test job can never save a partial/corrupt image.
      - name: Restore shared NetBSD image (version-keyed, restore-only)
        uses: actions/cache/restore@v4
        with:
          path: .netbsd-cache
          key: netbsd-amd64-install-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-amd64-install-
          fail-on-cache-miss: false

      - name: Build NetBSD harness image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/netbsd/Dockerfile
          push: false
          load: true
          tags: ovmx-netbsd-ktest:latest
          cache-from: type=gha,scope=netbsd-harness
          cache-to: type=gha,mode=max,scope=netbsd-harness

      - name: Build + modload /dev/vms; assert one ping ioctl through the seam
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/.netbsd-cache"
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  --entrypoint /netbsd/run_p2b.sh \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "FAIL: NetBSD/amd64 P2b harness exited nonzero ($RC)"
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "OK (INV-6): with no module loaded the probe FAILED HONESTLY" \
            || { echo "FAIL: did not see the INV-6 module-absent honest-failure assertion"; exit 1; }
          echo "$OUTPUT" | grep -qF "PROBE: PING OK" \
            || { echo "FAIL: did not see the probe's PING OK line -- the ioctl did not round-trip"; exit 1; }
          echo "$OUTPUT" | grep -qF 'NetBSD/amd64 P2b HARNESS PASSED' \
            || { echo "FAIL: harness did not report its own PASSED banner"; exit 1; }
          echo "PASS: real in-kernel /dev/vms on NetBSD answered one ping ioctl through kif_transport_netbsd.c"

      - name: NEGATIVE CONTROL — skipping modload must redden the PING assertion
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  --entrypoint /netbsd/run_p2b.sh \
                  -e P2B_SKIP_LOAD=1 \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -eq 0 ]; then
            echo "FAIL: harness exited 0 with the module never loaded -- the PING OK assertion has no teeth."
            exit 1
          fi
          # Went red for the RIGHT reason: the ping round-trip could not happen
          # because /dev/vms was never created (not a build/boot/timeout break).
          echo "$OUTPUT" | grep -qF "the version/ping ioctl did not round-trip" \
            || { echo "FAIL: nonzero exit but not the expected missing-ioctl reason -- negative control may have failed for an unrelated cause"; exit 1; }
          echo "PASS: harness correctly went RED when the module was not loaded -- the PING assertion has teeth"

  # Job 3b-netbsd-p2c: OVMX/NetBSD event-flag facility (vms-4b4, epic vms-8e8 P2c)
  #
  # THE PHASE THAT PROVES THE SHARED EXECUTIVE CORE IS REAL ON NETBSD. Builds the
  # harness image, boots the cached NetBSD/amd64 guest (comp + syssrc), and:
  #   - builds the OVMX/NetBSD `vms' pseudo-device, which compiles the SAME
  #     event-flag facility source the Linux vms.ko builds --
  #     src/kernel-core/vms_eflag.c -- with the NetBSD backend
  #     (exec_kbackend_netbsd.h / exec_list_netbsd.{h,c}). There is NO NetBSD copy
  #     of the facility logic; the one source runs on both substrates,
  #   - builds the userspace event-flag tool, which reaches /dev/vms THROUGH the
  #     transport seam (src/libvmssys/kif_transport_netbsd.c) and $ASCEFCs the
  #     well-known PERMANENT common cluster before each op (VMS-faithful),
  #   - INV-6 NEGATIVE CONTROL: runs the tool with the module NOT loaded and
  #     requires an HONEST device-absent failure (SS$_NOSUCHDEV) -- never a fake,
  #   - CROSS-PROCESS PROOF: process A sets common flag 64; a DIFFERENT process B
  #     reads it SET (control flag 65 stays CLEAR); a third clears it and sees the
  #     previous state was-set; then a waiter BLOCKS in-kernel on flag 66 and is
  #     WOKEN by a DIFFERENT process's set (the shared cv/lock wait/wake across a
  #     process boundary). That cross-process visibility + wake is the
  #     INV-6-decisive property (CLAUDE.md Rule 9): the flag lives in the shared
  #     executive core's kernel memory, not in any one process.
  #
  # GATING: NIGHTLY (schedule) + manual (workflow_dispatch) ONLY -- NOT per-PR and
  # NOT the merge queue (rd vms-2d9). This is honest gating, not weakening:
  #   * The per-PR NetBSD gate is P2a (Executive Harness) + P2b (vms Pseudo-Device)
  #     + the prime job. P2b already BUILDS the shared src/kernel-core/vms_eflag.c
  #     with the NetBSD backend (exec_kbackend_netbsd/exec_list_netbsd) and LOADS
  #     the module and round-trips /dev/vms on every PR -- so a NetBSD-backend
  #     COMPILE or module-load regression is caught per-PR.
  #   * What runs here in addition is the heavy TWO-PROCESS cross-process proof
  #     (build + modload + 4 processes + an in-kernel cv wait/wake). Under TCG on
  #     shared GitHub runners that heavy path is reliable MOST of the time (green
  #     in Phase C #393 at 14m50s, and 5/5 back-to-back local TCG runs) but flakes
  #     intermittently on runner-variance (e.g. a stuck emulated-CD staging step),
  #     and a flaky job must not gate PRs ("flaky = broken", CLAUDE.md Rule 8).
  #   * So the cross-process proof is MOVED to the nightly full suite (never
  #     deleted), where an occasional runner-variance retry is acceptable. It uses
  #     the SAME shared prime cache and deterministic console as the per-PR jobs.
  # Restore this to per-PR gating once GitHub-hosted NetBSD/amd64 runners gain KVM
  # (or a dedicated KVM runner is available) so the heavy proof is fast + reliable.
  netbsd-amd64-eflag-facility:
    name: NetBSD/amd64 Event-Flag Facility (QEMU)
    needs: [changes, netbsd-amd64-prime-cache]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SHARED installed-disk cache (rd vms-2d9) -- IDENTICAL key/path to the
      # P2a and P2b jobs, so one install serves all three; version-keyed only.
      # This is the fix for the eflag job's cold-install timeout: its key no
      # longer changes when src/kernel-core (or any OVMX source) changes.
      # RESTORE-ONLY (rd vms-2d9): this test job never WRITES the cache. The
      # prime job (a `needs:' of this job) already installed and SAVED the shared
      # image, so we only restore it and always boot a WARM disk (~8min) -- the
      # driver finds the image present and never installs. restore-only also means
      # a timed-out/failed test job can never save a partial/corrupt image.
      - name: Restore shared NetBSD image (version-keyed, restore-only)
        uses: actions/cache/restore@v4
        with:
          path: .netbsd-cache
          key: netbsd-amd64-install-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-amd64-install-
          fail-on-cache-miss: false

      - name: Build NetBSD harness image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/netbsd/Dockerfile
          push: false
          load: true
          tags: ovmx-netbsd-ktest:latest
          cache-from: type=gha,scope=netbsd-harness
          cache-to: type=gha,mode=max,scope=netbsd-harness

      - name: Build + modload /dev/vms; prove cross-process shared event-flag state
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/.netbsd-cache"
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  --entrypoint /netbsd/run_p2c.sh \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "FAIL: NetBSD/amd64 P2c harness exited nonzero ($RC)"
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "OK (INV-6): with no module loaded the tool FAILED HONESTLY" \
            || { echo "FAIL: did not see the INV-6 module-absent honest-failure assertion"; exit 1; }
          echo "$OUTPUT" | grep -qF "process B (a DIFFERENT process) observed common flag 64 SET" \
            || { echo "FAIL: did not see the cross-process shared-kernel-state proof"; exit 1; }
          echo "$OUTPUT" | grep -qF "the shared exec_cv_wait/broadcast holds cross-process" \
            || { echo "FAIL: did not see the cross-process cv wait/wake proof"; exit 1; }
          echo "$OUTPUT" | grep -qF 'NetBSD/amd64 P2c HARNESS PASSED' \
            || { echo "FAIL: harness did not report its own PASSED banner"; exit 1; }
          echo "PASS: the SAME src/kernel-core/vms_eflag.c, compiled with the NetBSD backend, shared state across processes (INV-6)"

      - name: NEGATIVE CONTROL — skipping the SETEF must redden the cross-process proof
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  --entrypoint /netbsd/run_p2c.sh \
                  -e P2C_SKIP_SET=1 \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -eq 0 ]; then
            echo "FAIL: harness exited 0 with process A's SETEF skipped -- the cross-process proof has no teeth."
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "the cross-process shared-kernel-state proof did not hold" \
            || { echo "FAIL: nonzero exit but not the expected missing-set reason -- negative control may have failed for an unrelated cause"; exit 1; }
          echo "PASS: harness correctly went RED when the flag was never set -- the cross-process proof has teeth"

  # -----------------------------------------------------------------------
  # Job 3b-netbsd-vmsfs: OVMX/NetBSD ODS-2 mount+read (vms-308, epic vms-8e8
  # P4-VFS V4)
  #
  # THE PHASE THAT PROVES THE SHARED ODS-2 CORE MOUNTS + READS ON NETBSD. Builds
  # the harness image, masters an OVMX ODS-2 volume with tests/qemu/mkimage_vmsfs
  # (the SAME tool + image the Linux vmsfs.ko block-device test uses), boots the
  # cached NetBSD/amd64 guest (comp + syssrc) with that volume attached as wd1,
  # and:
  #   - builds the OVMX/NetBSD ODS-2 vnode module, which compiles the SAME
  #     src/kernel-core/vmsfs/*.c the Linux vmsfs.ko builds -- with the NetBSD
  #     backend (vmsfs_backend_netbsd.h). There is NO NetBSD copy of the ODS-2
  #     logic; the one core mounts + reads on both substrates,
  #   - NEGATIVE CONTROL: attempts the mount with the module NOT loaded -> the
  #     mount(2) must fail (no vmsfs type), never appear to succeed,
  #   - modloads the module, mounts /dev/wd1d READ-ONLY, lists the directory
  #     (VOP_READDIR) asserting HELLO.TXT;1 appears, and reads HELLO.TXT
  #     (VOP_LOOKUP -> VOP_READ) asserting its known content byte-for-byte.
  #
  # GATING: NIGHTLY (schedule) + manual (workflow_dispatch) ONLY -- NOT per-PR,
  # exactly like the executive P2c cross-process proof (rd vms-2d9). Booting a
  # NetBSD guest under TCG on a KVM-less GitHub runner is too slow/variable for a
  # per-PR gate; the per-PR NetBSD vmsfs gate is the fast QEMU-free cross-compile
  # (netbsd-amd64-vmsfs-crosscompile). It uses the SAME shared prime cache and
  # deterministic console as the executive jobs.
  netbsd-amd64-vmsfs-mount:
    name: NetBSD/amd64 ODS-2 Mount + Read (QEMU)
    needs: [changes, netbsd-amd64-prime-cache]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore shared NetBSD image (version-keyed, restore-only)
        uses: actions/cache/restore@v4
        with:
          path: .netbsd-cache
          key: netbsd-amd64-install-${{ hashFiles('tests/netbsd/netbsd_version.env') }}
          restore-keys: |
            netbsd-amd64-install-
          fail-on-cache-miss: false

      - name: Build NetBSD harness image (gha layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/netbsd/Dockerfile
          push: false
          load: true
          tags: ovmx-netbsd-ktest:latest
          cache-from: type=gha,scope=netbsd-harness
          cache-to: type=gha,mode=max,scope=netbsd-harness

      - name: Master an ODS-2 volume; build + modload the vnode module; mount + read
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/.netbsd-cache"
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  --entrypoint /netbsd/run_vmsfs.sh \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -ne 0 ]; then
            echo "FAIL: NetBSD/amd64 ODS-2 mount harness exited nonzero ($RC)"
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "OK (negctl): with no module loaded the ODS-2 mount FAILED" \
            || { echo "FAIL: did not see the module-absent mount-fails negative control"; exit 1; }
          echo "$OUTPUT" | grep -qF "OK (readdir): HELLO.TXT;1 appears" \
            || { echo "FAIL: did not see the VOP_READDIR directory-listing proof"; exit 1; }
          echo "$OUTPUT" | grep -qF "OK (read): HELLO.TXT read back the expected content" \
            || { echo "FAIL: did not see the VOP_READ content proof"; exit 1; }
          echo "$OUTPUT" | grep -qF 'NetBSD/amd64 ODS-2 mount HARNESS PASSED' \
            || { echo "FAIL: harness did not report its own PASSED banner"; exit 1; }
          echo "PASS: the SAME src/kernel-core/vmsfs core, compiled with the NetBSD backend, mounted + read an OVMX ODS-2 volume on NetBSD"

      - name: NEGATIVE CONTROL — skipping modload must redden the mount+read proof
        run: |
          set +e
          RAW=$(docker run --rm -v "$GITHUB_WORKSPACE/.netbsd-cache:/cache" \
                  --entrypoint /netbsd/run_vmsfs.sh \
                  -e VMSFS_SKIP_MODLOAD=1 \
                  ovmx-netbsd-ktest:latest 2>&1)
          RC=$?
          set -e
          OUTPUT=$(printf '%s\n' "$RAW" | tr -d '\r')
          echo "$OUTPUT"

          if [ "$RC" -eq 0 ]; then
            echo "FAIL: harness exited 0 with the module never loaded -- the mount+read proof has no teeth."
            exit 1
          fi
          echo "$OUTPUT" | grep -qF "the mount+read assertions below must go RED" \
            || { echo "FAIL: nonzero exit but not the expected skip-modload reason -- negative control may have failed for an unrelated cause"; exit 1; }
          echo "PASS: harness correctly went RED when the module was not loaded -- the mount+read proof has teeth"

  # -----------------------------------------------------------------------
  # Job 3d: Kernel Executive — per-facility negative controls (vms-e7d)
  #
  # Job 3c proves the executive gate CAN fail, by deleting the whole
  # executive. That is a blunderbuss: it establishes "this job can go red",
  # not "this job would go red if the event-flag code stopped clearing a
  # flag", and it cannot name what regressed. ATTRIBUTION IS THE POINT — a
  # gate that only ever says "something failed" tells the next implementer
  # nothing, and a facility whose assertions had quietly stopped meaning
  # anything would still be covered by 3c.
  #
  # This job injects ONE minimal defect per facility — the vms-e4d
  # compat[EX][CR] flip, mechanised, plus one of the same shape for every
  # other facility — boots each in QEMU against a REAL /dev/vms, and asserts
  # THE RUNTIME PROPERTY: the facility's OWN test suite goes RED
  # (run_facility_negctl.sh checks 1-4/8). That behavioral proof -- defect
  # injected, vms.ko rebuilt, booted for real, the suite reddens -- is what
  # caught the #177 fake test.
  #
  # TORN OUT (vms-49f), per the CLAUDE.md Rule 9 amendment: the per-defect
  # EXACT red-set equality against the manifest's named set, the attribution to
  # declared suites, and the committed-ledger comparison. Those are string
  # relations over the harness's OWN self-declarations, not runtime behavior --
  # "it may lint but MUST NOT be gated or worded as proof" -- and they re-broke
  # on every executive change that shifted which assertions redden. They remain
  # as non-gating lint inside run_facility_negctl.sh. The aggregate ledger job
  # that used to compare the union against a committed 61 KB record is deleted.
  #
  # It also runs the PRISTINE image first as a positive control, so a harness
  # that fails indiscriminately cannot pass this job.
  #
  # WHAT THIS JOB DOES NOT COVER, stated because an implicit narrowing is how
  # a gate quietly stops meaning what its name says: vmsfs.ko and its two
  # suites. vmsfs is a filesystem module, not an executive facility — nothing
  # in it is reached through /dev/vms — and job 3c above is where it is
  # covered. facility_defects.sh declares that exclusion and prints it.
  #
  # Docker here is BUILD/TEST TOOLING (CLAUDE.md Rule 9): it builds vms.ko and
  # boots an independent guest kernel that loads it for real. Nothing in this
  # job treats a container as an OVMX runtime.
  #
  # Runtime note: ~12 QEMU boots, one of which (executive-not-pinned) is
  # EXPECTED to hang until run_tests.sh's 120s timeout, because unloading an
  # unpinned vms.ko under an open descriptor Oopses the guest kernel. That is
  # the guarantee being demonstrated, not a flake — the control asserts that
  # every suite ordered before test_kmod_pin ran clean (a count derived from
  # the checkout, never written down), so a genuine boot failure cannot be
  # mistaken for it. Hence the wider timeout-minutes than the other QEMU jobs.
  # -----------------------------------------------------------------------
  # SHARDED (vms-86a). MEASURED root cause: this job ran the full defect list
  # sequentially -- one in-container rebuild plus one QEMU boot per defect --
  # in a single job: 27m09s idle, 50m39s under moderate concurrent CI load,
  # >60m and timeout-minutes-killed with three PRs in flight (rd vms-86a
  # trail, measured 2026-08-04).
  #
  # WHY it slows down under load is NOT established, and a prior version of
  # this comment asserted a cause ("no host-level resource shared between two
  # PRs' jobs -- so the slowdown is queueing/scheduling variance, not
  # contention this workflow can remove") with no command behind it (rd
  # vms-570 audit). timeout-minutes counts execution time on an already-
  # assigned runner, not queue wait, so a job the timeout kills at 60+ minutes
  # spent that time RUNNING -- queueing before the runner was assigned cannot
  # produce that, which contradicts the deleted claim rather than supporting
  # it. GitHub does not expose runner host placement, so whether concurrent
  # jobs share underlying physical-host resources is not verifiable from
  # here either way. Deleted rather than reworded, per this program's own
  # rule: a false emphatic gets removed, not restated more carefully.
  #
  # The fix below does not depend on knowing the mechanism: shrinking what
  # ONE job must sequentially get through before its own timeout widens the
  # margin against whatever the slowdown turns out to be. Raising
  # timeout-minutes was rejected regardless: it hides the same margin problem
  # under a bigger number rather than fixing it (flaky-test rule, CLAUDE.md).
  # A concurrency group serialising these jobs across PRs remains on the
  # table if sharding's margin ever proves insufficient -- not applied here
  # because sharding alone already multiplies the measured margin (see the
  # per-shard budget comment below), and serialising would trade this job's
  # timeout risk for queue-time risk on whichever PR runs second.
  #
  # So the per-facility loop is split into N independent shard jobs, each
  # running ~1/N of the manifest's defects (`facility_defects.sh list`, split
  # by `NR % N`, so the split tracks the manifest as it grows or shrinks --
  # never a hand-maintained defect list that goes stale). Splitting shrinks
  # the SEQUENTIAL run inside any one job, which is what the timeout budgets
  # against; it does not remove or narrow the RUNTIME check -- every shard still
  # runs the same positive control and the same per-defect runtime detection
  # (the facility's own suite reddens against a real /dev/vms) as the single job
  # did, just over a subset of defects. (The per-defect exact red-set equality,
  # the attribution to declared suites, and the full-manifest committed-ledger
  # comparison that a former aggregate job ran over the union of shards were
  # TORN OUT as declaration gates in vms-49f -- see the block above. The shards
  # no longer feed an aggregate ledger comparison.)
  kernel-executive-facility-negative-controls-shard:
    name: Kernel Executive — Per-Facility Negative Controls (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Budget per shard: roughly one Nth of the manifest's defects (the NR%n
    # partition below) plus the fixed image-build + positive-control cost
    # every shard pays independently. Not hand-recited here because it drifts
    # as the manifest grows -- run `sh tests/qemu/facility_defects.sh list |
    # wc -l` for today's count. The pre-sharding full run measured 27m09s
    # idle / 50m39s moderate / >60m heavy-load (rd vms-86a trail,
    # 2026-08-04); a shard's sequential work is a small fraction of that, so
    # 30m leaves headroom against the SAME per-defect variance without
    # resurrecting a 60m+ job.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # SHARD-BALLOON FIX (vms-86a part 2). MEASURED: the main-push run on
      # d2d76fc failed on THREE shards AT ONCE (0/6, 1/6, 5/6) -- every shard
      # runs QEMU + fork/pipe/multi-process tests, and with all 6 unbounded
      # (GitHub's default matrix concurrency), they compete for host
      # resources (CPU for 6 concurrent QEMU guests, IPC timing) alongside
      # whatever else this workflow is already running. That's resource
      # starvation, not a per-defect logic bug -- the same shard slice that
      # fails under load passes standalone. Capping how many run AT ONCE
      # (not how many run in total -- all 6 still execute, sequenced in
      # batches) gives each shard the headroom it needs without trading away
      # coverage or resurrecting the pre-#158 single-job wall-time problem.
      # Revisit the number empirically if shards still balloon at 3.
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This job (across its shards) is the ONLY place the executive is
      # actually exercised, and rd vms-b1f means it does not run on a dev host
      # at all. It injects each defect, rebuilds vms.ko, boots the guest against
      # a REAL /dev/vms, and asserts the RUNTIME property: the facility's own
      # suite goes RED (run_facility_negctl.sh checks 1-4/8).
      #
      # The driver still emits an observed record to RECORD_OUT, but it is now
      # ADVISORY ONLY: the aggregate ledger job that used to union the shards and
      # compare against a committed tests/qemu/facility_negctl_observed.tsv was
      # deleted in vms-49f (a string relation over the harness's own
      # self-declarations -- "it may lint but MUST NOT be gated", CLAUDE.md Rule
      # 9 amendment). Nothing downstream reads the emitted record.
      - name: Every executive facility has a control that turns CI red against a real /dev/vms (this shard's slice)
        env:
          CONTAINER_ENGINE: docker
          # Advisory emission only; no longer uploaded or compared (vms-49f).
          FACILITY_NEGCTL_RECORD_OUT: ${{ runner.temp }}/facility_negctl_observed.tsv
        run: |
          set -eu
          DEFECTS=$(sh tests/qemu/facility_defects.sh list \
            | awk -v n="${{ strategy.job-total }}" -v i="${{ matrix.shard }}" 'NR % n == i')
          echo "This shard (${{ matrix.shard }}/${{ strategy.job-total }}) runs:"
          echo "$DEFECTS" | sed 's/^/  /'
          # shellcheck disable=SC2086
          tests/qemu/run_facility_negctl.sh $DEFECTS

  # -----------------------------------------------------------------------
  # Job 4: Conformance tests
  #
  # Runs in a disposable ubuntu:24.04 tooling container (gcc, source tree,
  # built libs). The conformance programs are compiled and executed against
  # the VMS libs.
  # -----------------------------------------------------------------------
  conformance:
    name: Conformance Tests
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MIGRATED OFF THE ROOT DOCKERFILE BY vms-71a (CLAUDE.md Rule 9: the
      # Docker RUNTIME layer is dead). This job never ran the product image —
      # it only used the Dockerfile's "builder" stage for a disposable
      # cmake+gcc build environment. That is build/test TOOLING, which Rule 9
      # explicitly allows in Docker; it is reproduced here with a plain
      # ubuntu:24.04 container and the checked-out workspace bind-mounted at
      # /src, so no image tied to the retired root Dockerfile is built at all.
      - name: Build OVMX + run conformance tests (tooling container, not a runtime image)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            -v "${{ github.workspace }}/tests/conformance/vms_programs:/tests/vms_programs:ro" \
            ubuntu:24.04 bash -c '
              set -e
              apt-get update -qq
              apt-get install -y --no-install-recommends cmake gcc make libc6-dev libreadline-dev
              cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/ -DBUILD_TOOLS=ON
              cmake --build build --parallel "$(nproc)"
              bash /src/tests/conformance/run_conformance.sh
            '

  # -----------------------------------------------------------------------
  # Job 5: Corpus conformance — compile+run tier1-examples against OVMX
  #
  # This is a GATE with a FALSIFIABLE FLOOR, not just a metric job.
  #   - It fails on per-entry REGRESSIONS — enforced by run_corpus.sh's own
  #     exit code. A baseline run-pass entry that no longer runs clean
  #     (run-pass -> run-fail/run-crash/link-fail/compile-fail), or a baseline
  #     compile-pass/run-fail entry that no longer builds, fails the run. This
  #     catches a single baseline-passing program breaking even when another
  #     program improves in the same change and holds the aggregate count flat.
  #   - It fails if the RUN-PASS count drops BELOW the committed baseline
  #     floor in tests/conformance/corpus_baseline.json — enforced by the
  #     "Enforce run-pass floor" step below. Aggregate backstop to the
  #     per-entry check above.
  #
  # The floor is exactly what run_corpus.sh measured on the committed tree
  # (see the baseline's timestamp + summary). It is honest, not inflated:
  # if run-pass is 42/229, the floor is 42. Raising the headline number
  # means raising the committed baseline with a real measurement — never
  # hand-editing it. No continue-on-error, no `|| true`: a floor that
  # cannot fail is not a floor.
  #
  # The JSON report is uploaded as a build artifact for trend analysis.
  # -----------------------------------------------------------------------
  corpus-conformance:
    name: Corpus Conformance
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MIGRATED OFF THE ROOT DOCKERFILE BY vms-71a — see the conformance job
      # above for why: this only ever used the "builder" stage as a disposable
      # build environment (Rule 9 build/test TOOLING), reproduced here with a
      # plain ubuntu:24.04 container. Build/apt noise is redirected to stderr
      # so only run_corpus.sh's JSON reaches stdout / corpus_report.json.
      - name: Build OVMX + run corpus conformance harness (tooling container, not a runtime image)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src -w /src \
            ubuntu:24.04 bash -c '
              set -e
              { apt-get update -qq && apt-get install -y --no-install-recommends cmake gcc make libc6-dev libreadline-dev; } >&2
              { cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/ -DBUILD_TOOLS=ON; } >&2
              { cmake --build build --parallel "$(nproc)"; } >&2
              bash /src/tests/conformance/run_corpus.sh /src/tests/conformance/corpus_baseline.json
            ' > corpus_report.json
        # Exit code 0 = no compile/link regressions (even if many compile-fail)
        # Exit code 1 = compile/link regression (previously-passing program now fails)

      # -------------------------------------------------------------------
      # FALSIFIABLE FLOOR: fail the build if run-pass fell below the
      # committed baseline. Runs on the ubuntu-latest host (jq is present);
      # both files are plain JSON produced by the SAME harness, so the
      # comparison is exact. This step is what converts the job from
      # regression-only to a real conformance floor (vms-801, R2.0).
      # -------------------------------------------------------------------
      - name: Enforce run-pass floor (falsifiable conformance gate)
        run: |
          floor=$(jq '.summary."run-pass"' tests/conformance/corpus_baseline.json)
          current=$(jq '.summary."run-pass"' corpus_report.json)
          total=$(jq '.total' corpus_report.json)
          echo "Corpus run-pass floor (committed baseline): ${floor}"
          echo "Corpus run-pass current (this build):       ${current} / ${total}"
          if ! [ "${floor}" -ge 0 ] 2>/dev/null || ! [ "${current}" -ge 0 ] 2>/dev/null; then
            echo "::error::Could not read run-pass counts (floor='${floor}' current='${current}') — report or baseline malformed"
            exit 1
          fi
          if [ "${current}" -lt "${floor}" ]; then
            echo "::error::Corpus conformance REGRESSION — run-pass ${current} dropped below committed floor ${floor}. Fix the regression, or (if intended) re-run run_corpus.sh and commit the new corpus_baseline.json."
            exit 1
          fi
          echo "Conformance floor held: ${current} >= ${floor}"

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-conformance-report-${{ github.sha }}
          path: corpus_report.json
          retention-days: 90

  # -----------------------------------------------------------------------
  # Job 6: Static analysis (clang-tidy + cppcheck)
  #
  # Runs in parallel with all other jobs — no `needs:` dependency.
  # INFORMATIONAL ONLY: always exits 0, findings are uploaded as artifacts.
  # src/libvmssys/ is excluded (freestanding, no glibc — false positives).
  # src/kernel/    is excluded (standalone Makefiles, not in compile_commands.json).
  # -----------------------------------------------------------------------
  static-analysis:
    name: Static Analysis
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-static-analysis
          restore-keys: apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc make libc6-dev libreadline-dev \
            clang-tidy cppcheck

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_TOOLS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (required for generated headers)
        run: cmake --build build -j$(nproc)

      - name: Run clang-tidy
        run: |
          # Collect source files from compile_commands.json,
          # excluding freestanding (libvmssys) and kernel directories.
          python3 - <<'PYEOF'
          import json, subprocess, sys, os

          db_path = "build/compile_commands.json"
          if not os.path.exists(db_path):
              print("compile_commands.json not found, skipping clang-tidy")
              sys.exit(0)

          with open(db_path) as f:
              db = json.load(f)

          cwd = os.getcwd()
          excluded = ("src/libvmssys/", "src/kernel/")
          files = []
          for entry in db:
              rel = entry["file"].replace(cwd + "/", "")
              if not any(rel.startswith(ex) for ex in excluded):
                  files.append(entry["file"])

          if not files:
              print("No files to analyze after exclusions.")
              sys.exit(0)

          print(f"Running clang-tidy on {len(files)} files...")
          result = subprocess.run(
              ["clang-tidy", "-p", "build"] + files,
              capture_output=True, text=True
          )
          output = result.stdout + result.stderr
          print(output)
          with open("clang-tidy-results.txt", "w") as out:
              out.write(output)
          # Always exit 0 — findings are informational only
          sys.exit(0)
          PYEOF

      - name: Run cppcheck
        run: |
          cppcheck \
            --suppressions-list=cppcheck.suppressions \
            --enable=warning,performance,portability \
            --error-exitcode=0 \
            --std=c11 \
            -D_GNU_SOURCE \
            -I src/libvms/include \
            -I src/vmsrms/include \
            -I src/vmsfs/include \
            -I src/vmslnm/include \
            -I src/vmsprocess/include \
            -I src/vmsdcl/include \
            --suppress=missingInclude:src/libvmssys/* \
            --suppress=missingInclude:src/kernel/* \
            --suppress=missingInclude:src/kernel-netbsd/* \
            -j$(nproc) \
            src/ 2>&1 | tee cppcheck-results.txt || true
          echo "cppcheck complete (exit forced to 0)"

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-results
          path: clang-tidy-results.txt
          if-no-files-found: ignore

      - name: Upload cppcheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results
          path: cppcheck-results.txt
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # Job 7: User Acceptance Test — scripted VMS session on the REAL runtime
  #
  # Boots the real kernel under QEMU, logs in over the console, and drives a
  # scripted VMS admin session, validating output for VMS correctness and the
  # absence of Unix leaks.
  #
  # MIGRATED OFF DOCKER+SSH BY vms-71a (CLAUDE.md Rule 9: the Docker RUNTIME
  # layer is dead). This job used to `docker run` the now-deleted root-
  # Dockerfile product image and SSH to port 2222 — a container with no
  # /dev/vms. distro/Dockerfile.bootable (build/test TOOLING, kept under
  # Rule 9) builds the real kernel + initramfs; tests/uat/vms_session_qemu.sh
  # runs the SAME command list and the SAME 13 assertions the SSH script did.
  #
  # KNOWN COVERAGE GAP, tracked not hidden: driving DCL over the console does
  # not exercise vmssshd, so SSH login has no CI coverage now that its only
  # runtime (the dead container) is gone. tests/uat/vms_session_test.sh is
  # retained for when the SSH path is brought up on QEMU (see vms-02d, which
  # the operator cancelled — SSH-on-QEMU is not currently planned work).
  # -----------------------------------------------------------------------
  uat-session:
    name: VMS User Acceptance Test
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.boot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bootable image (uses GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile.bootable
          push: false
          load: true
          tags: ovmx-boot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run UAT session on the real runtime (QEMU console)
        timeout-minutes: 10
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/uat/vms_session_qemu.sh:/test.sh:ro \
            --entrypoint bash \
            ovmx-boot:latest \
            /test.sh

  # -----------------------------------------------------------------------
  # Job 8: IMGACT.EXE activation proof (musl, aarch64)
  #
  # Gate on the OVMX image activator (bead vms-913.x). Runs the clean-room
  # proof harness inside a native-musl Alpine container: builds IMGACT.EXE,
  # activates a dynamic test executable through it (DT_HASH symbol lookup,
  # RELATIVE/GLOB_DAT/JUMP_SLOT/TLSDESC relocs, TLS), and asserts both the
  # success path (activated program prints PASS, exits 0) and the failure
  # path (missing shareable image -> %IMGACT-F-IMGNOTFND, nonzero exit).
  #
  # This job covers the aarch64 backend specifically (the x86_64 backend,
  # bead vms-913.11, has its own native-runner counterpart: Job 9b
  # imgact-x86_64 below, plus the full boot-to-login proof in uat-session).
  # GitHub runners are x86_64, so this aarch64 harness runs under arm64
  # emulation via binfmt/QEMU. This is a hard gate (rule 10): a broken
  # activator fails the build.
  # -----------------------------------------------------------------------
  imgact-proof:
    name: IMGACT.EXE Activation Proof (musl)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build + activate IMGACT.EXE in Alpine (musl, arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils make >/dev/null
              export CC=gcc
              sh /src/src/imgact/test/run_test.sh
            '

  # -----------------------------------------------------------------------
  # Job 9: OVMX_IMGACT build mode (musl, aarch64)
  #
  # Gate on the image-activation build mode (bead vms-913.3): configure +
  # build the whole tree with -DOVMX_IMGACT=ON and assert (via readelf) that
  # shareable images carry VMS SONAMEs + DT_HASH, executables carry
  # PT_INTERP=IMGACT.EXE + DT_HASH, STARTUP.EXE/IMGACT.EXE stay static, and
  # nothing uses GNU_HASH. This job covers the aarch64 backend; the x86_64
  # counterpart (bead vms-913.11) is Job 9b (imgact-x86_64) below, which
  # runs natively with no emulation. This job runs under arm64 emulation
  # on the x86_64 runner.
  # -----------------------------------------------------------------------
  imgact-build-mode:
    name: OVMX_IMGACT Build Mode (musl)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    # vms-0b8 FIXED (was: LINK.EXE "not found" in link_native_graph). Root cause
    # was NOT a target-ordering bug: OVMX_IMGACT=ON injects
    # -Wl,--dynamic-linker=/vms/.../IMGACT.EXE into the GLOBAL CMAKE_EXE_LINKER_FLAGS,
    # which poisoned the PT_INTERP of the HOST build tool LINK.EXE (vmslink) — a
    # tool that must EXECUTE during `cmake --build` to produce the shareable
    # graph. exec then failed ENOENT/127 (file present, interpreter absent).
    # Fixed by linking the vmslink host tools statically in IMGACT mode
    # (src/vmslink/CMakeLists.txt) + adding src/libvms/include to the imgact
    # target's include path (src/imgact/CMakeLists.txt, for imgact_prodreg.h).
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure + build + verify OVMX_IMGACT (arm64 musl)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache cmake gcc g++ musl-dev binutils make linux-headers >/dev/null
              export CC=gcc BUILD=/tmp/imgact-build
              sh /src/src/imgact/test/verify_imgact_cmake.sh
            '

  # -----------------------------------------------------------------------
  # Job 9b: OVMX_IMGACT build mode + activation (musl, x86_64)
  #
  # x86_64 counterpart of Job 9 (imgact-build-mode) + the IMGACT activation
  # proof, gating bead vms-be5. GitHub runners ARE x86_64, so this runs the
  # NATIVE x86_64 musl Alpine image with NO emulation (contrast the aarch64
  # jobs, which need setup-qemu-action). Two proofs:
  #   1. verify_imgact_cmake_x86_64.sh — configure+build the whole tree with
  #      -DOVMX_IMGACT=ON, assert PT_INTERP=IMGACT.EXE + DT_HASH layout, no
  #      GNU_HASH, and TLS uses the TLSDESC dialect (-mtls-dialect=gnu2) with
  #      no general-dynamic __tls_get_addr relocs the x86_64 IMGACT can't bind.
  #   2. run_test_x86_64.sh — build the x86_64 IMGACT.EXE backend and activate
  #      a gnu2-TLSDESC shareable + PT_INTERP consumer FOR REAL (QEMU=env, i.e.
  #      run natively since the runner is x86_64), then assert the missing-image
  #      failure path yields %IMGACT-F-IMGNOTFND.
  # -----------------------------------------------------------------------
  imgact-x86_64:
    name: OVMX_IMGACT Build + Activate (musl, x86_64)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    # vms-0b8 FIXED — same host-tool PT_INTERP poisoning as imgact-build-mode
    # (LINK.EXE, a build-host tool, was given PT_INTERP=IMGACT.EXE via the global
    # CMAKE_EXE_LINKER_FLAGS in OVMX_IMGACT mode and could not exec during the
    # link_native_graph build step). Fixed in src/vmslink/CMakeLists.txt (static
    # host tools) + src/imgact/CMakeLists.txt (libvms include for imgact_prodreg.h).
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + verify + activate OVMX_IMGACT (native x86_64 musl)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache cmake gcc g++ musl-dev binutils make linux-headers >/dev/null
              echo "=== 1/2: OVMX_IMGACT x86_64 build + layout + TLSDESC verify ==="
              CC=gcc READELF=readelf BUILD=/tmp/imgact-build-x86_64 \
                sh /src/src/imgact/test/verify_imgact_cmake_x86_64.sh
              echo "=== 2/2: x86_64 IMGACT.EXE activation proof (native, QEMU=env) ==="
              CC=gcc READELF=readelf QEMU=env \
                sh /src/src/imgact/test/run_test_x86_64.sh
            '

  # -----------------------------------------------------------------------
  # Job 10: LINK.EXE — VMS-native linker MVP (aarch64)
  #
  # Gate on the OVMX/VMS linker (bead vms-9dd): builds LINK.EXE + OVMXDUMP,
  # compiles a leaf object with gcc, links it into an OVMX shareable image
  # WITHOUT ld, and asserts the image is a valid ET_DYN whose .vms$sv symbol
  # vector exports the declared universal symbols + GSMATCH. aarch64-only for
  # now (LINK.EXE rejects non-aarch64 objects); runs under arm64 emulation.
  # -----------------------------------------------------------------------
  vmslink-mvp:
    name: LINK.EXE VMS-native Linker (MVP)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build LINK.EXE + link an OVMX shareable image (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils >/dev/null
              export CC=gcc WORK=/tmp/vmslink-test
              sh /src/src/vmslink/test/run_test.sh
            '

  # -----------------------------------------------------------------------
  # Job 10a: LINK.EXE — x86_64 "simple" static relocations (vms-8f5)
  #
  # x86_64 counterpart of Job 10, gating the additive machine-type gate: the
  # runner IS x86_64, so LINK.EXE + the hand-built .o test objects are built
  # and RUN natively with NO emulation (contrast Job 10, which needs arm64
  # QEMU for the whole harness). Proves R_X86_64_64 (absolute data pointer),
  # R_X86_64_PC32 (same-image call), and R_X86_64_PLT32 (cross-object call)
  # link + execute for real, that the emitted ET_DYN carries EM_X86_64, and —
  # via one arm64-emulated cross-compile of a companion aarch64 object fed to
  # the SAME native LINK.EXE binary — that the gate stays additive (aarch64
  # still emits EM_AARCH64, mixed-architecture input is rejected).
  # -----------------------------------------------------------------------
  vmslink-x86_64:
    name: LINK.EXE VMS-native Linker — x86_64 relocs (vms-8f5/cd1/2e4)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64, for the aarch64 regression cross-compile only)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build LINK.EXE (native x86_64) + prove the simple x86_64 relocs + additive-gate regression
        run: |
          sh src/vmslink/test/run_test_x86_64.sh

      # vms-2e4: the LAST x86_64 relocation class — gnu2-dialect TLSDESC
      # (R_X86_64_GOTPC32_TLSDESC + R_X86_64_TLSDESC_CALL, plus the
      # local-dynamic R_X86_64_DTPOFF32 / _TLS_MODULE_BASE_ half). Proof is
      # end-to-end, not structural: the linked image is EXECUTED, its
      # PT_INTERP runs the real x86_64 IMGACT.EXE, and a second real thread
      # (clone + CLONE_SETTLS) shows every thread-local is TP-relative. The
      # runner is x86_64, so this runs natively — but it needs
      # /vms/SYS0/SYSCOMMON/{SYSEXE,SYSLIB} for the PT_INTERP path.
      - name: Prove the x86_64 TLSDESC relocs link AND activate (vms-2e4)
        run: |
          sudo mkdir -p /vms/SYS0/SYSCOMMON/SYSEXE /vms/SYS0/SYSCOMMON/SYSLIB
          sudo chown -R "$(id -u):$(id -g)" /vms
          sh src/vmslink/test/run_test_x86_64_tls.sh

  # -----------------------------------------------------------------------
  # Job 10b: DECC$SHR.EXE — the OVMX C run-time library shareable (aarch64)
  #
  # Gate on the C-RTL shareable (bead vms-61f.1, pillar vms-ade): LINK.EXE links
  # the WHOLE musl libc.a + libgcc.a (soft-float/long-double builtins) into a
  # single OVMX shareable carrying a .vms$sv symbol vector of the C-RTL universals
  # (malloc/free/memcpy/strlen/printf/...) — VMS-native, NO ld/ld.so. Asserts the
  # image links CLEAN (zero deferred externals) and exports the universals as
  # PROCEDURE. Runtime init is vms-61f.2. aarch64-only; runs under arm64 emulation.
  # -----------------------------------------------------------------------
  decc-shr:
    name: DECC$SHR VMS-native C-RTL Shareable
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build LINK.EXE + link DECC$SHR from whole musl libc.a + libgcc.a (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache gcc musl-dev binutils >/dev/null
              export CC=gcc WORK=/tmp/decc-shr-test
              sh /src/src/vmslink/test/run_decc_shr.sh
            '

  # -----------------------------------------------------------------------
  # link-native-cmake: the VMS-native LINK.EXE graph wired into CMake
  # (bead vms-b6a, pillar vms-ade). Every job above this one drives the
  # mk_*_shr.sh recipes by hand from a raw shell harness; this job proves the
  # SAME recipes are reachable as ordinary `cmake --build` output when the
  # compiler targets aarch64 musl (OVMX_LINK_NATIVE auto-detects ON), so the
  # shipped OVMX libraries can be the VMS-native LINK.EXE shareables instead
  # of ld-linked .so files. Asserts, via readelf, that all 9 artifacts (5
  # libs + DECC$SHR + DCL.EXE + LOGINOUT.EXE) are EM_AARCH64 with zero
  # DT_NEEDED entries -- no ld/ld.so anywhere in the graph. Runs under arm64
  # emulation. The x86_64 analog (link-native-cmake-x86_64, vms-6da) follows
  # immediately below, sharing this SAME build_link_native.sh/CMakeLists.txt
  # mechanism (ARCH auto-detected from the compiler triple) -- not a forked
  # target or a second custom command.
  # -----------------------------------------------------------------------
  link-native-cmake:
    name: VMS-native LINK.EXE Graph via CMake (OVMX_LINK_NATIVE)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register QEMU binfmt handlers (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: cmake -B build && cmake --build build (arm64 musl) -- assert the shipped graph is LINK.EXE-native
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache cmake gcc g++ musl-dev binutils make linux-headers >/dev/null
              cmake -B /tmp/build -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/build --target link_native_graph -j"$(nproc)"
              echo "== readelf: EM_AARCH64, zero DT_NEEDED, across all 9 artifacts =="
              SYSLIB=/tmp/build/link-native/SYSLIB
              SYSEXE=/tmp/build/link-native/SYSEXE
              for f in "$SYSLIB"/*.EXE "$SYSEXE"/*.EXE; do
                  echo "-- $f --"
                  readelf -h "$f" | grep -q "Machine:.*AArch64" || { echo "FAIL: $f not EM_AARCH64"; exit 1; }
                  N=$(readelf -d "$f" 2>/dev/null | grep -c NEEDED || true)
                  [ "$N" -eq 0 ] || { echo "FAIL: $f has $N DT_NEEDED entries (ld-linked, not VMS-native)"; exit 1; }
              done
              COUNT=$(ls "$SYSLIB"/*.EXE "$SYSEXE"/*.EXE | wc -l)
              [ "$COUNT" -eq 9 ] || { echo "FAIL: expected 9 artifacts (5 libs + DECC\$SHR + DCL.EXE + LOGINOUT.EXE), got $COUNT"; exit 1; }
              echo "OK: $COUNT VMS-native LINK.EXE artifacts, all EM_AARCH64, zero DT_NEEDED"
            '

  # -----------------------------------------------------------------------
  # link-native-cmake-x86_64: the x86_64 analog of link-native-cmake above
  # (bead vms-6da, epic vms-b93 "0.1 pre-release" -- the direct blocker of
  # vms-d0f5e's fat initramfs). Same CMakeLists.txt/build_link_native.sh
  # mechanism, ARCH auto-detected from the compiler triple (aarch64-musl vs
  # x86_64-musl) -- NOT a duplicated custom target. x86_64 is the project's
  # primary architecture (CLAUDE.md Rule 5) and this is what a shipped fat
  # initramfs actually needs. Asserts, via readelf, that all 9 artifacts are
  # EM_X86_64 with zero DT_NEEDED entries. Unlike the arm64 job, GitHub's
  # runner IS x86_64 (see dcl-native-x86_64 above), so this needs no QEMU
  # binfmt registration -- the alpine:3.20/amd64 container runs natively.
  # -----------------------------------------------------------------------
  link-native-cmake-x86_64:
    name: VMS-native LINK.EXE Graph via CMake, x86_64 (OVMX_LINK_NATIVE)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.toolchain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cmake -B build && cmake --build build (x86_64 musl) -- assert the shipped graph is LINK.EXE-native
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/src -w /src \
            docker.io/library/alpine:3.20 sh -c '
              set -e
              apk add --no-cache cmake gcc g++ musl-dev binutils make linux-headers >/dev/null
              cmake -B /tmp/build -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/build --target link_native_graph -j"$(nproc)"
              echo "== readelf: EM_X86_64, zero DT_NEEDED, across all 9 artifacts =="
              SYSLIB=/tmp/build/link-native/SYSLIB
              SYSEXE=/tmp/build/link-native/SYSEXE
              for f in "$SYSLIB"/*.EXE "$SYSEXE"/*.EXE; do
                  echo "-- $f --"
                  readelf -h "$f" | grep -q "Machine:.*X86-64" || { echo "FAIL: $f not EM_X86_64"; exit 1; }
                  N=$(readelf -d "$f" 2>/dev/null | grep -c NEEDED || true)
                  [ "$N" -eq 0 ] || { echo "FAIL: $f has $N DT_NEEDED entries (ld-linked, not VMS-native)"; exit 1; }
              done
              COUNT=$(ls "$SYSLIB"/*.EXE "$SYSEXE"/*.EXE | wc -l)
              [ "$COUNT" -eq 9 ] || { echo "FAIL: expected 9 artifacts (5 libs + DECC\$SHR + DCL.EXE + LOGINOUT.EXE), got $COUNT"; exit 1; }
              echo "OK: $COUNT VMS-native LINK.EXE artifacts, all EM_X86_64, zero DT_NEEDED"
