# Build the cluster demo's Node B (OVMX/VAX) from a vms ref, so no demo node
# runs a stale image.
#
# WHY. The browser cluster demo has two OVMX nodes. Node A (x86, qemu-wasm) has
# always been rebuilt per tag by openvmx-site's track-cluster-demo. Node B (the
# OVMX/VAX slim single disk the pcjs KA655 boots) was built by hand and parked on
# vax.3dl.network, so the visitor gate kept grading a V0.7-7 Node B against
# V0.7-9 and V0.7-10 executives. An executive fix never reached it.
#
# WHAT. tests/lab-vax/run-boot.sh acceptance -- sysboot-single's slim single
# disk (the build the hand-made images came from), booted and driven through
# the shared DCL/SHOW acceptance battery -- run on the ref under test, with
# Node B's CLUSTER_AUTHORIZE.DAT group on its FFS root. It FAILS unless the
# battery passes; this job also fails unless that
# boot announces the ref's own OVMX_PRODUCT_VERSION and no other. Then Node B's
# identity from the ONE roster (tools/cluster-web-demo/mk_democonfig.py
# DEMO_NODE_B: SCSNODE/SCSSYSTEMID/VOTES/EXPECTED_VOTES/VAXCLUSTER) is written
# into the booted disk's ODS-2 partition by the same offline injector Node A
# uses (see that step for why it is not booted with it). The result is
# uploaded as the `cluster-demo-nodeB` artifact (and, for a release tag,
# attached to the release as ovmx-vax-nodeB.img.gz), which is where
# openvmx-site's gate and deploy take Node B from.
#
# The SAME job also builds the homepage's single-node OVMX/VAX browser demo
# disk (matrix node=single, rd vms-208f): the acceptance-proven slim single disk
# with no cluster identity, attached as ovmx-vax-single.img.gz with its
# vax-single-manifest.json version sidecar. It was hand-built and sat at V0.7-5.
#
# The workflow file runs from main; the BUILD is the ref's own tree (its
# run-boot.sh, its roster, its sources), so a release-verify branch cut before
# this file existed can still be built and gated before its tag.
name: cluster-demo-nodeB
# openvmx-site finds the build for a ref by this title, then checks the
# artifact's own manifest (sha, version) against the ref before using it.
run-name: Node B for ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'vms branch, tag or commit to build Node B from (e.g. release-verify-v0.7-10)'
        required: true
  push:
    tags: ['V*']

permissions:
  contents: write     # gh release upload on a tag
  packages: read      # the private prebuilt vax toolchain image

concurrency:
  group: cluster-demo-nodeB-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # One build, two shipped VAX demo disks (rd vms-208f, epic vms-d385): Node B of
  # the cluster demo (CLUSTER_AUTHORIZE group + roster identity), and the
  # single-node OVMX/VAX browser demo on the homepage -- the same acceptance-
  # proven slim single disk with no cluster identity at all. Both follow the tag.
  nodeB:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {node: B, title: "Node B (OVMX/VAX) for the cluster demo", img: ovmx-vax-nodeB.img.gz, manifest: nodeB-manifest.json, artifact: cluster-demo-nodeB}
          - {node: single, title: "Single-node OVMX/VAX browser demo disk", img: ovmx-vax-single.img.gz, manifest: vax-single-manifest.json, artifact: demo-vax-single}
    env:
      KBUILD_DIR: /tmp/ovmx-vax-${{ matrix.node }}-kbuild
      SRC_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Checkout the ref under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}

      - name: Record what is being built
        id: src
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          VER=$(sed -n 's/^#define OVMX_PRODUCT_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' src/libvms/include/ovmx_identity.h)
          [ -n "$VER" ] || { echo "no OVMX_PRODUCT_VERSION in src/libvms/include/ovmx_identity.h"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "building the ${{ matrix.node }} disk from $SRC_REF = $SHA, OVMX $VER"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Install qemu-img (run-boot.sh's cluster-config injector needs it)
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends qemu-utils

      - name: Restore the cached NetBSD/vax disk (primed by ci-vax netbsd-vax-simh)
        uses: actions/cache/restore@v4
        with:
          path: .boot-cache/lab-vax
          key: lab-vax-netbsd10.1-simh2e0d51e-anitav2_18-${{ hashFiles('tests/lab-vax/Dockerfile', 'tests/lab-vax/entrypoint.sh') }}

      # Restore-only, exact key only: an inexact substrate would be a kernel
      # built from other sources, which is the staleness this workflow exists
      # to end. On a miss run-boot.sh builds the substrate from this ref.
      - name: Restore the OVMX/vax substrate for exactly this source (else it is built)
        uses: actions/cache/restore@v4
        with:
          path: |
            .boot-cache/lab-vax/boot-artifacts
          key: vax-substrate-netbsd10.1-${{ hashFiles('tests/netbsd/netbsd_version.env', 'tests/lab-vax/run-boot.sh', 'tools/cross-vax/build-vax-modular-kernel.sh', 'tools/cross-vax/netbsd-ovmx-quiet.patch', 'tools/cross-vax/netbsd-ovmx-gencons.patch', 'tools/cross-vax/netbsd-ovmx-todr.patch', 'tools/cross-vax/build-ovmx-init-vax.sh', 'tools/cross-vax/build-devvms-vax.sh', 'tools/cross-vax/Dockerfile', 'tools/cross-vax/*.tar.xz', 'src/kernel-netbsd/**', 'src/kernel-core/**', 'src/ovmx_init/**', 'src/libvms/**', 'src/libvmssys/**', 'src/vmsprocess/**', 'src/vmslnm/**', 'src/vmsfs/**', 'src/vmsrms/**', 'src/vmsqueue/**', 'src/imgact/**') }}

      - name: Build the lab-vax image (SIMH + anita)
        run: docker build -f tests/lab-vax/Dockerfile -t ovmx-vax-lab tests/lab-vax

      - name: Install NetBSD/vax if the cache missed (no-op on a hit)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.boot-cache/lab-vax:/cache" \
            ovmx-vax-lab install

      - name: Pull the prebuilt vax--netbsdelf toolchain image (source-hash tag) or fall back to build
        env:
          GHCR_IMG: ghcr.io/3dl-dev/ovmx-cross-vax
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s tools/cross-vax/Dockerfile 'tools/cross-vax/*.tar.xz' | sha256sum | cut -c1-16)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull "$GHCR_IMG:$SOURCE_HASH"; then
            docker tag "$GHCR_IMG:$SOURCE_HASH" ovmx-cross-vax:latest
          else
            echo "BUILD_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Build the vax--netbsdelf cross toolchain image (gha layer cache)
        if: env.BUILD_FALLBACK == '1'
        uses: docker/build-push-action@v6
        with:
          context: tools/cross-vax
          file: tools/cross-vax/Dockerfile
          push: false
          load: true
          tags: ovmx-cross-vax:latest
          cache-from: type=registry,ref=ghcr.io/3dl-dev/ovmx-cache:cross-vax

      - name: Node B identity from the roster (mk_democonfig.py DEMO_NODE_B)
        if: matrix.node == 'B'
        run: |
          set -euo pipefail
          python3 - <<'EOF' > "$RUNNER_TEMP/nodeB.env"
          import sys
          sys.path.insert(0, "tools/cluster-web-demo")
          from mk_democonfig import DEMO_NODE_B as b
          print("NODE_B_SCSNODE=%s" % b["name"])
          print("NODE_B_SCSSYSTEMID=%d" % b["id"])
          print("NODE_B_VOTES=%d" % b["votes"])
          print("NODE_B_EXPECTED_VOTES=%d" % b["expected_votes"])
          print("NODE_B_VAXCLUSTER=%d" % b["vaxcluster"])
          print("NODE_B_GROUP=%d" % b["group"])
          print("NODE_B_PASSWORD=%s" % b.get("password", ""))
          EOF
          cat "$RUNNER_TEMP/nodeB.env" >> "$GITHUB_ENV"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/nodeB.env"
          python3 tools/cluster-web-demo/mk_democonfig.py authorize \
            "$RUNNER_TEMP/CLUSTER_AUTHORIZE.DAT" "$NODE_B_GROUP" ${NODE_B_PASSWORD:+"$NODE_B_PASSWORD"}
          # run-boot.sh wants it under CACHE_DIR, which the lab container may own.
          DST="${{ github.workspace }}/.boot-cache/lab-vax/nodeB/CLUSTER_AUTHORIZE.DAT"
          sudo install -D -m 0644 "$RUNNER_TEMP/CLUSTER_AUTHORIZE.DAT" "$DST"
          echo "CLUSTER_AUTH_FILE=$DST" >> "$GITHUB_ENV"

      # WHY THE IDENTITY GOES ON AFTER THE BOOT. Node B is a NON-VOTING member
      # (VOTES 0): booted alone with its cluster identity it waits to form or
      # join, and a node without quorum blocks -- LOGINOUT accepts the password
      # and DCL never answers (measured, run 38598276981). That is correct VMS
      # behaviour, not a defect, so the build does not boot that identity on its
      # own. It runs the stock acceptance proof unchanged (boot, PROVISION,
      # log in, the DCL/SHOW battery) on the disk with the
      # CLUSTER_AUTHORIZE.DAT group already on its FFS root, and only then writes
      # the roster's OVMXVMSSYS.PAR into partition 'e' -- with the same offline
      # injector Node A's sysdisk gets. Its DCL $ in a cluster is the visitor
      # gate's to prove, next to the real VAX that gives it quorum.
      # `acceptance` builds exactly sysboot-single's slim single disk, then
      # boots it and drives the SHARED DCL/SHOW acceptance battery (log in
      # SYSTEM/MANAGER, run the commands a user types, assert VMS-faithful
      # output) -- the VAX leg CI already gates every release on. sysboot-single's
      # own login probe is not CI-covered and times out after "Welcome" on this
      # rail at V0.7-10 (runs 38598276981, 38601013446) while acceptance passes on
      # the same SHA, so the battery is the proof used here.
      - name: Build + boot the disk (run-boot.sh acceptance; fails unless DCL works)
        env:
          CROSS_IMAGE: ovmx-cross-vax
          LAB_IMAGE: ovmx-vax-lab
        run: |
          set -o pipefail
          tests/lab-vax/run-boot.sh acceptance 2>&1 | tee "$RUNNER_TEMP/demo-build.log"

      - name: Write Node B's cluster identity into the booted disk's ODS-2 partition
        if: matrix.node == 'B'
        run: |
          set -euo pipefail
          IMG=.boot-cache/lab-vax/single-work/wd0.img
          sudo chown "$(id -u)" "$IMG"
          W="$RUNNER_TEMP/nodeB-e"; mkdir -p "$W"
          read -r E_OFF E_SIZE < <(python3 - "$IMG" <<'EOF'
          import sys
          sys.path.insert(0, "tests/lab-vax")
          import mk_single_disk as m
          head = open(sys.argv[1], "rb").read(m.SECSIZE * 2)
          lab = m._find_label_off(head)
          size, off, _ = m._part(head, lab, 4)
          print(off, size)
          EOF
          )
          echo "partition e: $E_SIZE sectors at sector $E_OFF"
          dd if="$IMG" of="$W/e.raw" bs=512 skip="$E_OFF" count="$E_SIZE" status=none
          sh tools/cluster-web-demo/inject-ods2-config.sh "$W/e.raw" "$W/e.qcow2" \
            --scsnode "$NODE_B_SCSNODE" --scssystemid "$NODE_B_SCSSYSTEMID" \
            --votes "$NODE_B_VOTES" --expected-votes "$NODE_B_EXPECTED_VOTES" \
            --vaxcluster "$NODE_B_VAXCLUSTER"
          # DECnet (rd vms-5843): the roster's DECnet address and peers, written
          # by this ref's own NCP.EXE onto the same ODS-2 partition, so Node B's
          # boot-time STARTNET starts NETACP and SET HOST OVMXA/OVMXB works.
          sh tools/cluster-web-demo/inject-decnet-config.sh "$W/e.qcow2" "$W/e.qcow2" \
            --scsnode "$NODE_B_SCSNODE"
          qemu-img convert -O raw "$W/e.qcow2" "$W/e.new"
          [ "$(stat -c%s "$W/e.new")" = "$(stat -c%s "$W/e.raw")" ] || { echo "injected partition changed size"; exit 1; }
          dd if="$W/e.new" of="$IMG" bs=512 seek="$E_OFF" conv=notrunc status=none
          python3 tests/lab-vax/mk_single_disk.py verify "$IMG"

      # The boot the acceptance run just made IS the disk that ships. Its console
      # must name this ref's version, and nothing older: that is the same
      # check the visitor gate makes on every OVMX node in the page.
      - name: The built disk's own boot announces this ref's version, and no other
        run: |
          set -euo pipefail
          WANT='${{ steps.src.outputs.version }}'
          tr -d '\r' < "$RUNNER_TEMP/demo-build.log" > "$RUNNER_TEMP/demo-console.txt"
          SEEN=$(grep -ao 'OpenVMX V[0-9][0-9.]*-[0-9][0-9]*' "$RUNNER_TEMP/demo-console.txt" | sort -u || true)
          echo "versions announced: ${SEEN:-<none>}"
          [ -n "$SEEN" ] || { echo "the boot console never announced an OpenVMX version"; exit 1; }
          [ "$SEEN" = "OpenVMX $WANT" ] || { echo "Node B announced '$SEEN', the ref is $WANT"; exit 1; }
          grep -aq "Username:" "$RUNNER_TEMP/demo-console.txt" || { echo "no Username: in the boot"; exit 1; }

      - name: Package the disk + its version sidecar
        run: |
          set -euo pipefail
          mkdir -p out
          IMG=.boot-cache/lab-vax/single-work/wd0.img
          [ -f "$IMG" ] || { echo "no single disk at $IMG"; exit 1; }
          gzip -n -9 -c "$IMG" > "out/${{ matrix.img }}"
          cp "$RUNNER_TEMP/demo-console.txt" "out/${{ matrix.node }}-build-final-boot-console.txt"
          python3 - '${{ steps.src.outputs.sha }}' '${{ steps.src.outputs.version }}' "$SRC_REF" '${{ matrix.node }}' '${{ matrix.img }}' '${{ matrix.manifest }}' <<'EOF'
          import hashlib, json, os, sys
          sha, ver, ref, node, img, manifest = sys.argv[1:7]
          def h(p): return hashlib.sha256(open(p, "rb").read()).hexdigest()
          m = {"ref": ref, "sha": sha, "version": ver,
               "img_gz_sha256": h("out/" + img),
               "raw_sha256": h(".boot-cache/lab-vax/single-work/wd0.img")}
          if node == "B":
              m = {"node": os.environ["NODE_B_SCSNODE"], "scssystemid": int(os.environ["NODE_B_SCSSYSTEMID"]), **m}
          else:
              m = {"node": "single", **m}
          json.dump(m, open("out/" + manifest, "w"), indent=2)
          EOF
          cat "out/${{ matrix.manifest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          retention-days: 30

      # A tag push, or a dispatch whose ref IS a release tag (a catch-up build
      # for a tag cut before this workflow existed, e.g. V0.7-10 -- rd vms-fbdd).
      - name: Attach the disk + sidecar to the release (tag builds)
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/V')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.ref, 'V'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          T='${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}'
          git ls-remote --exit-code --tags origin "refs/tags/$T" >/dev/null \
            || { echo "$T is not a tag; nothing to attach"; exit 0; }
          # release.yml creates the release for this tag; wait for it rather
          # than race it.
          for _ in $(seq 1 60); do
            gh release view "$T" >/dev/null 2>&1 && break
            sleep 60
          done
          gh release upload "$T" "out/${{ matrix.img }}" "out/${{ matrix.manifest }}" --clobber
