# Source of truth for the DCL-qualifiers row of the Compatibility Surface Register.
facility: dcl-qualifiers
name: "DCL Qualifier Grammar (Engine A / CLD tables)"
domain: command-language
vms_ref: "OpenVMS Command Definition Utility (CDU) Manual; DCL Dictionary"
scope_1_0: in
tier: 1
plan_ref: vms-8ad
summary: >
  Per-verb qualifier validation (Phase 1, vms-097). The parser rejects any
  qualifier not in a verb's table with the authentic %DCL-W-IVQUAL (or
  %DCL-W-IVKEYW) BEFORE the handler runs, structurally. Re-censused 2026-09-14
  against origin/main: 46 of the 58 builtin verbs carry a validating table (29
  real q_* tables + 17 q_none reject-all); no verb is accept-all by
  accident any more (the quals == NULL ones validate per sub-verb, in their own
  layer, or by delegation -- see dcl-qualifiers$zero-validation-verbs). Since the prior census DEASSIGN and DEFINE gained real q_*
  tables (DIFFERENCES moved to q_none), so the real-table set is now exactly 29.
  A real CLI$-callable CDU compiler exists for external images but is not used to
  generate the builtin tables.
last_reviewed: 2026-10-19
items:
  - id: dcl-qualifiers$ivqual-enforcement
    kind: feature
    status: verified
    authenticity: real
    vms: "Unknown /QUALIFIER on a verb -> %DCL-W-IVQUAL; bad keyword -> %DCL-W-IVKEYW, before the handler runs"
    evidence: src/vmsdcl/dcl_parser.c:448
    verified_against: "tests/dcl/test_ivqual_gate_structural.sh — anti-cheat tripwire: revert the .quals wiring and every IVQUAL/IVKEYW assertion goes red; positive controls (real /LOG,/KEEP,/REVERSE,/DATE=MODIFIED still pass) plus authentic $STATUS %X000008F0 (IVQUAL) / %X000008F4 (IVKEYW)"
    notes: "dcl_validate_qualifiers() (dcl_parser.c:448) is the structural enforcement point; called from dispatch (dcl_exec.c) before every handler. Closes the universal silent-accept hole for the retrofit tranche."

  - id: dcl-qualifiers$verb-coverage
    kind: feature
    status: partial
    authenticity: real
    vms: "Per-verb qualifier tables validating every DCL verb's /QUALIFIER grammar"
    evidence: src/vmsdcl/dcl_builtin.c
    notes: "31 verbs carry a real q_* qualifier table (ANALYZE ASSIGN ATTACH BACKUP CONVERT COPY CREATE DEASSIGN DEFINE DELETE DIRECTORY DUMP INQUIRE LINK MOUNT OPEN PING PRINT PRODUCT PURGE READ RECALL RENAME RUN REPLY SEARCH SORT SPAWN STOP SUBMIT TYPE); 17 more use q_none (empty table = reject-all, honest over-restriction for verbs whose VMS qualifiers OVMX has not retrofit); The remaining quals == NULL verbs (HELP INSTALL RUN SET SHOW TCPIP) are not accept-all: SET/SHOW/TCPIP validate per sub-verb, RUN through its own oracle-pinned layer, INSTALL through INSTALL.EXE, HELP accepts by design -- see dcl-qualifiers$zero-validation-verbs. Since 2026-09-14 TELNET (q_none), FTP, WRITE, MAIL and LIBRARY gained tables."

  - id: dcl-qualifiers$zero-validation-verbs
    kind: feature
    status: implemented
    authenticity: real
    vms: "Qualifier validation for the verbs that carry no flat q_* table (SET, SHOW, TCPIP, RUN, MAIL, WRITE, LIBRARY, TELNET, FTP, INSTALL, HELP)"
    evidence: src/vmsdcl/dcl_builtin.c
    notes: "Re-classified per verb with code and test evidence (vms-097). No verb silently accepts an unknown qualifier any more. TABLES: TELNET (q_none) and FTP (q_ftp) -- tests/dcl/test_tcpip_tool_qualifier_validation.sh, tests/qemu/test_syssvc_dcl_tcpip_tool_quals.c, defects.d/dcl-tcpip-tool-quals-accept-all; WRITE (q_write: /SYMBOL writes the symbol value, /ERROR=label branches, /UPDATE refused) -- test_write_qualifiers.sh, test_syssvc_dcl_write_quals.c, 3 defects; MAIL (q_mail: /SUBJECT, forwarded to MAIL.EXE as /SUBJECT=value -- it used to hand MAIL.EXE the bare word) -- test_mail_qualifier_validation.sh, test_syssvc_dcl_mail_quals.c, 2 defects; LIBRARY (q_library; /COMPRESS real for object libraries, /VAX only on the VAX rail) -- test_library_*.sh, test_syssvc_dcl_library_quals.c, 2 defects. UMBRELLAS validated per sub-verb: SET (set_subverb_quals in dcl_cmd_set.c; TERMINAL ACL PASSWORD ACCOUNTING VOLUME SYMBOL validate themselves; SET PROTECTION /DEFAULT; SET AUDIT is an unconditional honest NOTIMPL) -- test_set_qualifier_validation.sh, test_syssvc_dcl_set_quals.c, defects.d/dcl-set-declared-qual-refused; SHOW (show_subverb_quals in dcl_cmd_show.c; TIME keeps its oracle-pinned NOQUAL, SYMBOL its own IVQUAL, CLUSTER belongs to the cluster lane and is NOT validated yet) -- test_show_qualifier_validation.sh, test_syssvc_dcl_show_quals.c, defects.d/dcl-show-declared-qual-refused; TCPIP (tcpip_subcmd_quals in dcl_cmd_misc.c, per verb+object) -- test_tcpip_qualifier_validation.sh, test_syssvc_dcl_tcpip_quals.c, defects.d/dcl-tcpip-declared-qual-refused. RUN validates through its own oracle-pinned layer (run_bad_qualifier: IVQUAL / ABKEYW, VAX V7.3 capture) -- test_run_qualifier_validation.sh, test_syssvc_dcl_run_quals.c, defects.d/dcl-run-quals-unvalidated. DELEGATED: INSTALL forwards every qualifier to INSTALL.EXE, whose parser answers %INSTALL-E-IVQUAL (src/install/install.c:184,266). ACCEPT-ALL BY DESIGN: HELP (a /token after HELP is a qualifier TOPIC to look up, vms-01b). KNOWN GAPS, not faked: SHOW CLUSTER qualifiers (cluster lane); SHOW/SET sub-verbs that parse their own raw tail are only as strict as that parser; SET FILE/VERSION_LIMIT is acknowledged without effect and SET MESSAGE flags are stored but not yet consumed by dcl_error (no oracle capture of the partial-field message formats)."

  - id: dcl-qualifiers$per-verb-depth
    kind: feature
    status: partial
    authenticity: real
    vms: "Full per-verb qualifier set depth (VMS DIRECTORY alone has dozens)"
    evidence: src/vmsdcl/dcl_builtin.c
    notes: "Per INV-DCL a table lists ONLY implemented qualifiers, so depth is honestly a fraction of VMS (DIRECTORY carries /DATE=MODIFIED,/SIZE,/OWNER,/PROTECTION,... but not the full VMS set); qualifiers VMS accepts that OVMX does not implement are honestly rejected (over-restriction, not a lie)."

  - id: dcl-qualifiers$cdu-compiler
    kind: routine
    status: verified
    authenticity: real
    vms: "CLI$COMPILE_CLD — compile CLD source into a callable command table"
    evidence: src/libvms/rtl/lib_cli.c
    verified_against: "tests/libvms/test_lib_cli.c compiling the real external CLD tests/corpus/tier3-mmk/mmk_cld.cld (corpus conformance, not a synthetic input)"
    notes: "Real CDU compiler, CLI$-callable, proven against an external image's CLD — but the 58 builtin verbs still use hand-written C tables, not CDU-generated ones."
