              echo "== readelf: EM_X86_64, zero DT_NEEDED, across all 9 artifacts =="
              SYSLIB=/tmp/build/link-native/SYSLIB
              SYSEXE=/tmp/build/link-native/SYSEXE
              for f in "$SYSLIB"/*.EXE "$SYSEXE"/*.EXE; do
                  echo "-- $f --"
                  readelf -h "$f" | grep -q "Machine:.*X86-64" || { echo "FAIL: $f not EM_X86_64"; exit 1; }
