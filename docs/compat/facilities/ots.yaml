# OTS$ Object-Time-System RTL. See docs/design-compat-surface-register.md.
facility: ots
name: "OTS$ Object-Time-System RTL"
domain: programming-interfaces
vms_ref: "OpenVMS RTL Object Time System (OTS$) Manual"
scope_1_0: in
tier: 1
plan_ref: vms-801
summary: >
  ~50 OTS$ routines header-declared; 32 of 43 are implemented, broadly real.
  Gaps: packed-decimal conversions (OTS$CVT_T_P/CVT_P_T, blocking COBOL/DIBOL
  decimal), the comparison family (OTS$CMP_GTR/GEQ/...), and string-descriptor
  management (OTS$SCOPY_DXDX/SCOPY_R_DX/SFREE1_DD/SFREEN_DD/SGET1_DD) — all
  declared in the header but with zero implementation, a pure stub gap.
last_reviewed: 2026-08-13
