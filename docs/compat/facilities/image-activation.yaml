  - {id: image-activation$tls, kind: feature, status: implemented, authenticity: real, vms: "Thread-Local Storage in activated images", evidence: "src/imgact/test/run_exec_tls.sh", notes: ".vms$tls section; run_exec_tls.sh, run_tls_producer_over_crtl.sh."}
  - {id: image-activation$native-alpha-eihd, kind: feature, status: partial, authenticity: real, scope_1_0: in, vms: "Activation of an OpenVMS Alpha native image (EIHD/EISD/EIAF .EXE LINKed on real VMS), unchanged, with its SYS$/LIB$ calls bound by symbol-vector offset", evidence: "tools/cross-alpha/run-module-gp-activation-alpha.sh", notes: "rd vms-3b3f. CI alpha-native-image (native-gate) runs HELLO.EXE and RETST.EXE, which were LINKed on the lab Alpha V8.4 node from our own MACRO-32 sources (tests/native-images/alpha/), on the booted executive. The output and $STATUS must match the node's, and the missing-shareable and not-an-image refusals must give the real statuses (%X100388B2, %X104D8CFC). The reader (src/imgact/imgact_eihd.h) is checked field by field against the node's ANALYZE/IMAGE reports (imgact_eihd_parse_unit). Partial: SYS$PUBLIC_VECTORS and LIBRTL provide only the entries that have VMS-ABI implementations (src/vmslink/vms_vectors/*.vec); any other entry fails activation with SS$_UNSUPPORTED. Shareables are found only as SYS$SHARE:name.EXE, because logical-name translation of a shareable name is not implemented. .ADDRESS, code-address and PSB fixups, and shareable initialization, are refused. SYS$IMGSTA does not establish a traceback handler. The CLI callback argument is not passed."}
  - {id: image-activation$native-vax-isd, kind: feature, status: absent, authenticity: n/a, scope_1_0: in, vms: "Activation of an OpenVMS VAX native image (IHD/ISD .EXE LINKed on real VMS) on OVMX/VAX", evidence: "src/imgact/imgact_eihd.h", notes: "rd vms-3b3f. Not started: Alpha came first, because OVMX/Alpha already runs the Alpha calling standard and its page size matches. A VAX image calls system services at fixed S0 addresses, and these collide with the NetBSD-VAX kernel's own S0 mapping."}
