# Source of truth for the SYSUAF row of the Compatibility Surface Register.
facility: sysuaf
name: "SYSUAF — Accounts + Login Authentication"
domain: system-management
vms_ref: "OpenVMS Guide to System Security; Authorize Utility Manual"
scope_1_0: in
plan_ref: vms-8ad
summary: >
  Full UAF account record storage and Purdy/hashed password authentication are
  real. Account-state login enforcement is genuine: DISUSER/DISACNT deny login
  (console + SSH) and CAPTIVE confines the session — both read at login time
  (vms-c8fa). SSH performs the executive setident + a permanent, fail-closed UIC
  credential drop (vms-49e/vms-6ae), closing the old authenticate-then-run-as-root
  facade. Password expiration is ENFORCED at login on both front-ends (vms-c6df):
  an expired password (admin-forced UAI$M_PWD_EXPIRED, or
  UAF$Q_PWD_DATE+UAF$Q_PWD_LIFETIME elapsed) is refused rather than logged straight
  in; the interactive force-change flow VMS runs in its place is the tracked
  follow-up (honest-refuse floor, INV-6). A NETWORK-class login authorization
  decision (DISNETWORK + the account/expiry gates) now exists and is
  selftest-proven fail-closed, but is deliberately unwired into any live login
  path pending the SSH->LOGINOUT session-establish (vms-843a/vms-16b).
last_reviewed: 2026-09-14
items:
  - {id: sysuaf$record,        kind: struct,   status: implemented, authenticity: real,        vms: "Full UAF account record (username, UIC, dirs, quotas, flags, hashed password)", evidence: src/libvms/rtl/sysuaf.c}
  - {id: sysuaf$authenticate,  kind: routine,  status: implemented, authenticity: real,        vms: "sysuaf_authenticate() — Purdy/hashed password check against stored quadword", evidence: "src/libvms/rtl/sysuaf.c:320"}
  - {id: sysuaf$disuser,       kind: feature,  status: implemented, authenticity: real,        vms: "UAI$M_DISUSER/DISACNT — interactive login disabled for account", evidence: "src/libvms/rtl/sysuaf.c:390", notes: "vms-c8fa: READ at login. sysuaf_interactive_login_permitted() checks DISUSER|DISACNT and is enforced BEFORE start_session() in both console LOGINOUT (tools/vms_login.c) and SSH (src/vmsssh/sshd_auth.c) — a disabled account is refused with the same generic failure text even with the correct password. Was absent/facade-risk on 2026-08-13. Re-census 2026-09-14: unchanged, line ref refreshed (was :389)."}
  - {id: sysuaf$captive,       kind: feature,  status: implemented, authenticity: real,        vms: "UAI$M_CAPTIVE — restrict account to captive command procedure", evidence: "src/libvms/rtl/sysuaf.c:400", notes: "vms-c8fa: sysuaf_account_captive() read. SSH auth passes --captive to vmsdcl (src/vmsssh/sshd_auth.c); DCL enforces it (src/vmsdcl/dcl_main.c — Ctrl-Y disabled, REPL suppressed, logs out after the login procedure). Was absent/facade-risk on 2026-08-13. Re-census 2026-09-14: unchanged, line ref refreshed (was :399)."}
  - {id: sysuaf$pwd_expired,   kind: feature,  status: partial,     authenticity: advisory,    vms: "UAI$M_PWD_EXPIRED + UAF$Q_PWD_DATE/PWD_LIFETIME — password expiration enforced at login", evidence: "src/libvms/rtl/sysuaf.c:418", notes: "vms-c6df: ENFORCED. sysuaf_password_expired() reads UAI$M_PWD_EXPIRED and UAF$Q_PWD_DATE+UAF$Q_PWD_LIFETIME straight from the binary $UAFDEF record (NOT the flag-name string, which omits the transient bit) against sys$gettim; an expired password is REFUSED at login on both front-ends — console LOGINOUT (tools/vms_login.c, %OVMX-F-PWDEXPIRED before start_session) and SSH (src/vmsssh/sshd_auth.c). On-disk UAF$Q_PWD_LIFETIME field at [OVMX] offset 0x188 (sysuaf.h). authenticity=advisory (not real): VMS FORCES a password change at login; OVMX honestly REFUSES instead (INV-6) — interactive force-change is the tracked follow-up vms-91f. Proof: tests/libvms/test_sysuaf_login_flags.c, tests/vmsssh/test_sshd_auth.c, tests/qemu/test_syssvc_loginout_acp.c (expired account authored + read back over the ODS-2 ACP). Re-census 2026-09-14: unchanged."}
  - {id: sysuaf$network_login_permit, kind: feature, status: partial, authenticity: advisory, vms: "NETWORK-class login authorization — DISNETWORK/DISUSER/DISACNT/expired gates for a pre-authenticated (SSH) session", evidence: "tools/vms_login.c:933", plan_ref: vms-843a, notes: "vms-843a/vms-16b (2026-09-12, #1199): loginout_network_permit() is a pure, fail-closed AUTHORIZATION DECISION for the faithful SSH->$CREPRC(LOGINOUT) handoff (Option A — SSH authenticates in-protocol against the same SYSUAF/Purdy authority, so LOGINOUT does not re-read the password). Permits a network login only if the account is enabled (DISUSER/DISACNT), UAI$M_DISNETWORK is clear, and the password is not expired; grants nothing beyond the SYSUAF record. Real, honest logic but DELIBERATELY UNWIRED into any live login path (dead until the session-establish + executive-identity conveyance land, lab-gated vms-101) — hence partial/advisory, not a facade. Proof is a plain host-side ctest (loginout_network_permit_selftest, tools/CMakeLists.txt:48, 6 cases clean->permit / DISNETWORK|DISUSER|DISACNT|expired|NULL->refuse) — a self-test, not an oracle, so NOT verified. Design: docs/design-ssh-loginout-handoff.md."}
  - {id: sysuaf$ssh_credential_drop, kind: feature, status: implemented, authenticity: real, vms: "Process credentials match the authenticated SYSUAF identity after SSH login", evidence: "src/vmsssh/vmssshd.c:612", notes: "vms-49e/vms-6ae: vmssshd (a) establishes the authenticated identity in the executive via vms_kif_setident, fail-closed _exit(1) on refusal (INV-6), and (b) performs a permanent setgid-before-setuid UIC drop via ovmx_cred_drop_to_uic() BEFORE execl of vmsdcl, fatal on failure (%OVMX-F-NOUIC). Unit-tested (tests/vmsssh/test_cred_drop.c, test_ssh_ident.c). Was absent/facade-risk (session ran as euid=0/root) on 2026-08-13. Re-census 2026-09-14: unchanged."}
