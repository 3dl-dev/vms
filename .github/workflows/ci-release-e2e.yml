  # A flagless bracket boot on a fresh disk shows the seeded defaults, proving
  # the authored values came from the SYSBOOT> session, not the seed.
  #
  # Same SKIP_RETURN_CODE 77 => hard CI failure convention as the scsnode e2e
  # above: this gate must actually run the real boot, never skip silently.
  # -----------------------------------------------------------------------
  sysboot-cluster-params-e2e:
    name: SYSBOOT> authors cluster params (vms-46c gap #2)
    needs: changes
    # vms-fb8 tier-split: heavy boot/e2e gate runs on NON-PR events only
