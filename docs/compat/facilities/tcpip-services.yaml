# Source of truth for the TCP/IP Services row of the Compatibility Surface Register.
facility: tcpip-services
name: "TCP/IP Services (UCX QIO + Sockets + BGn:/ETH0:)"
domain: networking
vms_ref: "OpenVMS TCP/IP Services for OpenVMS (UCX) manuals"
scope_1_0: in
plan_ref: vms-67f
summary: >
  A THIN BUT REAL SLICE of TCP/IP Services, not the product. What EXISTS is
  real; the majority of the OpenVMS UCX application surface is NOT built and is
  now tracked as absent rows below (unbuilt-application-surface, sockets-api-gaps).
  DATA PLANE: a VMS program reaches
  TCP the ordinary VMS way — $ASSIGN TCPIP$DEVICE: then $QIO on the
  executive-resident INET pseudo-device BGn: (src/kernel/vms_bg*, socket lives
  in vms.ko over the host in-kernel socket API, no userspace stack), proven
  end-to-end against a real /dev/vms and guarded by a negctl defect gate. A
  BSD-sockets RTL veneer (DECC$SOCKET-equivalent) rides that path, and the
  client TOOLS (DCL TELNET/FTP + PING), the TCPIP$INETD auxiliary server and a
  DAYTIME service are real. The NIC now surfaces as the VMS device ETH0: and
  QEMU provides a virtio-net-pci device (default user-mode NAT). CONFIG PLANE
  (vms-67f): host name/domain/address land in the executive-resident
  TCPIP$INET_HOST/DOMAIN/HOSTADDR SYSTEM logicals AND PERSIST ACROSS REBOOT —
  host/interface/route/name-service settings are written to TCPIP$*.DAT over the
  Files-11 ACP (apply/persist split) and reapplied at startup (TCPIP REAPPLY),
  proven by a double-boot e2e. INBOUND is R4-hardened: TCPIP$INETD drops each
  spawned service to its own SYSUAF run-as account before execv (fail-closed,
  never SYSTEM — vms-8bd) and caps concurrent service children (MAXCHILD
  fork-flood back-pressure — vms-bb4). INV-6 honest throughout: no /dev/vms =>
  SS$_NOSUCHDEV, never a per-process fake. The INETD SERVICE database is now
  MANAGED THE VMS WAY (#878): TCPIP {SET,SHOW,ENABLE,DISABLE,DELETE} SERVICE edit
  SYS$SYSTEM:TCPIP$SERVICE.DAT and persist the change over the Files-11 ACP, so a
  DCL-enabled service survives reboot and is reapplied on the next TCPIP$INETD
  start (was hand-edit-only). Deferred honestly: DHCP, multiple interfaces /
  TCPIP$INET_HOSTADDRn, and a raw NIC-as-VMS-device data path (EWA0:).
last_reviewed: 2026-11-02
items:
  - {id: tcpip-services$bg-inet-device, kind: feature, status: implemented, authenticity: real, vms: "INET pseudo-device BGn: — $ASSIGN TCPIP$DEVICE: + $QIO (IO$_SETMODE/IO$_ACCESS/IO$_READVBLK/IO$_WRITEVBLK/IO$_DEACCESS) TCP socket path, executive-resident", evidence: "src/kernel-core/vms_bg.c", verified_against: "tests/qemu/test_tcpip_external_boot_e2e.sh — a booted OVMX sets its address and default route with TCPIP SET INTERFACE/ROUTE on a tap link to a separate server host (its own container: alpine busybox telnetd/ftpd on 192.168.77.1, off the link, via gateway 10.0.3.1 -- no NAT or proxy), then TELNETs and FTPs over BGn: to it; the link is captured (pcap) and ftpd's log kept, evidence in tests/lab/captures/vms-d0c4-external-tcpip-20261102/; FTP GET then PUT round-trips 131072 bytes byte-identical (vms-d0c4); tests/qemu/test_syssvc_bg_echo.c — loopback echo against a REAL /dev/vms + the facility_defects negctl gate 'bg-recv-length-zeroed' (vms-527)", notes: "The socket is executive-resident (vms.ko), the analogue of the executive mailbox; no userspace socket, exactly as VMS BGn: is a driver not a library. Proven over the real NIC to an external peer by the booted e2e above (merge-queue gate, tcpip_net tier). A refused / unreachable / timed-out connect completes SS$_REJECT / SS$_UNREACHABLE / SS$_TIMEOUT (vms-d0c4), as TCP/IP Services reports them. UDP (vms-a9e7): IO$_SETMODE P2=IO$K_SOCK_UDP mints an executive AF_INET/SOCK_DGRAM socket (one datagram per IO$_WRITEVBLK/IO$_READVBLK on a connected channel), and the IO$_SETMODE P4 socket-option list carries TCPIP$C_RCVTIMEO so a read against a silent peer completes SS$_TIMEOUT; the P2 selector and the TCPIP$C_* numeric values are labelled OVMX design choices (iodef.h). Proof is tests/qemu/test_syssvc_bg_udp.c (loopback UDP echo byte-exact + silent-port SS$_TIMEOUT) + negctl 'bg-udp-recv-timeout-not-reported' -- loopback only, no external peer. STATUS=implemented, not verified: no real-VMS oracle byte-gate. Not built: IPv6, IO$_READVBLK flags (MSG_PEEK/OOB/NBIO), async (AST-completed) BGn: I/O."}
  - {id: tcpip-services$sockets-veneer, kind: feature, status: implemented, authenticity: real, vms: "BSD-sockets in the C RTL (DECC$SOCKET) -- DECC$SHR's socket/connect/bind/listen/accept/send/recv/sendto/recvfrom/sendmsg/recvmsg/[gs]etsockopt/getsockname/getpeername/shutdown/close/select/poll and read/write/readv/writev/dup/dup2/fcntl/ioctl on a socket are $QIO on a BGn: channel", evidence: "src/vmstcpip/sockets/ovmx_decc_sockets.c", verified_against: "tests/qemu/test_syssvc_decc_socket.c -- SOCKECHO.EXE, a BSD-sockets program LINKED --use DECC$SHR only, round-trips bytes byte-exact to an executive listener over a REAL /dev/vms (send/recv, read/write, poll, select, O_NONBLOCK EAGAIN, a waited-out select timeout, a poll wake-up, dup, plus its own bind/listen/accept leg); a ptrace syscall audit counts ZERO Linux socket-family syscalls, ZERO poll/select-family syscalls and ZERO read/write-family syscalls on a socket descriptor (only /dev/vms ioctls); with an empty /dev socket() fails ENODEV; + the facility_defects negctl gates 'decc-socket-bound-to-musl', 'decc-socket-read-via-musl' and 'bg-select-revents-dropped' (vms-99f)", notes: "vms-99f: DECC$SHR used to export MUSL's socket family (raw Linux socket syscalls) and resolver (DNS over Linux UDP). Every socket/resolver universal, and the descriptor calls on a socket, are now bound to ovmx_decc_sockets.c: socket() = $ASSIGN TCPIP$DEVICE: + IO$_SETMODE, and every later call an IO$ function on that channel through the SAME function map sys$qio uses (bg_qio_func.h) -- IO$_ACCESS, IO$_ACCESS|IO$M_ACCEPT, IO$_WRITEVBLK, IO$_READVBLK, IO$_DEACCESS, IO$_SETMODE/IO$_SENSEMODE option blocks, and select()/poll() as the IO$_SENSEMODE readiness wait in which the executive sleeps on the sockets' own wait queues (VMS_IOCTL_BG_SELECT). No Linux socket and no Linux descriptor is on the I/O path; the descriptor number is reserved by a close-on-exec duplicate of the executive device descriptor and never used for I/O. Name resolution is numeric-only until the BGn: UDP resolver (vms-a9e7). GENERIC (x86_64/aarch64) DECC$SHR only: the Alpha DECC$SHR (musl-alpha decc$ sockets) is still musl-bound (see sockets-api-gaps). STATUS=implemented not verified: loopback inside one guest, no external peer. Design: docs/design-bgsockets-veneer-ovmx.md s8."}
  - {id: tcpip-services$client-tools, kind: utility, status: partial, authenticity: real, vms: "TCP/IP CLIENT tools — DCL TELNET + FTP client over BGn: (client-only; no server)", evidence: "src/vmstcpip/services/tcpip_client.h", verified_against: "tests/qemu/test_tcpip_external_boot_e2e.sh — booted OVMX on a tap link: TELNET to a real busybox telnetd on a separate server host (option negotiation answered, the remote shell's output shown while the session is open, the server's exit and CTRL/] QUIT both end it); FTP /GET of a missing file fails %FTP-E-GETERR; FTP /GET then /PUT round-trips 131072 bytes byte-identical with a real busybox ftpd (PASV data to a non-loopback address); pcap + ftpd log in tests/lab/captures/vms-d0c4-external-tcpip-20261102/ (vms-d0c4); tests/qemu/test_syssvc_tcpip_client.c (engines vs a real /dev/vms) + tests/vmstcpip/test_tcpip_client_fuzz.c (TELNET receive parser + PASV parser fuzz)", notes: "TELNET is full duplex: character mode when the server WILL ECHO (SGA accepted), line mode otherwise (the executive terminal driver edits the line); RETURN goes as CR LF; escape CTRL/] then QUIT/EXIT/CLOSE. FTP stores a binary RETR through RMS on the ODS-2 disk as fixed 512-byte records (last record zero-padded, as VMS TCP/IP Services FTP stores an image transfer) and requires the server's 226. STATUS=partial: TELNET answers only ECHO/SGA (no TTYPE/NAWS/NEW-ENVIRON); FTP is /GET or /PUT on the command line only -- no interactive FTP> session, no ASCII (TYPE A) transfers, PASV only; host names resolve through the vms-a9e7 stub resolver (tcpip-services$resolver), not the BIND resolver service; clients only (FTP-server + TELNET-server are absent, see unbuilt-application-surface). Negctl gate 'tcpip-ftp-get-length-dropped' (vms-dbb). Honest SS$_NOSUCHDEV with no executive."}
  - {id: tcpip-services$ping, kind: utility, status: implemented, authenticity: real, vms: "PING (ICMP echo) over BGn: raw socket", evidence: "src/vmstcpip/services/tcpip_ping.h", notes: "IO$_SETMODE P2=IO$K_SOCK_ICMP mints a raw AF_INET/SOCK_RAW/IPPROTO_ICMP executive socket; same public services as the TCP tools (vms-80b). Was the one tool tcpip_client.h honestly deferred as a NOOP."}
  - {id: tcpip-services$inetd, kind: subsystem, status: implemented, authenticity: real, vms: "TCPIP$INETD auxiliary server — bind/listen each enabled service's port and hand the connection to its service image", evidence: "src/vmstcpip/services/tcpip_inetd.h", notes: "Proven against a real /dev/vms by tests/qemu/test_syssvc_tcpip_inetd.c (vms-cdb9). Until vms-21b the aux server could not run on a BOOTED distro: TCPIP$INETD.EXE was never staged into the image, and it launched service images by a raw execv of a Linux path (service images are ODS-2-resident at SYS$SYSTEM:, not on the boot initramfs VFS). vms-21b stages it at SYS$SYSTEM: and launches service images the VMS way — materialize off the Files-11 ACP (the shared rms_stage_over_acp DCL RUN + PID1 use) then execve. NOT auto-started in the shipped default (operator security-posture call; enforced by tests/integration/test_tcpip_posture_guard.sh). R4-HARDENED (the gate before any reading/privileged service): each service runs in a process the auxiliary server creates DETACHED with its own SYSUAF run-as account (the SERVICE.DAT username field, resolved by INETD; the executive creates the PCB via VMS_IOCTL_CREPRC_PCB and checks INETD may give that identity; the service then takes the substrate identity the executive gives its process, never root), FAIL-CLOSED — an empty/unknown account creates no process, a refused identity releases the held task only to _exit(125), and the service never launches as SYSTEM (vms-8bd, vms-1f8, tcpip_inetd_ident.c); and concurrent service children are capped (TCPIP_INETD_MAXCHILD, accept back-pressure) so a network fork-flood cannot exhaust the system (vms-bb4). Both proven by test_syssvc_tcpip_inetd.c (the service reports its own detached process and identity; a refused identity launches nothing, negctl tcpip-inetd-refused-identity-launched) and the daytime cold-boot e2e (DAYTIME launches under the low-priv TCPIP$DAYTIME account). Precondition that unblocks the OpenSSH sshd ladder (vms-9ef)."}
  - {id: tcpip-services$daytime-service, kind: feature, status: implemented, authenticity: real, vms: "DAYTIME service (RFC 867) launched by the auxiliary server", evidence: "src/vmstcpip/services/tcpip_daytime.h", notes: "First genuine standalone service image INETD launches end to end; proven by tests/qemu/test_syssvc_tcpip_daytime.c against a real /dev/vms (vms-477). That KE-harness proof injects a literal Linux image path; on the SHIPPED distro the image is ODS-2-resident at SYS$SYSTEM: and the aux server activates it over the ACP (materialize->execve, vms-21b) — proven answerable on a cold boot by tests/qemu/run_tcpip_daytime_boot_e2e.sh. DISABLED in the shipped default SERVICE.DAT (operator-enabled; the shipped image auto-starts no service — posture-guarded by tests/integration/test_tcpip_posture_guard.sh); the cold-boot proof enables it via a test overlay only. Under R4 (vms-8bd) the aux server launches it under the low-privilege TCPIP$DAYTIME SYSUAF service account (UIC [128,134], TMPMBX/NETMBX), NOT SYSTEM — the cold-boot e2e proves the persona drop end to end."}
  - {id: tcpip-services$nic-device, kind: feature, status: implemented, authenticity: real, vms: "NIC exposed as a VMS device (ETH0:, DVI$_DEVCLASS = DC$_SCOM)", evidence: "src/kernel-core/vms_devtab.c", notes: "The Linux net device roots at 'eth' so the native-rooted VMS name is ETH0: (device-native naming, vms-9d2). QEMU now provides ONE virtio-net-pci device; OVMX_NET_MODE defaults to user-mode NAT (SLIRP), with tap/bridge/none options (vms-7bd). A raw NIC-as-VMS-device I/O path (EWA0:) is still deferred; the TCP data path rides BGn:."}
  - {id: tcpip-services$config-plane, kind: feature, status: implemented, authenticity: real, vms: "TCPIP$CONFIG core config + TCPIP$INET_HOST/DOMAIN/HOSTADDR SYSTEM logicals + TCPIP SET INTERFACE/SHOW CONFIGURATION", evidence: "src/vmstcpip/mgmt/tcpip_config.h", notes: "Host name/domain/address configured the VMS way land in the executive-resident LNM$SYSTEM table (shared cross-process over /dev/vms), read back through the independent sys$trnlnm, and the address is applied to the interface over the substrate stack. Proven against a real /dev/vms (tests/qemu/test_syssvc_tcpip_config) + a host honest-degradation DCL test; SS$_NOSUCHDEV with no executive (vms-67f). CONFIG NOW PERSISTS ACROSS REBOOT: host/interface/route/name-service settings are written to TCPIP$HOST/INTERFACE/ROUTE/NAMESERVICE.DAT via RMS over the Files-11 ACP (apply/persist split) and reapplied at startup by the C 'TCPIP REAPPLY' verb from @SYS$STARTUP:TCPIP$STARTUP — proven by tests/qemu/run_tcpip_reboot_e2e.sh (double-boot: settings survive, store proven no-growth). Config persistence shipped; a persistent INETD SERVICE database (#878) remains deferred."}
  - {id: tcpip-services$dcl-tcpip-verb, kind: command, status: implemented, authenticity: real, vms: "DCL TCPIP verb (show interface/route/host/version/configuration/service, set host/interface/route/name_service/service, enable/disable/delete service)", evidence: "src/vmsdcl/dcl_cmd_misc.c", notes: "SHOW INTERFACE reads the EXECUTIVE'S interface list (vms-99f): DCL assigns a BGn: channel and issues the IO$_SENSEMODE interface-list request (VMS_IOCTL_BG_IFLIST), and vms.ko reads name/flags/MTU/IPv4 address+mask/link-layer address live from the network stack the channel's socket lives in -- no /sys/class/net, host socket or SIOCGIF* in DCL; with no executive it fails %TCPIP-E-NOEXEC (SS$_NOSUCHDEV), never a host listing (tests/qemu/test_syssvc_dcl_tcpip_iflist.c, tests/dcl/test_tcpip_show.sh, defects.d/bg-iflist-mask-zeroed). SET INTERFACE resolves the device name from the same executive list. SHOW ROUTE is still Linux-substrate introspection (/proc/net/route + a /sys/class/net name map). SET INTERFACE applies the address AND records TCPIP$INET_HOSTADDR in the executive; SHOW CONFIGURATION reads the TCPIP$ SYSTEM logicals back (honest %TCPIP-W-NOEXEC with no executive). SET HOST/INTERFACE/ROUTE/NAME_SERVICE additionally PERSIST their settings to TCPIP$*.DAT over the Files-11 ACP, and TCPIP REAPPLY (invoked at boot from @SYS$STARTUP:TCPIP$STARTUP) reapplies them on the next cold boot (apply/persist split; proven by run_tcpip_reboot_e2e.sh). SET/SHOW/ENABLE/DISABLE/DELETE SERVICE manage the persistent INETD service database (see the service-db row, #878). SHOW ROUTE and the live SET ROUTE apply remain Linux-substrate introspection ('ip route') -- honestly disclosed, not fabricated; an executive-sourced routing table is the follow-on."}
  - {id: tcpip-services$service-db, kind: subsystem, status: implemented, authenticity: real, vms: "Persistent INETD service database — TCPIP {SET,SHOW,ENABLE,DISABLE,DELETE} SERVICE manage SYS$SYSTEM:TCPIP$SERVICE.DAT, the database TCPIP$INETD binds from at aux-server start", evidence: "src/vmstcpip/mgmt/tcpip_service_db.h", verified_against: "tests/qemu/test_syssvc_tcpip_service_db.c — a service SET+ENABLEd through the engine over a REAL Files-11 ACP is read back through the INDEPENDENT aux-server parser (tcpip_inetd_parse_db, the same code TCPIP$INETD runs to decide what to bind); DISABLE removes it from the bound set (record retained as a '!'-line), DELETE drops it; with no executive the persistent WRITE fails ENOEXEC (honest SS$_NOSUCHDEV class, never a per-process fake); + the facility_defects negctl gate 'tcpip-svcdb-enable-not-persisted' (vms-71b)", notes: "The management/persistence plane the DCL SERVICE verbs drive (#878). The database was already ACP-resident and read at boot; this adds the VMS-way management surface (was hand-edit-only) — SET SERVICE defines/updates a record, ENABLE/DISABLE toggle the '!'-disabled convention the aux-server parser already honours, DELETE removes it, and the change is persisted over the ACP the same apply/persist way the config stores are (rms_textfile_*), so a DCL-enabled service survives reboot and is reapplied on the next TCPIP$INETD start. Line format is the SAME OVMX design choice tcpip_inetd.h documents (Rule 8). A new service defaults DISABLED (operator posture). The end-to-end cold-boot double-boot serving proof (a DCL-enabled service answered on the next boot — the 'verified' oracle gate) is the tracked follow-on."}
  - {id: tcpip-services$unbuilt-application-surface, kind: subsystem, status: absent, authenticity: n/a, scope_1_0: out, vms: "The OpenVMS UCX application service surface: SMTP, POP3, IMAP, NFS (client+server), NTP, SNMP agent, BIND/named server + the BIND resolver service, LPD/LPR printing, FINGER, RLOGIN/RSH, FTP SERVER, TELNET SERVER", evidence: "docs/design-tcpip-services-ovmx.md", notes: "NOT BUILT. src/vmstcpip/ holds the BGn: data path, a sockets veneer, an INETD aux server, a DAYTIME toy service, client TELNET/FTP/PING, and the small DCL-verb stub resolver (resolver row: host DB then one DNS A query over BGn: UDP -- not BIND). None of the real UCX servers/daemons above exist. Recorded as an explicit absent row so the register does not read as near-complete -- this is the bulk of the facility, post-1.0. (Baron 2026-09-16 anti-LARP: TCP/IP is a mile wide, inch deep; this row makes the width honest.)"}
  - {id: tcpip-services$sockets-api-gaps, kind: feature, status: absent, authenticity: n/a, scope_1_0: out, vms: "BSD sockets API completeness: DNS resolver (getaddrinfo/gethostbyname of NAMES), UDP/raw sockets via socket(), AF_INET6, half-close (shutdown SHUT_WR), FIONREAD, fork-inherited sockets, stdio on a socket, struct-valued socket options, the services database (getservbyname), interface queries (if_nametoindex), and the Alpha DECC$SHR's socket family", evidence: "src/vmstcpip/sockets/ovmx_decc_sockets.c", notes: "What the DECC$SHR sockets (sockets-veneer row, vms-99f) do NOT yet do, each failing HONESTLY rather than reaching the host: host names fail EAI_FAIL/NO_RECOVERY (the DCL verbs' stub resolver over BGn: UDP -- the resolver row -- is not yet exposed as getaddrinfo/gethostbyname to C programs); SOCK_DGRAM/SOCK_RAW fail EPROTOTYPE; FIONREAD fails EOPNOTSUPP; a forked child's calls on an inherited socket fail EBADF (a channel belongs to its process); stdio (fdopen) on a socket fails; a poll/select mixing sockets with other descriptors alternates a 10 ms executive wait with a zero-timeout poll of the others (terminal readiness from the executive is the follow-on); AF_INET6 EAFNOSUPPORT; shutdown() of one direction shuts both (BGn: IO$_DEACCESS has no half-close); struct options ENOPROTOOPT; getservbyname/port NULL (musl's read the host /etc/services); if_* fail (musl's query host interfaces). The Alpha DECC$SHR (mk_decc_shr.sh alpha branch, the OpenSSH VMS port's target) still exports musl-alpha's decc$ sockets. (select/poll and numeric resolution are no longer gaps.)"}
  - {id: tcpip-services$deferred-rungs, kind: feature, status: absent, authenticity: n/a, vms: "DHCP client, multiple interfaces / TCPIP$INET_HOSTADDRn, a raw NIC-as-VMS-device data path (EWA0:)", evidence: "docs/design-tcpip-services-ovmx.md", scope_1_0: stretch, notes: "Honestly deferred; single static interface today. NOTE: CONFIG persistence (host/interface/route/name-service) shipped over the Files-11 ACP with a boot-time TCPIP REAPPLY (config-plane + dcl-tcpip-verb rows), and the PERSISTENT INETD SERVICE database (#878) is now managed the VMS way (service-db row) — both are NO LONGER deferred."}
