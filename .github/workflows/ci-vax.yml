  # arch-independent data files (SYSUAF.DAT, RIGHTSLIST.DAT, OVMXVMSSYS.PAR) and
  # the Decision-A SYS$MANAGER:SYSTARTUP_VMS.COM (no INSTALL ADD SYS$SHARE block,
  # which would red the boot under vax static linking) -- and boots vms-7b1's
  # assembled disk (ovmx_init as PID 1) WITH that volume on rq1 -> ra1 -> DKA0:.
  #
